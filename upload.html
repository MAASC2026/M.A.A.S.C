<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- Main -->

<div class="main">

<header>

<h1>Upload Student Excel</h1>

<p>Select Department and Upload Student Excel File</p>

</header>

<div class="container">

<label>Academic Year</label>

<select id="academicYear">

<option value="">Select Academic Year</option>

<option>2026-2029</option>
<option>2025-2028</option>
<option>2024-2027</option>

</select>

<label>Department</label>

<select id="department">

<option value="">Select Department</option>

<option value="B.Com General">B.Com General</option>
<option value="B.Com BM">B.Com BM</option>
<option value="B.Com MM">B.Com MM</option>
<option value="B.Com CS">B.Com CS</option>
<option value="B.Com A&F">B.Com A&F</option>
<option value="B.Com ISM">B.Com ISM</option>
<option value="B.Com CA">B.Com CA</option>
<option value="B.Com BUS.AD">B.Com BUS.AD</option>

<option value="B.A DEFENCE">B.A DEFENCE</option>
<option value="B.A PUB.AD">B.A PUB.AD</option>
<option value="B.A TAMIL">B.A TAMIL</option>
<option value="B.A TOURISM">B.A TOURISM</option>

<option value="B.Sc CS">B.Sc CS</option>
<option value="B.Sc CS WITH AI">B.Sc CS WITH AI</option>
<option value="B.Sc CRIMINOLOGY">B.Sc CRIMINOLOGY</option>
<option value="B.Sc SA">B.Sc SA</option>
<option value="B.Sc PHYS WITH CA">B.Sc PHYS WITH CA</option>
<option value="B.Sc MATHS WITH CA">B.Sc MATHS WITH CA</option>
<option value="B.Sc ELECTRONICS WITH AI">B.Sc ELECTRONICS WITH AI</option>
<option value="B.Sc VISCOM">B.Sc VISCOM</option>
<option value="B.Sc ELECTRONIC MEDIA">B.Sc ELECTRONIC MEDIA</option>
<option value="B.Sc IDD">B.Sc IDD</option>
<option value="B.Sc PHYSICS">B.Sc PHYSICS</option>

<option value="BCA COMPUTER APPLICATION">BCA COMPUTER APPLICATION</option>

</select>

<label>Year</label>

<select id="year">

<option value="">Select Year</option>

<option value="I">I Year</option>
<option value="II">II Year</option>
<option value="III">III Year</option>

</select>

<label>Section</label>

<select id="section">

<option value="">Select Section</option>

<option value="A">Section A</option>
<option value="B">Section B</option>
<option value="C">Section C</option>
<option value="D">Section D</option>

</select>

<label>Select Excel File</label>

<input
type="file"
id="excelFile"
accept=".xlsx,.xls">

<br><br>

<button id="previewBtn">

<i class="fa fa-eye"></i>

Preview Excel

</button>

<button id="uploadBtn">

<i class="fa fa-upload"></i>

Upload Students

</button>

<div class="loader" id="loader"></div>

<div id="message" class="message"></div>

</div>

<div class="container" style="margin-top:25px;">

<h2>Student Preview</h2>

<div class="table-wrapper">

<table id="previewTable">

<thead>

<tr>

<th>S.No</th>

<th>Roll No</th>

<th>Student Name</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

</div>

</div>

<script type="module">
    import { db } from "./firebase-config.js";

import {
    collection,
    getDocs,
    query,
    where,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const previewBtn = document.getElementById("previewBtn");
const uploadBtn = document.getElementById("uploadBtn");

const tbody = document.querySelector("#previewTable tbody");

const loader = document.getElementById("loader");
const message = document.getElementById("message");

let students = [];

// Preview Excel
previewBtn.addEventListener("click", readExcel);

// Upload
uploadBtn.addEventListener("click", uploadStudents);

function showMessage(text, type) {

    message.style.display = "block";
    message.className = "message " + type;
    message.innerHTML = text;

}

function hideMessage() {

    message.style.display = "none";

}

function readExcel() {

    hideMessage();

    const file = document.getElementById("excelFile").files[0];

    if (!file) {

        showMessage("Please choose an Excel file.", "error");

        return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {

        const data = new Uint8Array(e.target.result);

        const workbook = XLSX.read(data, {
            type: "array"
        });

        const sheet = workbook.Sheets[workbook.SheetNames[0]];

        const rows = XLSX.utils.sheet_to_json(sheet, {
            header: 1
        });

        students = [];

        tbody.innerHTML = "";

        for (let i = 1; i < rows.length; i++) {

            if (!rows[i][0]) continue;

            const rollNo = String(rows[i][0]).trim();

            const studentName = String(rows[i][1] || "").trim();

            students.push({
                rollNo,
                studentName
            });

            tbody.innerHTML += `
            <tr>
                <td>${students.length}</td>
                <td>${rollNo}</td>
                <td>${studentName}</td>
            </tr>
            `;

        }

        showMessage(
            students.length +
            " students loaded successfully.",
            "success"
        );

    };

    reader.readAsArrayBuffer(file);

}

async function uploadStudents() {

    hideMessage();

    const academicYear =
        document.getElementById("academicYear").value;

    const department =
        document.getElementById("department").value;

    const year =
        document.getElementById("year").value;

    const section =
        document.getElementById("section").value;

    if (
        academicYear == "" ||
        department == "" ||
        year == "" ||
        section == ""
    ) {

        showMessage(
            "Please select Academic Year, Department, Year and Section.",
            "error"
        );

        return;

    }

    if (students.length == 0) {

        showMessage(
            "Preview the Excel file first.",
            "error"
        );

        return;

    }

    loader.style.display = "block";

    let uploaded = 0;

    let skipped = 0;

    for (const student of students) {

        const q = query(
            collection(db, "students"),
            where("rollNo", "==", student.rollNo)
        );

        const existing = await getDocs(q);

        if (!existing.empty) {

            skipped++;

            continue;

        }

        await addDoc(collection(db, "students"), {

            academicYear,

            department,

            year,

            section,

            rollNo: student.rollNo,

            studentName: student.studentName,

            registerNo: "",

            createdAt: serverTimestamp()

        });

        uploaded++;

    }

    loader.style.display = "none";

    showMessage(

        "Upload Completed.<br><br>" +

        "Uploaded : " + uploaded +

        "<br>" +

        "Skipped : " + skipped,

        "success"

    );

    students = [];

    tbody.innerHTML = "";

    document.getElementById("excelFile").value = "";

}
</script>

</body>
</html>
