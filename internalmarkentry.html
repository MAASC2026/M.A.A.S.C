<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Internal Mark Entry</title>

<link rel="stylesheet" href="internalmarkentry.css">

</head>


<body>


<div class="container">


<div class="header">

<h2>Internal Mark Entry</h2>

</div>



<div class="filters">



<div class="form-group">

<label>Department</label>

<select id="department">

<option value="">Select Department</option>

<option value="B.Com General">B.Com General</option>
<option value="B.Com BM">B.Com BM</option>
<option value="B.Com MM">B.Com MM</option>
<option value="B.Com CS">B.Com CS</option>
<option value="B.Com A&F">B.Com A&F</option>
<option value="B.Com ISM">B.Com ISM</option>
<option value="B.Com CA">B.Com CA</option>
<option value="B.Com BUS.AD">B.Com BUS.AD</option>

<option value="B.A DEFENCE">B.A DEFENCE</option>
<option value="B.A PUB.AD">B.A PUB.AD</option>
<option value="B.A TAMIL">B.A TAMIL</option>
<option value="B.A TOURISM">B.A TOURISM</option>

<option value="B.Sc CS">B.Sc CS</option>
<option value="B.Sc CS WITH AI">B.Sc CS WITH AI</option>
<option value="B.Sc CRIMINOLOGY">B.Sc CRIMINOLOGY</option>
<option value="B.Sc SA">B.Sc SA</option>
<option value="B.Sc PHYS WITH CA">B.Sc PHYS WITH CA</option>
<option value="B.Sc MATHS WITH CA">B.Sc MATHS WITH CA</option>
<option value="B.Sc ELECTRONICS WITH AI">B.Sc ELECTRONICS WITH AI</option>
<option value="B.Sc VISCOM">B.Sc VISCOM</option>
<option value="B.Sc ELECTRONIC MEDIA">B.Sc ELECTRONIC MEDIA</option>
<option value="B.Sc IDD">B.Sc IDD</option>
<option value="B.Sc PHYSICS">B.Sc PHYSICS</option>

<option value="BCA COMPUTER APPLICATION">BCA COMPUTER APPLICATION</option>

</select>

</div>





<div class="form-group">

<label>Class</label>

<select id="year">

<option value="">Select Year</option>

<option value="I">I Year</option>

<option value="II">II Year</option>

<option value="III">III Year</option>

</select>

</div>





<div class="form-group">

<label>Section</label>

<select id="section">

<option value="">Select Section</option>

<option value="A">A</option>

<option value="B">B</option>

<option value="C">C</option>

<option value="D">D</option>

</select>

</div>





<div class="form-group">

<label>Subject</label>

<select id="subject">


<option value="">Select Subject</option>

<option>Data Structure Programming</option>

<option>Web Technology</option>

<option>RDBMS - SA</option>

<option>ASP.NET - SA </option>


</select>


</div>






<div class="form-group">


<label>Program Number</label>


<select id="examType">


<option value="">Select Exam</option>

<option>PRG 1</option>

<option>PRG 2</option> 2</option>

<option>PRG 3</option>

<option>PRG 4</option>

<option>PRG 5</option>


</select>


</div>






<div class="form-group">

<label>Maximum Mark</label>

<input 

type="number"

id="maxMark"

value="50">


</div>






<div class="form-group">


<label>Date</label>


<input 

type="date"

id="date">


</div>



</div>






<div class="button-area">


<button onclick="loadStudents()">

Load Students

</button>


</div>







<table>


<thead>

<tr>

<th>S.No</th>

<th>Roll No</th>

<th>Student Name</th>

<th>Mark</th>


</tr>

</thead>



<tbody id="studentBody">


</tbody>


</table>







<div class="save-area">


<button onclick="saveMarks()">

Save Marks

</button>


</div>




</div>





<script type="module">
    // ==========================================
// Firebase Configuration
// ==========================================

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getFirestore,
collection,
getDocs,
query,
where,
addDoc,
serverTimestamp

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";





const firebaseConfig = {

  apiKey: "AIzaSyAIv3091VM-gkmdwEAn7OhXWd9Cm2zh2bo",
  authDomain: "maasc-2026.firebaseapp.com",
  projectId: "maasc-2026",
  storageBucket: "maasc-2026.appspot.com",
  messagingSenderId: "585813001586",
  appId: "1:585813001586:web:664e0e90ff0725d2e849eb"


};





const app = initializeApp(firebaseConfig);


const db = getFirestore(app);






// Set Today's Date

document.getElementById("date").valueAsDate = new Date();







// ==========================================
// LOAD STUDENTS
// ==========================================
window.loadStudents = async function(){

const department =
document.getElementById("department").value;

const year =
document.getElementById("year").value;

const section =
document.getElementById("section").value;

const subject =
document.getElementById("subject").value;

const examType =
document.getElementById("examType").value;



if(
!department ||
!year ||
!section ||
!subject ||
!examType
){

alert("Select all fields");

return;

}



const tbody =
document.getElementById("studentBody");

tbody.innerHTML="";



try{


// Load students

const studentQuery=query(

collection(db,"students"),

where("department","==",department),

where("year","==",year),

where("section","==",section)

);



const studentSnapshot=
await getDocs(studentQuery);




// Load existing marks

const markQuery=query(

collection(db,"internalMarks"),

where("department","==",department),

where("year","==",year),

where("section","==",section),

where("subject","==",subject),

where("examType","==",examType)

);



const markSnapshot =
await getDocs(markQuery);



let markList={};



markSnapshot.forEach(doc=>{

let data=doc.data();

markList[data.rollNo]=data.mark;


});





let sno=1;



studentSnapshot.forEach(doc=>{


let student=doc.data();


let oldMark =
markList[student.rollNo];



tbody.innerHTML += `


<tr>

<td>${sno++}</td>


<td>${student.rollNo}</td>


<td>${student.studentName}</td>


<td>


<input

type="number"

class="mark"

data-roll="${student.rollNo}"

value="${oldMark ?? ''}"

placeholder="Enter Mark">


</td>


</tr>


`;



});



}

catch(error){

console.error(error);

alert(error.message);

}


}
// ==========================================
// SAVE MARKS
// ==========================================


window.saveMarks = async function(){





let department =
document.getElementById("department").value;



let year =
document.getElementById("year").value;



let section =
document.getElementById("section").value;



let subject =
document.getElementById("subject").value;



let examType =
document.getElementById("examType").value;



let maxMark =
Number(document.getElementById("maxMark").value);



let date =
document.getElementById("date").value;






if(
!department ||
!year ||
!section ||
!subject ||
!examType ||
!maxMark ||
!date

)

{

alert("Please fill all fields");

return;

}






let marks =
document.querySelectorAll(".mark");



if(marks.length==0)

{

alert("Load Students First");

return;

}






try{



for(let input of marks)

{


let mark=input.value;



if(mark==="")

{

alert("Enter marks for all students");

return;

}




if(Number(mark)>maxMark)

{

alert(

"Mark cannot exceed maximum mark"

);

return;

}




let row=input.closest("tr");



let rollNo=row.cells[1].innerText;


let studentName=row.cells[2].innerText;







await addDoc(

collection(db,"internalMarks"),

{


department,

year,

section,

subject,

examType,

maxMark,

date,

rollNo,

studentName,

mark:Number(mark),

createdAt:serverTimestamp()


}

);



}




alert("Internal Marks Saved Successfully");



}



catch(error)

{


console.log(error);

alert(error.message);


}




}
</script>



</body>


</html>
