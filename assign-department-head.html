<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Assign Department Head</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f6f9;
    min-height:100vh;
}

/* HEADER */

.header{
    height:70px;
    background:#500454;
    color:white;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 25px;

    box-shadow:0 2px 10px rgba(0,0,0,.25);
}

.header h2{
    font-size:23px;
}

.header span{
    font-size:15px;
}

/* CONTAINER */

.container{
    max-width:1200px;
    margin:30px auto;
    padding:0 20px;
}

/* CARD */

.card{
    background:white;
    border-radius:12px;
    padding:25px;
    margin-bottom:25px;

    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.card h2{
    color:#500454;
    margin-bottom:20px;
}

/* FORM */

.form-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr));

    gap:20px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group label{
    font-weight:bold;
    margin-bottom:8px;
    color:#333;
}

select,
input{
    width:100%;
    padding:12px;

    border:1px solid #ccc;
    border-radius:7px;

    font-size:15px;

    outline:none;
}

select:focus,
input:focus{
    border-color:#500454;
}

/* DEPARTMENT CHECKBOXES */

.department-box{
    border:1px solid #ddd;
    border-radius:8px;
    padding:15px;

    max-height:260px;
    overflow-y:auto;

    background:#fafafa;
}

.department-item{
    display:flex;
    align-items:center;

    padding:10px;

    border-bottom:1px solid #eee;
}

.department-item:last-child{
    border-bottom:none;
}

.department-item input{
    width:auto;
    margin-right:10px;
}

.department-item label{
    cursor:pointer;
    margin:0;
    font-weight:normal;
}

/* BUTTON */

button{
    border:none;
    border-radius:7px;

    padding:12px 22px;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;
}

.btn-save{
    background:#500454;
    color:white;
}

.btn-save:hover{
    background:#6c0872;
}

.btn-clear{
    background:#777;
    color:white;
    margin-left:8px;
}

.btn-clear:hover{
    background:#555;
}

/* STATUS */

#status{
    margin-top:15px;
    padding:12px;

    border-radius:7px;

    display:none;
    font-weight:bold;
}

/* TABLE */

.table-container{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    padding:13px;
    border-bottom:1px solid #eee;
    text-align:left;
}

th{
    background:#500454;
    color:white;
}

tr:hover{
    background:#fafafa;
}

/* DEPARTMENT TAG */

.tag{
    display:inline-block;

    background:#eee;

    color:#500454;

    padding:5px 9px;

    margin:3px;

    border-radius:15px;

    font-size:13px;

    font-weight:bold;
}

/* ACTION BUTTON */

.edit-btn{
    background:#500454;
    color:white;

    padding:8px 14px;

    font-size:13px;
}

.remove-btn{
    background:#c62828;
    color:white;

    padding:8px 14px;

    font-size:13px;

    margin-left:5px;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:30px;
    color:#777;
}

/* RESPONSIVE */

@media(max-width:600px){

    .header{
        padding:0 15px;
    }

    .header h2{
        font-size:18px;
    }

    .header span{
        font-size:12px;
    }

    .container{
        margin-top:20px;
        padding:0 10px;
    }

}

</style>

</head>

<body>


<!-- =========================
     HEADER
========================= -->

<div class="header">

    <h2>
        DEPARTMENT HEAD ASSIGNMENT
    </h2>

    <span>
        MAASC ERP
    </span>

</div>


<div class="container">


<!-- =========================
     ASSIGN HEAD
========================= -->

<div class="card">

    <h2>
        Assign / Update Department Head
    </h2>


    <div class="form-grid">


        <!-- STAFF -->

        <div class="form-group">

            <label>
                Select Staff
            </label>

            <select id="staffSelect">

                <option value="">
                    -- Select Staff --
                </option>

            </select>

        </div>


        <!-- SEARCH STAFF -->

        <div class="form-group">

            <label>
                Search Staff
            </label>

            <input
                type="text"
                id="staffSearch"
                placeholder="Type staff name or ID">

        </div>


    </div>


    <br>


    <!-- DEPARTMENTS -->

    <div class="form-group">

        <label>
            Select Department(s)
        </label>


        <div
            id="departmentBox"
            class="department-box">

            Loading departments...

        </div>

    </div>


    <br>


    <button
        class="btn-save"
        onclick="saveHead()">

        SAVE HEAD

    </button>


    <button
        class="btn-clear"
        onclick="clearForm()">

        CLEAR

    </button>


    <div id="status"></div>

</div>


<!-- =========================
     CURRENT HEADS
========================= -->

<div class="card">

    <h2>
        Current Department Heads
    </h2>


    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>
                        Staff ID
                    </th>

                    <th>
                        Staff Name
                    </th>

                    <th>
                        Departments
                    </th>

                    <th>
                        Role
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody id="headTable">

            </tbody>

        </table>

    </div>

</div>


</div>


<script type="module">


/* ==========================================
   FIREBASE
========================================== */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    getDoc,
    setDoc,
    updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ==========================================
   YOUR FIREBASE CONFIG
========================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyAIv3091VM-gkmdwEAn7OhXWd9Cm2zh2bo",

    authDomain:
    "maasc-2026.firebaseapp.com",

    projectId:
    "maasc-2026",

    storageBucket:
    "maasc-2026.appspot.com",

    messagingSenderId:
    "585813001586",

    appId:
    "1:585813001586:web:664e0e90ff0725d2e849eb"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


/* ==========================================
   GLOBAL DATA
========================================== */

let staffData = [];

let departmentList = [];

let editingStaffId = "";


/* ==========================================
   DEPARTMENTS
========================================== */

departmentList = [

    "COMPUTER APPLICATIONS",

    "COMPUTER SCIENCE",

    "INFORMATION TECHNOLOGY",

    "COMMERCE",

    "COMMERCE WITH COMPUTER APPLICATIONS",

    "BUSINESS ADMINISTRATION",

    "BUSINESS ADMINISTRATION WITH COMPUTER APPLICATIONS",

    "ENGLISH",

    "TAMIL",

    "MATHEMATICS",

    "PHYSICS",

    "CHEMISTRY",

    "BIOCHEMISTRY",

    "MICROBIOLOGY",

    "BIOTECHNOLOGY",

    "PSYCHOLOGY",

    "VISUAL COMMUNICATION",

    "ELECTRONIC MEDIA",

    "COSTUME DESIGN AND FASHION",

    "HOTEL MANAGEMENT",

    "LIBRARY",

    "PHYSICAL EDUCATION",

    "ADMINISTRATION",

    "HR",

    "FINANCE",

    "LAB"

];


/* ==========================================
   LOAD DEPARTMENTS
========================================== */

function loadDepartments(){

    const box =
    document.getElementById(
        "departmentBox"
    );

    box.innerHTML = "";


    departmentList.forEach(
        department => {

            const div =
            document.createElement("div");

            div.className =
            "department-item";


            const checkbox =
            document.createElement("input");

            checkbox.type =
            "checkbox";

            checkbox.value =
            department;

            checkbox.id =
            "dep_" +
            department
            .replace(/[^a-zA-Z0-9]/g,"_");


            const label =
            document.createElement("label");

            label.htmlFor =
            checkbox.id;

            label.textContent =
            department;


            div.appendChild(
                checkbox
            );

            div.appendChild(
                label
            );


            box.appendChild(
                div
            );

        }
    );

}


/* ==========================================
   LOAD STAFF
========================================== */

async function loadStaff(){

    try{

        const snap =
        await getDocs(
            collection(
                db,
                "staff"
            )
        );


        staffData = [];


        snap.forEach(
            item => {

                const data =
                item.data();


                staffData.push({

                    documentId:
                    item.id,

                    staffId:
                    data.staffId ||
                    item.id,

                    staffName:
                    data.staffName ||
                    data.name ||
                    "",

                    department:
                    data.department ||
                    "",

                    role:
                    data.role ||
                    ""

                });

            }
        );


        staffData.sort(
            (a,b) =>
            a.staffName.localeCompare(
                b.staffName
            )
        );


        displayStaff(
            staffData
        );


        loadHeads();


    }catch(error){

        console.error(
            "STAFF LOAD ERROR:",
            error
        );

        showStatus(
            "Unable to load staff. Check Firestore permissions.",
            "error"
        );

    }

}


/* ==========================================
   DISPLAY STAFF
========================================== */

function displayStaff(list){

    const select =
    document.getElementById(
        "staffSelect"
    );


    select.innerHTML = `

        <option value="">
            -- Select Staff --
        </option>

    `;


    list.forEach(
        staff => {

            const option =
            document.createElement(
                "option"
            );


            option.value =
            staff.staffId;


            option.textContent =
            staff.staffName +
            " (" +
            staff.staffId +
            ")";


            select.appendChild(
                option
            );

        }
    );

}


/* ==========================================
   STAFF SEARCH
========================================== */

document
.getElementById("staffSearch")
.addEventListener(
    "input",
    function(){

        const search =
        this.value
        .trim()
        .toLowerCase();


        if(!search){

            displayStaff(
                staffData
            );

            return;

        }


        const filtered =
        staffData.filter(
            staff =>

            staff.staffName
            .toLowerCase()
            .includes(search)

            ||

            staff.staffId
            .toLowerCase()
            .includes(search)

        );


        displayStaff(
            filtered
        );

    }
);


/* ==========================================
   STAFF SELECT
========================================== */

document
.getElementById("staffSelect")
.addEventListener(
    "change",
    async function(){

        const staffId =
        this.value;


        if(!staffId){

            editingStaffId = "";

            clearDepartmentChecks();

            return;

        }


        editingStaffId =
        staffId;


        await loadExistingHead(
            staffId
        );

    }
);


/* ==========================================
   LOAD EXISTING HEAD
========================================== */

async function loadExistingHead(
    staffId
){

    try{

        const ref =
        doc(
            db,
            "staff",
            staffId
        );


        const snap =
        await getDoc(ref);


        clearDepartmentChecks();


        if(
            !snap.exists()
        ){

            return;

        }


        const data =
        snap.data();


        /*
         * NEW FORMAT
         *
         * headDepartments: []
         */

        let departments =
        data.headDepartments;


        /*
         * BACKWARD COMPATIBILITY
         *
         * If old record has
         * department field.
         */

        if(
            !Array.isArray(
                departments
            )
        ){

            if(
                data.department
            ){

                departments =
                [
                    data.department
                ];

            }else{

                departments = [];

            }

        }


        departments.forEach(
            department => {

                const id =
                "dep_" +
                department
                .replace(
                    /[^a-zA-Z0-9]/g,
                    "_"
                );


                const checkbox =
                document.getElementById(
                    id
                );


                if(checkbox){

                    checkbox.checked =
                    true;

                }

            }
        );


    }catch(error){

        console.error(error);

    }

}


/* ==========================================
   CLEAR CHECKBOXES
========================================== */

function clearDepartmentChecks(){

    document
    .querySelectorAll(
        "#departmentBox input[type=checkbox]"
    )
    .forEach(
        checkbox => {

            checkbox.checked =
            false;

        }
    );

}


/* ==========================================
   SAVE HEAD
========================================== */

window.saveHead =
async function(){

    const staffId =
    document
    .getElementById(
        "staffSelect"
    )
    .value;


    if(!staffId){

        showStatus(
            "Please select a staff member.",
            "error"
        );

        return;

    }


    const selectedDepartments =
    Array.from(
        document.querySelectorAll(
            "#departmentBox input[type=checkbox]:checked"
        )
    )
    .map(
        checkbox =>
        checkbox.value
    );


    if(
        selectedDepartments.length === 0
    ){

        showStatus(
            "Please select at least one department.",
            "error"
        );

        return;

    }


    const staff =
    staffData.find(
        item =>
        item.staffId === staffId
    );


    if(!staff){

        showStatus(
            "Staff details not found.",
            "error"
        );

        return;

    }


    try{

        const staffRef =
        doc(
            db,
            "staff",
            staffId
        );


        /*
         * IMPORTANT
         *
         * ONE PERSON
         * CAN HAVE MULTIPLE
         * DEPARTMENTS
         */

        await setDoc(
            staffRef,
            {

                staffId:
                staffId,

                staffName:
                staff.staffName,

                role:
                "Department Head",

                headDepartments:
                selectedDepartments,

                /*
                 * Keep the original
                 * department field if
                 * it already exists.
                 */

                department:
                staff.department ||
                selectedDepartments[0],

                updatedAt:
                new Date()

            },
            {
                merge:true
            }
        );


        showStatus(
            "Department Head assigned successfully.",
            "success"
        );


        clearForm();


        await loadStaff();


    }catch(error){

        console.error(
            "SAVE HEAD ERROR:",
            error
        );


        showStatus(
            "Failed to save Head. Check Firestore permissions.",
            "error"
        );

    }

};


/* ==========================================
   LOAD HEADS
========================================== */

async function loadHeads(){

    const table =
    document.getElementById(
        "headTable"
    );


    table.innerHTML = `

        <tr>
            <td colspan="5"
                class="empty">

                Loading...

            </td>
        </tr>

    `;


    try{

        const snap =
        await getDocs(
            collection(
                db,
                "staff"
            )
        );


        table.innerHTML = "";


        let count = 0;


        snap.forEach(
            item => {

                const data =
                item.data();


                let departments =
                data.headDepartments;


                /*
                 * Only show actual
                 * Department Heads
                 */

                if(
                    data.role !==
                    "Department Head"
                ){

                    return;

                }


                if(
                    !Array.isArray(
                        departments
                    )
                ){

                    if(
                        data.department
                    ){

                        departments =
                        [
                            data.department
                        ];

                    }else{

                        departments =
                        [];

                    }

                }


                if(
                    departments.length === 0
                ){

                    return;

                }


                count++;


                const tr =
                document.createElement(
                    "tr"
                );


                const departmentTags =
                departments
                .map(
                    department =>

                    `<span class="tag">
                        ${escapeHtml(
                            department
                        )}
                    </span>`

                )
                .join("");


                tr.innerHTML = `

                    <td>
                        ${escapeHtml(
                            data.staffId ||
                            item.id
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            data.staffName ||
                            data.name ||
                            ""
                        )}
                    </td>

                    <td>
                        ${departmentTags}
                    </td>

                    <td>
                        <b>
                            Department Head
                        </b>
                    </td>

                    <td>

                        <button
                            class="edit-btn"
                            onclick="editHead(
                                '${escapeAttribute(
                                    data.staffId ||
                                    item.id
                                )}'
                            )">

                            EDIT

                        </button>

                        <button
                            class="remove-btn"
                            onclick="removeHead(
                                '${escapeAttribute(
                                    data.staffId ||
                                    item.id
                                )}'
                            )">

                            REMOVE

                        </button>

                    </td>

                `;


                table.appendChild(
                    tr
                );

            }
        );


        if(count === 0){

            table.innerHTML = `

                <tr>

                    <td
                        colspan="5"
                        class="empty">

                        No Department Heads assigned.

                    </td>

                </tr>

            `;

        }


    }catch(error){

        console.error(error);


        table.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="empty">

                    Unable to load Head list.

                </td>

            </tr>

        `;

    }

}


/* ==========================================
   EDIT HEAD
========================================== */

window.editHead =
async function(staffId){

    document
    .getElementById(
        "staffSelect"
    )
    .value =
    staffId;


    editingStaffId =
    staffId;


    await loadExistingHead(
        staffId
    );


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

};


/* ==========================================
   REMOVE HEAD
========================================== */

window.removeHead =
async function(staffId){

    const confirmRemove =
    confirm(
        "Remove Department Head assignment for this staff member?"
    );


    if(!confirmRemove){

        return;

    }


    try{

        const staffRef =
        doc(
            db,
            "staff",
            staffId
        );


        /*
         * Do not delete staff.
         *
         * Only remove Head role
         * and Head departments.
         */

        await updateDoc(
            staffRef,
            {

                role:
                "Staff",

                headDepartments: []

            }
        );


        showStatus(
            "Department Head assignment removed.",
            "success"
        );


        await loadStaff();


    }catch(error){

        console.error(
            error
        );


        showStatus(
            "Unable to remove Head assignment.",
            "error"
        );

    }

};


/* ==========================================
   CLEAR FORM
========================================== */

window.clearForm =
function(){

    document
    .getElementById(
        "staffSelect"
    )
    .value = "";


    document
    .getElementById(
        "staffSearch"
    )
    .value = "";


    editingStaffId =
    "";


    clearDepartmentChecks();


    displayStaff(
        staffData
    );


    hideStatus();

};


/* ==========================================
   STATUS
========================================== */

function showStatus(
    message,
    type
){

    const status =
    document.getElementById(
        "status"
    );


    status.style.display =
    "block";


    status.textContent =
    message;


    if(type === "success"){

        status.style.background =
        "#e8f5e9";

        status.style.color =
        "#2e7d32";

    }else{

        status.style.background =
        "#ffebee";

        status.style.color =
        "#c62828";

    }

}


function hideStatus(){

    document
    .getElementById(
        "status"
    )
    .style.display =
    "none";

}


/* ==========================================
   HTML SAFETY
========================================== */

function escapeHtml(value){

    return String(value || "")
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(value){

    return String(value || "")
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    );

}


/* ==========================================
   INITIAL LOAD
========================================== */

loadDepartments();

loadStaff();


</script>

</body>

</html>
