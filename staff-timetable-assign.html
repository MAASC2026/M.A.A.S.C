<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Staff Timetable Assignment</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="staff-timetable-assign.css">

</head>

<body>

<header>

<div class="logo">

<i class="fa-solid fa-calendar-days"></i>

<h2>LAB STAFF TIMETABLE</h2>

</div>

<h1>

STAFF TIMETABLE ASSIGNMENT

</h1>

</header>

<div class="container">

<!-- ========================= -->

<div class="card">

<h3>

Staff Details

</h3>

<div class="formGrid">

<div>

<label>

Staff ID

</label>

<div class="searchBox">

<input
type="text"
id="staffId"
placeholder="Enter Staff ID">

<button id="loadStaff">

<i class="fa fa-search"></i>

Load

</button>

</div>

</div>

<div>

<label>

Staff Name

</label>

<input
type="text"
id="staffName"
readonly>

</div>

<div>

<label>

Department

</label>

<input
type="text"
id="department"
readonly>

</div>

</div>

</div>

<!-- ========================= -->

<div class="card">

<h3>

Session

</h3>

<div class="sessionArea">

<label>

<input
type="radio"
name="session"
value="FN"
checked>

FORE NOON

</label>

<label>

<input
type="radio"
name="session"
value="AN">

AFTER NOON

</label>

</div>

</div>

<!-- ========================= -->

<div class="card">

<div class="toolbar">

<button id="saveBtn">

<i class="fa-solid fa-floppy-disk"></i>

Save Timetable

</button>

<button id="printBtn">

<i class="fa-solid fa-print"></i>

Print

</button>

</div>

</div>

<!-- ========================= -->

<div class="card">

<div id="tableContainer">

<!-- FN / AN TABLE GENERATED HERE -->

</div>

</div>

</div>

<!-- ====================================== -->

<div class="modal"
id="assignModal">

<div class="modalContent">

<h2>

Assign Subject

</h2>

<div class="popupGrid">

<div>

<label>

Day

</label>

<input
type="text"
id="popupDay"
readonly>

</div>

<div>

<label>

Session

</label>

<input
type="text"
id="popupSession"
readonly>

</div>

<div>

<label>

Hour

</label>

<input
type="text"
id="popupHour"
readonly>

</div>

<div>

<label>

Time

</label>

<input
type="text"
id="popupTime"
readonly>

</div>

<div class="full">

<label>

Subject

</label>

<select id="popupSubject">

<option>

Loading...

</option>

</select>

</div>

</div>

<div class="buttons">

<button id="savePeriod">

Save

</button>

<button id="deletePeriod">

Delete

</button>

<button id="cancelPeriod">

Cancel

</button>

</div>

</div>

</div>

<script type="module"
src="staff-timetable-assign.js"></script>

</body>

</html>
