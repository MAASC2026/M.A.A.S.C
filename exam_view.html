<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Student Exam View Portal</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}


body{

background:#f4f6f9;
padding:25px;

}


.container{

max-width:1200px;
margin:auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);

}


h2{

text-align:center;
color:#1565c0;
margin-bottom:25px;

}



.filter-box{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-bottom:25px;

}



select,
button{

padding:12px;
border-radius:5px;
border:1px solid #ccc;
font-size:15px;

}



button{

background:#1565c0;
color:white;
border:none;
cursor:pointer;

}



button:hover{

background:#0d47a1;

}




.exam-card{

background:#fafafa;
border-left:6px solid #1565c0;
padding:20px;
margin-bottom:20px;
border-radius:8px;

}



.exam-card h3{

color:#1565c0;
margin-bottom:15px;

}



.exam-card p{

margin:8px 0;

}



.portion{

background:white;
padding:15px;
margin-top:15px;
border-radius:5px;
border:1px solid #ddd;

}



.no-data{

text-align:center;
font-size:18px;
padding:30px;
color:#777;

}




@media(max-width:800px){

.filter-box{

grid-template-columns:1fr;

}

}



</style>

</head>



<body>


<div class="container">


<h2>
Student Exam View Portal
</h2>



<div class="filter-box">


<select id="department">


<option value="">
Select Department
</option>


<option value="">Select Department</option>

<option value="B.Com General">B.Com General</option>
<option value="B.Com BM">B.Com BM</option>
<option value="B.Com MM">B.Com MM</option>
<option value="B.Com CS">B.Com CS</option>
<option value="B.Com A&F">B.Com A&F</option>
<option value="B.Com ISM">B.Com ISM</option>
<option value="B.Com CA">B.Com CA</option>
<option value="B.Com BUS.AD">B.Com BUS.AD</option>

<option value="B.A DEFENCE">B.A DEFENCE</option>
<option value="B.A PUB.AD">B.A PUB.AD</option>
<option value="B.A TAMIL">B.A TAMIL</option>
<option value="B.A TOURISM">B.A TOURISM</option>

<option value="B.Sc CS">B.Sc CS</option>
<option value="B.Sc CS WITH AI">B.Sc CS WITH AI</option>
<option value="B.Sc CRIMINOLOGY">B.Sc CRIMINOLOGY</option>
<option value="B.Sc SA">B.Sc SA</option>
<option value="B.Sc PHYS WITH CA">B.Sc PHYS WITH CA</option>
<option value="B.Sc MATHS WITH CA">B.Sc MATHS WITH CA</option>
<option value="B.Sc ELECTRONICS WITH AI">B.Sc ELECTRONICS WITH AI</option>
<option value="B.Sc VISCOM">B.Sc VISCOM</option>
<option value="B.Sc ELECTRONIC MEDIA">B.Sc ELECTRONIC MEDIA</option>
<option value="B.Sc IDD">B.Sc IDD</option>
<option value="B.Sc PHYSICS">B.Sc PHYSICS</option>

<option value="BCA COMPUTER APPLICATION">BCA COMPUTER APPLICATION</option>


</select>




<select id="year">


<option value="">
Select Year
</option>


<option>I Year</option>

<option>II Year</option>

<option>III Year</option>



</select>





<select id="section">


<option value="">
Select Section
</option>


<option>A</option>

<option>B</option>

<option>C</option>

<option>D</option>


</select>





<button id="loadBtn">

Load Exam

</button>



</div>





<div id="examList">


<div class="no-data">

Select Department, Year and Section

</div>


</div>




</div>




<script type="module">
    import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getFirestore,
collection,
query,
where,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



// FIREBASE CONFIG

const firebaseConfig = {

apiKey: "AIzaSyAIv3091VM-gkmdwEAn7OhXWd9Cm2zh2bo",

authDomain: "maasc-2026.firebaseapp.com",

projectId: "maasc-2026",

storageBucket: "maasc-2026.appspot.com",

messagingSenderId: "585813001586",

appId: "1:585813001586:web:664e0e90ff0725d2e849eb"

};



// INITIALIZE

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);




// BUTTON EVENT

document
.getElementById("loadBtn")
.addEventListener(
"click",
loadExam
);





async function loadExam(){



const department =
document.getElementById("department").value;


const year =
document.getElementById("year").value;


const section =
document.getElementById("section").value;



if(
department==""||
year==""||
section==""
){

alert("Please select Department, Year and Section");

return;

}




const examList =
document.getElementById("examList");



examList.innerHTML=
`
<div class="no-data">
Loading Exams...
</div>
`;




try{


const q=query(

collection(db,"examAssignments"),


where(
"department",
"==",
department
),


where(
"year",
"==",
year
),


where(
"section",
"==",
section
)


);




const snapshot =
await getDocs(q);





if(snapshot.empty){


examList.innerHTML=
`

<div class="no-data">

No Exam Assigned For This Class

</div>

`;


return;

}




let html="";




snapshot.forEach(doc=>{


const e = doc.data();



html +=

`

<div class="exam-card">


<h3>
${e.subject}
</h3>

<p>
<b>Assigned Staff :</b>
${e.faculty}
</p>

<p>
<b>Exam Type :</b>
${e.examType}
</p>



<p>
<b>Date :</b>
${e.examDate}
</p>



<p>
<b>Time :</b>
${e.examTime}
</p>



<p>
<b>Semester :</b>
${e.semester}
</p>



<p>
<b>Maximum Marks :</b>
${e.maxMarks}
</p>



<div class="portion">


<b>
Exam Portion
</b>


<hr><br>


${e.portion}


</div>



</div>

`;



});




examList.innerHTML=html;



}

catch(error){


console.error(error);


examList.innerHTML=

`

<div class="no-data">

Error Loading Exams

</div>

`;



}



}
</script>


</body>

</html>
