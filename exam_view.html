<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Schedule View</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

select{
    width:100%;
    padding:10px;
    margin:8px 0;
    box-sizing:border-box;
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th,td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}

th{
    background:#f2f2f2;
}

</style>
</head>

<body>

<div class="container">

<h2>Exam Schedule</h2>

<!-- Year -->
<select id="year" onchange="loadExam()">

    <option value="YEAR-1">I YEAR</option>
    <option value="YEAR-2">II YEAR</option>
    <option value="YEAR-3">III YEAR</option>

</select>

<!-- Department -->
<select id="dept" onchange="loadExam()">

    <option value="BCOM-GENERAL">B.Com General</option>
    <option value="BCOM-BM">B.Com BM</option>
    <option value="BCOM-MM">B.Com MM</option>
    <option value="BCOM-CS">B.Com CS</option>
    <option value="BCOM-AF">B.Com A&F</option>
    <option value="BCOM-ISM">B.Com ISM</option>
    <option value="BCOM-CA">B.Com CA</option>
    <option value="BCOM-BUSAD">B.Com BUS.AD</option>

    <option value="BA-DEFENCE">B.A DEFENCE</option>
    <option value="BA-PUBAD">B.A PUB.AD</option>
    <option value="BA-TAMIL">B.A TAMIL</option>
    <option value="BA-TOURISM">B.A TOURISM</option>

    <option value="BSC-CS">B.Sc CS</option>
    <option value="BSC-CS-AI">B.Sc CS WITH AI</option>
    <option value="BSC-CRIMINOLOGY">B.Sc CRIMINOLOGY</option>
    <option value="BSC-SA">B.Sc SA</option>
    <option value="BSC-PHYS-CA">B.Sc PHYSICS WITH CA</option>
    <option value="BSC-MATHS-CA">B.Sc MATHS WITH CA</option>
    <option value="BSC-ELEC-AI">B.Sc ELECTRONICS WITH AI</option>
    <option value="BSC-VISCOM">B.Sc VISCOM</option>
    <option value="BSC-ELECTRONIC-MEDIA">B.Sc ELECTRONIC MEDIA</option>
    <option value="BSC-IDD">B.Sc IDD</option>
    <option value="BSC-PHYSICS">B.Sc PHYSICS</option>

    <option value="BCA">BCA COMPUTER APPLICATION</option>

</select>

<!-- Exam Type -->
<select id="examType" onchange="loadExam()">

    <option value="CYCLIC-TEST-01">CYCLIC TEST 01</option>
    <option value="CYCLIC-TEST-02">CYCLIC TEST 02</option>

    <option value="INTERNAL-TEST-01">INTERNAL TEST 01</option>
    <option value="INTERNAL-TEST-02">INTERNAL TEST 02</option>

    <option value="MODEL-EXAM">MODEL EXAM</option>

    <option value="SEMESTER-EXAM">SEMESTER EXAM</option>

</select>

<div class="table-wrapper">

<table>

<thead>

<tr>
<th>Subject Code</th>
<th>Subject Name</th>
<th>Date</th>
<th>Timing</th>
<th>Platform</th>
</tr>

</thead>

<tbody id="tbody"></tbody>

</table>

</div>

</div>

<script type="module">

import { db } from "./firebase-config.js";

import {
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

function formatDate(dateStr){

    if(!dateStr) return "";

    const d = new Date(dateStr);

    const day = String(d.getDate()).padStart(2,"0");
    const month = String(d.getMonth()+1).padStart(2,"0");
    const year = d.getFullYear();

    return `${day}.${month}.${year}`;

}

window.loadExam = async function(){

    const year = document.getElementById("year").value;
    const dept = document.getElementById("dept").value;
    const examType = document.getElementById("examType").value;

    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";

    try{

        const snap = await getDoc(

            doc(
                db,
                "exams",
                year,
                "departments",
                dept,
                "exams",
                examType
            )

        );

        if(!snap.exists()){

            tbody.innerHTML = `
            <tr>
                <td colspan="5">No Exam Schedule Found</td>
            </tr>
            `;

            return;

        }

        const data = snap.data();

        Object.keys(data).forEach(key=>{

            const d = data[key];

            tbody.innerHTML += `

            <tr>

                <td>${d.SubjectCode || ""}</td>

                <td>${d.SubjectName || ""}</td>

                <td>${formatDate(d.Date)}</td>

                <td>${d.Timing || ""}</td>

                <td>${d.Platform || ""}</td>

            </tr>

            `;

        });

    }

    catch(err){

        console.error(err);

        tbody.innerHTML = `
        <tr>
            <td colspan="5">Error Loading Schedule</td>
        </tr>
        `;

    }

};

loadExam();

</script>

</body>
</html>
