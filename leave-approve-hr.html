<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Leave Approve - HR</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f6f9;
}

.container{
    max-width:1500px;
    margin:30px auto;
    padding:20px;
}

.header{
    background:#500454;
    color:white;
    padding:22px;
    border-radius:12px;
    margin-bottom:20px;
}

.header h2{
    margin-bottom:8px;
}

.card{
    background:white;
    padding:22px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.card h3{
    color:#500454;
    margin-bottom:20px;
}

.table-container{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1100px;
}

th,
td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:left;
    vertical-align:top;
}

th{
    background:#500454;
    color:white;
}

button{
    padding:9px 14px;
    border:none;
    border-radius:6px;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin:2px;
}

.approve{
    background:#16a34a;
}

.reject{
    background:#dc2626;
}

.message{
    display:none;
    padding:12px;
    margin-bottom:18px;
    border-radius:7px;
    font-weight:bold;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.empty{
    text-align:center;
    padding:25px;
    color:#666;
}

</style>

</head>

<body>

<div class="container">


<div class="header">

    <h2>
        Leave Approval - HR
    </h2>

    <p>
        Head Staff Leave Approval
    </p>

</div>


<div class="card">

    <div
        id="message"
        class="message">
    </div>


    <h3>
        Pending Head Staff Leave Applications
    </h3>


    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>Head Staff</th>
                    <th>Staff ID</th>
                    <th>Department</th>
                    <th>Leave Type</th>
                    <th>From</th>
                    <th>To</th>
                    <th>Days</th>
                    <th>Reason</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="table">

                <tr>

                    <td colspan="9">
                        Loading...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

</div>


<script type="module">

import { db } from "./firebase-config.js";

import {
    collection,
    getDocs,
    query,
    where,
    doc,
    updateDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================
   EXISTING ERP SESSION
===================================== */

const hrId =
    sessionStorage.getItem("staffId");

const hrName =
    sessionStorage.getItem("staffName");


if(!hrId){

    alert("Please Login");

    window.location.href="login.html";

}


/* =====================================
   MESSAGE
===================================== */

function showMessage(text,type){

    const box =
        document.getElementById("message");

    box.textContent=text;

    box.className=
        "message "+type;

    box.style.display="block";

}


/* =====================================
   LOAD HEAD LEAVES
===================================== */

async function loadRequests(){

    const table =
        document.getElementById("table");


    table.innerHTML =
        `<tr>
            <td colspan="9">
                Loading...
            </td>
        </tr>`;


    try{

        /*
           Only HEAD applications that are
           waiting for HR approval.
        */

        const q=query(

            collection(
                db,
                "leave_requests"
            ),

            where(
                "applicantRole",
                "==",
                "HEAD"
            ),

            where(
                "status",
                "==",
                "PENDING_HR"
            )

        );


        const snap =
            await getDocs(q);


        table.innerHTML="";


        if(snap.empty){

            table.innerHTML =
                `<tr>
                    <td
                        colspan="9"
                        class="empty">
                        No Head Staff leave applications waiting for HR approval.
                    </td>
                </tr>`;

            return;

        }


        snap.forEach(item=>{

            const data =
                item.data();


            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${data.applicantName || ""}
                </td>

                <td>
                    ${data.staffId || ""}
                </td>

                <td>
                    ${data.department || ""}
                </td>

                <td>
                    ${data.leaveType || ""}
                </td>

                <td>
                    ${data.fromDate || ""}
                </td>

                <td>
                    ${data.toDate || ""}
                </td>

                <td>
                    ${data.days || ""}
                </td>

                <td>
                    ${data.reason || ""}
                </td>

                <td>

                    <button
                        class="approve"
                        data-id="${item.id}"
                        data-action="APPROVE">
                        Approve
                    </button>

                    <button
                        class="reject"
                        data-id="${item.id}"
                        data-action="REJECT">
                        Reject
                    </button>

                </td>

            `;


            table.appendChild(row);

        });


    }catch(error){

        console.error(error);

        table.innerHTML =
            `<tr>
                <td
                    colspan="9"
                    class="empty">
                    Error loading applications:
                    ${error.message}
                </td>
            </tr>`;

    }

}


/* =====================================
   ACTION
===================================== */

document
.getElementById("table")
.addEventListener(
    "click",
    async function(e){

        const button =
            e.target.closest("button");


        if(!button){
            return;
        }


        const id =
            button.dataset.id;


        const action =
            button.dataset.action;


        const question =
            action==="APPROVE"
            ?
            "Approve this Head Staff leave?"
            :
            "Reject this Head Staff leave?";


        if(!confirm(question)){
            return;
        }


        try{

            const ref =
                doc(
                    db,
                    "leave_requests",
                    id
                );


            if(action==="APPROVE"){

                await updateDoc(
                    ref,
                    {

                        status:
                            "APPROVED_BY_HR",

                        hrAction:
                            "APPROVED",

                        hrActionBy:
                            hrId,

                        hrActionAt:
                            serverTimestamp()

                    }
                );


                showMessage(
                    "Head Staff leave approved successfully.",
                    "success"
                );

            }


            if(action==="REJECT"){

                await updateDoc(
                    ref,
                    {

                        status:
                            "REJECTED_BY_HR",

                        hrAction:
                            "REJECTED",

                        hrActionBy:
                            hrId,

                        hrActionAt:
                            serverTimestamp()

                    }
                );


                showMessage(
                    "Head Staff leave rejected.",
                    "success"
                );

            }


            await loadRequests();


        }catch(error){

            console.error(error);

            showMessage(
                "Unable to process leave: "+
                error.message,
                "error"
            );

        }

    }
);


loadRequests();

</script>

</body>

</html>
