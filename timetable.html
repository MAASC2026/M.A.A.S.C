<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Exam Assignment Portal</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f4f6f9;
padding:20px;
}

.container{
max-width:1400px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

h2{
text-align:center;
margin-bottom:20px;
color:#1565c0;
}

.form-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
margin-bottom:20px;
}

.form-grid input,
.form-grid select,
.form-grid textarea{

width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:5px;
font-size:15px;

}

.form-grid textarea{

grid-column:1/3;
resize:vertical;

}

.button-area{

grid-column:1/3;
display:flex;
gap:10px;

}

button{

padding:10px 20px;
border:none;
border-radius:5px;
cursor:pointer;
font-size:15px;

}

#saveBtn{
background:#1565c0;
color:white;
}

#clearBtn{
background:#757575;
color:white;
}

#updateBtn{
background:#2e7d32;
color:white;
display:none;
}

.table-wrapper{

overflow:auto;
margin-top:20px;

}

table{

width:100%;
border-collapse:collapse;
min-width:1300px;

}

table th{

background:#1565c0;
color:white;
padding:10px;

}

table td{

padding:10px;
border:1px solid #ddd;
text-align:center;

}

.action-btn{

padding:6px 10px;
margin:2px;
border:none;
border-radius:4px;
cursor:pointer;
color:white;

}

.edit{

background:#2e7d32;

}

.delete{

background:#d32f2f;

}

</style>

</head>

<body>

<div class="container">

<h2>Exam Assignment Portal</h2>

<div class="form-grid">

<select id="department">


<option value="">Select Department</option>

<option value="B.Com General">B.Com General</option>
<option value="B.Com BM">B.Com BM</option>
<option value="B.Com MM">B.Com MM</option>
<option value="B.Com CS">B.Com CS</option>
<option value="B.Com A&F">B.Com A&F</option>
<option value="B.Com ISM">B.Com ISM</option>
<option value="B.Com CA">B.Com CA</option>
<option value="B.Com BUS.AD">B.Com BUS.AD</option>

<option value="B.A DEFENCE">B.A DEFENCE</option>
<option value="B.A PUB.AD">B.A PUB.AD</option>
<option value="B.A TAMIL">B.A TAMIL</option>
<option value="B.A TOURISM">B.A TOURISM</option>

<option value="B.Sc CS">B.Sc CS</option>
<option value="B.Sc CS WITH AI">B.Sc CS WITH AI</option>
<option value="B.Sc CRIMINOLOGY">B.Sc CRIMINOLOGY</option>
<option value="B.Sc SA">B.Sc SA</option>
<option value="B.Sc PHYS WITH CA">B.Sc PHYS WITH CA</option>
<option value="B.Sc MATHS WITH CA">B.Sc MATHS WITH CA</option>
<option value="B.Sc ELECTRONICS WITH AI">B.Sc ELECTRONICS WITH AI</option>
<option value="B.Sc VISCOM">B.Sc VISCOM</option>
<option value="B.Sc ELECTRONIC MEDIA">B.Sc ELECTRONIC MEDIA</option>
<option value="B.Sc IDD">B.Sc IDD</option>
<option value="B.Sc PHYSICS">B.Sc PHYSICS</option>

<option value="BCA COMPUTER APPLICATION">BCA COMPUTER APPLICATION</option>


</select>

<select id="year">

<option value="">Year</option>

<option>I Year</option>
<option>II Year</option>
<option>III Year</option>

</select>

<select id="section">

<option value="">Section</option>

<option>A</option>
<option>B</option>
<option>C</option>
<option>D</option>

</select>

<select id="semester">

<option value="">Semester</option>

<option>I</option>
<option>II</option>
<option>III</option>
<option>IV</option>
<option>V</option>
<option>VI</option>

</select>

<input
type="text"
id="subject"
placeholder="Subject Name">

<select id="examType">

<option value="">Exam Type</option>

<option>CIA I</option>
<option>CIA II</option>
<option>MODEL</option>
<option>UNIVERSITY</option>

</select>

<input
type="date"
id="examDate">

<input
type="time"
id="examTime">

<input
type="number"
id="maxMarks"
placeholder="Maximum Marks">

<textarea
id="portion"
rows="6"
placeholder="Enter Exam Portion"></textarea>

<div class="button-area">

<button id="saveBtn">

Assign Exam

</button>

<button id="updateBtn">

Update Exam

</button>

<button id="clearBtn">

Clear

</button>

</div>

</div>

<hr>

<div class="table-wrapper">

<table>

<thead>

<tr>

<th>Department</th>
<th>Year</th>
<th>Section</th>
<th>Semester</th>
<th>Subject</th>
<th>Exam</th>
<th>Date</th>
<th>Time</th>
<th>Marks</th>
<th>Portion</th>
<th>Action</th>

</tr>

</thead>

<tbody id="examTable">

</tbody>

</table>

</div>

</div>

<script type="module">
    import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { 
getFirestore,
collection,
addDoc,
getDocs,
doc,
deleteDoc,
updateDoc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// FIREBASE CONFIG

const firebaseConfig = {

apiKey: "AIzaSyAIv3091VM-gkmdwEAn7OhXWd9Cm2zh2bo",
authDomain: "maasc-2026.firebaseapp.com",
projectId: "maasc-2026",
storageBucket: "maasc-2026.appspot.com",
messagingSenderId: "585813001586",
appId: "1:585813001586:web:664e0e90ff0725d2e849eb"

};


// INITIALIZE FIREBASE

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


// VARIABLES

let editID = null;



// PAGE LOAD

window.onload = function(){

loadExams();

};



// SAVE EXAM

document
.getElementById("saveBtn")
.addEventListener("click",saveExam);



async function saveExam(){


let exam={


department:
document.getElementById("department").value,


year:
document.getElementById("year").value,


section:
document.getElementById("section").value,


semester:
document.getElementById("semester").value,


subject:
document.getElementById("subject").value,


examType:
document.getElementById("examType").value,


examDate:
document.getElementById("examDate").value,


examTime:
document.getElementById("examTime").value,


maxMarks:
document.getElementById("maxMarks").value,


portion:
document.getElementById("portion").value,


createdAt:
new Date()


};



if(
exam.department==""||
exam.year==""||
exam.section==""||
exam.subject==""
){

alert("Please fill required fields");

return;

}



try{


await addDoc(

collection(db,"examAssignments"),

exam

);



alert("Exam Assigned Successfully");


clearForm();


loadExams();



}

catch(error){

console.log(error);

alert(error.message);

}



}




// LOAD EXAMS


async function loadExams(){


let table =
document.getElementById("examTable");


table.innerHTML="";


const querySnapshot =
await getDocs(
collection(db,"examAssignments")
);



querySnapshot.forEach((item)=>{


let e=item.data();



table.innerHTML += `

<tr>


<td>${e.department}</td>

<td>${e.year}</td>

<td>${e.section}</td>

<td>${e.semester}</td>

<td>${e.subject}</td>

<td>${e.examType}</td>

<td>${e.examDate}</td>

<td>${e.examTime}</td>

<td>${e.maxMarks}</td>

<td>${e.portion}</td>


<td>


<button 
class="action-btn edit"
onclick="editExam('${item.id}')">

Edit

</button>



<button 
class="action-btn delete"
onclick="deleteExam('${item.id}')">

Delete

</button>


</td>


</tr>

`;

});


}



// DELETE EXAM


window.deleteExam = async function(id){


if(
confirm("Delete this exam?")
){


await deleteDoc(

doc(db,"examAssignments",id)

);



alert("Deleted");


loadExams();


}



};




// EDIT EXAM


window.editExam = async function(id){


const ref =
doc(db,"examAssignments",id);



const snap =
await getDoc(ref);



let e=snap.data();



document.getElementById("department").value=e.department;

document.getElementById("year").value=e.year;

document.getElementById("section").value=e.section;

document.getElementById("semester").value=e.semester;

document.getElementById("subject").value=e.subject;

document.getElementById("examType").value=e.examType;

document.getElementById("examDate").value=e.examDate;

document.getElementById("examTime").value=e.examTime;

document.getElementById("maxMarks").value=e.maxMarks;

document.getElementById("portion").value=e.portion;



editID=id;



document.getElementById("saveBtn")
.style.display="none";


document.getElementById("updateBtn")
.style.display="block";



};




// UPDATE EXAM


document
.getElementById("updateBtn")
.addEventListener(
"click",
updateExam
);



async function updateExam(){


if(editID==null){

return;

}



let updated={


department:
department.value,


year:
year.value,


section:
section.value,


semester:
semester.value,


subject:
subject.value,


examType:
examType.value,


examDate:
examDate.value,


examTime:
examTime.value,


maxMarks:
maxMarks.value,


portion:
portion.value


};



await updateDoc(

doc(
db,
"examAssignments",
editID
),

updated

);



alert("Updated Successfully");



editID=null;


document.getElementById("saveBtn")
.style.display="block";


document.getElementById("updateBtn")
.style.display="none";



clearForm();

loadExams();



}





// CLEAR FORM


document
.getElementById("clearBtn")
.addEventListener(
"click",
clearForm
);



function clearForm(){


document
.querySelectorAll(
"input,textarea"
)
.forEach(
el=>el.value=""
);



document
.querySelectorAll(
"select"
)
.forEach(
el=>el.selectedIndex=0
);



}

</script>

</body>
</html>
