<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Schedule Entry</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

select,input{
    width:100%;
    padding:8px;
    margin:5px 0;
    box-sizing:border-box;
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th,td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}

th{
    background:#f2f2f2;
}

button{
    padding:10px 15px;
    margin-top:15px;
    cursor:pointer;
    border:none;
    color:white;
    border-radius:5px;
}

.add{
    background:#007bff;
}

.save{
    background:green;
}

</style>
</head>

<body>

<div class="container">

<h2>Exam Schedule Entry Portal</h2>

<select id="dept" onchange="loadExam()">

<option value="BCOM-GENERAL">B.Com General</option>
<option value="BCOM-BM">B.Com BM</option>
<option value="BCOM-MM">B.Com MM</option>
<option value="BCOM-CS">B.Com CS</option>
<option value="BCOM-AF">B.Com A&F</option>
<option value="BCOM-ISM">B.Com ISM</option>
<option value="BCOM-CA">B.Com CA</option>
<option value="BCOM-BUSAD">B.Com BUS.AD</option>

<option value="BA-DEFENCE">B.A DEFENCE</option>
<option value="BA-PUBAD">B.A PUB.AD</option>
<option value="BA-TAMIL">B.A TAMIL</option>
<option value="BA-TOURISM">B.A TOURISM</option>

<option value="BSC-CS">B.Sc CS</option>
<option value="BSC-CS-AI">B.Sc CS WITH AI</option>
<option value="BSC-CRIMINOLOGY">B.Sc CRIMINOLOGY</option>
<option value="BSC-SA">B.Sc SA</option>
<option value="BSC-PHYS-CA">B.Sc PHYSICS WITH CA</option>
<option value="BSC-MATHS-CA">B.Sc MATHS WITH CA</option>
<option value="BSC-ELEC-AI">B.Sc ELECTRONICS WITH AI</option>
<option value="BSC-VISCOM">B.Sc VISCOM</option>
<option value="BSC-ELECTRONIC-MEDIA">B.Sc ELECTRONIC MEDIA</option>
<option value="BSC-IDD">B.Sc IDD</option>
<option value="BSC-PHYSICS">B.Sc PHYSICS</option>

<option value="BCA">BCA COMPUTER APPLICATION</option>

</select>


<select id="examType" onchange="loadExam()">

<option value="CYCLIC-TEST-01">CYCLIC TEST 01</option>
<option value="CYCLIC-TEST-02">CYCLIC TEST 02</option>
<option value="INTERNAL-TEST-01">INTERNAL TEST 01</option>
<option value="INTERNAL-TEST-02">INTERNAL TEST 02</option>
<option value="MODEL-EXAM">MODEL EXAM</option>
<option value="SEMESTER-EXAM">SEMESTER EXAM</option>

</select>

<div class="table-wrapper">

<table>

<thead>

<tr>

<th>Subject Code</th>
<th>Subject Name</th>
<th>Date</th>
<th>Timing</th>
<th>Platform</th>

</tr>

</thead>

<tbody id="tbody"></tbody>

</table>

</div>

<button class="add" onclick="addRow()">Add Subject</button>
<button class="save" onclick="saveExam()">Save Schedule</button>

</div>

<script type="module">

import { db } from "./firebase-config.js";

import {
doc,
setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let row=0;

/* Placeholder for future loading */
window.loadExam=function(){

console.log("Selection changed.");

};

/* Add Row */

window.addRow=function(){

row++;

document.getElementById("tbody").insertAdjacentHTML("beforeend",`

<tr>

<td>
<input id="code${row}" placeholder="Subject Code">
</td>

<td>
<input id="name${row}" placeholder="Subject Name">
</td>

<td>
<input type="date" id="date${row}">
</td>

<td>
<input id="time${row}" placeholder="10:00 AM - 1:00 PM">
</td>

<td>
<input id="platform${row}" placeholder="Offline / Online">
</td>

</tr>

`);

};


/* Save */

window.saveExam=async function(){

const dept=document.getElementById("dept").value;

const examType=document.getElementById("examType").value;

let data={};

let count=1;

for(let i=1;i<=row;i++){

const code=document.getElementById("code"+i).value.trim();

const name=document.getElementById("name"+i).value.trim();

const date=document.getElementById("date"+i).value;

const time=document.getElementById("time"+i).value.trim();

const platform=document.getElementById("platform"+i).value.trim();

if(code=="" && name=="") continue;

data["Exam_"+count]={

SubjectCode:code,

SubjectName:name,

Date:date,

Timing:time,

Platform:platform

};

count++;

}

if(Object.keys(data).length===0){

alert("Please enter at least one subject.");

return;

}

try{

await setDoc(

doc(db,"exams",dept,examType,"schedule"),

data

);

alert("Exam Schedule Saved Successfully.");

}catch(err){

console.error(err);

alert(err.message);

}

};

/* First Row */

addRow();

</script>

</body>
</html>
