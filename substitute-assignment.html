<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Substitute Assignment</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f6f9;
    color:#1f2937;
}

.header{
    background:#500454;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
}

.header h2{
    font-size:22px;
}

.header-user{
    font-size:15px;
}

.container{
    width:96%;
    max-width:1450px;
    margin:25px auto;
}

/* STAFF */

.staff-card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
    margin-bottom:20px;
}

.staff-title{
    color:#500454;
    font-size:19px;
    font-weight:bold;
    margin-bottom:15px;
}

.staff-grid{
    display:grid;
    grid-template-columns:
        repeat(3,1fr);
    gap:15px;
}

.staff-box{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:8px;
    padding:13px;
}

.staff-box label{
    display:block;
    font-size:12px;
    color:#64748b;
    margin-bottom:5px;
}

.staff-box strong{
    font-size:15px;
}

/* CONTROLS */

.control-card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
    margin-bottom:20px;
}

.control-grid{
    display:grid;
    grid-template-columns:
        repeat(3,1fr);
    gap:18px;
}

.control-group label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
    color:#334155;
}

.control-group input,
.control-group select{
    width:100%;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    font-size:15px;
    outline:none;
    background:white;
}

.control-group input:focus,
.control-group select:focus{
    border-color:#500454;
}

/* TIMETABLE */

.timetable-card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
    overflow-x:auto;
}

.session-title{
    text-align:center;
    color:#500454;
    font-size:21px;
    font-weight:bold;
    margin-bottom:18px;
}

.timetable{
    width:100%;
    min-width:1000px;
    border-collapse:collapse;
    table-layout:fixed;
}

.timetable th,
.timetable td{
    border:1px solid #cbd5e1;
    text-align:center;
    vertical-align:middle;
    padding:10px;
}

.timetable th{
    background:#500454;
    color:white;
    height:50px;
    font-size:14px;
}

.timetable .label{
    width:140px;
    background:#e2e8f0;
    color:#1e293b;
    font-weight:bold;
}

.time-cell{
    background:#f8fafc;
    font-weight:bold;
    font-size:12px;
    color:#475569;
    height:45px;
}

.period-cell{
    height:125px;
    cursor:pointer;
    transition:.2s;
    background:white;
}

.period-cell:hover{
    background:#faf0fb;
    box-shadow:
        inset 0 0 0 2px #500454;
}

.period-cell.empty{
    cursor:default;
    color:#94a3b8;
}

.period-cell.empty:hover{
    background:white;
    box-shadow:none;
}

.period-subject{
    font-weight:bold;
    color:#500454;
    margin-bottom:5px;
}

.period-class{
    font-size:13px;
    color:#334155;
    margin-bottom:4px;
}

.period-room{
    font-size:12px;
    color:#64748b;
}

.free-cell{
    color:#94a3b8;
    font-size:13px;
}

/* STATUS */

.status{
    display:none;
    padding:13px 16px;
    border-radius:8px;
    margin-bottom:18px;
    font-weight:bold;
}

.status.show{
    display:block;
}

.status.success{
    background:#dcfce7;
    color:#166534;
}

.status.error{
    background:#fee2e2;
    color:#991b1b;
}

.status.info{
    background:#dbeafe;
    color:#1e40af;
}

/* LOADING */

.loading{
    padding:30px;
    text-align:center;
    color:#64748b;
}

/* MODAL */

.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:5000;
    padding:20px;
}

.modal-bg.show{
    display:flex;
}

.modal{
    background:white;
    width:100%;
    max-width:620px;
    max-height:90vh;
    overflow-y:auto;
    border-radius:12px;
    padding:22px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.modal-header h2{
    color:#500454;
}

.close-btn{
    width:34px;
    height:34px;
    border:none;
    border-radius:6px;
    background:#dc2626;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.selected-period{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    padding:14px;
    border-radius:8px;
    margin-bottom:18px;
    line-height:1.7;
}

.staff-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.staff-option{
    display:flex;
    align-items:center;
    gap:12px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    padding:13px;
    cursor:pointer;
}

.staff-option:hover{
    background:#faf0fb;
    border-color:#500454;
}

.staff-option.selected{
    background:#f7eafa;
    border-color:#500454;
}

.staff-option input{
    width:18px;
    height:18px;
}

.staff-option-name{
    font-weight:bold;
}

.staff-option-info{
    font-size:12px;
    color:#64748b;
    margin-top:3px;
}

.request-btn{
    width:100%;
    margin-top:20px;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#16a34a;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.request-btn:disabled{
    background:#94a3b8;
    cursor:not-allowed;
}

.no-staff{
    background:#f8fafc;
    padding:20px;
    border-radius:8px;
    text-align:center;
    color:#64748b;
}

@media(max-width:850px){

    .staff-grid,
    .control-grid{
        grid-template-columns:1fr;
    }

    .header{
        flex-direction:column;
        gap:8px;
        align-items:flex-start;
    }

}

</style>

</head>

<body>


<!-- HEADER -->

<div class="header">

    <h2>
        SUBSTITUTE ASSIGNMENT
    </h2>

    <div class="header-user">
        Welcome,
        <span id="headerStaffName">Loading...</span>
    </div>

</div>


<div class="container">


<!-- STATUS -->

<div
id="statusBox"
class="status">
</div>


<!-- CURRENT STAFF -->

<div class="staff-card">

    <div class="staff-title">
        Current Staff
    </div>

    <div class="staff-grid">

        <div class="staff-box">

            <label>
                Staff ID
            </label>

            <strong id="staffId">
                Loading...
            </strong>

        </div>


        <div class="staff-box">

            <label>
                Staff Name
            </label>

            <strong id="staffName">
                Loading...
            </strong>

        </div>


        <div class="staff-box">

            <label>
                Department
            </label>

            <strong id="department">
                Loading...
            </strong>

        </div>

    </div>

</div>


<!-- CONTROLS -->

<div class="control-card">

    <div class="control-grid">


        <!-- DATE -->

        <div class="control-group">

            <label>
                Date
            </label>

            <input
                type="date"
                id="dateSelect">

        </div>


        <!-- DAY ORDER -->

        <div class="control-group">

            <label>
                Day Order
            </label>

            <select id="dayOrderSelect">

                <option value="">
                    Select Day Order
                </option>

                <option value="DAY 01">
                    DAY 01
                </option>

                <option value="DAY 02">
                    DAY 02
                </option>

                <option value="DAY 03">
                    DAY 03
                </option>

                <option value="DAY 04">
                    DAY 04
                </option>

                <option value="DAY 05">
                    DAY 05
                </option>

                <option value="DAY 06">
                    DAY 06
                </option>

            </select>

        </div>


        <!-- SESSION -->

        <div class="control-group">

            <label>
                Session
            </label>

            <select id="sessionSelect">

                <option value="">
                    Select Session
                </option>

                <option value="FN">
                    FN
                </option>

                <option value="AN">
                    AN
                </option>

            </select>

        </div>

    </div>

</div>


<!-- TIMETABLE -->

<div class="timetable-card">

    <div
        id="sessionTitle"
        class="session-title">

        SELECT DATE, DAY ORDER AND SESSION

    </div>


    <div id="timetableContainer">

        <div class="loading">

            Select Date, Day Order and Session

        </div>

    </div>

</div>


</div>


<!-- FREE STAFF MODAL -->

<div
id="modalBackground"
class="modal-bg">

<div class="modal">


    <div class="modal-header">

        <h2>
            Available Staff
        </h2>

        <button
            class="close-btn"
            id="closeModal">

            ×

        </button>

    </div>


    <div
        id="selectedPeriod"
        class="selected-period">
    </div>


    <div
        id="freeStaffList"
        class="staff-list">

    </div>


    <button
        id="requestBtn"
        class="request-btn"
        disabled>

        REQUEST SUBSTITUTE

    </button>


</div>

</div>


<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
    db
} from "./firebase-config.js";


import {
    collection,
    getDocs,
    query,
    where,
    addDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   SESSION STORAGE LOGIN
===================================================== */

const staffId =
    sessionStorage.getItem("staffId");

const staffName =
    sessionStorage.getItem("staffName");

const department =
    sessionStorage.getItem("department");


/* =====================================================
   CHECK LOGIN
===================================================== */

if(!staffId){

    alert("Please Login");

    window.location.href =
        "login.html";

}


/* =====================================================
   DISPLAY STAFF
===================================================== */

document.getElementById(
    "staffId"
).textContent =
    staffId || "-";


document.getElementById(
    "staffName"
).textContent =
    staffName || "-";


document.getElementById(
    "department"
).textContent =
    department || "-";


document.getElementById(
    "headerStaffName"
).textContent =
    staffName || "-";


/* =====================================================
   SESSION TIMES
===================================================== */

const sessionTimes = {

    FN:[
        "8:30 - 9:20",
        "9:20 - 10:10",
        "10:10 - 11:00",
        "11:30 - 12:20",
        "12:20 - 1:10"
    ],

    AN:[
        "1:30 - 2:20",
        "2:20 - 3:10",
        "3:30 - 4:20",
        "4:20 - 5:10",
        "5:10 - 6:00"
    ]

};


/* =====================================================
   VARIABLES
===================================================== */

let timetableData = [];

let selectedPeriod = null;

let selectedSubstitute = null;


/* =====================================================
   CONTROLS
===================================================== */

document
.getElementById("dateSelect")
.addEventListener(
    "change",
    loadTimetable
);


document
.getElementById("dayOrderSelect")
.addEventListener(
    "change",
    loadTimetable
);


document
.getElementById("sessionSelect")
.addEventListener(
    "change",
    loadTimetable
);


/* =====================================================
   LOAD TIMETABLE
===================================================== */

async function loadTimetable(){

    const date =
        document.getElementById(
            "dateSelect"
        ).value;


    const dayOrder =
        document.getElementById(
            "dayOrderSelect"
        ).value;


    const session =
        document.getElementById(
            "sessionSelect"
        ).value;


    /*
       IMPORTANT

       DATE DOES NOT CHANGE DAY ORDER.

       DAY ORDER DOES NOT CHANGE DATE.
    */


    if(
        !date ||
        !dayOrder ||
        !session
    ){

        document.getElementById(
            "sessionTitle"
        ).textContent =
            "SELECT DATE, DAY ORDER AND SESSION";


        document.getElementById(
            "timetableContainer"
        ).innerHTML =

            `<div class="loading">
                Select Date, Day Order and Session
             </div>`;

        return;

    }


    document.getElementById(
        "sessionTitle"
    ).textContent =

        session === "FN"
        ? "FORENOON SESSION"
        : "AFTERNOON SESSION";


    document.getElementById(
        "timetableContainer"
    ).innerHTML =

        `<div class="loading">
            Loading timetable...
         </div>`;


    try{

        timetableData =
            await getStaffTimetable(
                date,
                dayOrder,
                session
            );


        renderTimetable(
            dayOrder,
            session,
            timetableData
        );


    }catch(error){

        console.error(error);

        showStatus(
            "Unable to load timetable: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   GET STAFF TIMETABLE
===================================================== */

async function getStaffTimetable(
    date,
    dayOrder,
    session
){

    const result = [];

    try{

        /*
         First try timetable collection
        using staffId.
        */

        const timetableRef =
            collection(
                db,
                "timetable"
            );


        const q =
            query(
                timetableRef,
                where(
                    "staffId",
                    "==",
                    staffId
                )
            );


        const snap =
            await getDocs(q);


        snap.forEach(
            docSnap => {

                const data =
                    docSnap.data();


                if(
                    matchesDay(
                        data,
                        dayOrder
                    ) &&
                    matchesSession(
                        data,
                        session
                    )
                ){

                    result.push({
                        id:docSnap.id,
                        ...data
                    });

                }

            }
        );


    }catch(error){

        console.log(
            "staffId timetable query failed",
            error
        );


        /*
         Fallback:
         load timetable collection and
         filter locally.
        */

        try{

            const snap =
                await getDocs(
                    collection(
                        db,
                        "timetable"
                    )
                );


            snap.forEach(
                docSnap => {

                    const data =
                        docSnap.data();


                    if(
                        matchesStaff(
                            data
                        ) &&
                        matchesDay(
                            data,
                            dayOrder
                        ) &&
                        matchesSession(
                            data,
                            session
                        )
                    ){

                        result.push({
                            id:docSnap.id,
                            ...data
                        });

                    }

                }
            );

        }catch(secondError){

            console.error(
                secondError
            );

        }

    }


    return normalizeTimetable(
        result,
        session
    );

}


/* =====================================================
   STAFF MATCH
===================================================== */

function matchesStaff(data){

    const values = [

        data.staffId,
        data.staffID,
        data.staff_id,
        data.teacherId,
        data.teacherID

    ];

    return values.some(
        value =>
            String(value || "")
            .trim()
            .toUpperCase()
            ===
            String(staffId)
            .trim()
            .toUpperCase()
    );

}


/* =====================================================
   DAY MATCH
===================================================== */

function matchesDay(
    data,
    dayOrder
){

    const values = [

        data.dayOrder,
        data.dayorder,
        data.day,
        data.day_order

    ];


    return values.some(
        value =>

            normalizeDay(value)
            ===
            normalizeDay(dayOrder)

    );

}


/* =====================================================
   SESSION MATCH
===================================================== */

function matchesSession(
    data,
    session
){

    const values = [

        data.session,
        data.Session,
        data.periodSession

    ];


    return values.some(
        value =>

            String(value || "")
            .trim()
            .toUpperCase()
            ===
            session

    );

}


/* =====================================================
   DAY NORMALIZATION
===================================================== */

function normalizeDay(value){

    let v =
        String(value || "")
        .trim()
        .toUpperCase();


    v =
        v.replace(
            "DAY",
            ""
        )
        .trim();


    v =
        v.replace(
            /^0+/,
            ""
        );


    return v;

}


/* =====================================================
   NORMALIZE TIMETABLE
===================================================== */

function normalizeTimetable(
    records,
    session
){

    const periods = {

        1:null,
        2:null,
        3:null,
        4:null,
        5:null

    };


    records.forEach(
        data => {

            let hour =
                data.hour ??
                data.hourNo ??
                data.period ??
                data.periodNo;


            /*
             Convert "Hour 1" / "HOUR 1"
             into number.
            */

            if(
                typeof hour === "string"
            ){

                const match =
                    hour.match(/\d+/);

                if(match){

                    hour =
                        Number(
                            match[0]
                        );

                }

            }


            hour =
                Number(hour);


            if(
                hour >= 1 &&
                hour <= 5
            ){

                periods[hour] = {

                    subject:
                        data.subject ||
                        data.subjectName ||
                        "",

                    department:
                        data.department ||
                        data.dep ||
                        "",

                    year:
                        data.year ||
                        data.classYear ||
                        "",

                    section:
                        data.section ||
                        data.sec ||
                        "",

                    room:
                        data.room ||
                        data.roomNo ||
                        data.roomNumber ||
                        ""

                };

            }

        }
    );


    return periods;

}


/* =====================================================
   RENDER TABLE
===================================================== */

function renderTimetable(
    dayOrder,
    session,
    data
){

    const times =
        sessionTimes[session];


    let html = `

    <table class="timetable">

        <thead>

            <tr>

                <th>
                    DAY ORDER
                </th>

                <th>
                    HOUR 1
                </th>

                <th>
                    HOUR 2
                </th>

                <th>
                    HOUR 3
                </th>

                <th>
                    HOUR 4
                </th>

                <th>
                    HOUR 5
                </th>

            </tr>

        </thead>


        <tbody>


            <!-- TIME -->

            <tr>

                <td class="label">
                    TIME
                </td>

                <td class="time-cell">
                    ${times[0]}
                </td>

                <td class="time-cell">
                    ${times[1]}
                </td>

                <td class="time-cell">
                    ${times[2]}
                </td>

                <td class="time-cell">
                    ${times[3]}
                </td>

                <td class="time-cell">
                    ${times[4]}
                </td>

            </tr>


            <!-- DAY ORDER -->

            <tr>

                <td class="label">
                    ${escapeHTML(dayOrder)}
                </td>

                ${periodCell(data[1],1)}

                ${periodCell(data[2],2)}

                ${periodCell(data[3],3)}

                ${periodCell(data[4],4)}

                ${periodCell(data[5],5)}

            </tr>


        </tbody>

    </table>

    `;


    document.getElementById(
        "timetableContainer"
    ).innerHTML =
        html;

}


/* =====================================================
   PERIOD CELL
===================================================== */

function periodCell(
    data,
    hour
){

    if(!data){

        return `

        <td class="period-cell empty">

            <div class="free-cell">
                FREE
            </div>

        </td>

        `;

    }


    return `

    <td
        class="period-cell"
        data-hour="${hour}"
        onclick="openSubstitute(
            ${hour}
        )"
    >

        <div class="period-subject">

            ${escapeHTML(
                data.subject ||
                "Subject"
            )}

        </div>


        <div class="period-class">

            ${escapeHTML(
                data.department ||
                department ||
                ""
            )}

            ${
                data.year
                ?
                " - " +
                escapeHTML(
                    data.year
                )
                :
                ""
            }

            ${
                data.section
                ?
                " - " +
                escapeHTML(
                    data.section
                )
                :
                ""
            }

        </div>


        ${
            data.room
            ?
            `
            <div class="period-room">

                Room:
                ${escapeHTML(data.room)}

            </div>
            `
            :
            ""
        }

    </td>

    `;

}


/* =====================================================
   OPEN SUBSTITUTE
===================================================== */

window.openSubstitute =
async function(hour){

    const date =
        document.getElementById(
            "dateSelect"
        ).value;


    const dayOrder =
        document.getElementById(
            "dayOrderSelect"
        ).value;


    const session =
        document.getElementById(
            "sessionSelect"
        ).value;


    const period =
        timetableData[hour];


    if(!period){

        return;

    }


    selectedPeriod = {

        date,
        dayOrder,
        session,
        hour,

        ...period

    };


    selectedSubstitute = null;


    document.getElementById(
        "selectedPeriod"
    ).innerHTML = `

        <b>Selected Class</b><br>

        Date:
        ${escapeHTML(date)}
        <br>

        Day Order:
        ${escapeHTML(dayOrder)}
        <br>

        Session:
        ${escapeHTML(session)}
        <br>

        Hour:
        ${hour}
        <br>

        Subject:
        ${escapeHTML(
            period.subject ||
            "-"
        )}

    `;


    document.getElementById(
        "modalBackground"
    ).classList.add(
        "show"
    );


    document.getElementById(
        "freeStaffList"
    ).innerHTML =

        `<div class="loading">
            Checking free staff...
        </div>`;


    document.getElementById(
        "requestBtn"
    ).disabled = true;


    await loadFreeStaff(
        date,
        dayOrder,
        session,
        hour
    );

};


/* =====================================================
   LOAD FREE STAFF
===================================================== */

async function loadFreeStaff(
    date,
    dayOrder,
    session,
    hour
){

    try{

        const allStaff =
            await getAllStaff();


        const busyStaffIds =
            await getBusyStaffIds(
                date,
                dayOrder,
                session,
                hour
            );


        const freeStaff =
            allStaff.filter(
                staff => {

                    const id =
                        getStaffId(
                            staff
                        );


                    if(
                        normalizeStaffId(id)
                        ===
                        normalizeStaffId(
                            staffId
                        )
                    ){

                        return false;

                    }


                    if(
                        staff.active === false
                    ){

                        return false;

                    }


                    return !busyStaffIds.has(
                        normalizeStaffId(id)
                    );

                }
            );


        displayFreeStaff(
            freeStaff
        );


    }catch(error){

        console.error(
            error
        );


        document.getElementById(
            "freeStaffList"
        ).innerHTML =

            `<div class="no-staff">

                Unable to load available staff.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

             </div>`;

    }

}


/* =====================================================
   GET ALL STAFF
===================================================== */

async function getAllStaff(){

    const result = [];


    const snap =
        await getDocs(
            collection(
                db,
                "staff"
            )
        );


    snap.forEach(
        docSnap => {

            result.push({

                id:
                    docSnap.id,

                ...docSnap.data()

            });

        }
    );


    return result;

}


/* =====================================================
   GET BUSY STAFF
===================================================== */

async function getBusyStaffIds(
    date,
    dayOrder,
    session,
    hour
){

    const busy =
        new Set();


    /*
       Load timetable records.

       Client-side filtering is used so that
       Firestore composite indexes are not required.
    */

    const snap =
        await getDocs(
            collection(
                db,
                "timetable"
            )
        );


    snap.forEach(
        docSnap => {

            const data =
                docSnap.data();


            if(
                !matchesDay(
                    data,
                    dayOrder
                )
            ){

                return;

            }


            if(
                !matchesSession(
                    data,
                    session
                )
            ){

                return;

            }


            let recordHour =
                data.hour ??
                data.hourNo ??
                data.period ??
                data.periodNo;


            if(
                typeof recordHour === "string"
            ){

                const match =
                    recordHour.match(
                        /\d+/
                    );

                if(match){

                    recordHour =
                        Number(
                            match[0]
                        );

                }

            }


            if(
                Number(recordHour)
                !==
                Number(hour)
            ){

                return;

            }


            const id =
                data.staffId ||
                data.staffID ||
                data.staff_id ||
                data.teacherId ||
                data.teacherID;


            if(id){

                busy.add(
                    normalizeStaffId(
                        id
                    )
                );

            }

        }
    );


    return busy;

}


/* =====================================================
   STAFF ID
===================================================== */

function getStaffId(staff){

    return (

        staff.staffId ||
        staff.staffID ||
        staff.staff_id ||
        staff.id ||
        ""

    );

}


/* =====================================================
   NORMALIZE STAFF ID
===================================================== */

function normalizeStaffId(value){

    return String(
        value || ""
    )
    .trim()
    .toUpperCase();

}


/* =====================================================
   DISPLAY FREE STAFF
===================================================== */

function displayFreeStaff(
    staffList
){

    const container =
        document.getElementById(
            "freeStaffList"
        );


    if(
        !staffList.length
    ){

        container.innerHTML =

            `<div class="no-staff">

                No free staff available
                for this hour.

             </div>`;

        return;

    }


    container.innerHTML =
        staffList.map(
            staff => {

                const id =
                    getStaffId(
                        staff
                    );


                const name =
                    staff.name ||
                    staff.staffName ||
                    staff.displayName ||
                    "Unknown Staff";


                const dep =
                    staff.department ||
                    staff.dept ||
                    "";


                return `

                <label
                    class="staff-option"
                    data-id="${escapeHTML(id)}"
                >

                    <input
                        type="radio"
                        name="substituteStaff"
                        value="${escapeHTML(id)}"
                    >

                    <div>

                        <div
                            class="staff-option-name">

                            ${escapeHTML(name)}

                        </div>

                        <div
                            class="staff-option-info">

                            ${escapeHTML(id)}

                            ${
                                dep
                                ?
                                " | " +
                                escapeHTML(dep)
                                :
                                ""
                            }

                        </div>

                    </div>

                </label>

                `;

            }
        )
        .join("");


    document
    .querySelectorAll(
        ".staff-option"
    )
    .forEach(
        option => {

            option.addEventListener(
                "click",
                function(){

                    document
                    .querySelectorAll(
                        ".staff-option"
                    )
                    .forEach(
                        x =>
                        x.classList.remove(
                            "selected"
                        )
                    );


                    this.classList.add(
                        "selected"
                    );


                    const radio =
                        this.querySelector(
                            "input"
                        );


                    radio.checked = true;


                    selectedSubstitute =
                        radio.value;


                    document.getElementById(
                        "requestBtn"
                    ).disabled = false;

                }
            );

        }
    );

}


/* =====================================================
   REQUEST SUBSTITUTE
===================================================== */

document
.getElementById(
    "requestBtn"
)
.addEventListener(
    "click",
    async function(){

        if(
            !selectedPeriod ||
            !selectedSubstitute
        ){

            return;

        }


        try{

            this.disabled = true;

            this.textContent =
                "SENDING REQUEST...";


            await addDoc(

                collection(
                    db,
                    "substituteRequests"
                ),

                {

                    requesterStaffId:
                        staffId,

                    requesterName:
                        staffName,

                    requesterDepartment:
                        department,


                    substituteStaffId:
                        selectedSubstitute,


                    date:
                        selectedPeriod.date,

                    dayOrder:
                        selectedPeriod.dayOrder,

                    session:
                        selectedPeriod.session,

                    hour:
                        selectedPeriod.hour,


                    subject:
                        selectedPeriod.subject ||
                        "",

                    classDepartment:
                        selectedPeriod.department ||
                        department,

                    year:
                        selectedPeriod.year ||
                        "",

                    section:
                        selectedPeriod.section ||
                        "",

                    room:
                        selectedPeriod.room ||
                        "",


                    status:
                        "PENDING",

                    createdAt:
                        serverTimestamp()

                }

            );


            closeModal();


            showStatus(
                "Substitute request sent to the Head for approval.",
                "success"
            );


        }catch(error){

            console.error(
                error
            );


            showStatus(
                "Request failed: " +
                error.message,
                "error"
            );


            this.disabled = false;

            this.textContent =
                "REQUEST SUBSTITUTE";

        }

    }
);


/* =====================================================
   CLOSE MODAL
===================================================== */

document
.getElementById(
    "closeModal"
)
.addEventListener(
    "click",
    closeModal
);


function closeModal(){

    document
    .getElementById(
        "modalBackground"
    )
    .classList.remove(
        "show"
    );

}


/* =====================================================
   STATUS
===================================================== */

function showStatus(
    message,
    type
){

    const box =
        document.getElementById(
            "statusBox"
        );


    box.textContent =
        message;


    box.className =
        "status show " +
        type;


    setTimeout(
        function(){

            box.classList.remove(
                "show"
            );

        },
        5000
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =====================================================
   CLOSE WHEN CLICK OUTSIDE
===================================================== */

document
.getElementById(
    "modalBackground"
)
.addEventListener(
    "click",
    function(e){

        if(
            e.target ===
            this
        ){

            closeModal();

        }

    }
);


</script>
