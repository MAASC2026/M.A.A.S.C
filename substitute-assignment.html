<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Substitute Assignment</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f7fb;
    color:#1f2937;
}

.header{
    background:#1e3a8a;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h1{
    font-size:22px;
}

.container{
    width:95%;
    max-width:1400px;
    margin:25px auto;
}

.staff-card{
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.staff-card h2{
    font-size:18px;
    color:#1e3a8a;
    margin-bottom:15px;
}

.staff-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.info-box{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    padding:12px;
    border-radius:8px;
}

.info-box label{
    display:block;
    font-size:12px;
    color:#64748b;
    margin-bottom:5px;
}

.info-box strong{
    font-size:15px;
}

.controls{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.control-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.control-group label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

.control-group input,
.control-group select{
    width:100%;
    padding:11px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    font-size:15px;
    background:white;
}

.timetable-card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    overflow-x:auto;
}

.session-title{
    text-align:center;
    color:#1e3a8a;
    font-size:20px;
    font-weight:bold;
    margin-bottom:18px;
}

.timetable{
    width:100%;
    min-width:900px;
    border-collapse:collapse;
    table-layout:fixed;
}

.timetable th,
.timetable td{
    border:1px solid #cbd5e1;
    text-align:center;
    vertical-align:middle;
    padding:10px;
}

.timetable th{
    background:#1e3a8a;
    color:white;
    font-size:14px;
}

.timetable .label{
    background:#e2e8f0;
    font-weight:bold;
    width:130px;
}

.time-row td{
    background:#f8fafc;
    font-size:12px;
    font-weight:bold;
}

.period-cell{
    min-height:100px;
    height:110px;
    cursor:pointer;
    background:#fff;
    transition:.2s;
}

.period-cell:hover{
    background:#eff6ff;
}

.period-cell.empty{
    color:#94a3b8;
    cursor:default;
}

.period-content{
    line-height:1.5;
    font-size:13px;
}

.period-content .subject{
    font-weight:bold;
    color:#1e3a8a;
}

.period-content .class-info{
    color:#334155;
}

.period-content .room{
    color:#64748b;
    font-size:12px;
}

.selected-cell{
    outline:3px solid #2563eb;
    background:#eff6ff !important;
}

.status{
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
    display:none;
}

.status.show{
    display:block;
}

.status.error{
    background:#fee2e2;
    color:#991b1b;
}

.status.success{
    background:#dcfce7;
    color:#166534;
}

.status.info{
    background:#dbeafe;
    color:#1e40af;
}

/* Modal */

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.65);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9999;
    padding:20px;
}

.modal-overlay.show{
    display:flex;
}

.modal{
    background:white;
    width:100%;
    max-width:600px;
    border-radius:12px;
    padding:22px;
    max-height:90vh;
    overflow-y:auto;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.modal-header h2{
    color:#1e3a8a;
    font-size:19px;
}

.close-btn{
    border:none;
    background:#ef4444;
    color:white;
    width:32px;
    height:32px;
    border-radius:6px;
    cursor:pointer;
    font-size:18px;
}

.selected-period{
    background:#f1f5f9;
    padding:12px;
    border-radius:8px;
    margin-bottom:18px;
    line-height:1.7;
}

.free-staff-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.staff-option{
    border:1px solid #cbd5e1;
    padding:13px;
    border-radius:8px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:12px;
}

.staff-option:hover{
    background:#eff6ff;
    border-color:#2563eb;
}

.staff-option.selected{
    background:#dbeafe;
    border-color:#2563eb;
}

.staff-option input{
    width:18px;
    height:18px;
}

.request-btn{
    width:100%;
    border:none;
    background:#16a34a;
    color:white;
    padding:13px;
    border-radius:8px;
    margin-top:18px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.request-btn:disabled{
    background:#94a3b8;
    cursor:not-allowed;
}

.no-staff{
    padding:20px;
    text-align:center;
    background:#f8fafc;
    border-radius:8px;
    color:#64748b;
}

.loading{
    text-align:center;
    padding:30px;
    color:#64748b;
}

@media(max-width:900px){
    .staff-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .control-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){
    .staff-grid{
        grid-template-columns:1fr;
    }

    .header{
        padding:15px;
    }

    .header h1{
        font-size:18px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>Substitute Assignment</h1>
    <span id="loginStatus">Loading...</span>
</div>

<div class="container">

    <div id="statusBox" class="status"></div>

    <!-- CURRENT STAFF -->

    <div class="staff-card">

        <h2>Current Staff</h2>

        <div class="staff-grid">

            <div class="info-box">
                <label>Staff ID</label>
                <strong id="staffId">Loading...</strong>
            </div>

            <div class="info-box">
                <label>Staff Name</label>
                <strong id="staffName">Loading...</strong>
            </div>

            <div class="info-box">
                <label>Department</label>
                <strong id="staffDepartment">Loading...</strong>
            </div>

            <div class="info-box">
                <label>Role</label>
                <strong id="staffRole">Loading...</strong>
            </div>

        </div>

    </div>


    <!-- DATE / DAY ORDER / SESSION -->

    <div class="controls">

        <div class="control-grid">

            <div class="control-group">
                <label for="dateSelect">Date</label>
                <input type="date" id="dateSelect">
            </div>

            <div class="control-group">
                <label for="dayOrderSelect">Day Order</label>

                <select id="dayOrderSelect">

                    <option value="">Select Day Order</option>
                    <option value="DAY 01">DAY 01</option>
                    <option value="DAY 02">DAY 02</option>
                    <option value="DAY 03">DAY 03</option>
                    <option value="DAY 04">DAY 04</option>
                    <option value="DAY 05">DAY 05</option>
                    <option value="DAY 06">DAY 06</option>

                </select>
            </div>

            <div class="control-group">
                <label for="sessionSelect">Session</label>

                <select id="sessionSelect">

                    <option value="">Select Session</option>
                    <option value="FN">FN</option>
                    <option value="AN">AN</option>

                </select>
            </div>

        </div>

    </div>


    <!-- TIMETABLE -->

    <div class="timetable-card">

        <div id="sessionTitle" class="session-title">
            SELECT DATE, DAY ORDER AND SESSION
        </div>

        <div id="timetableContainer">

            <div class="loading">
                Select Date, Day Order and Session
            </div>

        </div>

    </div>

</div>


<!-- FREE STAFF MODAL -->

<div id="staffModal" class="modal-overlay">

    <div class="modal">

        <div class="modal-header">

            <h2>Select Substitute Staff</h2>

            <button
                class="close-btn"
                onclick="closeStaffModal()">
                ×
            </button>

        </div>

        <div id="selectedPeriod" class="selected-period"></div>

        <div id="freeStaffList" class="free-staff-list"></div>

        <button
            id="requestBtn"
            class="request-btn"
            disabled
            onclick="requestSubstitute()">

            REQUEST SUBSTITUTE

        </button>

    </div>

</div>


<!-- FIREBASE -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    collection,
    getDocs,
    query,
    where,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyAIv3091VM-gkmdwEAn7OhXWd9Cm2zh2bo",

    authDomain:
        "maasc-2026.firebaseapp.com",

    projectId:
        "maasc-2026",

    storageBucket:
        "maasc-2026.appspot.com",

    messagingSenderId:
        "585813001586",

    appId:
        "1:585813001586:web:664e0e90ff0725d2e849eb"

};


/* =========================================================
   FIREBASE INITIALIZE
========================================================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let currentUser = null;

let currentStaff = null;

let currentSelectedPeriod = null;

let selectedSubstituteStaff = null;


/* =========================================================
   SESSION TIMES
========================================================= */

const sessionTimes = {

    FN: [
        "8:30–9:20",
        "9:20–10:10",
        "10:10–11:00",
        "11:30–12:20",
        "12:20–1:10"
    ],

    AN: [
        "1:30–2:20",
        "2:20–3:10",
        "3:30–4:20",
        "4:20–5:10",
        "5:10–6:00"
    ]

};


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        showStatus(
            "No logged-in Firebase user found.",
            "error"
        );

        document.getElementById("loginStatus").textContent =
            "Not Logged In";

        return;
    }

    currentUser = user;

    document.getElementById("loginStatus").textContent =
        "Logged In";

    await loadCurrentStaff(user);

});


/* =========================================================
   LOAD CURRENT STAFF
========================================================= */

async function loadCurrentStaff(user){

    try{

        /*
         IMPORTANT:

         This currently checks the staff document using
         Firebase Auth UID.

         Once your existing staff structure is provided,
         this can be matched exactly to your system.
        */

        const staffRef =
            doc(db, "staff", user.uid);

        const staffSnap =
            await getDoc(staffRef);


        if(!staffSnap.exists()){

            /*
             Try staff collection using email.
            */

            const staffQuery = query(
                collection(db, "staff"),
                where("email", "==", user.email)
            );

            const staffResult =
                await getDocs(staffQuery);


            if(staffResult.empty){

                showStatus(
                    "Staff profile not found in Firestore.",
                    "error"
                );

                return;
            }


            const staffDoc =
                staffResult.docs[0];

            currentStaff = {
                id: staffDoc.id,
                ...staffDoc.data()
            };

        }else{

            currentStaff = {
                id: staffSnap.id,
                ...staffSnap.data()
            };

        }


        displayCurrentStaff();


    }catch(error){

        console.error(
            "Staff loading error:",
            error
        );

        showStatus(
            "Unable to load current staff details: " +
            error.message,
            "error"
        );

    }

}


/* =========================================================
   DISPLAY STAFF
========================================================= */

function displayCurrentStaff(){

    const staff =
        currentStaff || {};


    document.getElementById("staffId").textContent =
        staff.staffId ||
        staff.staffID ||
        staff.id ||
        "-";


    document.getElementById("staffName").textContent =
        staff.name ||
        staff.staffName ||
        staff.displayName ||
        "-";


    document.getElementById("staffDepartment").textContent =
        staff.department ||
        staff.dept ||
        "-";


    document.getElementById("staffRole").textContent =
        staff.role ||
        staff.serviceRole ||
        "Staff";

}


/* =========================================================
   CONTROL EVENTS
========================================================= */

document
.getElementById("dateSelect")
.addEventListener("change", loadTimetable);


document
.getElementById("dayOrderSelect")
.addEventListener("change", loadTimetable);


document
.getElementById("sessionSelect")
.addEventListener("change", loadTimetable);


/* =========================================================
   LOAD TIMETABLE
========================================================= */

async function loadTimetable(){

    const date =
        document.getElementById("dateSelect").value;

    const dayOrder =
        document.getElementById("dayOrderSelect").value;

    const session =
        document.getElementById("sessionSelect").value;


    /*
     DATE AND DAY ORDER ARE COMPLETELY INDEPENDENT.
     Nothing below changes one based on the other.
    */


    if(!date || !dayOrder || !session){

        document.getElementById("sessionTitle").textContent =
            "SELECT DATE, DAY ORDER AND SESSION";

        document.getElementById("timetableContainer").innerHTML =

            `<div class="loading">
                Select Date, Day Order and Session
            </div>`;

        return;
    }


    document.getElementById("sessionTitle").textContent =
        session === "FN"
        ? "FORENOON SESSION"
        : "AFTERNOON SESSION";


    /*
      IMPORTANT:

      The actual timetable Firestore query will be connected
      to your existing timetable collection.

      For now this creates the correct timetable structure.
    */

    const timetableData =
        await getTimetableData(
            date,
            dayOrder,
            session
        );


    renderTimetable(
        dayOrder,
        session,
        timetableData
    );

}


/* =========================================================
   GET TIMETABLE DATA
========================================================= */

async function getTimetableData(
    date,
    dayOrder,
    session
){

    /*
       PLACEHOLDER STRUCTURE.

       This deliberately does NOT guess your existing
       Firestore timetable collection.

       Once your current timetable portal code is provided,
       this function will use its exact collection/field names.
    */


    return {

        1: null,
        2: null,
        3: null,
        4: null,
        5: null

    };

}


/* =========================================================
   RENDER TIMETABLE
========================================================= */

function renderTimetable(
    dayOrder,
    session,
    timetableData
){

    const times =
        sessionTimes[session];


    let html = `

        <table class="timetable">

            <thead>

                <tr>

                    <th>DAY ORDER</th>

                    <th>HOUR 1</th>
                    <th>HOUR 2</th>
                    <th>HOUR 3</th>
                    <th>HOUR 4</th>
                    <th>HOUR 5</th>

                </tr>

            </thead>

            <tbody>

                <tr class="time-row">

                    <td class="label">
                        TIME
                    </td>

                    <td>${times[0]}</td>
                    <td>${times[1]}</td>
                    <td>${times[2]}</td>
                    <td>${times[3]}</td>
                    <td>${times[4]}</td>

                </tr>

                <tr>

                    <td class="label">
                        ${dayOrder}
                    </td>

                    ${createPeriodCell(
                        timetableData[1],
                        1
                    )}

                    ${createPeriodCell(
                        timetableData[2],
                        2
                    )}

                    ${createPeriodCell(
                        timetableData[3],
                        3
                    )}

                    ${createPeriodCell(
                        timetableData[4],
                        4
                    )}

                    ${createPeriodCell(
                        timetableData[5],
                        5
                    )}

                </tr>

            </tbody>

        </table>

    `;


    document.getElementById(
        "timetableContainer"
    ).innerHTML = html;

}


/* =========================================================
   CREATE PERIOD CELL
========================================================= */

function createPeriodCell(
    period,
    hour
){

    if(!period){

        return `

            <td class="period-cell empty">

                <div class="period-content">

                    FREE

                </div>

            </td>

        `;

    }


    return `

        <td
            class="period-cell"
            onclick="openFreeStaffModal(
                ${hour},
                ${JSON.stringify(
                    period
                ).replace(/"/g,"&quot;")}
            )"
        >

            <div class="period-content">

                <div class="subject">

                    ${escapeHTML(
                        period.subject || ""
                    )}

                </div>

                <div class="class-info">

                    ${escapeHTML(
                        period.department || ""
                    )}

                    ${period.year
                        ? " - " +
                          escapeHTML(period.year)
                        : ""
                    }

                    ${period.section
                        ? " - " +
                          escapeHTML(period.section)
                        : ""
                    }

                </div>

                ${
                    period.room
                    ?
                    `<div class="room">
                        Room:
                        ${escapeHTML(period.room)}
                    </div>`
                    :
                    ""
                }

            </div>

        </td>

    `;

}


/* =========================================================
   OPEN FREE STAFF MODAL
========================================================= */

window.openFreeStaffModal =
async function(
    hour,
    period
){

    currentSelectedPeriod = {

        hour,
        ...period

    };

    selectedSubstituteStaff = null;

    document.getElementById(
        "requestBtn"
    ).disabled = true;


    const session =
        document.getElementById(
            "sessionSelect"
        ).value;

    const date =
        document.getElementById(
            "dateSelect"
        ).value;

    const dayOrder =
        document.getElementById(
            "dayOrderSelect"
        ).value;


    document.getElementById(
        "selectedPeriod"
    ).innerHTML = `

        <strong>Selected Period</strong><br>

        Date: ${escapeHTML(date)}<br>

        Day Order: ${escapeHTML(dayOrder)}<br>

        Session: ${escapeHTML(session)}<br>

        Hour: ${hour}<br>

        Subject:
        ${escapeHTML(period.subject || "-")}

    `;


    document.getElementById(
        "staffModal"
    ).classList.add("show");


    await loadFreeStaff(
        date,
        dayOrder,
        session,
        hour
    );

};


/* =========================================================
   LOAD FREE STAFF
========================================================= */

async function loadFreeStaff(
    date,
    dayOrder,
    session,
    hour
){

    const list =
        document.getElementById(
            "freeStaffList"
        );


    list.innerHTML =

        `<div class="loading">
            Checking available staff...
        </div>`;


    try{

        /*
         The exact timetable collection is intentionally
         not guessed here.

         The final version will compare:

         ALL STAFF
             MINUS
         STAFF BUSY IN SELECTED
         DATE + DAY ORDER + SESSION + HOUR
        */


        const freeStaff =
            await findFreeStaff(
                date,
                dayOrder,
                session,
                hour
            );


        if(!freeStaff.length){

            list.innerHTML =

                `<div class="no-staff">
                    No free staff available
                </div>`;

            return;
        }


        list.innerHTML =
            freeStaff.map(
                staff => `

                    <label
                        class="staff-option"
                        onclick="selectSubstituteStaff(
                            '${escapeAttribute(
                                staff.id
                            )}'
                        )"
                    >

                        <input
                            type="radio"
                            name="substituteStaff"
                            value="${escapeAttribute(
                                staff.id
                            )}"
                        >

                        <div>

                            <strong>
                                ${escapeHTML(
                                    staff.name ||
                                    staff.staffName ||
                                    "-"
                                )}
                            </strong>

                            <br>

                            <small>
                                ${escapeHTML(
                                    staff.department ||
                                    ""
                                )}
                                ${
                                    staff.staffId
                                    ?
                                    " | " +
                                    escapeHTML(
                                        staff.staffId
                                    )
                                    :
                                    ""
                                }
                            </small>

                        </div>

                    </label>

                `
            ).join("");


    }catch(error){

        console.error(
            "Free staff error:",
            error
        );

        list.innerHTML =

            `<div class="no-staff">
                Unable to load available staff.
            </div>`;

    }

}


/* =========================================================
   FIND FREE STAFF
========================================================= */

async function findFreeStaff(
    date,
    dayOrder,
    session,
    hour
){

    /*
       FINAL LOGIC:

       1. Load all active staff.
       2. Remove current requesting staff.
       3. Check each staff's timetable.
       4. Remove anyone having a period in:
          date + dayOrder + session + hour.
       5. Return remaining staff.

       Exact Firestore field names will be connected
       from your existing timetable portal.
    */


    const staffSnapshot =
        await getDocs(
            collection(db, "staff")
        );


    const result = [];


    staffSnapshot.forEach(
        staffDoc => {

            const staff =
                {
                    id: staffDoc.id,
                    ...staffDoc.data()
                };


            if(
                currentStaff &&
                staffDoc.id === currentStaff.id
            ){

                return;

            }


            if(
                staff.active === false
            ){

                return;

            }


            result.push(staff);

        }
    );


    return result;

}


/* =========================================================
   SELECT SUBSTITUTE STAFF
========================================================= */

window.selectSubstituteStaff =
function(staffId){

    selectedSubstituteStaff =
        staffId;


    document
        .querySelectorAll(
            ".staff-option"
        )
        .forEach(
            option => {

                const radio =
                    option.querySelector(
                        "input"
                    );

                option.classList.toggle(
                    "selected",
                    radio &&
                    radio.value === staffId
                );

            }
        );


    document.getElementById(
        "requestBtn"
    ).disabled = false;

};


/* =========================================================
   REQUEST SUBSTITUTE
========================================================= */

window.requestSubstitute =
async function(){

    if(
        !currentStaff ||
        !currentSelectedPeriod ||
        !selectedSubstituteStaff
    ){

        return;

    }


    const date =
        document.getElementById(
            "dateSelect"
        ).value;

    const dayOrder =
        document.getElementById(
            "dayOrderSelect"
        ).value;

    const session =
        document.getElementById(
            "sessionSelect"
        ).value;


    try{

        /*
          IMPORTANT:

          This is the basic request structure.

          Your existing Substitute Approval Portal's
          exact collection and field names should be used
          in the final integration.
        */


        await addDoc(
            collection(
                db,
                "substituteRequests"
            ),
            {

                requesterUid:
                    currentUser.uid,

                requesterStaffId:
                    currentStaff.staffId ||
                    currentStaff.staffID ||
                    currentStaff.id,

                requesterName:
                    currentStaff.name ||
                    currentStaff.staffName ||
                    "",

                requesterDepartment:
                    currentStaff.department ||
                    "",


                substituteStaffId:
                    selectedSubstituteStaff,


                date:
                    date,

                dayOrder:
                    dayOrder,

                session:
                    session,

                hour:
                    currentSelectedPeriod.hour,


                subject:
                    currentSelectedPeriod.subject ||
                    "",

                department:
                    currentSelectedPeriod.department ||
                    "",

                year:
                    currentSelectedPeriod.year ||
                    "",

                section:
                    currentSelectedPeriod.section ||
                    "",

                room:
                    currentSelectedPeriod.room ||
                    "",


                status:
                    "PENDING",

                createdAt:
                    serverTimestamp(),

                requesterUid:
                    currentUser.uid

            }
        );


        closeStaffModal();


        showStatus(
            "Substitute request sent successfully to the Head for approval.",
            "success"
        );


    }catch(error){

        console.error(
            "Request error:",
            error
        );


        showStatus(
            "Unable to send substitute request: " +
            error.message,
            "error"
        );

    }

};


/* =========================================================
   CLOSE MODAL
========================================================= */

window.closeStaffModal =
function(){

    document.getElementById(
        "staffModal"
    ).classList.remove("show");

};


/* =========================================================
   STATUS
========================================================= */

function showStatus(
    message,
    type
){

    const box =
        document.getElementById(
            "statusBox"
        );


    box.textContent =
        message;


    box.className =
        "status show " + type;


    setTimeout(
        () => {

            box.classList.remove(
                "show"
            );

        },
        5000
    );

}


/* =========================================================
   ESCAPE HELPERS
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function escapeAttribute(value){

    return String(value ?? "")
        .replaceAll("\\","\\\\")
        .replaceAll("'","\\'");
}


/* =========================================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
========================================================= */

document
.getElementById("staffModal")
.addEventListener(
    "click",
    function(event){

        if(
            event.target === this
        ){

            closeStaffModal();

        }

    }
);

</script>
