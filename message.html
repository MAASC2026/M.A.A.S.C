<script type="module">

/* =====================================================

/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentFirebaseUser = null;

let currentStaff = null;

let allStaff = [];

let staffMap = {};

let conversations = [];

let currentChatId = null;

let currentChatUnsubscribe = null;

let conversationUnsubscribe = null;

    "individual";


/* =====================================================
   ELEMENTS
===================================================== */

const appElement =
    document.getElementById(

const currentUserElement =

/* =====================================================
   HELPERS
===================================================== */

function str(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(
        value
    );

}


function staffIdFromData(
    data,
    documentId
){

    return str(

        data.staffId ||

        data.staffID ||

        data.employeeId ||

        data.employeeID ||

        data.id ||

        documentId

    ).trim();

}


function staffNameFromData(
    data
){

    return str(

        data.name ||

        data.staffName ||

        data.fullName ||

        data.displayName ||

        data.employeeName ||

        "Staff"

    ).trim();

}


function departmentFromData(
    data
){

    return str(

        data.department ||

        data.dept ||

        data.Department ||

        ""

    ).trim();

}


function isActive(
    data
){

    if(
        data.active === false
    ){

        return false;

    }

    if(
        data.isActive === false
    ){

        return false;

    }

    if(
        data.workerActive === false
    ){

        return false;

    }

    return true;

}


function initial(
    name
){

    const value =
        str(name).trim();

    if(!value){

        return "?";

    }

    return value
        .charAt(0)
        .toUpperCase();

}


function escapeHTML(
    value
){

    return str(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function timestampMillis(
    value
){

    try{

        if(
            value &&
            typeof value.toMillis ===
            "function"
        ){

            return value.toMillis();

        }

    }
    catch(e){}

    return 0;

}


function timeText(
    value
){

    if(!value){

        return "";

    }

    try{

        const date =
            value.toDate
                ? value.toDate()
                : new Date(value);

        return date.toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }
    catch(e){

        return "";

    }

}


/* =====================================================
   LOAD STAFF
===================================================== */

async function loadStaff(){

    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "staff"
                )
            );


        allStaff = [];

        staffMap = {};


        snapshot.forEach(
            item => {

                const data =
                    item.data();


                const staffId =
                    staffIdFromData(
                        data,
                        item.id
                    );


                if(!staffId){

                    return;

                }


                const staff = {

                    firestoreId:
                        item.id,

                    staffId:
                        staffId,

                    name:
                        staffNameFromData(
                            data
                        ),

                    department:
                        departmentFromData(
                            data
                        ),

                    active:
                        isActive(
                            data
                        ),

                    email:
                        str(
                            data.email
                        )

                };


                allStaff.push(
                    staff
                );


                staffMap[
                    staff.staffId
                ] =
                    staff;

            }
        );


        allStaff.sort(
            (a,b) =>
                a.name.localeCompare(
                    b.name
                )
        );


        renderStaffResults("");

        renderDepartmentResults("");

        updateAllStaffCount();


        console.log(
            "TOTAL STAFF:",
            allStaff.length
        );

    }
    catch(error){

        console.error(
            "STAFF LOAD ERROR:",
            error
        );


        chatListElement.innerHTML = `

            <div class="no-results">
                Unable to load staff.
                <br><br>
                ${escapeHTML(
                    error.message
                )}
            </div>

        `;

    }

}


/* =====================================================
   FIND CURRENT STAFF
===================================================== */

async function findCurrentStaff(){

    /*
       1. Firebase Auth
    */

    if(
        currentFirebaseUser
    ){

        const user =
            currentFirebaseUser;


        /*
           Match UID to Firestore document.
        */

        let found =
            allStaff.find(
                staff =>
                    staff.firestoreId ===
                    user.uid
            );


        /*
           Match email.
        */

        if(
            !found &&
            user.email
        ){

            const email =
                user.email
                    .toLowerCase();


            found =
                allStaff.find(
                    staff =>
                        str(
                            staff.email
                        )
                        .toLowerCase() ===
                        email
                );

        }


        /*
           Match displayName.
        */

        if(
            !found &&
            user.displayName
        ){

            found =
                allStaff.find(
                    staff =>
                        staff.name
                            .toLowerCase() ===
                        str(
                            user.displayName
                        )
                        .toLowerCase()
                );

        }


        if(found){

            return found;

        }

    }


    /*
       2. Existing browser session.
    */

    const sessionKeys = [

        "staffId",
        "staffID",
        "staff_id",

        "currentStaffId",
        "currentStaffID",

        "loggedInStaffId",
        "loggedInStaffID",

        "employeeId",
        "employeeID",

        "userId",
        "userID",

        "staffCode",
        "employeeCode"

    ];


    const possibleIds = [];


    for(
        const key
        of sessionKeys
    ){

        try{

            const local =
                localStorage.getItem(
                    key
                );


            if(local){

                possibleIds.push(
                    local.trim()
                );

            }

        }
        catch(e){}


        try{

            const session =
                sessionStorage.getItem(
                    key
                );


            if(session){

                possibleIds.push(
                    session.trim()
                );

            }

        }
        catch(e){}

    }


    /*
       Remove duplicates.
    */

    const uniqueIds =
        [
            ...new Set(
                possibleIds
            )
        ];


    console.log(
        "SESSION STAFF IDS:",
        uniqueIds
    );


    for(
        const id
        of uniqueIds
    ){

        const found =
            allStaff.find(
                staff =>
                    staff.staffId
                        .toUpperCase() ===
                    id.toUpperCase()
            );


        if(found){

            return found;

        }

    }


    /*
       3. Stored staff object.
    */

    const objectKeys = [

        "staff",
        "currentStaff",
        "loggedInStaff",
        "staffData",
        "userData"

    ];


    for(
        const key
        of objectKeys
    ){

        const stores = [

            localStorage,
            sessionStorage

        ];


        for(
            const store
            of stores
        ){

            try{

                const raw =
                    store.getItem(
                        key
                    );


                if(!raw){

                    continue;

                }


                const data =
                    JSON.parse(
                        raw
                    );


                const id =
                    data.staffId ||
                    data.staffID ||
                    data.employeeId ||
                    data.employeeID ||
                    data.id;


                if(!id){

                    continue;

                }


                const found =
                    allStaff.find(
                        staff =>
                            staff.staffId
                                .toUpperCase() ===
                            str(id)
                                .toUpperCase()
                    );


                if(found){

                    return found;

                }

            }
            catch(e){}

        }

    }


    return null;

}

/* =====================================================
   CONVERSATION LISTENER
===================================================== */

function startConversationListener(){

    if(
        !currentStaff
    ){

        return;

    }


    if(
        conversationUnsubscribe
    ){

        conversationUnsubscribe();

    }


    const reference =
        collection(
            db,
            "staffConversations"
        );


    const q =
        query(
            reference,
            where(
                "participantIds",
                "array-contains",
                currentStaff.staffId
            )
        );


    conversationUnsubscribe =
        onSnapshot(
            q,
            snapshot => {

                conversations = [];


                snapshot.forEach(
                    item => {

                        conversations.push({

                            id:
                                item.id,

                            ...item.data()

                        });

                    }
                );


                conversations.sort(
                    (a,b) =>
                        timestampMillis(
                            b.lastMessageTime
                        )
                        -
                        timestampMillis(
                            a.lastMessageTime
                        )
                );


                renderConversations();

            },
            error => {

                console.error(
                    "CONVERSATION ERROR:",
                    error
                );

                chatListElement.innerHTML = `

                    <div class="no-results">

                        Unable to load messages.

                        <br><br>

                        ${escapeHTML(
                            error.message
                        )}

                    </div>

                `;

            }
        );

}


/* =====================================================
   RENDER CONVERSATIONS
===================================================== */

function renderConversations(){

    const search =
        conversationSearch.value
            .trim()
            .toLowerCase();


    const filtered =
        conversations.filter(
            chat => {

                if(!search){

                    return true;

                }


                return (

                    str(
                        chat.title
                    )
                    .toLowerCase()
                    .includes(search)

                    ||

                    str(
                        chat.lastMessage
                    )
                    .toLowerCase()
                    .includes(search)

                );

            }
        );


    if(
        !filtered.length
    ){

        chatListElement.innerHTML = `

            <div class="no-results">

                No conversations yet.

            </div>

        `;

        return;

    }


    chatListElement.innerHTML =
        "";


    filtered.forEach(
        chat => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "chat-item" +
                (
                    currentChatId ===
                    chat.id
                        ? " active"
                        : ""
                );


            const unread =
                Number(
                    (
                        chat.unreadCounts ||
                        {}
                    )[
                        currentStaff.staffId
                    ] || 0
                );


            let icon =
                initial(
                    chat.title
                );


            if(
                chat.type ===
                "all"
            ){

                icon = "A";

            }


            if(
                chat.type ===
                "department"
            ){

                icon = "D";

            }


            div.innerHTML = `

                <div class="avatar">

                    ${escapeHTML(
                        icon
                    )}

                </div>


                <div class="chat-info">

                    <div class="chat-top">

                        <div class="chat-name">

                            ${escapeHTML(
                                chat.title ||
                                "Staff"
                            )}

                        </div>

                        <div class="chat-time">

                            ${timeText(
                                chat.lastMessageTime
                            )}

                        </div>

                    </div>


                    <div class="chat-last">

                        ${escapeHTML(
                            chat.lastMessage ||
                            "No messages yet"
                        )}

                    </div>

                </div>


                ${
                    unread > 0
                        ? `
                            <div class="unread">

                                ${
                                    unread > 99
                                        ? "99+"
                                        : unread
                                }

                            </div>
                          `
                        : ""
                }

            `;


            div.addEventListener(
                "click",
                () =>
                    openConversation(
                        chat.id
                    )
            );


            chatListElement.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   OPEN CONVERSATION
===================================================== */

async function openConversation(
    chatId
){

    currentChatId =
        chatId;


    const chat =
        conversations.find(
            item =>
                item.id ===
                chatId
        );


    if(!chat){

        return;

    }


    document.getElementById(
        "emptyChat"
    ).style.display =
        "none";


    document.getElementById(
        "chatHeader"
    ).style.display =
        "flex";


    document.getElementById(
        "messages"
    ).style.display =
        "block";


    document.getElementById(
        "messageInputArea"
    ).style.display =
        "flex";


    document.getElementById(
        "headerName"
    ).textContent =
        chat.title ||
        "Staff";


    document.getElementById(
        "headerAvatar"
    ).textContent =
        chat.type === "all"
            ? "A"
            :
        chat.type === "department"
            ? "D"
            :
        initial(
            chat.title
        );


    document.getElementById(
        "headerStatus"
    ).textContent =
        chat.type === "all"
            ? "All Staff"
            :
        chat.type === "department"
            ? "Department Staff"
            :
            "Staff Conversation";


    if(
        currentChatUnsubscribe
    ){

        currentChatUnsubscribe();

    }


    const messagesReference =
        collection(
            db,
            "staffConversations",
            chatId,
            "messages"
        );


    const q =
        query(
            messagesReference,
            orderBy(
                "timestamp",
                "asc"
            )
        );


    currentChatUnsubscribe =
        onSnapshot(
            q,
            snapshot => {

                renderMessages(
                    snapshot
                );

            },
            error => {

                console.error(
                    "MESSAGE ERROR:",
                    error
                );

            }
        );


    /*
       Reset unread.
    */

    try{

        const unreadCounts =
            {
                ...(chat.unreadCounts || {})
            };


        unreadCounts[
            currentStaff.staffId
        ] = 0;


        await updateDoc(
            doc(
                db,
                "staffConversations",
                chatId
            ),
            {
                unreadCounts:
                    unreadCounts
            }
        );

    }
    catch(error){

        console.warn(
            "READ UPDATE ERROR:",
            error
        );

    }


    appElement.classList.add(
        "chat-open"
    );


    renderConversations();


    setTimeout(
        () => {

            document.getElementById(
                "messageInput"
            ).focus();

        },
        200
    );

}


/* =====================================================
   RENDER MESSAGES
===================================================== */

function renderMessages(
    snapshot
){

    const container =
        document.getElementById(
            "messages"
        );


    container.innerHTML =
        "";


    snapshot.forEach(
        item => {

            const data =
                item.data();


            const mine =
                data.senderId ===
                currentStaff.staffId;


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "message-row " +
                (
                    mine
                        ? "mine"
                        : ""
                );


            const bubble =
                document.createElement(
                    "div"
                );


            bubble.className =
                "message " +
                (
                    mine
                        ? "mine"
                        : "theirs"
                );


            let sender =
                "";


            if(!mine){

                sender = `

                    <div class="sender-name">

                        ${escapeHTML(
                            data.senderName ||
                            data.senderId ||
                            "Staff"
                        )}

                    </div>

                `;

            }


            const read =
                data.readBy &&
                data.readBy.length > 1;


            bubble.innerHTML = `

                ${sender}


                <div class="message-text">

                    ${escapeHTML(
                        data.text
                    )}

                </div>


                <div class="message-meta">

                    ${timeText(
                        data.timestamp
                    )}

                    ${
                        mine
                            ? `
                                <span
                                    class="${
                                        read
                                            ? "read"
                                            : ""
                                    }"
                                >
                                    ${
                                        read
                                            ? "✓✓"
                                            : "✓"
                                    }
                                </span>
                              `
                            : ""
                    }

                </div>

            `;


            row.appendChild(
                bubble
            );


            container.appendChild(
                row
            );

        }
    );


    container.scrollTop =
        container.scrollHeight;

}


/* =====================================================
   SEND CURRENT MESSAGE
===================================================== */

async function sendCurrentMessage(){

    if(
        !currentChatId
    ){

        return;

    }


    if(
        !currentStaff
    ){

        alert(
            "Staff information not found."
        );

        return;

    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if(!text){

        return;

    }


    input.value =
        "";


    try{

        const chatReference =
            doc(
                db,
                "staffConversations",
                currentChatId
            );


        const chatSnapshot =
            await getDoc(
                chatReference
            );


        if(
            !chatSnapshot.exists()
        ){

            alert(
                "Conversation not found."
            );

            return;

        }


        const chat =
            chatSnapshot.data();


        const messageReference =
            collection(
                db,
                "staffConversations",
                currentChatId,
                "messages"
            );


        await addDoc(
            messageReference,
            {

                senderId:
                    currentStaff.staffId,

                senderName:
                    currentStaff.name,

                text:
                    text,

                timestamp:
                    serverTimestamp(),

                readBy:[
                    currentStaff.staffId
                ]

            }
        );


        const unreadCounts =
            {
                ...(chat.unreadCounts || {})
            };


        const participants =
            chat.participantIds || [];


        participants.forEach(
            id => {

                if(
                    id !==
                    currentStaff.staffId
                ){

                    unreadCounts[id] =
                        Number(
                            unreadCounts[id] ||
                            0
                        ) + 1;

                }

            }
        );


        await updateDoc(
            chatReference,
            {

                lastMessage:
                    text,

                lastMessageTime:
                    serverTimestamp(),

                lastSenderId:
                    currentStaff.staffId,

                lastSenderName:
                    currentStaff.name,

                unreadCounts:
                    unreadCounts

            }
        );

    }
    catch(error){

        console.error(
            "SEND ERROR:",
            error
        );


        alert(
            "Message could not be sent.\n\n" +
            error.message
        );


        input.value =
            text;

    }

}

/* =====================================================
   DEPARTMENT SEARCH
===================================================== */

function getDepartments(){

    const map = {};


    allStaff.forEach(
        staff => {

            if(
                !staff.department
            ){

                return;

            }


            const key =
                staff.department
                    .trim();


            if(
                !map[key]
            ){

                map[key] = {

                    name:
                        key,

                    count:
                        0

                };

            }


            if(
                staff.active
            ){

                map[key].count++;

            }

        }
    );


    return Object.values(
        map
    )
    .sort(
        (a,b) =>
            a.name.localeCompare(
                b.name
            )
    );

}

/* =====================================================
   SEND NEW MESSAGE
===================================================== */

async function sendNewMessage(){

    if(
        !currentStaff
    ){

        alert(
            "Staff information not found."
        );

        return;

    }


    const text =
        document.getElementById(
            "newMessageText"
        )
        .value
        .trim();


    if(!text){

        alert(
            "Please type a message."
        );

        return;

    }


    if(
        !currentRecipient
    ){

        alert(
            "Please select a recipient."
        );

        return;

    }


    try{

        let recipients = [];


        /* INDIVIDUAL */

        if(
            currentRecipient.type ===
            "individual"
        ){

            const target =
                staffMap[
                    currentRecipient.staffId
                ];


            if(target){

                recipients.push(
                    target
                );

            }


            recipients.push(
                currentStaff
            );

        }


        /* DEPARTMENT */

        if(
            currentRecipient.type ===
            "department"
        ){

            recipients =
                allStaff.filter(
                    staff =>

                        staff.active &&

                        staff.department
                            .trim()
                            .toLowerCase() ===
                        currentRecipient
                            .department
                            .trim()
                            .toLowerCase()

                );


            if(
                !recipients.some(
                    staff =>
                        staff.staffId ===
                        currentStaff.staffId
                )
            ){

                recipients.push(
                    currentStaff
                );

            }

        }


        /* ALL STAFF */

        if(
            currentRecipient.type ===
            "all"
        ){

            recipients =
                allStaff.filter(
                    staff =>
                        staff.active
                );


            if(
                !recipients.some(
                    staff =>
                        staff.staffId ===
                        currentStaff.staffId
                )
            ){

                recipients.push(
                    currentStaff
                );

            }

        }


        recipients =
            recipients.filter(
                Boolean
            );


        const participantIds =
            [
                ...new Set(
                    recipients.map(
                        staff =>
                            staff.staffId
                    )
                )
            ];


        if(
            participantIds.length <
            2
        ){

            alert(
                "No valid recipient found."
            );

            return;

        }


        let chatId;

        let title;

        const type =
            currentRecipient.type;


        /* INDIVIDUAL */

        if(
            type ===
            "individual"
        ){

            chatId =
                [
                    currentStaff.staffId,
                    currentRecipient.staffId
                ]
                .sort()
                .join(
                    "__"
                );


            title =
                currentRecipient.name;

        }


        /* DEPARTMENT / ALL */

        else{

            const newReference =
                doc(
                    collection(
                        db,
                        "staffConversations"
                    )
                );


            chatId =
                newReference.id;


            title =
                type ===
                "all"

                    ? "All Staff"

                    :
                currentRecipient
                    .department +
                " Staff";

        }


        const chatReference =
            doc(
                db,
                "staffConversations",
                chatId
            );


        let existingData =
            null;


        const existingSnapshot =
            await getDoc(
                chatReference
            );


        if(
            existingSnapshot.exists()
        ){

            existingData =
                existingSnapshot.data();

        }


        const unreadCounts =
            {
                ...(
                    existingData &&
                    existingData.unreadCounts
                        ? existingData.unreadCounts
                        : {}
                )
            };


        participantIds.forEach(
            id => {

                if(
                    !unreadCounts[id]
                ){

                    unreadCounts[id] =
                        0;

                }

            }
        );


        participantIds.forEach(
            id => {

                if(
                    id !==
                    currentStaff.staffId
                ){

                    unreadCounts[id]++;

                }

            }
        );


        await setDoc(
            chatReference,
            {

                title:
                    title,

                type:
                    type,

                participantIds:
                    participantIds,

                participantNames:
                    recipients.map(
                        staff =>
                            staff.name
                    ),

                department:
                    currentRecipient.department ||
                    "",

                lastMessage:
                    text,

                lastSenderId:
                    currentStaff.staffId,

                lastSenderName:
                    currentStaff.name,

                lastMessageTime:
                    serverTimestamp(),

                unreadCounts:
                    unreadCounts,

                createdBy:
                    currentStaff.staffId,

                createdAt:
                    existingData &&
                    existingData.createdAt
                        ? existingData.createdAt
                        : serverTimestamp()

            },

            {
                merge:true
            }

        );


        await addDoc(
            collection(
                db,
                "staffConversations",
                chatId,
                "messages"
            ),
            {

                senderId:
                    currentStaff.staffId,

                senderName:
                    currentStaff.name,

                text:
                    text,

                timestamp:
                    serverTimestamp(),

                readBy:
                    [
                        currentStaff.staffId
                    ]

            }
        );


        closeNewMessage();


        setTimeout(
            () => {

                openConversation(
                    chatId
                );

            },
            500
        );

    }
    catch(error){

        console.error(
            "NEW MESSAGE ERROR:",
            error
        );


        alert(
            "Unable to send message.\n\n" +
            error.message
        );

    }

}


/* =====================================================
   EVENTS
===================================================== */

document.getElementById(
    "newMessageButton"
)
.addEventListener(
    "click",
    openNewMessage
);


document.getElementById(
    "closeModal"
)
.addEventListener(
    "click",
    closeNewMessage
);


document.getElementById(
    "cancelModal"
)
.addEventListener(
    "click",
    closeNewMessage
);


document.getElementById(
    "individualTab"
)
.addEventListener(
    "click",
    () =>
        setRecipientMode(
            "individual"
        )
);


document.getElementById(
    "departmentTab"
)
.addEventListener(
    "click",
    () =>
        setRecipientMode(
            "department"
        )
);


document.getElementById(
    "allTab"
)
.addEventListener(
    "click",
    () =>
        setRecipientMode(
            "all"
        );


document.getElementById(
    "staffSearch"
)
.addEventListener(
    "input",
    event =>
        renderStaffResults(
            event.target.value
        )
);


document.getElementById(
    "departmentSearch"
)
.addEventListener(
    "input",
    event =>
        renderDepartmentResults(
            event.target.value
        )
);


conversationSearch.addEventListener(
    "input",
    renderConversations
);


document.getElementById(
    "sendButton"
)
.addEventListener(
    "click",
    sendCurrentMessage
);


document.getElementById(
    "messageInput"
)
.addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendCurrentMessage();

        }

    }
);


document.getElementById(
    "sendNewButton"
)
.addEventListener(
    "click",
    sendNewMessage
);


document.getElementById(
    "mobileBack"
)
.addEventListener(
    "click",
    () => {

        appElement.classList.remove(
            "chat-open"
        );

    }
);


/* =====================================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
===================================================== */

newMessageModal.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            newMessageModal
        ){

            closeNewMessage();

        }

    }
);

</script>

</body>
</html>
