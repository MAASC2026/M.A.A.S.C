<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Staff Messaging System</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f3f6fb;
    color:#1f2937;
}

/* HEADER */
.header{
    background:#1e3a8a;
    color:white;
    padding:20px 28px;
}

.header h1{
    font-size:24px;
}

.header p{
    margin-top:5px;
    font-size:14px;
    opacity:.9;
}

/* MAIN */
.container{
    max-width:1300px;
    margin:25px auto;
    padding:0 18px;
}

.layout{
    display:grid;
    grid-template-columns:330px 1fr;
    gap:20px;
}

/* CARDS */
.card{
    background:white;
    border-radius:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.left{
    min-height:680px;
}

.right{
    min-height:680px;
}

/* STAFF LIST */
.card-header{
    padding:18px;
    border-bottom:1px solid #e5e7eb;
    font-size:17px;
    font-weight:bold;
}

.staff-search{
    padding:12px;
    border-bottom:1px solid #e5e7eb;
}

.staff-search input{
    width:100%;
    padding:11px;
    border:1px solid #d1d5db;
    border-radius:7px;
    outline:none;
}

.staff-search input:focus{
    border-color:#2563eb;
}

.staff-list{
    max-height:590px;
    overflow-y:auto;
}

.staff-item{
    padding:13px 15px;
    border-bottom:1px solid #f0f0f0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.staff-item:hover{
    background:#f3f7ff;
}

.staff-item.active{
    background:#dbeafe;
}

.staff-name{
    font-size:14px;
    font-weight:bold;
}

.staff-info{
    margin-top:4px;
    font-size:12px;
    color:#6b7280;
}

.unread{
    min-width:22px;
    height:22px;
    padding:0 6px;
    border-radius:50%;
    background:#dc2626;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:bold;
}

/* COMPOSE */
.compose{
    padding:20px;
}

.top-actions{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.action-btn{
    padding:10px 15px;
    border:none;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.inbox-btn{
    background:#2563eb;
    color:white;
}

.sent-btn{
    background:#e5e7eb;
    color:#111827;
}

.count{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:20px;
    height:20px;
    margin-left:5px;
    padding:0 5px;
    background:#dc2626;
    color:white;
    border-radius:50%;
    font-size:10px;
}

/* TABS */
.recipient-tabs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.tab{
    padding:10px 15px;
    border:1px solid #d1d5db;
    border-radius:7px;
    background:white;
    cursor:pointer;
    font-weight:bold;
    font-size:13px;
}

.tab.active{
    background:#2563eb;
    border-color:#2563eb;
    color:white;
}

/* FORM */
.group{
    margin-bottom:17px;
}

.group label{
    display:block;
    margin-bottom:7px;
    font-size:13px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:11px;
    border:1px solid #d1d5db;
    border-radius:7px;
    outline:none;
    font-size:14px;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#2563eb;
}

textarea{
    min-height:140px;
    resize:vertical;
}

/* SEARCHABLE STAFF */
.staff-picker{
    position:relative;
}

.staff-picker input[type="text"]{
    width:100%;
}

.staff-results{
    position:absolute;
    left:0;
    right:0;
    top:100%;
    background:white;
    border:1px solid #d1d5db;
    border-radius:0 0 8px 8px;
    max-height:280px;
    overflow-y:auto;
    z-index:1000;
    box-shadow:0 6px 18px rgba(0,0,0,.15);
    display:none;
}

.staff-results.show{
    display:block;
}

.staff-result-item{
    padding:12px;
    border-bottom:1px solid #f0f0f0;
    cursor:pointer;
}

.staff-result-item:hover{
    background:#eff6ff;
}

.staff-result-name{
    font-size:14px;
    font-weight:bold;
}

.staff-result-info{
    margin-top:4px;
    color:#6b7280;
    font-size:12px;
}

.selected-staff{
    display:none;
    margin-top:7px;
    padding:8px 10px;
    border-radius:6px;
    background:#dcfce7;
    color:#166534;
    font-size:13px;
}

/* BUTTONS */
.btn{
    padding:11px 20px;
    border:none;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.send{
    background:#2563eb;
    color:white;
}

.send:hover{
    background:#1d4ed8;
}

.send:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.clear{
    background:#e5e7eb;
    margin-left:8px;
}

/* ALERT */
.message{
    display:none;
    padding:12px;
    margin-top:15px;
    border-radius:7px;
    font-size:13px;
}

.message.show{
    display:block;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.info{
    background:#dbeafe;
    color:#1e40af;
}

/* CONVERSATION */
.conversation{
    display:none;
}

.conversation.show{
    display:block;
}

.conversation-header{
    padding:18px;
    border-top:1px solid #e5e7eb;
    border-bottom:1px solid #e5e7eb;
}

.conversation-header h2{
    font-size:18px;
}

.conversation-header p{
    margin-top:4px;
    font-size:12px;
    color:#6b7280;
}

.messages{
    height:450px;
    overflow-y:auto;
    padding:20px;
    background:#f8fafc;
}

.msg{
    max-width:75%;
    margin-bottom:15px;
}

.msg.mine{
    margin-left:auto;
}

.msg-bubble{
    padding:12px 14px;
    border-radius:10px;
    background:white;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
    word-break:break-word;
}

.msg.mine .msg-bubble{
    background:#dbeafe;
}

.msg-sender{
    margin-bottom:5px;
    font-size:11px;
    font-weight:bold;
}

.msg-time{
    margin-top:5px;
    color:#6b7280;
    font-size:10px;
}

.reply{
    display:flex;
    gap:8px;
    padding:15px;
    border-top:1px solid #e5e7eb;
}

.reply textarea{
    min-height:45px;
    max-height:100px;
}

.reply button{
    height:45px;
    align-self:flex-end;
}

/* EMPTY / LOADING */
.empty{
    padding:40px 15px;
    text-align:center;
    color:#6b7280;
}

.loading{
    padding:30px;
    text-align:center;
    color:#6b7280;
}

/* MOBILE */
@media(max-width:850px){

    .layout{
        grid-template-columns:1fr;
    }

    .left{
        min-height:auto;
    }

    .staff-list{
        max-height:320px;
    }

    .right{
        min-height:auto;
    }

    .messages{
        height:400px;
    }

    .msg{
        max-width:90%;
    }
}
</style>
</head>

<body>

<!-- HEADER -->

<div class="container">

<div class="layout">

</div>

<script type="module">

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getFirestore,
    collection,
    getDocs,

    where,
    onSnapshot,
    doc,
    updateDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAIv3091VM-gkmdwEAn7OhXWd9Cm2zh2bo",

    authDomain:
        "maasc-2026.firebaseapp.com",

    projectId:
        "maasc-2026",

    storageBucket:
        "maasc-2026.appspot.com",

    messagingSenderId:
        "585813001586",

    appId:
        "1:585813001586:web:664e0e90ff0725d2e849eb"

};


const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getFirestore(app);


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentStaff = null;

let allStaff = [];

let currentType =
    "individual";

let selectedConversationStaff =
    null;

let unsubscribeInbox =
    null;

let unsubscribeConversation =
    null;


/* =====================================================
   SHORTCUT
===================================================== */

function $(id){

    return document.getElementById(id);

}


/* =====================================================
   CLEAN TEXT
===================================================== */

function clean(value){

    return String(
        value ?? ""
    ).trim();

}


function upper(value){

    return clean(
        value
    ).toUpperCase();

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function esc(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    const box =
        $("sendMessage");

    box.textContent =
        text;

    box.className =
        "message show " +
        type;

}


/* =====================================================
   HIDE MESSAGE
===================================================== */

function hideMessage(){

    $("sendMessage")
        .className =
        "message";

}


/* =====================================================
   GET STAFF SESSION
===================================================== */

function getLoggedInStaff(){

    const keys = [

        "staffSession",
        "staff_session",
        "loggedInStaff",
        "currentStaff",
        "staffData",
        "userData",
        "user"

    ];


    for(
        const key of keys
    ){

        try{

            const raw =

                localStorage.getItem(
                    key
                )

                ||

                sessionStorage.getItem(
                    key
                );


            if(!raw)
                continue;


            const data =
                JSON.parse(
                    raw
                );


            if(
                data &&
                typeof data ===
                "object"
            ){

                return data;

            }

        }
        catch(error){

            console.warn(
                "Session parse error:",
                error
            );

        }

    }


    const idKeys = [

        "staffId",
        "staffID",
        "loggedInStaffId",
        "currentStaffId",
        "userStaffId"

    ];


    for(
        const key of idKeys
    ){

        const id =

            localStorage.getItem(
                key
            )

            ||

            sessionStorage.getItem(
                key
            );


        if(id){

            return {

                staffId:id

            };

        }

    }


    return null;

}


/* =====================================================
   STAFF FIELD HELPERS
===================================================== */

function getStaffId(data){

    return clean(

        data.staffId ??

        data.staffID ??

        data.staff_id ??

        data.id

    );

}


function getStaffName(data){

    return clean(

        data.staffName ??

        data.name ??

        data.staff_name ??

        data.displayName

    );

}


function getDepartment(data){

    return clean(

        data.department ??

        data.dept ??

        data.departmentName

    );

}


/* =====================================================
   LOAD CURRENT STAFF
===================================================== */

async function loadCurrentStaff(){

    const session =
        getLoggedInStaff();


    if(!session){

        alert(
            "Staff login session not found. Please login first."
        );

        return false;

    }


    const id =

        clean(

            session.staffId ??

            session.staffID ??

            session.staff_id ??

            session.id

        );


    if(!id){

        alert(
            "Staff ID was not found in the login session."
        );

        return false;

    }


    currentStaff = {

        staffId:id,

        staffName:

            clean(

                session.staffName ??

                session.name ??

                session.staff_name

            ),

        department:

            clean(

                session.department ??

                session.dept ??

                session.departmentName

            )

    };


    /*
     * Get complete staff details
     * from Firestore.
     */

    try{

        const snap =
            await getDocs(
                collection(
                    db,
                    "staff"
                )
            );


        snap.forEach(
            item => {

                const data =
                    item.data();


                const sid =
                    getStaffId(
                        data
                    );


                if(
                    upper(sid) ===
                    upper(
                        currentStaff.staffId
                    )
                ){

                    currentStaff.staffName =

                        currentStaff.staffName
                        ||

                        getStaffName(
                            data
                        );


                    currentStaff.department =

                        currentStaff.department
                        ||

                        getDepartment(
                            data
                        );

                }

            }
        );

    }
    catch(error){

        console.error(
            "Current staff lookup:",
            error
        );

    }


    return true;

}


/* =====================================================
   LOAD ALL STAFF
===================================================== */

async function loadStaff(){

    const box =
        $("staffList");


    box.innerHTML =
        `
        <div class="loading">
            Loading staff...
        </div>
        `;


    try{

        const snap =
            await getDocs(
                collection(
                    db,
                    "staff"
                )
            );


        const map =
            new Map();


        snap.forEach(
            item => {

                const data =
                    item.data();


                const staffId =
                    getStaffId(
                        data
                    );


                if(!staffId)
                    return;


                /*
                 * Do not display
                 * currently logged staff.
                 */

                if(
                    upper(staffId) ===
                    upper(
                        currentStaff.staffId
                    )
                ){

                    return;

                }


                map.set(
                    upper(
                        staffId
                    ),
                    {

                        documentId:
                            item.id,

                        staffId:
                            staffId,

                        staffName:
                            getStaffName(
                                data
                            ) ||
                            staffId,

                        department:
                            getDepartment(
                                data
                            )

                    }
                );

            }
        );


        allStaff =
            Array.from(
                map.values()
            );


        allStaff.sort(
            (a,b) =>

                String(
                    a.staffName
                ).localeCompare(
                    String(
                        b.staffName
                    )
                )
        );


        populateDepartments();

        populateSearchableStaff();

        renderStaffList(
            allStaff
        );

    }
    catch(error){

        console.error(
            "STAFF LOAD ERROR:",
            error
        );


        box.innerHTML =

            `
            <div class="empty">

                Unable to load staff.

                <br><br>

                ${esc(
                    error.message
                )}

            </div>
            `;

    }

}


/* =====================================================
   SEARCHABLE INDIVIDUAL STAFF
===================================================== */

function populateSearchableStaff(){

    const search =
        $("individualStaffSearch");


    const results =
        $("individualStaffResults");


    const hidden =
        $("individualStaff");


    const selected =
        $("selectedStaffDisplay");


    function showResults(){

        const text =
            upper(
                search.value
            );


        if(!text){

            results.innerHTML =
                "";

            results.classList.remove(
                "show"
            );

            return;

        }


        const matches =
            allStaff.filter(
                staff => {

                    const name =
                        upper(
                            staff.staffName
                        );

                    const id =
                        upper(
                            staff.staffId
                        );

                    const department =
                        upper(
                            staff.department
                        );


                    return (

                        name.includes(
                            text
                        )

                        ||

                        id.includes(
                            text
                        )

                        ||

                        department.includes(
                            text
                        )

                    );

                }
            );


        if(!matches.length){

            results.innerHTML =

                `
                <div
                    class="empty"
                    style="padding:15px">

                    No matching staff found.

                </div>
                `;


            results.classList.add(
                "show"
            );

            return;

        }


        results.innerHTML =

            matches.map(
                staff => `

                <div
                    class="staff-result-item"
                    data-staff-id="${esc(
                        staff.staffId
                    )}">

                    <div
                        class="staff-result-name">

                        ${esc(
                            staff.staffName
                        )}

                    </div>

                    <div
                        class="staff-result-info">

                        ${esc(
                            staff.staffId
                        )}

                        ${
                            staff.department

                            ? " • " +
                              esc(
                                  staff.department
                              )

                            : ""
                        }

                    </div>

                </div>

                `
            )
            .join("");


        results.classList.add(
            "show"
        );


        results
            .querySelectorAll(
                ".staff-result-item"
            )
            .forEach(
                item => {

                    item.addEventListener(
                        "click",
                        () => {

                            const id =
                                item.dataset.staffId;


                            const staff =
                                allStaff.find(
                                    s =>
                                        upper(
                                            s.staffId
                                        ) ===
                                        upper(
                                            id
                                        )
                                );


                            if(!staff)
                                return;


                            /*
                             * Store selected
                             * Staff ID.
                             */

                            hidden.value =
                                staff.staffId;


                            /*
                             * Show staff name
                             * in search field.
                             */

                            search.value =
                                staff.staffName;


                            /*
                             * Show selected
                             * staff information.
                             */

                            selected.textContent =

                                "✓ Selected: " +

                                staff.staffName +

                                " (" +

                                staff.staffId +

                                ")" +

                                (
                                    staff.department

                                    ? " • " +
                                      staff.department

                                    : ""
                                );


                            selected.style.display =
                                "block";


                            search.style.borderColor =
                                "#16a34a";


                            results.innerHTML =
                                "";


                            results.classList.remove(
                                "show"
                            );

                        }
                    );

                }
            );

    }


    search.addEventListener(
        "input",
        () => {

            /*
             * If user changes
             * selected name, remove
             * previous selection.
             */

            hidden.value =
                "";

            selected.style.display =
                "none";

            search.style.borderColor =
                "#d1d5db";


            showResults();

        }
    );


    search.addEventListener(
        "focus",
        () => {

            if(
                search.value.trim()
            ){

                showResults();

            }

        }
    );


    document.addEventListener(
        "click",
        event => {

            if(
                !event.target.closest(
                    ".staff-picker"
                )
            ){

                results.classList.remove(
                    "show"
                );

            }

        }
    );

}

    const departments =

                    .map(
                        staff =>

                                staff.department
                            )
                    )

                    .filter(
                        Boolean
                    )

            )
        ];

        (a,b) =>
            a.localeCompare(
                b
            )
    );

        `

    return String(
        value

    .replace(
        /[^a-zA-Z0-9_-]/g,
        "_"
    );

}

/* =====================================================
   SEND MESSAGE
===================================================== */

$("sendBtn")
    .addEventListener(
        "click",
        sendMessage
    );


async function sendMessage(){

    hideMessage();


    const text =
        clean(
            $("messageText").value
        );


    if(!text){

        showMessage(
            "Please type a message.",
            "error"
        );

        return;

    }


    let recipients = [];


    /* INDIVIDUAL */

    if(
        currentType ===
        "individual"
    ){

        const id =
            clean(
                $("individualStaff").value
            );


        if(!id){

            showMessage(
                "Please type and select a staff member.",
                "error"
            );

            return;

        }


        const staff =
            allStaff.find(
                s =>
                    upper(
                        s.staffId
                    ) ===
                    upper(
                        id
                    )
            );


        if(!staff){

            showMessage(
                "Selected staff was not found.",
                "error"
            );

            return;

        }


        recipients = [
            staff
        ];

    }


    /* DEPARTMENT */

    else if(
        currentType ===
        "department"
    ){

        const department =
            clean(
                $("departmentSelect").value
            );


        if(!department){

            showMessage(
                "Please select a department.",
                "error"
            );

            return;

        }


        recipients =
            allStaff.filter(
                staff =>

                    upper(
                        staff.department
                    ) ===
                    upper(
                        department
                    )
            );


        if(!recipients.length){

            showMessage(
                "No staff found in this department.",
                "error"
            );

            return;

        }

    }


    /* ALL STAFF */

    else if(
        currentType ===
        "all"
    ){

        recipients =
            [...allStaff];


        if(!recipients.length){

            showMessage(
                "No staff members are available.",
                "error"
            );

            return;

        }

    }


    const sendButton =
        $("sendBtn");


    sendButton.disabled =
        true;


    sendButton.textContent =
        "SENDING...";


    try{

        /*
         * One Firestore document
         * per recipient.
         */

        const promises =
            recipients.map(
                recipient =>

                    addDoc(
                        collection(
                            db,
                            "staffMessages"
                        ),
                        {

                            senderId:
                                currentStaff.staffId,

                            senderName:
                                currentStaff.staffName ||
                                currentStaff.staffId,

                            senderDepartment:
                                currentStaff.department ||
                                "",

                            receiverId:
                                recipient.staffId,

                            receiverName:
                                recipient.staffName,

                            receiverDepartment:
                                recipient.department ||
                                "",

                            message:
                                text,

                            type:
                                currentType,

                            isRead:
                                false,

                            createdAt:
                                serverTimestamp()

                        }
                    )
            );


        await Promise.all(
            promises
        );


        if(
            currentType ===
            "all"
        ){

            showMessage(

                "Message sent to " +
                recipients.length +
                " staff members.",

                "success"

            );

        }
        else if(
            currentType ===
            "department"
        ){

            showMessage(

                "Message sent to " +
                recipients.length +
                " staff members in " +
                $("departmentSelect").value +
                ".",

                "success"

            );

        }
        else{

            showMessage(

                "Message sent to " +
                recipients[0].staffName +
                ".",

                "success"

            );

        }


        $("messageText")
            .value =
            "";


    }
    catch(error){

        console.error(
            "SEND MESSAGE ERROR:",
            error
        );


        showMessage(

            "Message could not be sent: " +
            error.message,

            "error"

        );

    }
    finally{

        sendButton.disabled =
            false;


        sendButton.textContent =
            "SEND MESSAGE";

    }

}

/* =====================================================
   CONVERSATION
===================================================== */

function loadConversation(
    staff
){

    if(
        unsubscribeConversation
    ){

        unsubscribeConversation();

    }


    const messagesRef =
        collection(
            db,
            "staffMessages"
        );


    /*
     * We query by sender ID
     * and filter the other side
     * in JavaScript.
     */

    const q =
        query(

            messagesRef,

            where(
                "senderId",
                "in",
                [
                    currentStaff.staffId,
                    staff.staffId
                ]
            )

        );


    unsubscribeConversation =
        onSnapshot(
            q,
            async snapshot => {

                const messages = [];


                snapshot.forEach(
                    item => {

                        const data =
                            item.data();


                        const isConversation =

                            (

                                upper(
                                    data.senderId
                                ) ===
                                upper(
                                    currentStaff.staffId
                                )

                                &&

                                upper(
                                    data.receiverId
                                ) ===
                                upper(
                                    staff.staffId
                                )

                            )

                            ||

                            (

                                upper(
                                    data.senderId
                                ) ===
                                upper(
                                    staff.staffId
                                )

                                &&

                                upper(
                                    data.receiverId
                                ) ===
                                upper(
                                    currentStaff.staffId
                                )

                            );


                        if(
                            isConversation
                        ){

                            messages.push({

                                id:
                                    item.id,

                                ...data

                            });

                        }

                    }
                );


                messages.sort(
                    (a,b) =>

                        (
                            a.createdAt?.seconds ||
                            0
                        )

                        -

                        (
                            b.createdAt?.seconds ||
                            0
                        )

                );


                renderConversation(
                    messages
                );


                /*
                 * Mark received messages
                 * as read.
                 */

                for(
                    const message
                    of messages
                ){

                    if(

                        upper(
                            message.receiverId
                        ) ===
                        upper(
                            currentStaff.staffId
                        )

                        &&

                        message.isRead !==
                        true

                    ){

                        try{

                            await updateDoc(

                                doc(
                                    db,
                                    "staffMessages",
                                    message.id
                                ),

                                {
                                    isRead:true
                                }

                            );

                        }
                        catch(error){

                            console.error(
                                error
                            );

                        }

                    }

                }

            },

            error => {

                console.error(
                    "CONVERSATION ERROR:",
                    error
                );

            }
        );

}


/* =====================================================
   RENDER CONVERSATION
===================================================== */

function renderConversation(

){

    const box =

    if(!messages.length){

        messages.map(

/* =====================================================
   UNREAD COUNT
===================================================== */

function loadUnreadCounts(){

    if(
        unsubscribeInbox
    ){

        unsubscribeInbox();

    }


    const q =
        query(

            collection(
                db,
                "staffMessages"
            ),

            where(
                "receiverId",
                "==",
                currentStaff.staffId
            ),

            where(
                "isRead",
                "==",
                false
            )

        );


    unsubscribeInbox =
        onSnapshot(
            q,
            snapshot => {

                const count =
                    snapshot.size;


                const badge =
                    $("unreadCount");


                badge.textContent =
                    count;


                badge.style.display =

                    count > 0

                    ? "inline-flex"
                    : "none";


                const counts = {};


                snapshot.forEach(
                    item => {

                        const data =
                            item.data();


                        const senderId =
                            data.senderId;


                        if(!senderId)
                            return;


                        counts[
                            senderId
                        ] =

                            (
                                counts[
                                    senderId
                                ] || 0
                            ) + 1;

                    }
                );


                allStaff.forEach(
                    staff => {

                        const element =
                            document.getElementById(
                                "unread-" +
                                safeId(
                                    staff.staffId
                                )
                            );


                        if(!element)
                            return;


                        const number =

                            counts[
                                staff.staffId
                            ] || 0;


                        element.textContent =
                            number;


                        element.style.display =

                            number > 0

                            ? "flex"
                            : "none";

                    }
                );

            },

            error => {

                console.error(
                    "UNREAD ERROR:",
                    error
                );

            }
        );

}


/* =====================================================
   INBOX
===================================================== */

$("inboxBtn")
    .addEventListener(
        "click",
        loadInbox
    );


async function loadInbox(){

    try{

        const q =
            query(

                collection(
                    db,
                    "staffMessages"
                ),

                where(
                    "receiverId",
                    "==",
                    currentStaff.staffId
                )

            );


        const snap =
            await getDocs(
                q
            );


        const messages = [];


        snap.forEach(
            item => {

                messages.push({

                    id:
                        item.id,

                    ...item.data()

                });

            }
        );


        /*
         * Newest first.
         */

        messages.sort(
            (a,b) =>

                (
                    b.createdAt?.seconds ||
                    0
                )

                -

                (
                    a.createdAt?.seconds ||
                    0
                )

        );


        $("conversation")
            .classList
            .add("show");


        $("conversationTitle")
            .textContent =
            "📥 Inbox";


        $("conversationInfo")
            .textContent =
            "Received messages";


        $("messages")
            .innerHTML =

            messages.length

            ?

            messages.map(
                message => `

                <div class="msg">

                    <div
                        class="msg-bubble">

                        <div
                            class="msg-sender">

                            ${esc(
                                message.senderName ||
                                message.senderId
                            )}

                            ${
                                message.type ===
                                "all"

                                ? " • 📢 All Staff"

                                :

                                message.type ===
                                "department"

                                ? " • 🏢 Department"

                                : ""

                            }

                        </div>


                        <div>

                            ${esc(
                                message.message
                            )}

                        </div>


                        <div
                            class="msg-time">

                            ${esc(
                                formatTimestamp(
                                    message.createdAt
                                )
                            )}

                        </div>

                    </div>

                </div>

                `
            )
            .join("")

            :

            `
            <div class="empty">

                No received messages.

            </div>
            `;


        /*
         * Mark inbox messages
         * as read.
         */

        for(
            const message
            of messages
        ){

            if(
                message.isRead !==
                true
            ){

                try{

                    await updateDoc(

                        doc(
                            db,
                            "staffMessages",
                            message.id
                        ),

                        {
                            isRead:true
                        }

                    );

                }
                catch(error){

                    console.error(
                        error
                    );

                }

            }

        }

    }
    catch(error){

        console.error(
            "INBOX ERROR:",
            error
        );


        $("messages")
            .innerHTML =

            `
            <div class="empty">

                Unable to load inbox.

                <br><br>

                ${esc(
                    error.message
                )}

            </div>
            `;

    }

}

/* =====================================================
   DATE FORMAT
===================================================== */

function formatTimestamp(
    timestamp
){

    if(!timestamp){

        return "Just now";

    }


    try{

        const date =

            timestamp.toDate

            ?

            timestamp.toDate()

            :

            new Date(
                timestamp.seconds *
                1000
            );


        return date.toLocaleString(
            "en-IN",
            {

                day:
                    "2-digit",

                month:
                    "short",

                year:
                    "numeric",

                hour:
                    "2-digit",

                minute:
                    "2-digit"

            }
        );

    }
    catch(error){

        return "Just now";

    }

}
