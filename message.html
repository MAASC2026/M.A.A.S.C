<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Staff Messages</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f6f9;
    color:#222;
}

.header{
    background:#17365d;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h2{
    font-size:22px;
}

.staff-info{
    text-align:right;
    font-size:14px;
}

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    gap:10px;
    flex-wrap:wrap;
}

.tabs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.tab-btn{
    border:none;
    padding:11px 18px;
    border-radius:7px;
    cursor:pointer;
    background:#ddd;
    font-weight:bold;
}

.tab-btn.active{
    background:#17365d;
    color:white;
}

.new-btn{
    border:none;
    padding:12px 20px;
    background:#198754;
    color:white;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.unread-count{
    background:#dc3545;
    color:white;
    border-radius:20px;
    padding:3px 8px;
    font-size:11px;
    margin-left:4px;
}

.card{
    background:white;
    border-radius:10px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    overflow:hidden;
}

.message-item{
    padding:18px;
    border-bottom:1px solid #eee;
    cursor:pointer;
    transition:.2s;
}

.message-item:hover{
    background:#f8f9fa;
}

.message-item.unread{
    background:#eef5ff;
    border-left:5px solid #17365d;
}

.message-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
}

.message-name{
    font-weight:bold;
    font-size:16px;
}

.message-time{
    color:#777;
    font-size:12px;
    white-space:nowrap;
}

.message-preview{
    margin-top:7px;
    color:#555;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.unread-dot{
    display:inline-block;
    width:9px;
    height:9px;
    background:#dc3545;
    border-radius:50%;
    margin-right:6px;
}

.empty{
    padding:50px;
    text-align:center;
    color:#777;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:600px;
    background:white;
    border-radius:12px;
    padding:25px;
    max-height:90vh;
    overflow-y:auto;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.close{
    border:none;
    background:none;
    font-size:25px;
    cursor:pointer;
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:7px;
    margin-bottom:18px;
    font-size:14px;
}

textarea{
    min-height:150px;
    resize:vertical;
}

.send-btn{
    width:100%;
    padding:13px;
    border:none;
    background:#198754;
    color:white;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.detail-message{
    background:#f5f6f8;
    padding:18px;
    border-radius:8px;
    white-space:pre-wrap;
    line-height:1.6;
    margin:15px 0;
}

.detail-info{
    color:#666;
    font-size:13px;
    margin-bottom:8px;
}

.reply-btn{
    border:none;
    background:#17365d;
    color:white;
    padding:11px 18px;
    border-radius:7px;
    cursor:pointer;
}

.delete-btn{
    border:none;
    background:#dc3545;
    color:white;
    padding:11px 18px;
    border-radius:7px;
    cursor:pointer;
    margin-left:8px;
}

.loading{
    padding:30px;
    text-align:center;
}

.back-btn{
    border:none;
    background:#6c757d;
    color:white;
    padding:10px 16px;
    border-radius:7px;
    cursor:pointer;
    margin-bottom:15px;
}

@media(max-width:600px){

    .header{
        padding:15px;
    }

    .header h2{
        font-size:18px;
    }

    .message-row{
        flex-direction:column;
        gap:5px;
    }

    .message-time{
        white-space:normal;
    }
}
</style>
</head>

<body>

<div class="header">

    <div>
        <h2>✉ Staff Messages</h2>
    </div>

    <div class="staff-info">
        <div id="loggedStaffName">Loading...</div>
        <div id="loggedStaffId"></div>
    </div>

</div>


<div class="container">

    <div class="top-bar">

        <div class="tabs">

            <button
                class="tab-btn active"
                id="inboxBtn"
                onclick="showInbox()">
                📥 Inbox
                <span
                    class="unread-count"
                    id="unreadCount"
                    style="display:none;">
                    0
                </span>
            </button>

            <button
                class="tab-btn"
                id="sentBtn"
                onclick="showSent()">
                📤 Sent
            </button>

        </div>

        <button
            class="new-btn"
            onclick="openCompose()">
            ✍ New Message
        </button>

    </div>


    <div class="card">

        <div id="messageList">

            <div class="loading">
                Loading messages...
            </div>

        </div>

    </div>

</div>


<!-- COMPOSE MODAL -->

<div
    class="modal"
    id="composeModal">

    <div class="modal-box">

        <div class="modal-header">

            <h3>New Message</h3>

            <button
                class="close"
                onclick="closeCompose()">
                ×
            </button>

        </div>


        <form onsubmit="sendMessage(event)">

            <label>Select Staff</label>

            <select
                id="receiverSelect"
                required>

                <option value="">
                    Loading staff...
                </option>

            </select>


            <label>Message</label>

            <textarea
                id="messageText"
                placeholder="Type your message..."
                required></textarea>


            <button
                class="send-btn"
                type="submit">

                Send Message

            </button>

        </form>

    </div>

</div>


<!-- VIEW MESSAGE MODAL -->

<div
    class="modal"
    id="viewModal">

    <div class="modal-box">

        <div class="modal-header">

            <h3>Message</h3>

            <button
                class="close"
                onclick="closeView()">
                ×
            </button>

        </div>


        <div id="viewContent"></div>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    doc,
    getDoc,
    setDoc,
    updateDoc,
    deleteDoc,
    query,
    where,
    orderBy,
    onSnapshot,
    getDocs,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
   ===================================================== */

const firebaseConfig = {

   apiKey: "AIzaSyAIv3091VM-gkmdwEAn7OhXWd9Cm2zh2bo",
  authDomain: "maasc-2026.firebaseapp.com",
  projectId: "maasc-2026",
  storageBucket: "maasc-2026.appspot.com",
  messagingSenderId: "585813001586",
  appId: "1:585813001586:web:664e0e90ff0725d2e849eb"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =====================================================
   GLOBAL VARIABLES
   ===================================================== */

let currentUser = null;

let currentStaff = null;

let currentMode = "inbox";

let unsubscribeInbox = null;

let unsubscribeSent = null;

let allStaff = [];


/* =====================================================
   AUTH
   ===================================================== */

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        alert("Please login first.");

        return;

    }

    currentUser = user;

    await loadCurrentStaff();

    await loadAllStaff();

    showInbox();

});


/* =====================================================
   LOAD CURRENT STAFF
   ===================================================== */

async function loadCurrentStaff(){

    try{

        let staffId = "";

        /*
         * First try localStorage values used by
         * existing staff dashboards.
         */

        staffId =
            localStorage.getItem("staffId") ||
            localStorage.getItem("staffID") ||
            localStorage.getItem("staff_id") ||
            "";


        /*
         * If no staff ID is stored, use Firebase UID.
         */

        if(!staffId){

            staffId = currentUser.uid;

        }


        staffId = String(staffId)
            .trim()
            .toUpperCase();


        /*
         * Find staff document.
         */

        const staffRef =
            doc(db, "staff", staffId);

        const staffSnap =
            await getDoc(staffRef);


        if(staffSnap.exists()){

            const data = staffSnap.data();

            currentStaff = {

                staffId: staffId,

                name:
                    data.name ||
                    data.staffName ||
                    data.fullName ||
                    currentUser.displayName ||
                    staffId,

                email:
                    data.email ||
                    data.personalEmail ||
                    data.officialEmail ||
                    currentUser.email ||
                    ""

            };

        }
        else{

            /*
             * Fallback: search by Firebase UID/email.
             */

            const staffQuery =
                query(
                    collection(db,"staff"),
                    where("uid","==",currentUser.uid)
                );


            const result =
                await getDocs(staffQuery);


            if(!result.empty){

                const d =
                    result.docs[0];

                const data =
                    d.data();


                currentStaff = {

                    staffId:
                        String(
                            data.staffId ||
                            d.id
                        ).toUpperCase(),

                    name:
                        data.name ||
                        data.staffName ||
                        data.fullName ||
                        currentUser.displayName ||
                        d.id,

                    email:
                        data.email ||
                        data.personalEmail ||
                        data.officialEmail ||
                        currentUser.email ||
                        ""

                };

            }
            else{

                currentStaff = {

                    staffId: staffId,

                    name:
                        currentUser.displayName ||
                        staffId,

                    email:
                        currentUser.email ||
                        ""

                };

            }

        }


        document.getElementById(
            "loggedStaffName"
        ).textContent =
            currentStaff.name;


        document.getElementById(
            "loggedStaffId"
        ).textContent =
            currentStaff.staffId;


    }
    catch(error){

        console.error(
            "Staff loading error:",
            error
        );

        alert(
            "Unable to load staff details."
        );

    }

}


/* =====================================================
   LOAD ALL STAFF
   ===================================================== */

async function loadAllStaff(){

    try{

        const snapshot =
            await getDocs(
                collection(db,"staff")
            );


        allStaff = [];


        snapshot.forEach((staffDoc) => {

            const data =
                staffDoc.data();


            const staffId =
                String(
                    data.staffId ||
                    staffDoc.id ||
                    ""
                )
                .trim()
                .toUpperCase();


            if(!staffId) return;


            /*
             * Do not show current staff
             * in recipient list.
             */

            if(
                currentStaff &&
                staffId === currentStaff.staffId
            ){

                return;

            }


            allStaff.push({

                staffId: staffId,

                name:
                    data.name ||
                    data.staffName ||
                    data.fullName ||
                    staffId,

                department:
                    data.department ||
                    ""

            });

        });


        allStaff.sort(
            (a,b) =>
                a.name.localeCompare(b.name)
        );


        populateStaffSelect();

    }
    catch(error){

        console.error(
            "Staff list error:",
            error
        );

    }

}


/* =====================================================
   POPULATE STAFF SELECT
   ===================================================== */

function populateStaffSelect(){

    const select =
        document.getElementById(
            "receiverSelect"
        );


    select.innerHTML =
        '<option value="">Select staff</option>';


    allStaff.forEach(staff => {

        const option =
            document.createElement("option");


        option.value =
            staff.staffId;


        option.textContent =
            staff.name +
            " (" +
            staff.staffId +
            ")" +
            (
                staff.department
                    ? " - " + staff.department
                    : ""
            );


        select.appendChild(option);

    });

}


/* =====================================================
   INBOX
   ===================================================== */

window.showInbox = function(){

    currentMode = "inbox";


    document
        .getElementById("inboxBtn")
        .classList.add("active");


    document
        .getElementById("sentBtn")
        .classList.remove("active");


    if(unsubscribeSent){

        unsubscribeSent();

        unsubscribeSent = null;

    }


    if(!currentStaff) return;


    const messageList =
        document.getElementById(
            "messageList"
        );


    messageList.innerHTML =
        '<div class="loading">Loading inbox...</div>';


    const q =
        query(
            collection(db,"messages"),
            where(
                "receiverId",
                "==",
                currentStaff.staffId
            ),
            orderBy(
                "timestamp",
                "desc"
            )
        );


    if(unsubscribeInbox){

        unsubscribeInbox();

    }


    unsubscribeInbox =
        onSnapshot(
            q,
            (snapshot) => {

                const messages = [];


                snapshot.forEach(
                    messageDoc => {

                        const data =
                            messageDoc.data();


                        if(
                            data.deletedByReceiver === true
                        ){

                            return;

                        }


                        messages.push({

                            id:
                                messageDoc.id,

                            ...data

                        });

                    }
                );


                renderMessages(messages);

                updateUnreadCount(messages);

            },
            (error) => {

                console.error(
                    "Inbox error:",
                    error
                );


                messageList.innerHTML = `
                    <div class="empty">
                        Unable to load messages.<br><br>
                        ${error.message}
                    </div>
                `;

            }
        );

};


/* =====================================================
   SENT
   ===================================================== */

window.showSent = function(){

    currentMode = "sent";


    document
        .getElementById("sentBtn")
        .classList.add("active");


    document
        .getElementById("inboxBtn")
        .classList.remove("active");


    if(unsubscribeInbox){

        unsubscribeInbox();

        unsubscribeInbox = null;

    }


    if(!currentStaff) return;


    const messageList =
        document.getElementById(
            "messageList"
        );


    messageList.innerHTML =
        '<div class="loading">Loading sent messages...</div>';


    const q =
        query(
            collection(db,"messages"),
            where(
                "senderId",
                "==",
                currentStaff.staffId
            ),
            orderBy(
                "timestamp",
                "desc"
            )
        );


    if(unsubscribeSent){

        unsubscribeSent();

    }


    unsubscribeSent =
        onSnapshot(
            q,
            (snapshot) => {

                const messages = [];


                snapshot.forEach(
                    messageDoc => {

                        const data =
                            messageDoc.data();


                        if(
                            data.deletedBySender === true
                        ){

                            return;

                        }


                        messages.push({

                            id:
                                messageDoc.id,

                            ...data

                        });

                    }
                );


                renderMessages(messages);

            },
            (error) => {

                console.error(
                    "Sent messages error:",
                    error
                );


                messageList.innerHTML = `
                    <div class="empty">
                        Unable to load sent messages.<br><br>
                        ${error.message}
                    </div>
                `;

            }
        );

};


/* =====================================================
   RENDER MESSAGES
   ===================================================== */

function renderMessages(messages){

    const list =
        document.getElementById(
            "messageList"
        );


    if(messages.length === 0){

        list.innerHTML = `
            <div class="empty">
                ${
                    currentMode === "inbox"
                    ? "📭 No messages received."
                    : "📤 No sent messages."
                }
            </div>
        `;

        return;

    }


    /*
     * Always newest first.
     */

    messages.sort(
        (a,b) => {

            const ta =
                a.timestamp?.toMillis
                    ? a.timestamp.toMillis()
                    : 0;

            const tb =
                b.timestamp?.toMillis
                    ? b.timestamp.toMillis()
                    : 0;

            return tb - ta;

        }
    );


    list.innerHTML = "";


    messages.forEach(message => {

        const item =
            document.createElement("div");


        item.className =
            "message-item " +
            (
                currentMode === "inbox" &&
                message.read !== true
                    ? "unread"
                    : ""
            );


        const personName =
            currentMode === "inbox"
                ? message.senderName
                : message.receiverName;


        const time =
            formatTimestamp(
                message.timestamp
            );


        item.innerHTML = `

            <div class="message-row">

                <div class="message-name">

                    ${
                        currentMode === "inbox" &&
                        message.read !== true
                            ? '<span class="unread-dot"></span>'
                            : ''
                    }

                    ${escapeHTML(personName || "")}

                </div>

                <div class="message-time">
                    ${time}
                </div>

            </div>


            <div class="message-preview">

                ${escapeHTML(
                    message.message || ""
                )}

            </div>

        `;


        item.onclick = () => {

            openMessage(message);

        };


        list.appendChild(item);

    });

}


/* =====================================================
   UNREAD COUNT
   ===================================================== */

function updateUnreadCount(messages){

    const unread =
        messages.filter(
            message =>
                message.read !== true
        ).length;


    const count =
        document.getElementById(
            "unreadCount"
        );


    count.textContent =
        unread;


    count.style.display =
        unread > 0
            ? "inline-block"
            : "none";

}


/* =====================================================
   OPEN MESSAGE
   ===================================================== */

async function openMessage(message){

    /*
     * Mark received message as read.
     */

    if(
        currentMode === "inbox" &&
        message.read !== true
    ){

        try{

            await updateDoc(
                doc(
                    db,
                    "messages",
                    message.id
                ),
                {
                    read: true,
                    readAt: serverTimestamp()
                }
            );

        }
        catch(error){

            console.error(
                "Read update error:",
                error
            );

        }

    }


    const viewContent =
        document.getElementById(
            "viewContent"
        );


    const personLabel =
        currentMode === "inbox"
            ? "From"
            : "To";


    viewContent.innerHTML = `

        <div class="detail-info">
            <strong>${personLabel}:</strong>
            ${escapeHTML(
                currentMode === "inbox"
                    ? message.senderName || ""
                    : message.receiverName || ""
            )}
        </div>

        <div class="detail-info">
            <strong>Staff ID:</strong>
            ${escapeHTML(
                currentMode === "inbox"
                    ? message.senderId || ""
                    : message.receiverId || ""
            )}
        </div>

        <div class="detail-info">
            <strong>Time:</strong>
            ${formatTimestamp(message.timestamp)}
        </div>

        <div class="detail-message">
            ${escapeHTML(message.message || "")}
        </div>

        <div>

            ${
                currentMode === "inbox"
                ? `
                    <button
                        class="reply-btn"
                        onclick='replyToMessage(
                            ${JSON.stringify(
                                message.senderId
                            )},
                            ${JSON.stringify(
                                message.senderName
                            )}
                        )'>

                        ↩ Reply

                    </button>
                `
                : ""
            }

            <button
                class="delete-btn"
                onclick='deleteMessage(
                    ${JSON.stringify(message.id)}
                )'>

                🗑 Delete

            </button>

        </div>

    `;


    document
        .getElementById("viewModal")
        .classList.add("show");

}


/* =====================================================
   REPLY
   ===================================================== */

window.replyToMessage = function(
    staffId,
    staffName
){

    closeView();

    openCompose();


    setTimeout(() => {

        const select =
            document.getElementById(
                "receiverSelect"
            );


        select.value =
            staffId;


        /*
         * If the staff was not found in
         * the current list, create it.
         */

        if(!select.value){

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                staffId;


            option.textContent =
                staffName +
                " (" +
                staffId +
                ")";


            select.appendChild(option);


            select.value =
                staffId;

        }


        document
            .getElementById(
                "messageText"
            )
            .focus();

    },100);

};


/* =====================================================
   SEND MESSAGE
   ===================================================== */

window.sendMessage = async function(event){

    event.preventDefault();


    if(!currentStaff){

        alert(
            "Staff details are not loaded."
        );

        return;

    }


    const receiverId =
        document
            .getElementById(
                "receiverSelect"
            )
            .value;


    const message =
        document
            .getElementById(
                "messageText"
            )
            .value
            .trim();


    if(!receiverId){

        alert(
            "Please select a staff member."
        );

        return;

    }


    if(!message){

        alert(
            "Please type a message."
        );

        return;

    }


    const receiver =
        allStaff.find(
            staff =>
                staff.staffId === receiverId
        );


    try{

        await addDoc(
            collection(
                db,
                "messages"
            ),
            {

                senderId:
                    currentStaff.staffId,

                senderName:
                    currentStaff.name,

                senderEmail:
                    currentStaff.email,

                receiverId:
                    receiverId,

                receiverName:
                    receiver
                        ? receiver.name
                        : receiverId,

                message:
                    message,

                timestamp:
                    serverTimestamp(),

                read:
                    false,

                deletedBySender:
                    false,

                deletedByReceiver:
                    false

            }
        );


        alert(
            "Message sent successfully."
        );


        document
            .getElementById(
                "messageText"
            )
            .value = "";


        document
            .getElementById(
                "receiverSelect"
            )
            .value = "";


        closeCompose();


    }
    catch(error){

        console.error(
            "Send message error:",
            error
        );


        alert(
            "Message could not be sent.\n\n" +
            error.message
        );

    }

};


/* =====================================================
   DELETE MESSAGE
   ===================================================== */

window.deleteMessage = async function(
    messageId
){

    if(
        !confirm(
            "Delete this message?"
        )
    ){

        return;

    }


    try{

        const messageRef =
            doc(
                db,
                "messages",
                messageId
            );


        const snapshot =
            await getDoc(
                messageRef
            );


        if(!snapshot.exists()){

            return;

        }


        const data =
            snapshot.data();


        if(
            currentMode === "inbox"
        ){

            await updateDoc(
                messageRef,
                {
                    deletedByReceiver:
                        true
                }
            );

        }
        else{

            await updateDoc(
                messageRef,
                {
                    deletedBySender:
                        true
                }
            );

        }


        closeView();

    }
    catch(error){

        console.error(
            "Delete error:",
            error
        );


        alert(
            "Unable to delete message."
        );

    }

};

/* =====================================================
   FORMAT TIME
   ===================================================== */

function formatTimestamp(timestamp){

    if(!timestamp){

        return "Just now";

    }


    let date;


    if(
        typeof timestamp.toDate === "function"
    ){

        date =
            timestamp.toDate();

    }
    else{

        date =
            new Date(timestamp);

    }


    if(isNaN(date.getTime())){

        return "Just now";

    }


    return date.toLocaleString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =====================================================
   HTML ESCAPE
   ===================================================== */

function escapeHTML(value){

    return String(value || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
