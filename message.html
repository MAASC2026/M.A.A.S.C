<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Staff Messaging</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
    height:100vh;
}

.app{
    height:100vh;
    display:flex;
    background:#fff;
}

/* LEFT */

.sidebar{
    width:320px;
    border-right:1px solid #ddd;
    display:flex;
    flex-direction:column;
}

.sidebar-header{
    padding:18px;
    border-bottom:1px solid #ddd;
}

.sidebar-header h2{
    font-size:21px;
    color:#1e3a8a;
    margin-bottom:12px;
}

.search{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:8px;
    outline:none;
}

.staff-list{
    flex:1;
    overflow-y:auto;
}

.staff{
    padding:13px 15px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
    border-bottom:1px solid #f1f1f1;
}

.staff:hover{
    background:#f5f8ff;
}

.staff.active{
    background:#eaf1ff;
}

.avatar{
    width:42px;
    height:42px;
    min-width:42px;
    border-radius:50%;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:13px;
}

.staff-info{
    min-width:0;
    flex:1;
}

.staff-name{
    font-size:14px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.staff-id{
    font-size:11px;
    color:#777;
    margin-top:3px;
}

.unread{
    width:9px;
    height:9px;
    background:#ef4444;
    border-radius:50%;
}

/* CHAT */

.chat{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.chat-header{
    height:70px;
    padding:12px 18px;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    gap:12px;
}

.chat-header-info{
    display:none;
}

.chat-name{
    font-weight:bold;
    font-size:15px;
}

.chat-id{
    font-size:11px;
    color:#777;
    margin-top:3px;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
    background:#f7f9fc;
}

.empty{
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:#888;
}

.empty-icon{
    font-size:50px;
    margin-bottom:10px;
}

.message-row{
    display:flex;
    margin-bottom:12px;
}

.message-row.sent{
    justify-content:flex-end;
}

.message-row.received{
    justify-content:flex-start;
}

.message{
    max-width:65%;
    padding:9px 12px;
    border-radius:12px;
    font-size:13px;
    line-height:1.4;
}

.sent .message{
    background:#2563eb;
    color:white;
    border-bottom-right-radius:3px;
}

.received .message{
    background:white;
    color:#222;
    border:1px solid #ddd;
    border-bottom-left-radius:3px;
}

.message-time{
    font-size:9px;
    margin-top:4px;
    text-align:right;
    opacity:.7;
}

/* INPUT */

.input-area{
    display:none;
    padding:12px;
    border-top:1px solid #ddd;
    background:white;
    gap:8px;
}

.message-input{
    flex:1;
    height:45px;
    resize:none;
    border:1px solid #ccc;
    border-radius:8px;
    padding:12px;
    outline:none;
    font-size:13px;
}

.send{
    width:50px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:19px;
    cursor:pointer;
}

.send:hover{
    background:#1d4ed8;
}

.send:disabled{
    opacity:.5;
}

/* MOBILE */

@media(max-width:700px){

    .sidebar{
        width:100%;
    }

    .chat{
        display:none;
    }

    .app.chat-open .sidebar{
        display:none;
    }

    .app.chat-open .chat{
        display:flex;
    }

    .message{
        max-width:82%;
    }
}
</style>
</head>

<body>

<div class="app" id="app">

    <!-- STAFF LIST -->

    <div class="sidebar">

        <div class="sidebar-header">

            <h2>💬 Messages</h2>

            <input
                id="search"
                class="search"
                type="text"
                placeholder="Search staff..."
            >

        </div>

        <div
            id="staffList"
            class="staff-list"
        >

            <div style="
                padding:25px;
                text-align:center;
                color:#888;
                font-size:13px;
            ">
                Loading staff...
            </div>

        </div>

    </div>


    <!-- CHAT -->

    <div class="chat">

        <div class="chat-header">

            <div
                id="chatAvatar"
                class="avatar"
            >
                ?
            </div>

            <div
                id="chatHeaderInfo"
                class="chat-header-info"
            >

                <div
                    id="chatName"
                    class="chat-name"
                >
                    Staff
                </div>

                <div
                    id="chatId"
                    class="chat-id"
                >
                    -
                </div>

            </div>

        </div>


        <div
            id="messages"
            class="messages"
        >

            <div class="empty">

                <div>

                    <div class="empty-icon">
                        💬
                    </div>

                    <b>
                        Select a staff member
                    </b>

                    <div style="
                        font-size:12px;
                        margin-top:5px;
                    ">
                        Start your conversation
                    </div>

                </div>

            </div>

        </div>


        <div
            id="inputArea"
            class="input-area"
        >

            <textarea
                id="messageInput"
                class="message-input"
                placeholder="Type a message..."
            ></textarea>

            <button
                id="sendBtn"
                class="send"
            >
                ➤
            </button>

        </div>

    </div>

</div>


<script type="module">

/* ==========================================
   FIREBASE
========================================== */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    query,
    where,
    orderBy,
    onSnapshot,
    serverTimestamp,
    updateDoc,
    doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyAIv3091VM-gkmdwEAn7OhXWd9Cm2zh2bo",

    authDomain:
        "maasc-2026.firebaseapp.com",

    projectId:
        "maasc-2026",

    storageBucket:
        "maasc-2026.appspot.com",

    messagingSenderId:
        "585813001586",

    appId:
        "1:585813001586:web:664e0e90ff0725d2e849eb"
};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* ==========================================
   VARIABLES
========================================== */

let currentUser = null;
let currentStaff = null;

let staffList = [];

let selectedStaff = null;

let unsubscribeMessages = null;


/* ==========================================
   AUTH
========================================== */

onAuthStateChanged(
    auth,
    async user => {

        /*
           IMPORTANT:

           No redirect here.

           Existing ERP login is used.
        */

        if(!user){

            document.getElementById(
                "staffList"
            ).innerHTML = `

                <div style="
                    padding:25px;
                    text-align:center;
                    color:#888;
                ">
                    Please login to ERP first.
                </div>

            `;

            return;
        }


        currentUser = user;

        console.log(
            "CURRENT USER:",
            user.uid,
            user.email
        );


        await loadCurrentStaff();

    }
);


/* ==========================================
   LOAD CURRENT STAFF
========================================== */

async function loadCurrentStaff(){

    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "staff"
                )
            );


        let found = null;


        snapshot.forEach(
            item => {

                const data =
                    item.data();


                const staffId =
                    String(
                        data.staffId ||
                        data.staffID ||
                        item.id ||
                        ""
                    ).trim();


                const uid =
                    String(
                        data.uid ||
                        data.authUid ||
                        data.userId ||
                        ""
                    ).trim();


                const email =
                    String(
                        data.email ||
                        data.officialEmail ||
                        data.officialMail ||
                        ""
                    )
                    .trim()
                    .toLowerCase();


                const loginEmail =
                    String(
                        currentUser.email || ""
                    )
                    .trim()
                    .toLowerCase();


                /* UID MATCH */

                if(
                    uid &&
                    uid === currentUser.uid
                ){

                    found = {
                        docId:item.id,
                        ...data,
                        staffId
                    };

                }


                /* DOCUMENT ID MATCH */

                if(
                    item.id === currentUser.uid
                ){

                    found = {
                        docId:item.id,
                        ...data,
                        staffId
                    };

                }


                /* EMAIL MATCH */

                if(
                    email &&
                    loginEmail &&
                    email === loginEmail
                ){

                    found = {
                        docId:item.id,
                        ...data,
                        staffId
                    };

                }

            }
        );


        if(!found){

            console.error(
                "CURRENT STAFF NOT FOUND"
            );

            document.getElementById(
                "staffList"
            ).innerHTML = `

                <div style="
                    padding:25px;
                    text-align:center;
                    color:#888;
                ">
                    Staff profile not found.
                </div>

            `;

            return;

        }


        currentStaff = found;


        console.log(
            "CURRENT STAFF:",
            currentStaff
        );


        await loadStaff();

    }
    catch(error){

        console.error(
            "STAFF ERROR:",
            error
        );

    }

}


/* ==========================================
   CURRENT STAFF ID
========================================== */

function getMyStaffId(){

    return String(

        currentStaff.staffId ||
        currentStaff.staffID ||
        currentStaff.docId ||
        currentUser.uid

    ).trim();

}


/* ==========================================
   CURRENT STAFF NAME
========================================== */

function getMyName(){

    return (

        currentStaff.name ||
        currentStaff.staffName ||
        currentStaff.fullName ||
        currentStaff.displayName ||
        getMyStaffId()

    );

}


/* ==========================================
   LOAD STAFF LIST
========================================== */

async function loadStaff(){

    const snapshot =
        await getDocs(
            collection(
                db,
                "staff"
            )
        );


    staffList = [];


    snapshot.forEach(
        item => {

            const data =
                item.data();


            const id =
                String(
                    data.staffId ||
                    data.staffID ||
                    item.id
                ).trim();


            /*
               Don't show current staff
            */

            if(
                id === getMyStaffId()
            ){

                return;

            }


            staffList.push({

                docId:item.id,

                staffId:id,

                ...data

            });

        }
    );


    staffList.sort(
        (a,b) => {

            return getStaffName(a)
                .localeCompare(
                    getStaffName(b)
                );

        }
    );


    renderStaff();

}


/* ==========================================
   STAFF NAME
========================================== */

function getStaffName(staff){

    if(!staff){

        return "";

    }


    return (

        staff.name ||
        staff.staffName ||
        staff.fullName ||
        staff.displayName ||
        staff.staffId ||
        ""

    );

}


/* ==========================================
   INITIALS
========================================== */

function initials(name){

    const parts =
        String(name)
        .trim()
        .split(/\s+/);


    if(parts.length === 1){

        return parts[0]
            .substring(0,2)
            .toUpperCase();

    }


    return (
        parts[0][0] +
        parts[parts.length - 1][0]
    ).toUpperCase();

}


/* ==========================================
   RENDER STAFF
========================================== */

function renderStaff(){

    const container =
        document.getElementById(
            "staffList"
        );


    container.innerHTML = "";


    if(staffList.length === 0){

        container.innerHTML = `

            <div style="
                padding:25px;
                text-align:center;
                color:#888;
            ">
                No other staff found.
            </div>

        `;

        return;

    }


    staffList.forEach(
        staff => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "staff";


            item.dataset.staffId =
                staff.staffId;


            item.innerHTML = `

                <div class="avatar">

                    ${escapeHtml(
                        initials(
                            getStaffName(staff)
                        )
                    )}

                </div>


                <div class="staff-info">

                    <div class="staff-name">

                        ${escapeHtml(
                            getStaffName(staff)
                        )}

                    </div>

                    <div class="staff-id">

                        ${escapeHtml(
                            staff.staffId
                        )}

                    </div>

                </div>

            `;


            item.onclick =
                () => {

                    openChat(
                        staff
                    );

                };


            container.appendChild(
                item
            );

        }
    );

}


/* ==========================================
   SEARCH
========================================== */

document.getElementById(
    "search"
).addEventListener(
    "input",
    function(){

        const value =
            this.value
            .toLowerCase()
            .trim();


        document
            .querySelectorAll(
                ".staff"
            )
            .forEach(
                item => {

                    const text =
                        item.textContent
                        .toLowerCase();


                    item.style.display =
                        !value ||
                        text.includes(value)
                        ?
                        "flex"
                        :
                        "none";

                }
            );

    }
);


/* ==========================================
   OPEN CHAT
========================================== */

function openChat(staff){

    selectedStaff =
        staff;


    document
        .querySelectorAll(
            ".staff"
        )
        .forEach(
            item => {

                item.classList.remove(
                    "active"
                );

            }
        );


    const selected =
        document.querySelector(
            `[data-staff-id="${CSS.escape(
                staff.staffId
            )}"]`
        );


    if(selected){

        selected.classList.add(
            "active"
        );

    }


    const name =
        getStaffName(
            staff
        );


    document.getElementById(
        "chatAvatar"
    ).textContent =
        initials(name);


    document.getElementById(
        "chatName"
    ).textContent =
        name;


    document.getElementById(
        "chatId"
    ).textContent =
        staff.staffId;


    document.getElementById(
        "chatHeaderInfo"
    ).style.display =
        "block";


    document.getElementById(
        "inputArea"
    ).style.display =
        "flex";


    document.getElementById(
        "app"
    ).classList.add(
        "chat-open"
    );


    loadMessages();

}


/* ==========================================
   LOAD MESSAGES
========================================== */

function loadMessages(){

    if(
        !selectedStaff ||
        !currentStaff
    ){

        return;

    }


    if(
        unsubscribeMessages
    ){

        unsubscribeMessages();

    }


    const myId =
        getMyStaffId();


    const otherId =
        selectedStaff.staffId;


    /*
       We listen to messages where
       current staff is sender.
    */

    const sentQuery =
        query(
            collection(
                db,
                "messages"
            ),
            where(
                "senderId",
                "==",
                myId
            ),
            where(
                "receiverId",
                "==",
                otherId
            )
        );


    const receivedQuery =
        query(
            collection(
                db,
                "messages"
            ),
            where(
                "senderId",
                "==",
                otherId
            ),
            where(
                "receiverId",
                "==",
                myId
            )
        );


    let sent = [];
    let received = [];


    let firstLoad = true;


    function render(){

        const all = [
            ...sent,
            ...received
        ];


        all.sort(
            (a,b) => {

                return getTime(a.timestamp)
                    -
                    getTime(b.timestamp);

            }
        );


        renderMessages(
            all
        );


        /*
           Mark received messages read
        */

        if(!firstLoad){

            markMessagesRead(
                received
            );

        }

        firstLoad = false;

    }


    let unsubscribe1 =
        onSnapshot(
            sentQuery,
            snapshot => {

                sent =
                    snapshot.docs.map(
                        d => ({
                            id:d.id,
                            ...d.data()
                        })
                    );


                render();

            },
            error => {

                console.error(
                    "SENT QUERY ERROR:",
                    error
                );

            }
        );


    let unsubscribe2 =
        onSnapshot(
            receivedQuery,
            snapshot => {

                received =
                    snapshot.docs.map(
                        d => ({
                            id:d.id,
                            ...d.data()
                        })
                    );


                render();

            },
            error => {

                console.error(
                    "RECEIVED QUERY ERROR:",
                    error
                );

            }
        );


    unsubscribeMessages =
        () => {

            unsubscribe1();
            unsubscribe2();

        };

}


/* ==========================================
   RENDER MESSAGES
========================================== */

function renderMessages(all){

    const container =
        document.getElementById(
            "messages"
        );


    container.innerHTML = "";


    if(all.length === 0){

        container.innerHTML = `

            <div class="empty">

                <div>

                    <div class="empty-icon">
                        💬
                    </div>

                    <b>
                        No messages yet
                    </b>

                    <div style="
                        font-size:12px;
                        margin-top:5px;
                    ">
                        Send a message to start.
                    </div>

                </div>

            </div>

        `;

        return;

    }


    all.forEach(
        message => {

            const isSent =
                message.senderId ===
                getMyStaffId();


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "message-row " +
                (
                    isSent
                    ?
                    "sent"
                    :
                    "received"
                );


            const bubble =
                document.createElement(
                    "div"
                );


            bubble.className =
                "message";


            const text =
                escapeHtml(
                    message.message || ""
                )
                .replace(
                    /\n/g,
                    "<br>"
                );


            bubble.innerHTML = `

                <div>
                    ${text}
                </div>

                <div class="message-time">

                    ${formatTime(
                        message.timestamp
                    )}

                    ${
                        isSent
                        ?
                        (
                            message.read
                            ?
                            " ✓✓"
                            :
                            " ✓"
                        )
                        :
                        ""
                    }

                </div>

            `;


            row.appendChild(
                bubble
            );


            container.appendChild(
                row
            );

        }
    );


    container.scrollTop =
        container.scrollHeight;

}


/* ==========================================
   SEND
========================================== */

async function sendMessage(){

    if(
        !selectedStaff
    ){

        return;

    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if(!text){

        return;

    }


    const button =
        document.getElementById(
            "sendBtn"
        );


    button.disabled = true;


    try{

        await addDoc(
            collection(
                db,
                "messages"
            ),
            {

                senderId:
                    getMyStaffId(),

                senderName:
                    getMyName(),

                receiverId:
                    selectedStaff.staffId,

                receiverName:
                    getStaffName(
                        selectedStaff
                    ),

                message:
                    text,

                read:
                    false,

                timestamp:
                    serverTimestamp()

            }
        );


        input.value = "";


    }
    catch(error){

        console.error(
            "MESSAGE SEND ERROR:",
            error
        );


        alert(
            "Message could not be sent.\n\n" +
            error.message
        );

    }
    finally{

        button.disabled = false;

        input.focus();

    }

}


/* ==========================================
   SEND BUTTON
========================================== */

document.getElementById(
    "sendBtn"
).addEventListener(
    "click",
    sendMessage
);


/* ==========================================
   ENTER TO SEND
========================================== */

document.getElementById(
    "messageInput"
).addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* ==========================================
   MARK READ
========================================== */

async function markMessagesRead(
    messages
){

    for(
        const message
        of messages
    ){

        if(
            message.read === true
        ){

            continue;

        }


        try{

            await updateDoc(
                doc(
                    db,
                    "messages",
                    message.id
                ),
                {
                    read:true
                }
            );

        }
        catch(error){

            console.error(
                "READ ERROR:",
                error
            );

        }

    }

}


/* ==========================================
   HELPERS
========================================== */

function getTime(timestamp){

    if(!timestamp){

        return 0;

    }


    if(
        typeof timestamp.toMillis ===
        "function"
    ){

        return timestamp.toMillis();

    }


    if(timestamp.seconds){

        return timestamp.seconds * 1000;

    }


    return 0;

}


function formatTime(timestamp){

    const time =
        getTime(
            timestamp
        );


    if(!time){

        return "...";

    }


    return new Date(
        time
    ).toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

</script>

</body>
</html>
