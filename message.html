<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Staff Messaging | MAASC ERP</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #f4f6f9;
    color: #1f2937;
    height: 100vh;
    overflow: hidden;
}

/* =========================
   TOP BAR
========================= */

.topbar {
    height: 65px;
    background: #172554;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-icon {
    width: 40px;
    height: 40px;
    background: #2563eb;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
}

.brand h2 {
    font-size: 20px;
}

.staff-info {
    display: flex;
    align-items: center;
    gap: 12px;
}

.staff-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #2563eb;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.staff-details {
    text-align: right;
}

.staff-name {
    font-weight: bold;
    font-size: 14px;
}

.staff-id {
    font-size: 12px;
    opacity: .8;
}

/* =========================
   MAIN
========================= */

.main {
    height: calc(100vh - 65px);
    display: flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 240px;
    background: white;
    border-right: 1px solid #e5e7eb;
    padding: 20px 14px;
}

.sidebar-title {
    font-size: 12px;
    color: #9ca3af;
    font-weight: bold;
    margin: 5px 12px 12px;
    text-transform: uppercase;
}

.menu-item {
    height: 45px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 13px;
    border-radius: 9px;
    cursor: pointer;
    margin-bottom: 5px;
    color: #4b5563;
}

.menu-item:hover {
    background: #eff6ff;
    color: #2563eb;
}

.menu-item.active {
    background: #dbeafe;
    color: #1d4ed8;
    font-weight: bold;
}

.menu-icon {
    width: 22px;
    text-align: center;
}

.unread-badge {
    margin-left: auto;
    background: #ef4444;
    color: white;
    min-width: 22px;
    height: 22px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
}

/* =========================
   CONTENT
========================= */

.content {
    flex: 1;
    padding: 20px;
    min-width: 0;
}

.page-header {
    height: 55px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
}

.page-title {
    font-size: 24px;
    font-weight: bold;
}

.page-subtitle {
    color: #6b7280;
    font-size: 13px;
    margin-top: 4px;
}

.compose-btn {
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 11px 18px;
    cursor: pointer;
    font-weight: bold;
}

.compose-btn:hover {
    background: #1d4ed8;
}

/* =========================
   MESSAGING AREA
========================= */

.messaging-container {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    height: calc(100vh - 160px);
    display: flex;
    overflow: hidden;
}

/* =========================
   CONVERSATION LIST
========================= */

.conversation-list {
    width: 330px;
    border-right: 1px solid #e5e7eb;
    display: flex;
    flex-direction: column;
}

.search-box {
    padding: 14px;
    border-bottom: 1px solid #e5e7eb;
}

.search-box input {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    outline: none;
    font-size: 13px;
}

.search-box input:focus {
    border-color: #2563eb;
}

.conversation-items {
    overflow-y: auto;
    flex: 1;
}

.conversation {
    padding: 13px;
    border-bottom: 1px solid #f0f0f0;
    cursor: pointer;
    display: flex;
    gap: 11px;
}

.conversation:hover {
    background: #f8fafc;
}

.conversation.active {
    background: #eff6ff;
}

.avatar {
    width: 43px;
    height: 43px;
    flex-shrink: 0;
    background: #dbeafe;
    color: #1d4ed8;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.conversation-body {
    min-width: 0;
    flex: 1;
}

.conversation-top {
    display: flex;
    justify-content: space-between;
    gap: 8px;
}

.conversation-name {
    font-size: 14px;
    font-weight: bold;
}

.conversation-time {
    font-size: 10px;
    color: #9ca3af;
    white-space: nowrap;
}

.conversation-preview {
    color: #6b7280;
    font-size: 12px;
    margin-top: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.conversation.unread .conversation-name {
    color: #111827;
}

.conversation.unread .conversation-preview {
    color: #374151;
    font-weight: bold;
}

/* =========================
   CHAT AREA
========================= */

.chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.chat-header {
    height: 65px;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    padding: 0 18px;
}

.chat-user-avatar {
    width: 42px;
    height: 42px;
    background: #dbeafe;
    color: #1d4ed8;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    margin-right: 12px;
}

.chat-user-name {
    font-weight: bold;
    font-size: 15px;
}

.chat-user-department {
    color: #6b7280;
    font-size: 11px;
    margin-top: 3px;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    background: #f8fafc;
}

.empty-chat {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9ca3af;
    text-align: center;
}

.empty-chat-icon {
    font-size: 45px;
    margin-bottom: 10px;
}

.message-row {
    display: flex;
    margin-bottom: 13px;
}

.message-row.sent {
    justify-content: flex-end;
}

.message {
    max-width: 70%;
    padding: 10px 13px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.5;
}

.message.received {
    background: white;
    border: 1px solid #e5e7eb;
    border-bottom-left-radius: 3px;
}

.message.sent {
    background: #2563eb;
    color: white;
    border-bottom-right-radius: 3px;
}

.message-time {
    font-size: 9px;
    margin-top: 4px;
    opacity: .65;
    text-align: right;
}

.message-date {
    text-align: center;
    margin: 15px 0;
    font-size: 10px;
    color: #9ca3af;
}

/* =========================
   MESSAGE INPUT
========================= */

.message-input-area {
    border-top: 1px solid #e5e7eb;
    padding: 12px;
    display: flex;
    gap: 9px;
    background: white;
}

.message-input {
    flex: 1;
    resize: none;
    min-height: 42px;
    max-height: 100px;
    padding: 11px 13px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    outline: none;
    font-size: 13px;
}

.message-input:focus {
    border-color: #2563eb;
}

.send-btn {
    width: 48px;
    border: none;
    background: #2563eb;
    color: white;
    border-radius: 9px;
    cursor: pointer;
    font-size: 18px;
}

.send-btn:hover {
    background: #1d4ed8;
}

/* =========================
   MODAL
========================= */

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.modal-overlay.show {
    display: flex;
}

.modal {
    width: 500px;
    max-width: calc(100% - 30px);
    background: white;
    border-radius: 13px;
    box-shadow: 0 20px 50px rgba(0,0,0,.2);
    overflow: hidden;
}

.modal-header {
    padding: 17px 20px;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-title {
    font-size: 17px;
    font-weight: bold;
}

.close-btn {
    border: none;
    background: none;
    font-size: 22px;
    cursor: pointer;
    color: #6b7280;
}

.modal-body {
    padding: 20px;
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 7px;
    color: #374151;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 11px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    outline: none;
    font-size: 13px;
}

.form-group textarea {
    min-height: 120px;
    resize: vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    border-color: #2563eb;
}

.modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 9px;
    padding: 15px 20px;
    border-top: 1px solid #e5e7eb;
}

.cancel-btn {
    padding: 10px 16px;
    border: 1px solid #d1d5db;
    background: white;
    border-radius: 8px;
    cursor: pointer;
}

.send-message-btn {
    padding: 10px 18px;
    border: none;
    background: #2563eb;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

/* =========================
   LOADING
========================= */

.loading {
    padding: 25px;
    text-align: center;
    color: #9ca3af;
    font-size: 13px;
}

/* =========================
   TOAST
========================= */

.toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: #111827;
    color: white;
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
    z-index: 2000;
    box-shadow: 0 5px 20px rgba(0,0,0,.2);
}

.toast.show {
    display: block;
}

/* =========================
   MOBILE
========================= */

@media(max-width: 850px) {

    .sidebar {
        display: none;
    }

    .conversation-list {
        width: 280px;
    }

    .message {
        max-width: 85%;
    }
}

@media(max-width: 600px) {

    body {
        overflow: auto;
    }

    .main {
        height: calc(100vh - 65px);
    }

    .content {
        padding: 10px;
    }

    .page-title {
        font-size: 20px;
    }

    .staff-details {
        display: none;
    }

    .messaging-container {
        height: calc(100vh - 135px);
    }

    .conversation-list {
        width: 100%;
    }

    .chat-area {
        display: none;
    }

    .messaging-container.chat-open .conversation-list {
        display: none;
    }

    .messaging-container.chat-open .chat-area {
        display: flex;
        width: 100%;
    }

    .back-mobile {
        display: block !important;
    }
}

.back-mobile {
    display: none;
    border: none;
    background: none;
    font-size: 20px;
    margin-right: 10px;
    cursor: pointer;
}
</style>
</head>

<!-- =========================
     FIREBASE
========================= -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    doc,
    getDoc,
    getDocs,
    addDoc,
    updateDoc,
    query,
    where,
    orderBy,
    onSnapshot,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
   USE THE SAME CONFIG FROM YOUR EXISTING ERP
===================================================== */

const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain: "YOUR_PROJECT.firebaseapp.com",

    projectId: "YOUR_PROJECT_ID",

    storageBucket: "YOUR_PROJECT.firebasestorage.app",

    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",

    appId: "YOUR_APP_ID"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentUser = null;

let currentStaff = null;

let allStaff = [];

let allMessages = [];

let selectedStaffId = null;

let selectedConversationId = null;

let unsubscribeMessages = null;


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        showToast("Please login first.");

        setTimeout(() => {

            window.location.href = "login.html";

        }, 1200);

        return;

    }

    currentUser = user;

    await loadCurrentStaff();

});


/* =====================================================
   LOAD CURRENT STAFF
===================================================== */

async function loadCurrentStaff() {

    try {

        /*
         * First try Firebase Auth UID as document ID.
         */

        let staffDoc = await getDoc(
            doc(db, "staff", currentUser.uid)
        );


        /*
         * If not found, search by email.
         */

        if (!staffDoc.exists() && currentUser.email) {

            const q = query(
                collection(db, "staff"),
                where("email", "==", currentUser.email)
            );

            const snapshot = await getDocs(q);

            if (!snapshot.empty) {

                staffDoc = snapshot.docs[0];

            }

        }


        /*
         * If still not found, search official email.
         */

        if (!staffDoc.exists() && currentUser.email) {

            const q2 = query(
                collection(db, "staff"),
                where(
                    "officialEmail",
                    "==",
                    currentUser.email
                )
            );

            const snapshot2 = await getDocs(q2);

            if (!snapshot2.empty) {

                staffDoc = snapshot2.docs[0];

            }

        }


        if (!staffDoc.exists()) {

            console.error(
                "STAFF PROFILE NOT FOUND"
            );

            showToast(
                "Staff profile not found."
            );

            return;

        }


        currentStaff = {

            id: staffDoc.id,

            ...staffDoc.data()

        };


        console.log(
            "CURRENT STAFF:",
            currentStaff
        );


        updateStaffHeader();

        await loadAllStaff();

        listenForMessages();

    }

    catch(error) {

        console.error(
            "STAFF LOAD ERROR:",
            error
        );

        showToast(
            "Unable to load staff details."
        );

    }

}


/* =====================================================
   UPDATE HEADER
===================================================== */

function updateStaffHeader() {

    const name =
        currentStaff.name ||
        currentStaff.staffName ||
        currentStaff.displayName ||
        currentStaff.staffId ||
        "Staff";


    const staffId =
        currentStaff.staffId ||
        currentStaff.id ||
        "---";


    document.getElementById(
        "topStaffName"
    ).textContent = name;


    document.getElementById(
        "topStaffId"
    ).textContent = staffId;


    document.getElementById(
        "topAvatar"
    ).textContent =
        getInitials(name);

}


/* =====================================================
   LOAD ALL STAFF
===================================================== */

async function loadAllStaff() {

    try {

        const snapshot = await getDocs(
            collection(db, "staff")
        );


        allStaff = [];


        snapshot.forEach(item => {

            const data = item.data();

            /*
             * Do not include current logged-in staff.
             */

            if (
                item.id !== currentStaff.id &&
                data.staffId !== currentStaff.staffId
            ) {

                allStaff.push({

                    id: item.id,

                    ...data

                });

            }

        });


        allStaff.sort((a, b) => {

            const nameA =
                String(
                    a.name ||
                    a.staffName ||
                    ""
                ).toLowerCase();

            const nameB =
                String(
                    b.name ||
                    b.staffName ||
                    ""
                ).toLowerCase();

            return nameA.localeCompare(nameB);

        });


        populateStaffDropdown();

    }

    catch(error) {

        console.error(
            "STAFF DIRECTORY ERROR:",
            error
        );

    }

}


/* =====================================================
   STAFF DROPDOWN
===================================================== */

function populateStaffDropdown(
    search = ""
) {

    const select =
        document.getElementById(
            "staffSelect"
        );


    select.innerHTML =
        '<option value="">Select staff member</option>';


    const term =
        search.trim().toLowerCase();


    allStaff.forEach(staff => {

        const name =
            staff.name ||
            staff.staffName ||
            staff.displayName ||
            "Unknown Staff";


        const staffId =
            staff.staffId ||
            staff.id ||
            "";


        const department =
            staff.department ||
            staff.dept ||
            "";


        const searchable =
            (
                name +
                " " +
                staffId +
                " " +
                department
            ).toLowerCase();


        if (
            !term ||
            searchable.includes(term)
        ) {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                staff.id;


            option.textContent =
                `${name} (${staffId})${department ? " - " + department : ""}`;


            select.appendChild(
                option
            );

        }

    });

}


/* =====================================================
   FILTER STAFF
===================================================== */

window.filterStaffDropdown = function() {

    const value =
        document.getElementById(
            "staffSearch"
        ).value;


    populateStaffDropdown(value);

};


/* =====================================================
   LISTEN FOR MESSAGES
===================================================== */

function listenForMessages() {

    if (!currentStaff) return;


    if (unsubscribeMessages) {

        unsubscribeMessages();

    }


    /*
     * Listen for messages where current
     * staff is either sender or receiver.
     */

    const sentQuery = query(

        collection(db, "messages"),

        where(
            "senderId",
            "==",
            getStaffIdentifier()
        )

    );


    const receivedQuery = query(

        collection(db, "messages"),

        where(
            "receiverId",
            "==",
            getStaffIdentifier()
        )

    );


    let sentMessages = [];

    let receivedMessages = [];


    const unsubSent =
        onSnapshot(
            sentQuery,
            snapshot => {

                sentMessages =
                    snapshot.docs.map(
                        item => ({
                            id: item.id,
                            ...item.data()
                        })
                    );

                rebuildMessages(
                    sentMessages,
                    receivedMessages
                );

            },

            error => {

                console.error(
                    "SENT MESSAGE LISTENER:",
                    error
                );

            }
        );


    const unsubReceived =
        onSnapshot(
            receivedQuery,
            snapshot => {

                receivedMessages =
                    snapshot.docs.map(
                        item => ({
                            id: item.id,
                            ...item.data()
                        })
                    );

                rebuildMessages(
                    sentMessages,
                    receivedMessages
                );

            },

            error => {

                console.error(
                    "RECEIVED MESSAGE LISTENER:",
                    error
                );

            }
        );


    unsubscribeMessages = () => {

        unsubSent();

        unsubReceived();

    };

}


/* =====================================================
   REBUILD MESSAGES
===================================================== */

function rebuildMessages(
    sent,
    received
) {

    const map = new Map();


    [...sent, ...received].forEach(message => {

        map.set(
            message.id,
            message
        );

    });


    allMessages =
        Array.from(map.values());


    allMessages.sort((a, b) => {

        const ta =
            getTimestamp(
                a.timestamp
            );

        const tb =
            getTimestamp(
                b.timestamp
            );

        return tb - ta;

    });


    renderConversationList();

    updateUnreadCount();

}


/* =====================================================
   GET STAFF IDENTIFIER
===================================================== */

function getStaffIdentifier() {

    return String(
        currentStaff.staffId ||
        currentStaff.id ||
        currentUser.uid
    );

}


/* =====================================================
   CONVERSATION LIST
===================================================== */

function renderConversationList() {

    const container =
        document.getElementById(
            "conversationItems"
        );


    const conversations =
        new Map();


    allMessages.forEach(message => {

        let otherId = "";

        if (
            message.senderId ===
            getStaffIdentifier()
        ) {

            otherId =
                message.receiverId;

        }

        else {

            otherId =
                message.senderId;

        }


        if (!otherId) return;


        const existing =
            conversations.get(otherId);


        if (
            !existing ||
            getTimestamp(message.timestamp) >
            getTimestamp(existing.timestamp)
        ) {

            conversations.set(
                otherId,
                message
            );

        }

    });


    container.innerHTML = "";


    if (
        conversations.size === 0
    ) {

        container.innerHTML = `

            <div class="loading">

                No messages yet.

                <br><br>

                Click <b>New Message</b>
                to start a conversation.

            </div>

        `;

        return;

    }


    conversations.forEach(
        (latestMessage, otherId) => {

            const staff =
                findStaff(otherId);


            const name =
                staff
                    ? (
                        staff.name ||
                        staff.staffName ||
                        staff.displayName ||
                        otherId
                    )
                    : (
                        latestMessage.senderName ||
                        latestMessage.receiverName ||
                        otherId
                    );


            const department =
                staff
                    ? (
                        staff.department ||
                        staff.dept ||
                        ""
                    )
                    : "";


            const unread =
                latestMessage.receiverId ===
                getStaffIdentifier() &&
                latestMessage.read !== true;


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "conversation" +
                (
                    unread
                        ? " unread"
                        : ""
                ) +
                (
                    selectedStaffId === otherId
                        ? " active"
                        : ""
                );


            div.dataset.name =
                (
                    name +
                    " " +
                    department +
                    " " +
                    otherId
                ).toLowerCase();


            div.onclick = () => {

                openConversation(
                    otherId
                );

            };


            const preview =
                latestMessage.message ||
                "";


            div.innerHTML = `

                <div class="avatar">

                    ${escapeHtml(
                        getInitials(name)
                    )}

                </div>


                <div class="conversation-body">

                    <div class="conversation-top">

                        <div class="conversation-name">

                            ${escapeHtml(name)}

                        </div>

                        <div class="conversation-time">

                            ${formatTime(
                                latestMessage.timestamp
                            )}

                        </div>

                    </div>


                    <div class="conversation-preview">

                        ${escapeHtml(preview)}

                    </div>

                </div>

            `;


            container.appendChild(div);

        }
    );

}


/* =====================================================
   FIND STAFF
===================================================== */

function findStaff(id) {

    return allStaff.find(
        staff =>
            staff.id === id ||
            String(
                staff.staffId
            ) === String(id)
    );

}


/* =====================================================
   OPEN CONVERSATION
===================================================== */

async function openConversation(
    otherId
) {

    selectedStaffId =
        String(otherId);


    const staff =
        findStaff(
            selectedStaffId
        );


    let name =
        staff
            ? (
                staff.name ||
                staff.staffName ||
                staff.displayName ||
                selectedStaffId
            )
            : selectedStaffId;


    let department =
        staff
            ? (
                staff.department ||
                staff.dept ||
                ""
            )
            : "";


    document.getElementById(
        "chatHeader"
    ).style.display = "flex";


    document.getElementById(
        "messageInputArea"
    ).style.display = "flex";


    document.getElementById(
        "chatUserName"
    ).textContent = name;


    document.getElementById(
        "chatUserDepartment"
    ).textContent =
        department ||
        "Staff";


    document.getElementById(
        "chatAvatar"
    ).textContent =
        getInitials(name);


    const container =
        document.getElementById(
            "messagingContainer"
        );


    container.classList.add(
        "chat-open"
    );


    renderMessages();


    await markConversationRead(
        selectedStaffId
    );


    renderConversationList();

}


/* =====================================================
   RENDER MESSAGES
===================================================== */

function renderMessages() {

    const container =
        document.getElementById(
            "messages"
        );


    if (!selectedStaffId) {

        return;

    }


    const myId =
        getStaffIdentifier();


    const conversation =
        allMessages
            .filter(message => {

                return (

                    (
                        message.senderId === myId &&
                        message.receiverId === selectedStaffId
                    )

                    ||

                    (
                        message.senderId === selectedStaffId &&
                        message.receiverId === myId
                    )

                );

            })
            .sort((a, b) => {

                return (
                    getTimestamp(a.timestamp) -
                    getTimestamp(b.timestamp)
                );

            });


    container.innerHTML = "";


    if (
        conversation.length === 0
    ) {

        container.innerHTML = `

            <div class="empty-chat">

                <div>

                    <div class="empty-chat-icon">
                        💬
                    </div>

                    <div>
                        Start the conversation
                    </div>

                </div>

            </div>

        `;

        return;

    }


    let previousDate = "";


    conversation.forEach(message => {

        const date =
            formatDate(
                message.timestamp
            );


        if (
            date !== previousDate
        ) {

            const dateDiv =
                document.createElement(
                    "div"
                );


            dateDiv.className =
                "message-date";


            dateDiv.textContent =
                date;


            container.appendChild(
                dateDiv
            );


            previousDate = date;

        }


        const isSent =
            message.senderId === myId;


        const row =
            document.createElement(
                "div"
            );


        row.className =
            "message-row " +
            (
                isSent
                    ? "sent"
                    : ""
            );


        const messageDiv =
            document.createElement(
                "div"
            );


        messageDiv.className =
            "message " +
            (
                isSent
                    ? "sent"
                    : "received"
            );


        messageDiv.innerHTML = `

            <div>
                ${escapeHtml(
                    message.message || ""
                ).replace(
                    /\n/g,
                    "<br>"
                )}
            </div>

            <div class="message-time">

                ${formatTime(
                    message.timestamp
                )}

                ${
                    isSent
                        ? (
                            message.read
                                ? " ✓✓"
                                : " ✓"
                        )
                        : ""
                }

            </div>

        `;


        row.appendChild(
            messageDiv
        );


        container.appendChild(
            row
        );

    });


    setTimeout(() => {

        container.scrollTop =
            container.scrollHeight;

    }, 50);

}


/* =====================================================
   SEND MESSAGE
===================================================== */

window.sendMessage = async function() {

    if (!selectedStaffId) {

        showToast(
            "Select a conversation first."
        );

        return;

    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const message =
        input.value.trim();


    if (!message) {

        return;

    }


    input.value = "";


    try {

        await addDoc(
            collection(
                db,
                "messages"
            ),
            {

                senderId:
                    getStaffIdentifier(),

                senderName:
                    getCurrentStaffName(),

                receiverId:
                    selectedStaffId,

                receiverName:
                    getStaffName(
                        selectedStaffId
                    ),

                message:
                    message,

                read:
                    false,

                deleted:
                    false,

                timestamp:
                    serverTimestamp()

            }
        );


        renderMessages();

    }

    catch(error) {

        console.error(
            "SEND MESSAGE ERROR:",
            error
        );

        input.value =
            message;

        showToast(
            "Message could not be sent."
        );

    }

};


/* =====================================================
   NEW MESSAGE
===================================================== */

window.sendNewMessage = async function() {

    const receiverId =
        document.getElementById(
            "staffSelect"
        ).value;


    const message =
        document.getElementById(
            "composeMessage"
        ).value.trim();


    if (!receiverId) {

        showToast(
            "Please select a staff member."
        );

        return;

    }


    if (!message) {

        showToast(
            "Please enter a message."
        );

        return;

    }


    try {

        await addDoc(
            collection(
                db,
                "messages"
            ),
            {

                senderId:
                    getStaffIdentifier(),

                senderName:
                    getCurrentStaffName(),

                receiverId:
                    getStaffNameId(
                        receiverId
                    ),

                receiverName:
                    getStaffName(
                        receiverId
                    ),

                message:
                    message,

                read:
                    false,

                deleted:
                    false,

                timestamp:
                    serverTimestamp()

            }
        );


        closeCompose();


        document.getElementById(
            "composeMessage"
        ).value = "";


        const receiver =
            getStaffNameId(
                receiverId
            );


        setTimeout(() => {

            openConversation(
                receiver
            );

        }, 300);


        showToast(
            "Message sent successfully."
        );

    }

    catch(error) {

        console.error(
            "NEW MESSAGE ERROR:",
            error
        );

        showToast(
            "Unable to send message."
        );

    }

};


/* =====================================================
   MARK CONVERSATION READ
===================================================== */

async function markConversationRead(
    otherId
) {

    const myId =
        getStaffIdentifier();


    const unreadMessages =
        allMessages.filter(
            message => {

                return (

                    message.senderId === otherId &&

                    message.receiverId === myId &&

                    message.read !== true

                );

            }
        );


    for (
        const message
        of unreadMessages
    ) {

        try {

            await updateDoc(
                doc(
                    db,
                    "messages",
                    message.id
                ),
                {
                    read: true
                }
            );

        }

        catch(error) {

            console.error(
                "READ UPDATE ERROR:",
                error
            );

        }

    }

}


/* =====================================================
   UNREAD COUNT
===================================================== */

function updateUnreadCount() {

    const myId =
        getStaffIdentifier();


    const unread =
        allMessages.filter(
            message => {

                return (

                    message.receiverId === myId &&

                    message.read !== true

                );

            }
        ).length;


    document.getElementById(
        "unreadBadge"
    ).textContent =
        unread > 99
            ? "99+"
            : unread;

}


/* =====================================================
   COMPOSE MODAL
===================================================== */

window.openCompose = function() {

    document.getElementById(
        "composeModal"
    ).classList.add(
        "show"
    );


    document.getElementById(
        "staffSearch"
    ).value = "";


    document.getElementById(
        "composeMessage"
    ).value = "";


    populateStaffDropdown();

};


window.closeCompose = function() {

    document.getElementById(
        "composeModal"
    ).classList.remove(
        "show"
    );

};


/* =====================================================
   SEARCH CONVERSATIONS
===================================================== */

window.filterConversations = function() {

    const search =
        document.getElementById(
            "conversationSearch"
        ).value
        .trim()
        .toLowerCase();


    document
        .querySelectorAll(
            ".conversation"
        )
        .forEach(item => {

            const text =
                item.dataset.name ||
                "";


            item.style.display =
                !search ||
                text.includes(search)
                    ? "flex"
                    : "none";

        });

};


/* =====================================================
   KEYBOARD SEND
===================================================== */

window.handleMessageKey = function(
    event
) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();

    }

};


/* =====================================================
   MOBILE
===================================================== */

window.closeMobileChat = function() {

    document
        .getElementById(
            "messagingContainer"
        )
        .classList.remove(
            "chat-open"
        );

    selectedStaffId = null;

};


/* =====================================================
   ERP DASHBOARD
===================================================== */

window.goBack = function() {

    /*
     * Change this filename if your ERP dashboard
     * has a different filename.
     */

    window.location.href =
        "staff-dashboard.html";

};


/* =====================================================
   STAFF NAME
===================================================== */

function getCurrentStaffName() {

    return (

        currentStaff.name ||

        currentStaff.staffName ||

        currentStaff.displayName ||

        currentStaff.staffId ||

        "Staff"

    );

}


/* =====================================================
   STAFF NAME BY ID
===================================================== */

function getStaffName(id) {

    const staff =
        findStaff(
            id
        );


    if (!staff) {

        return String(id);

    }


    return (

        staff.name ||

        staff.staffName ||

        staff.displayName ||

        staff.staffId ||

        id

    );

}


/* =====================================================
   STAFF IDENTIFIER FROM DOCUMENT ID
===================================================== */

function getStaffNameId(
    documentId
) {

    const staff =
        allStaff.find(
            item =>
                item.id === documentId
        );


    if (!staff) {

        return documentId;

    }


    /*
     * Messages use staffId as the identifier
     * when available.
     */

    return String(
        staff.staffId ||
        staff.id
    );

}


/* =====================================================
   INITIALS
===================================================== */

function getInitials(name) {

    if (!name) return "?";


    const parts =
        String(name)
            .trim()
            .split(/\s+/);


    if (parts.length === 1) {

        return parts[0]
            .substring(0, 2)
            .toUpperCase();

    }


    return (
        parts[0][0] +
        parts[parts.length - 1][0]
    ).toUpperCase();

}


/* =====================================================
   TIMESTAMP
===================================================== */

function getTimestamp(timestamp) {

    if (!timestamp) {

        return 0;

    }


    if (
        typeof timestamp.toMillis ===
        "function"
    ) {

        return timestamp.toMillis();

    }


    if (
        timestamp.seconds
    ) {

        return (
            timestamp.seconds * 1000
        );

    }


    if (
        timestamp instanceof Date
    ) {

        return timestamp.getTime();

    }


    return 0;

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(timestamp) {

    const time =
        getTimestamp(
            timestamp
        );


    if (!time) {

        return "...";

    }


    return new Date(
        time
    ).toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(timestamp) {

    const time =
        getTimestamp(
            timestamp
        );


    if (!time) {

        return "Today";

    }


    return new Date(
        time
    ).toLocaleDateString(
        [],
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   TOAST
===================================================== */

function showToast(
    message
) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(() => {

        toast.classList.remove(
            "show"
        );

    }, 2500);

}


/* =====================================================
   MODAL OUTSIDE CLICK
===================================================== */

document
    .getElementById(
        "composeModal"
    )
    .addEventListener(
        "click",
        event => {

            if (
                event.target.id ===
                "composeModal"
            ) {

                closeCompose();

            }

        }
    );

</script>
