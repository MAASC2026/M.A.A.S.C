<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Staff Messages</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f1f5f9;
    height:100vh;
    overflow:hidden;
}

/* =========================
   MAIN CONTAINER
========================= */

.app{
    width:100%;
    height:100vh;
    display:flex;
    background:#fff;
}

/* =========================
   LEFT PANEL
========================= */

.sidebar{
    width:330px;
    background:#ffffff;
    border-right:1px solid #ddd;
    display:flex;
    flex-direction:column;
}

.sidebar-header{
    padding:20px;
    background:#1d4ed8;
    color:white;
}

.sidebar-header h2{
    font-size:22px;
    margin-bottom:5px;
}

.sidebar-header p{
    font-size:13px;
    opacity:.9;
}

.search-box{
    padding:12px;
    border-bottom:1px solid #eee;
}

.search-box input{
    width:100%;
    padding:11px 14px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
    font-size:14px;
}

.search-box input:focus{
    border-color:#2563eb;
}

/* STAFF LIST */

.staff-list{
    flex:1;
    overflow-y:auto;
}

.staff-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px;
    border-bottom:1px solid #f0f0f0;
    cursor:pointer;
    transition:.2s;
}

.staff-item:hover{
    background:#f5f7fb;
}

.staff-item.active{
    background:#e8f0ff;
}

.avatar{
    width:46px;
    height:46px;
    min-width:46px;
    border-radius:50%;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:16px;
}

.staff-info{
    flex:1;
    min-width:0;
}

.staff-name{
    font-weight:bold;
    font-size:15px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.last-message{
    margin-top:5px;
    color:#777;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.staff-right{
    text-align:right;
}

.message-time{
    font-size:11px;
    color:#888;
}

.unread-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:21px;
    height:21px;
    padding:0 6px;
    margin-top:5px;
    border-radius:20px;
    background:#ef4444;
    color:white;
    font-size:11px;
    font-weight:bold;
}

/* =========================
   CHAT AREA
========================= */

.chat-area{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.chat-header{
    height:72px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 20px;
    border-bottom:1px solid #ddd;
    background:white;
}

.chat-header .avatar{
    width:44px;
    height:44px;
    min-width:44px;
}

.chat-user-name{
    font-size:17px;
    font-weight:bold;
}

.chat-user-id{
    color:#777;
    font-size:12px;
    margin-top:3px;
}

/* =========================
   MESSAGES
========================= */

.messages{
    flex:1;
    overflow-y:auto;
    padding:25px;
    background:#eef2f7;
}

.empty-chat{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    color:#777;
    text-align:center;
}

.empty-chat-icon{
    font-size:50px;
    margin-bottom:10px;
}

.empty-chat h3{
    color:#444;
    margin-bottom:5px;
}

.message-row{
    display:flex;
    margin-bottom:12px;
}

.message-row.sent{
    justify-content:flex-end;
}

.message-row.received{
    justify-content:flex-start;
}

.message-bubble{
    max-width:70%;
    padding:10px 13px;
    border-radius:14px;
    font-size:14px;
    line-height:1.4;
    word-wrap:break-word;
}

.sent .message-bubble{
    background:#2563eb;
    color:white;
    border-bottom-right-radius:4px;
}

.received .message-bubble{
    background:white;
    color:#222;
    border-bottom-left-radius:4px;
    box-shadow:0 1px 2px rgba(0,0,0,.08);
}

.message-meta{
    font-size:10px;
    margin-top:5px;
    opacity:.7;
    text-align:right;
}

/* =========================
   INPUT
========================= */

.message-input-area{
    padding:12px;
    background:white;
    border-top:1px solid #ddd;
    display:flex;
    gap:10px;
    align-items:flex-end;
}

.message-input{
    flex:1;
    resize:none;
    min-height:45px;
    max-height:120px;
    border:1px solid #d1d5db;
    border-radius:10px;
    padding:12px;
    font-size:14px;
    outline:none;
}

.message-input:focus{
    border-color:#2563eb;
}

.send-btn{
    width:50px;
    height:45px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.send-btn:hover{
    background:#1d4ed8;
}

.send-btn:disabled{
    background:#9ca3af;
    cursor:not-allowed;
}

/* =========================
   MOBILE
========================= */

.mobile-back{
    display:none;
    border:none;
    background:none;
    font-size:24px;
    cursor:pointer;
}

@media(max-width:700px){

    .sidebar{
        width:100%;
    }

    .chat-area{
        display:none;
        width:100%;
    }

    .app.chat-open .sidebar{
        display:none;
    }

    .app.chat-open .chat-area{
        display:flex;
    }

    .mobile-back{
        display:block;
    }

    .message-bubble{
        max-width:85%;
    }
}

/* =========================
   LOADING
========================= */

.loading{
    padding:25px;
    text-align:center;
    color:#777;
}

.no-staff{
    padding:30px 20px;
    text-align:center;
    color:#888;
}

/* ONLINE DOT */

.online-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#22c55e;
    display:inline-block;
    margin-left:5px;
}
</style>
</head>

<body>

<div class="app" id="app">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <div class="sidebar">

        <div class="sidebar-header">
            <h2>Staff Messages</h2>
            <p id="loggedStaffName">Loading...</p>
        </div>

        <div class="search-box">
            <input
                type="text"
                id="searchStaff"
                placeholder="Search staff..."
                autocomplete="off"
            >
        </div>

        <div class="staff-list" id="staffList">
            <div class="loading">
                Loading staff...
            </div>
        </div>

    </div>


    <!-- =========================
         CHAT AREA
    ========================== -->

    <div class="chat-area">

        <div class="chat-header" id="chatHeader">

            <button
                class="mobile-back"
                id="backButton"
            >
                ‹
            </button>

            <div class="avatar" id="chatAvatar">
                ?
            </div>

            <div>
                <div class="chat-user-name" id="chatUserName">
                    Select a staff
                </div>

                <div class="chat-user-id" id="chatUserId">
                    Choose a staff member to start chatting
                </div>
            </div>

        </div>


        <div class="messages" id="messages">

            <div class="empty-chat">

                <div class="empty-chat-icon">
                    💬
                </div>

                <h3>
                    Select a staff member
                </h3>

                <p>
                    Choose someone from the staff list to start a conversation.
                </p>

            </div>

        </div>


        <div class="message-input-area">

            <textarea
                id="messageInput"
                class="message-input"
                placeholder="Type a message..."
                disabled
            ></textarea>

            <button
                id="sendButton"
                class="send-btn"
                disabled
            >
                ➤
            </button>

        </div>

    </div>

</div>


<!-- =========================
     FIREBASE
========================= -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    doc,
    getDoc,
    getDocs,
    addDoc,
    updateDoc,
    query,
    where,
    orderBy,
    onSnapshot,
    serverTimestamp,
    limit
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
   ===================================================== */

const firebaseConfig = {

     apiKey: "AIzaSyAIv3091VM-gkmdwEAn7OhXWd9Cm2zh2bo",
  authDomain: "maasc-2026.firebaseapp.com",
  projectId: "maasc-2026",
  storageBucket: "maasc-2026.appspot.com",
  messagingSenderId: "585813001586",
  appId: "1:585813001586:web:664e0e90ff0725d2e849eb"

};


/* =====================================================
   INITIALIZE FIREBASE
   ===================================================== */

const appFirebase = initializeApp(firebaseConfig);

const auth = getAuth(appFirebase);

const db = getFirestore(appFirebase);


/* =====================================================
   GLOBAL VARIABLES
   ===================================================== */

let currentUser = null;

let currentStaff = null;

let currentConversationId = null;

let unsubscribeMessages = null;

let allStaff = [];

let conversationData = {};


/* =====================================================
   DOM
   ===================================================== */

const app = document.getElementById("app");

const staffList = document.getElementById("staffList");

const searchStaff = document.getElementById("searchStaff");

const loggedStaffName = document.getElementById("loggedStaffName");

const chatUserName = document.getElementById("chatUserName");

const chatUserId = document.getElementById("chatUserId");

const chatAvatar = document.getElementById("chatAvatar");

const messagesBox = document.getElementById("messages");

const messageInput = document.getElementById("messageInput");

const sendButton = document.getElementById("sendButton");

const backButton = document.getElementById("backButton");


/* =====================================================
   AUTH STATE
   ===================================================== */

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        loggedStaffName.textContent =
            "Please login first";

        staffList.innerHTML = `
            <div class="no-staff">
                You are not logged in.
            </div>
        `;

        return;
    }

    currentUser = user;

    console.log("Logged Firebase user:", user.uid);

    await loadCurrentStaff();

});


/* =====================================================
   LOAD CURRENT STAFF
===================================================== */

async function loadCurrentStaff(){

    try {

        /*
         * We first try Firebase Auth UID.
         */

        const staffRef =
            doc(db, "staff", currentUser.uid);

        const staffSnap =
            await getDoc(staffRef);

        if (staffSnap.exists()) {

            currentStaff = {
                id: staffSnap.id,
                ...staffSnap.data()
            };

        } else {

            /*
             * If staff document ID is not UID,
             * search by email.
             */

            const q = query(
                collection(db, "staff"),
                where("email", "==", currentUser.email),
                limit(1)
            );

            const result =
                await getDocs(q);

            if (!result.empty) {

                const d = result.docs[0];

                currentStaff = {
                    id: d.id,
                    ...d.data()
                };

            }

        }


        if (!currentStaff) {

            console.error(
                "Staff profile not found."
            );

            loggedStaffName.textContent =
                currentUser.email || "Staff";

            await loadStaff();

            return;
        }


        /*
         * Staff name can come from different fields
         * depending on your existing database.
         */

        const name =
            currentStaff.name ||
            currentStaff.staffName ||
            currentStaff.fullName ||
            currentStaff.displayName ||
            currentUser.displayName ||
            currentUser.email ||
            "Staff";


        currentStaff.displayName = name;


        loggedStaffName.textContent =
            "Logged in as " + name;


        console.log(
            "CURRENT STAFF:",
            currentStaff
        );


        await loadStaff();


    } catch(error){

        console.error(
            "Error loading current staff:",
            error
        );

        loggedStaffName.textContent =
            "Staff";

        await loadStaff();

    }

}


/* =====================================================
   LOAD STAFF LIST
===================================================== */

async function loadStaff(){

    try {

        const snapshot =
            await getDocs(
                collection(db, "staff")
            );

        allStaff = [];


        snapshot.forEach((staffDoc) => {

            const data = staffDoc.data();

            const id = staffDoc.id;


            /*
             * Do not show current logged-in staff.
             */

            if (
                currentStaff &&
                id === currentStaff.id
            ) {
                return;
            }


            const name =
                data.name ||
                data.staffName ||
                data.fullName ||
                data.displayName ||
                "Staff";


            allStaff.push({

                id: id,

                name: name,

                department:
                    data.department || "",

                email:
                    data.email || ""

            });

        });


        /*
         * Sort alphabetically initially.
         */

        allStaff.sort((a,b) =>
            a.name.localeCompare(b.name)
        );


        renderStaffList(allStaff);

        loadConversationPreviews();


    } catch(error){

        console.error(
            "Error loading staff:",
            error
        );

        staffList.innerHTML = `
            <div class="no-staff">
                Unable to load staff.
                <br><br>
                ${escapeHtml(error.message)}
            </div>
        `;

    }

}


/* =====================================================
   RENDER STAFF LIST
===================================================== */

function renderStaffList(list){

    if (!list.length){

        staffList.innerHTML = `
            <div class="no-staff">
                No staff found.
            </div>
        `;

        return;
    }


    staffList.innerHTML = "";


    list.forEach(staff => {

        const item =
            document.createElement("div");

        item.className = "staff-item";


        if (
            currentStaff &&
            currentStaff.id === staff.id
        ){
            return;
        }


        const initial =
            getInitials(staff.name);


        item.innerHTML = `

            <div class="avatar">
                ${escapeHtml(initial)}
            </div>

            <div class="staff-info">

                <div class="staff-name">
                    ${escapeHtml(staff.name)}
                </div>

                <div
                    class="last-message"
                    id="preview-${safeId(staff.id)}"
                >
                    Start a conversation
                </div>

            </div>

            <div class="staff-right">

                <div
                    class="message-time"
                    id="time-${safeId(staff.id)}"
                ></div>

                <div
                    class="unread-badge"
                    id="unread-${safeId(staff.id)}"
                    style="display:none"
                >
                    0
                </div>

            </div>

        `;


        item.addEventListener(
            "click",
            () => openChat(staff, item)
        );


        staffList.appendChild(item);

    });

}


/* =====================================================
   OPEN CHAT
===================================================== */

async function openChat(staff, element){

    currentStaff = currentStaff || {};

    currentConversationId =
        createConversationId(
            currentStaff.id,
            staff.id
        );


    /*
     * Highlight selected staff.
     */

    document
        .querySelectorAll(".staff-item")
        .forEach(item => {
            item.classList.remove("active");
        });


    if (element){
        element.classList.add("active");
    }


    /*
     * Header
     */

    chatUserName.textContent =
        staff.name;

    chatUserId.textContent =
        staff.id +
        (
            staff.department
                ? " • " + staff.department
                : ""
        );


    chatAvatar.textContent =
        getInitials(staff.name);


    /*
     * Enable input
     */

    messageInput.disabled = false;

    sendButton.disabled = false;

    messageInput.focus();


    /*
     * Mobile
     */

    app.classList.add("chat-open");


    /*
     * Clear previous listener
     */

    if (unsubscribeMessages){

        unsubscribeMessages();

        unsubscribeMessages = null;

    }


    /*
     * Load messages in real time.
     */

    const q = query(

        collection(
            db,
            "messages"
        ),

        where(
            "conversationId",
            "==",
            currentConversationId
        ),

        orderBy(
            "timestamp",
            "asc"
        )

    );


    unsubscribeMessages =
        onSnapshot(
            q,
            async (snapshot) => {

                messagesBox.innerHTML = "";


                if (snapshot.empty){

                    messagesBox.innerHTML = `

                        <div class="empty-chat">

                            <div class="empty-chat-icon">
                                👋
                            </div>

                            <h3>
                                Start chatting
                            </h3>

                            <p>
                                Send a message to ${escapeHtml(staff.name)}
                            </p>

                        </div>

                    `;

                    return;

                }


                const updates = [];


                snapshot.forEach(messageDoc => {

                    const data =
                        messageDoc.data();


                    renderMessage(
                        data
                    );


                    /*
                     * Mark messages received
                     * by current user as read.
                     */

                    if (
                        data.receiverId === currentStaff.id &&
                        data.read !== true
                    ){

                        updates.push(
                            updateDoc(
                                doc(
                                    db,
                                    "messages",
                                    messageDoc.id
                                ),
                                {
                                    read:true
                                }
                            )
                        );

                    }

                });


                await Promise.all(updates);


                /*
                 * Scroll to newest message.
                 */

                setTimeout(() => {

                    messagesBox.scrollTop =
                        messagesBox.scrollHeight;

                }, 50);

            },

            error => {

                console.error(
                    "Message listener error:",
                    error
                );

                messagesBox.innerHTML = `

                    <div class="empty-chat">

                        <div class="empty-chat-icon">
                            ⚠️
                        </div>

                        <h3>
                            Unable to load messages
                        </h3>

                        <p>
                            ${escapeHtml(error.message)}
                        </p>

                    </div>

                `;

            }

        );

}


/* =====================================================
   RENDER MESSAGE
===================================================== */

function renderMessage(data){

    const row =
        document.createElement("div");


    const sent =
        data.senderId === currentStaff.id;


    row.className =
        "message-row " +
        (sent ? "sent" : "received");


    const bubble =
        document.createElement("div");

    bubble.className =
        "message-bubble";


    const text =
        document.createElement("div");

    text.textContent =
        data.message || "";


    const meta =
        document.createElement("div");

    meta.className =
        "message-meta";


    meta.textContent =
        formatTime(data.timestamp);


    bubble.appendChild(text);

    bubble.appendChild(meta);

    row.appendChild(bubble);

    messagesBox.appendChild(row);

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

    const text =
        messageInput.value.trim();


    if (!text){

        return;

    }


    if (!currentStaff){

        alert(
            "Staff profile is not loaded."
        );

        return;

    }


    if (!currentConversationId){

        alert(
            "Please select a staff member."
        );

        return;

    }


    if (!currentStaff.id){

        alert(
            "Your staff ID is missing."
        );

        return;

    }


    /*
     * Disable while sending.
     */

    sendButton.disabled = true;


    try {

        await addDoc(
            collection(
                db,
                "messages"
            ),
            {

                conversationId:
                    currentConversationId,

                senderId:
                    currentStaff.id,

                senderName:
                    currentStaff.displayName,

                receiverId:
                    currentStaff.id === currentStaff.id
                        ? getOtherStaffId()
                        : "",

                receiverName:
                    currentStaff.id === currentStaff.id
                        ? getOtherStaffName()
                        : "",

                message:
                    text,

                timestamp:
                    serverTimestamp(),

                read:false

            }
        );


        messageInput.value = "";

        messageInput.focus();


    } catch(error){

        console.error(
            "Send message error:",
            error
        );

        alert(
            "Message could not be sent.\n\n" +
            error.message
        );

    }


    sendButton.disabled = false;

}


/* =====================================================
   CURRENT CHAT TARGET
===================================================== */

function getOtherStaffId(){

    /*
     * conversationId is created using two IDs.
     * Current selected staff is stored here.
     */

    if (
        window.selectedStaffForChat
    ){

        return window.selectedStaffForChat.id;

    }

    return "";

}


function getOtherStaffName(){

    if (
        window.selectedStaffForChat
    ){

        return window.selectedStaffForChat.name;

    }

    return "";

}


/* =====================================================
   FIX SELECTED STAFF
===================================================== */

const originalOpenChat =
    openChat;


/*
 * Store selected staff globally.
 */

window.openStaffChat = function(staff, element){

    window.selectedStaffForChat =
        staff;

    originalOpenChat(
        staff,
        element
    );

};


/*
 * Replace click handlers through event
 * delegation is not required.
 */


/* =====================================================
   SEARCH STAFF
===================================================== */

searchStaff.addEventListener(
    "input",
    () => {

        const search =
            searchStaff.value
                .trim()
                .toLowerCase();


        if (!search){

            renderStaffList(
                allStaff
            );

            loadConversationPreviews();

            return;

        }


        const filtered =
            allStaff.filter(staff =>

                staff.name
                    .toLowerCase()
                    .includes(search)

                ||

                staff.id
                    .toLowerCase()
                    .includes(search)

                ||

                staff.department
                    .toLowerCase()
                    .includes(search)

            );


        renderStaffList(
            filtered
        );

    }
);


/* =====================================================
   SEND BUTTON
===================================================== */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =====================================================
   ENTER TO SEND
===================================================== */

messageInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   MOBILE BACK
===================================================== */

backButton.addEventListener(
    "click",
    () => {

        app.classList.remove(
            "chat-open"
        );

        if (unsubscribeMessages){

            unsubscribeMessages();

            unsubscribeMessages = null;

        }

        currentConversationId =
            null;

        messageInput.disabled =
            true;

        sendButton.disabled =
            true;

    }
);


/* =====================================================
   LOAD CONVERSATION PREVIEWS
===================================================== */

async function loadConversationPreviews(){

    if (!currentStaff){
        return;
    }


    try {

        /*
         * Get all messages involving current staff.
         *
         * This version avoids requiring a Firestore
         * composite index.
         */

        const sentQuery = query(
            collection(db, "messages"),
            where(
                "senderId",
                "==",
                currentStaff.id
            )
        );


        const receivedQuery = query(
            collection(db, "messages"),
            where(
                "receiverId",
                "==",
                currentStaff.id
            )
        );


        const [
            sentSnapshot,
            receivedSnapshot
        ] = await Promise.all([

            getDocs(sentQuery),

            getDocs(receivedQuery)

        ]);


        const conversations = {};


        /*
         * SENT
         */

        sentSnapshot.forEach(docSnap => {

            const data =
                docSnap.data();

            processPreviewMessage(
                conversations,
                data,
                true
            );

        });


        /*
         * RECEIVED
         */

        receivedSnapshot.forEach(docSnap => {

            const data =
                docSnap.data();

            processPreviewMessage(
                conversations,
                data,
                false
            );

        });


        /*
         * Update staff previews.
         */

        allStaff.forEach(staff => {

            const conversationId =
                createConversationId(
                    currentStaff.id,
                    staff.id
                );


            const conversation =
                conversations[
                    conversationId
                ];


            const preview =
                document.getElementById(
                    "preview-" +
                    safeId(staff.id)
                );


            const time =
                document.getElementById(
                    "time-" +
                    safeId(staff.id)
                );


            const unread =
                document.getElementById(
                    "unread-" +
                    safeId(staff.id)
                );


            if (!preview){
                return;
            }


            if (conversation){

                preview.textContent =
                    conversation.lastMessage;


                time.textContent =
                    formatTime(
                        conversation.timestamp
                    );


                if (
                    conversation.unread > 0
                ){

                    unread.style.display =
                        "inline-flex";

                    unread.textContent =
                        conversation.unread;

                } else {

                    unread.style.display =
                        "none";

                }

            }

        });


        /*
         * Move conversations with latest
         * messages to the top.
         */

        allStaff.sort((a,b) => {

            const aId =
                createConversationId(
                    currentStaff.id,
                    a.id
                );

            const bId =
                createConversationId(
                    currentStaff.id,
                    b.id
                );


            const aTime =
                conversations[aId]?.timeNumber || 0;

            const bTime =
                conversations[bId]?.timeNumber || 0;


            if (
                aTime === bTime
            ){

                return a.name.localeCompare(
                    b.name
                );

            }


            return bTime - aTime;

        });


        /*
         * Re-render only if search is empty.
         */

        if (
            searchStaff.value.trim() === ""
        ){

            renderStaffList(
                allStaff
            );

            /*
             * renderStaffList recreated DOM,
             * therefore load previews again.
             */

            allStaff.forEach(staff => {

                const conversationId =
                    createConversationId(
                        currentStaff.id,
                        staff.id
                    );

                const conversation =
                    conversations[
                        conversationId
                    ];

                const preview =
                    document.getElementById(
                        "preview-" +
                        safeId(staff.id)
                    );

                const time =
                    document.getElementById(
                        "time-" +
                        safeId(staff.id)
                    );

                const unread =
                    document.getElementById(
                        "unread-" +
                        safeId(staff.id)
                    );


                if (
                    conversation &&
                    preview
                ){

                    preview.textContent =
                        conversation.lastMessage;

                    time.textContent =
                        formatTime(
                            conversation.timestamp
                        );

                    if (
                        conversation.unread > 0
                    ){

                        unread.style.display =
                            "inline-flex";

                        unread.textContent =
                            conversation.unread;

                    }

                }

            });

        }


    } catch(error){

        console.error(
            "Preview error:",
            error
        );

    }

}


/* =====================================================
   PROCESS PREVIEW MESSAGE
===================================================== */

function processPreviewMessage(
    conversations,
    data,
    sent
){

    const id =
        data.conversationId;


    if (!id){
        return;
    }


    let timestampNumber = 0;


    if (
        data.timestamp &&
        typeof data.timestamp.toMillis ===
            "function"
    ){

        timestampNumber =
            data.timestamp.toMillis();

    }


    if (
        !conversations[id]
    ){

        conversations[id] = {

            lastMessage:
                data.message || "",

            timestamp:
                data.timestamp,

            timeNumber:
                timestampNumber,

            unread:
                (
                    !sent &&
                    data.read !== true
                )
                    ? 1
                    : 0

        };

        return;

    }


    const existing =
        conversations[id];


    if (
        timestampNumber >=
        existing.timeNumber
    ){

        existing.lastMessage =
            data.message || "";

        existing.timestamp =
            data.timestamp;

        existing.timeNumber =
            timestampNumber;

    }


    if (
        !sent &&
        data.read !== true
    ){

        existing.unread++;

    }

}


/* =====================================================
   CREATE CONVERSATION ID
===================================================== */

function createConversationId(
    id1,
    id2
){

    return [
        String(id1),
        String(id2)
    ]
    .sort()
    .join("_");

}


/* =====================================================
   GET INITIALS
===================================================== */

function getInitials(name){

    if (!name){
        return "?";
    }


    const parts =
        name
            .trim()
            .split(/\s+/);


    if (parts.length === 1){

        return parts[0]
            .substring(0,2)
            .toUpperCase();

    }


    return (
        parts[0][0] +
        parts[parts.length - 1][0]
    ).toUpperCase();

}


/* =====================================================
   SAFE ID
===================================================== */

function safeId(value){

    return String(value)
        .replace(/[^a-zA-Z0-9_-]/g, "_");

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(timestamp){

    if (!timestamp){
        return "";
    }


    let date;


    if (
        timestamp &&
        typeof timestamp.toDate ===
            "function"
    ){

        date =
            timestamp.toDate();

    }

    else if (
        timestamp instanceof Date
    ){

        date =
            timestamp;

    }

    else {

        return "";

    }


    const now =
        new Date();


    const sameDay =
        date.toDateString() ===
        now.toDateString();


    if (sameDay){

        return date.toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }


    return date.toLocaleDateString(
        [],
        {
            day:"2-digit",
            month:"short"
        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   IMPORTANT:
   Override staff click handlers so selected staff
   is available to sendMessage().
===================================================== */

function renderStaffListWithChat(list){

    staffList.innerHTML = "";


    list.forEach(staff => {

        const item =
            document.createElement("div");

        item.className =
            "staff-item";


        item.innerHTML = `

            <div class="avatar">
                ${escapeHtml(getInitials(staff.name))}
            </div>

            <div class="staff-info">

                <div class="staff-name">
                    ${escapeHtml(staff.name)}
                </div>

                <div
                    class="last-message"
                    id="preview-${safeId(staff.id)}"
                >
                    Start a conversation
                </div>

            </div>

            <div class="staff-right">

                <div
                    class="message-time"
                    id="time-${safeId(staff.id)}"
                ></div>

                <div
                    class="unread-badge"
                    id="unread-${safeId(staff.id)}"
                    style="display:none"
                >
                    0
                </div>

            </div>

        `;


        item.addEventListener(
            "click",
            () => {

                window.selectedStaffForChat =
                    staff;

                openChat(
                    staff,
                    item
                );

            }
        );


        staffList.appendChild(item);

    });

}


/*
 * Use the corrected renderer.
 */

renderStaffList =
    renderStaffListWithChat;


/* =====================================================
   REAL-TIME INBOX UPDATE
===================================================== */

let inboxListener = null;


function startInboxListener(){

    if (!currentStaff){
        return;
    }


    const sentQuery =
        query(
            collection(db, "messages"),
            where(
                "senderId",
                "==",
                currentStaff.id
            )
        );


    const receivedQuery =
        query(
            collection(db, "messages"),
            where(
                "receiverId",
                "==",
                currentStaff.id
            )
        );


    /*
     * Real-time listener for received messages.
     */

    onSnapshot(
        receivedQuery,
        snapshot => {

            loadConversationPreviews();

        }
    );

}


/*
 * Start listener after current staff is loaded.
 */

const oldLoadStaff =
    loadStaff;


/*
 * The normal loadStaff already executes,
 * and this small delayed initialization
 * starts the realtime preview listener.
 */

setTimeout(() => {

    if (currentStaff){

        startInboxListener();

    }

}, 2500);

</script>
