<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Staff Messaging</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f6f9;
    height:100vh;
    overflow:hidden;
}

.app{
    display:flex;
    width:100%;
    height:100vh;
}

/* ================= LEFT ================= */

.left{
    width:350px;
    min-width:350px;
    background:white;
    border-right:1px solid #ddd;
    display:flex;
    flex-direction:column;
}

.left-header{
    background:#500454;
    color:white;
    padding:20px;
}

.left-header h2{
    font-size:21px;
}

.left-header p{
    font-size:11px;
    margin-top:5px;
    opacity:.8;
}

.current-user{
    padding:12px 15px;
    border-bottom:1px solid #eee;
    background:#fafafa;
}

.current-name{
    font-size:13px;
    font-weight:bold;
}

.current-id{
    font-size:10px;
    color:#777;
    margin-top:4px;
}

.search-area{
    padding:12px;
    border-bottom:1px solid #eee;
}

.search{
    width:100%;
    height:42px;
    border:1px solid #ccc;
    border-radius:8px;
    padding:0 12px;
    outline:none;
    font-size:12px;
}

.search:focus{
    border-color:#500454;
}

.staff-count{
    font-size:10px;
    color:#777;
    margin-top:7px;
}

.staff-list{
    flex:1;
    overflow-y:auto;
}

.staff-item{
    min-height:75px;
    padding:12px 15px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid #eee;
    cursor:pointer;
    position:relative;
}

.staff-item:hover{
    background:#faf3fb;
}

.staff-item.active{
    background:#f0ddf2;
    border-left:4px solid #500454;
    padding-left:11px;
}

.staff-item.unread{
    background:#fff3f5;
}

.avatar{
    width:44px;
    height:44px;
    min-width:44px;
    border-radius:50%;
    background:#500454;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:12px;
    font-weight:bold;
}

.staff-info{
    flex:1;
    min-width:0;
}

.staff-name{
    font-size:13px;
    font-weight:bold;
    color:#333;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.staff-id{
    font-size:10px;
    color:#777;
    margin-top:3px;
}

.last-message{
    font-size:10px;
    color:#888;
    margin-top:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.unread{
    background:#e11d48;
    color:white;
    min-width:21px;
    height:21px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    font-weight:bold;
}

.no-staff{
    padding:40px 20px;
    text-align:center;
    color:#777;
    font-size:12px;
}

/* ================= CHAT ================= */

.chat{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    background:#f4f6f9;
}

.chat-header{
    height:72px;
    min-height:72px;
    background:white;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:10px 20px;
    gap:12px;
}

.chat-avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#500454;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:bold;
}

.chat-details{
    display:none;
}

.chat-name{
    font-size:15px;
    font-weight:bold;
}

.chat-id{
    font-size:10px;
    color:#777;
    margin-top:3px;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.empty{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;

}

.empty-icon{
    font-size:50px;
    margin-bottom:10px;
}

.empty-title{

}

.empty-text{
    font-size:12px;
    margin-top:5px;
}

.row{

    margin-bottom:12px;
}

.row.sent{
    justify-content:flex-end;
}

.row.received{
    justify-content:flex-start;
}

.bubble{
    max-width:65%;
    padding:10px 13px;
    font-size:13px;
    line-height:1.4;
    word-break:break-word;
}

.sent .bubble{

    color:white;
    border-radius:13px 13px 3px 13px;
}

.received .bubble{

    color:#333;
    border:1px solid #ddd;
    border-radius:13px 13px 13px 3px;
}

.time{
    font-size:9px;
    margin-top:5px;

}

.input-area{
    display:none;
    gap:8px;
    padding:12px;
    background:white;
    border-top:1px solid #ddd;
}

.message-input{
    flex:1;
    height:45px;
    resize:none;
    border:1px solid #ccc;
    border-radius:8px;

    outline:none;
    font-size:13px;
}

.message-input:focus{
    border-color:#500454;
}

.send{
    width:55px;
    border:none;
    border-radius:8px;
    background:#500454;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.send:hover{
    background:#6e0a75;
}

.send:disabled{
    opacity:.5;
}

.notification{

    right:20px;
    bottom:20px;

    background:white;
    border-left:5px solid #500454;
    border-radius:10px;

    display:none;
    z-index:9999;
}

.notification.show{

}

.notification-title{
    color:#500454;
    font-weight:bold;
    font-size:13px;
}

.notification-text{
    font-size:12px;
    color:#555;
    margin-top:6px;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    .left{
        width:100%;
        min-width:100%;
    }

    .chat{
        display:none;
    }

    .app.chat-open .left{
        display:none;
    }

    .app.chat-open .chat{
        display:flex;
    }

    .bubble{
        max-width:82%;
    }

}

</style>

<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getFirestore,
    collection,
    getDocs,
    query,
    where,
    onSnapshot,
    addDoc,
    updateDoc,
    doc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAIv3091VM-gkmdwEAn7OhXWd9Cm2zh2bo",

    authDomain:
        "maasc-2026.firebaseapp.com",

    projectId:
        "maasc-2026",

    storageBucket:
        "maasc-2026.appspot.com",

    messagingSenderId:
        "585813001586",

    appId:
        "1:585813001586:web:664e0e90ff0725d2e849eb"

};


const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getFirestore(
        app
    );


/* =====================================================
   ERP SESSION
===================================================== */

const currentStaffId =
    String(
        sessionStorage.getItem("staffId") || ""
    ).trim();


const currentStaffName =
    String(
        sessionStorage.getItem("staffName") || ""
    ).trim();


const currentDepartment =
    String(
        sessionStorage.getItem("department") || ""
    ).trim();


console.log(
    "CURRENT STAFF ID:",
    currentStaffId
);

console.log(
    "CURRENT STAFF NAME:",
    currentStaffName
);

console.log(
    "CURRENT DEPARTMENT:",
    currentDepartment
);


/* =====================================================
   SESSION CHECK
===================================================== */

if(!currentStaffId){

    document.body.innerHTML = `

        <div style="
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            font-family:Arial;
            background:#f4f6f9;
        ">

            <div style="
                background:white;
                padding:35px;
                border-radius:12px;
                box-shadow:0 5px 25px rgba(0,0,0,.15);
            ">

                <h2 style="color:#500454;">
                    Staff Session Not Found
                </h2>

                <p style="
                    color:#666;
                    font-size:13px;
                    margin-top:10px;
                ">
                    Please open Staff Messaging
                    from your ERP dashboard.
                </p>

            </div>

        </div>

    `;

    throw new Error(
        "staffId not available"
    );

}


/* =====================================================
   DOM
===================================================== */

const currentName =
    document.getElementById(
        "currentName"
    );

const currentId =
    document.getElementById(
        "currentId"
    );

const search =
    document.getElementById(
        "search"
    );

const staffListElement =
    document.getElementById(
        "staffList"
    );

const staffCount =
    document.getElementById(
        "staffCount"
    );

const appElement =
    document.getElementById(
        "app"
    );

const chatAvatar =
    document.getElementById(
        "chatAvatar"
    );

const chatDetails =
    document.getElementById(
        "chatDetails"
    );

const chatName =
    document.getElementById(
        "chatName"
    );

const chatId =
    document.getElementById(
        "chatId"
    );

const messagesElement =
    document.getElementById(
        "messages"
    );

const inputArea =
    document.getElementById(
        "inputArea"
    );

const messageInput =
    document.getElementById(
        "messageInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const notification =
    document.getElementById(
        "notification"
    );

const notificationText =
    document.getElementById(
        "notificationText"
    );


currentName.textContent =
    currentStaffName || "Staff";

currentId.textContent =
    currentStaffId;


/* =====================================================
   DATA
===================================================== */

let allStaff = [];

let filteredStaff = [];

let allReceivedMessages = [];

let selectedStaff = null;

let conversationMessages = [];

let unsubscribeConversationSent = null;

let unsubscribeConversationReceived = null;


/* =====================================================
   LOAD STAFF
===================================================== */

async function loadStaff(){

    staffListElement.innerHTML = `

        <div class="no-staff">
            Loading staff...
        </div>

    `;


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "staff"
                )
            );


        allStaff = [];


        snapshot.forEach(
            function(item){

                const data =
                    item.data();


                const staffId =
                    String(

                        data.staffId ||
                        data.staffID ||
                        data.staff_id ||
                        data.employeeId ||
                        data.employeeID ||
                        item.id

                    ).trim();


                const name =
                    String(

                        data.name ||
                        data.staffName ||
                        data.staff_name ||
                        data.fullName ||
                        data.full_name ||
                        data.employeeName ||
                        data.employee_name ||
                        staffId

                    ).trim();


                const department =
                    String(

                        data.department ||
                        data.departmentName ||
                        data.department_name ||
                        data.dept ||
                        ""

                    ).trim();


                /*
                   Do not show current staff
                */

                if(
                    staffId.toLowerCase() ===
                    currentStaffId.toLowerCase()
                ){

                    return;

                }


                allStaff.push({

                    docId:item.id,

                    staffId:staffId,

                    name:name,

                    department:department

                });

            }
        );


        filteredStaff =
            [...allStaff];


        renderStaff();


    }
    catch(error){

        console.error(
            "STAFF LOAD ERROR:",
            error
        );


        staffListElement.innerHTML = `

            <div class="no-staff">

                ⚠️ Unable to load staff

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}


/* =====================================================
   REAL-TIME RECEIVED MESSAGE LISTENER
===================================================== */

function startReceivedListener(){

    const q =
        query(

            collection(
                db,
                "messages"
            ),

            where(
                "receiverId",
                "==",
                currentStaffId
            )

        );


    onSnapshot(
        q,
        function(snapshot){

            /*
               Store ALL received messages
            */

            allReceivedMessages =
                snapshot.docs.map(
                    function(item){

                        return {

                            id:item.id,

                            ...item.data()

                        };

                    }
                );


            /*
               Sort newest first
            */

            allReceivedMessages.sort(
                function(a,b){

                    return getTime(
                        b.timestamp
                    )
                    -
                    getTime(
                        a.timestamp
                    );

                }
            );


            /*
               THIS IS THE IMPORTANT PART

               Staff who sent the latest/unread
               message will automatically move
               to the TOP.
            */

            reorderStaff();


            /*
               Detect newly received messages
            */

            snapshot.docChanges()
                .forEach(
                    function(change){

                        if(
                            change.type !== "added"
                        ){

                            return;

                        }


                        const data =
                            change.doc.data();


                        /*
                           Only notify for recent
                           messages.
                        */

                        const messageTime =
                            getTime(
                                data.timestamp
                            );


                        if(
                            messageTime &&
                            Date.now() -
                            messageTime <
                            20000
                        ){

                            /*
                               If this chat isn't
                               currently open, show
                               notification.
                            */

                            if(
                                !selectedStaff ||
                                selectedStaff.staffId
                                .toLowerCase()
                                !==
                                String(
                                    data.senderId
                                ).toLowerCase()
                            ){

                                showNotification(
                                    data
                                );

                            }

                        }

                    }
                );


            /*
               If currently chatting with sender,
               refresh messages.
            */

            if(
                selectedStaff
            ){

                const senderId =
                    selectedStaff.staffId
                        .toLowerCase();


                const exists =
                    allReceivedMessages.some(
                        function(message){

                            return String(
                                message.senderId
                            )
                            .toLowerCase()
                            ===
                            senderId;

                        }
                    );


                if(exists){

                    renderConversation();

                }

            }

        },
        function(error){

            console.error(
                "MESSAGE LISTENER ERROR:",
                error
            );

        }
    );

}


/* =====================================================
   REORDER STAFF
===================================================== */

function reorderStaff(){

    /*
       Make a copy
    */

    const sorted =
        [...allStaff];


    sorted.sort(
        function(a,b){

            const aMessages =
                allReceivedMessages.filter(
                    function(message){

                        return String(
                            message.senderId
                        ).toLowerCase()
                        ===
                        a.staffId.toLowerCase();

                    }
                );


            const bMessages =
                allReceivedMessages.filter(
                    function(message){

                        return String(
                            message.senderId
                        ).toLowerCase()
                        ===
                        b.staffId.toLowerCase();

                    }
                );


            /*
               UNREAD COUNT
            */

            const aUnread =
                aMessages.filter(
                    function(message){

                        return message.read !== true;

                    }
                ).length;


            const bUnread =
                bMessages.filter(
                    function(message){

                        return message.read !== true;

                    }
                ).length;


            /*
               1. UNREAD FIRST
            */

            if(
                aUnread > 0 &&
                bUnread === 0
            ){

                return -1;

            }


            if(
                bUnread > 0 &&
                aUnread === 0
            ){

                return 1;

            }


            /*
               2. LATEST MESSAGE
            */

            const aLatest =
                aMessages.length
                ?
                getTime(
                    aMessages[0].timestamp
                )
                :
                0;


            const bLatest =
                bMessages.length
                ?
                getTime(
                    bMessages[0].timestamp
                )
                :
                0;


            if(
                aLatest !== bLatest
            ){

                return bLatest - aLatest;

            }


            /*
               3. ALPHABETICAL
            */

            return a.name
                .toLowerCase()
                .localeCompare(
                    b.name.toLowerCase()
                );

        }
    );


    /*
       Save sorted list
    */

    allStaff =
        sorted;


    /*
       Apply search again
    */

    applySearch();

}


/* =====================================================
   RENDER STAFF
===================================================== */

function renderStaff(){

    staffListElement.innerHTML = "";


    if(
        filteredStaff.length === 0
    ){

        staffListElement.innerHTML = `

            <div class="no-staff">

                🔍

                <br><br>

                No staff found

            </div>

        `;

        staffCount.textContent =
            "0 staff";

        return;

    }


    filteredStaff.forEach(
        function(staff){

            const messages =
                getMessagesFromStaff(
                    staff.staffId
                );


            const unreadMessages =
                messages.filter(
                    function(message){

                        return message.read !== true;

                    }
                );


            const latest =
                messages.length
                ?
                messages[0]
                :
                null;


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "staff-item";


            if(
                selectedStaff &&
                selectedStaff.staffId
                .toLowerCase()
                ===
                staff.staffId.toLowerCase()
            ){

                item.classList.add(
                    "active"
                );

            }


            if(
                unreadMessages.length > 0
            ){

                item.classList.add(
                    "unread"
                );

            }


            const initials =
                getInitials(
                    staff.name
                );


            item.innerHTML = `

                <div class="avatar">

                    ${escapeHtml(
                        initials
                    )}

                </div>


                <div class="staff-info">

                    <div class="staff-name">

                        ${escapeHtml(
                            staff.name
                        )}

                    </div>


                    <div class="staff-id">

                        ${escapeHtml(
                            staff.staffId
                        )}

                        ${
                            staff.department
                            ?
                            " • " +
                            escapeHtml(
                                staff.department
                            )
                            :
                            ""
                        }

                    </div>


                    ${
                        latest
                        ?
                        `
                        <div class="last-message">

                            ${
                                latest.senderId
                                .toLowerCase()
                                ===
                                currentStaffId
                                .toLowerCase()
                                ?
                                "You: "
                                :
                                ""
                            }

                            ${escapeHtml(
                                latest.message || ""
                            )}

                        </div>
                        `
                        :
                        ""
                    }

                </div>


                ${
                    unreadMessages.length > 0
                    ?
                    `
                    <div class="unread">

                        ${
                            unreadMessages.length
                        }

                    </div>
                    `
                    :
                    ""
                }

            `;


            item.addEventListener(
                "click",
                function(){

                    openChat(
                        staff
                    );

                }
            );


            staffListElement.appendChild(
                item
            );

        }
    );


    staffCount.textContent =
        filteredStaff.length +
        " staff";

}


/* =====================================================
   GET MESSAGES FROM STAFF
===================================================== */

function getMessagesFromStaff(
    staffId
){

    return allReceivedMessages
        .filter(
            function(message){

                return String(
                    message.senderId
                ).toLowerCase()
                ===
                String(
                    staffId
                ).toLowerCase();

            }
        )
        .sort(
            function(a,b){

                return getTime(
                    b.timestamp
                )
                -
                getTime(
                    a.timestamp
                );

            }
        );

}


/* =====================================================
   SEARCH
===================================================== */

search.addEventListener(
    "input",
    function(){

        applySearch();

    }
);


function applySearch(){

    const text =
        search.value
            .trim()
            .toLowerCase();


    if(!text){

        filteredStaff =
            [...allStaff];

    }
    else{

        filteredStaff =
            allStaff.filter(
                function(staff){

                    return (

                        staff.name
                            .toLowerCase()
                            .includes(text)

                        ||

                        staff.staffId
                            .toLowerCase()
                            .includes(text)

                        ||

                        staff.department
                            .toLowerCase()
                            .includes(text)

                    );

                }
            );

    }


    renderStaff();

}


/* =====================================================
   OPEN CHAT
===================================================== */

function openChat(staff){

    selectedStaff =
        staff;


    chatAvatar.textContent =
        getInitials(
            staff.name
        );


    chatName.textContent =
        staff.name;


    chatId.textContent =
        staff.staffId;


    chatDetails.style.display =
        "block";


    inputArea.style.display =
        "flex";


    appElement.classList.add(
        "chat-open"
    );


    loadConversation(
        staff.staffId
    );


    /*
       Mark messages read
    */

    markMessagesRead(
        staff.staffId
    );


    /*
       Re-render list immediately
       so unread badge disappears.
    */

    setTimeout(
        function(){

            reorderStaff();

        },
        300
    );


    messageInput.focus();

}


/* =====================================================
   LOAD CONVERSATION
===================================================== */

function loadConversation(
    otherStaffId
){

    if(
        unsubscribeConversationSent
    ){

        unsubscribeConversationSent();

    }


    if(
        unsubscribeConversationReceived
    ){

        unsubscribeConversationReceived();

    }


    conversationMessages = [];


    /*
       SENT
    */

    const sentQuery =
        query(

            collection(
                db,
                "messages"
            ),

            where(
                "senderId",
                "==",
                currentStaffId
            ),

            where(
                "receiverId",
                "==",
                otherStaffId
            )

        );


    /*
       RECEIVED
    */

    const receivedQuery =
        query(

            collection(
                db,
                "messages"
            ),

            where(
                "senderId",
                "==",
                otherStaffId
            ),

            where(
                "receiverId",
                "==",
                currentStaffId
            )

        );


    unsubscribeConversationSent =
        onSnapshot(
            sentQuery,
            function(snapshot){

                updateConversation(
                    snapshot,
                    true
                );

            }
        );


    unsubscribeConversationReceived =
        onSnapshot(
            receivedQuery,
            function(snapshot){

                updateConversation(
                    snapshot,
                    false
                );

            }
        );

}


/* =====================================================
   CONVERSATION CACHE
===================================================== */

let sentConversation = [];

let receivedConversation = [];


function updateConversation(
    snapshot,
    isSent
){

    const data =
        snapshot.docs.map(
            function(item){

                return {

                    id:item.id,

                    ...item.data()

                };

            }
        );


    if(isSent){

        sentConversation =
            data;

    }
    else{

        receivedConversation =
            data;

    }


    renderConversation();

}


/* =====================================================
   RENDER CONVERSATION
===================================================== */

function renderConversation(){

    if(!selectedStaff){

        return;

    }


    const combined = [

        ...sentConversation,

        ...receivedConversation

    ];


    combined.sort(
        function(a,b){

            return getTime(
                a.timestamp
            )
            -
            getTime(
                b.timestamp
            );

        }
    );


    messagesElement.innerHTML = "";


    if(
        combined.length === 0
    ){

        messagesElement.innerHTML = `

            <div class="empty">

                <div>

                    <div class="empty-icon">
                        💬
                    </div>

                    <div class="empty-title">
                        No messages yet
                    </div>

                    <div class="empty-text">
                        Start the conversation.
                    </div>

                </div>

            </div>

        `;

        return;

    }


    combined.forEach(
        function(message){

            const sent =
                String(
                    message.senderId
                ).toLowerCase()
                ===
                currentStaffId.toLowerCase();


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                sent
                ?
                "row sent"
                :
                "row received";


            const bubble =
                document.createElement(
                    "div"
                );


            bubble.className =
                "bubble";


            bubble.innerHTML = `

                <div>

                    ${escapeHtml(
                        message.message || ""
                    ).replace(
                        /\n/g,
                        "<br>"
                    )}

                </div>


                <div class="time">

                    ${formatTime(
                        message.timestamp
                    )}

                    ${
                        sent
                        ?
                        (
                            message.read === true
                            ?
                            " ✓✓"
                            :
                            " ✓"
                        )
                        :
                        ""
                    }

                </div>

            `;


            row.appendChild(
                bubble
            );


            messagesElement.appendChild(
                row
            );

        }
    );


    messagesElement.scrollTop =
        messagesElement.scrollHeight;

}


/* =====================================================
   MARK READ
===================================================== */

async function markMessagesRead(
    senderId
){

    try{

        const q =
            query(

                collection(
                    db,
                    "messages"
                ),

                where(
                    "senderId",
                    "==",
                    senderId
                ),

                where(
                    "receiverId",
                    "==",
                    currentStaffId
                )

            );


        const snapshot =
            await getDocs(q);


        const promises = [];


        snapshot.forEach(
            function(item){

                const data =
                    item.data();


                if(
                    data.read !== true
                ){

                    promises.push(

                        updateDoc(

                            doc(
                                db,
                                "messages",
                                item.id
                            ),

                            {
                                read:true
                            }

                        )

                    );

                }

            }
        );


        await Promise.all(
            promises
        );


    }
    catch(error){

        console.error(
            "MARK READ ERROR:",
            error
        );

    }

}


/* =====================================================
   SEND MESSAGE
===================================================== */

sendButton.addEventListener(
    "click",
    sendMessage
);


async function sendMessage(){

    if(!selectedStaff){

        alert(
            "Select a staff member."
        );

        return;

    }


    const text =
        messageInput.value.trim();


    if(!text){

        return;

    }


    sendButton.disabled =
        true;


    try{

        await addDoc(

            collection(
                db,
                "messages"
            ),

            {

                senderId:
                    currentStaffId,

                senderName:
                    currentStaffName,

                senderDepartment:
                    currentDepartment,

                receiverId:
                    selectedStaff.staffId,

                receiverName:
                    selectedStaff.name,

                receiverDepartment:
                    selectedStaff.department,

                message:
                    text,

                read:
                    false,

                timestamp:
                    serverTimestamp()

            }

        );


        messageInput.value = "";


        messageInput.focus();


    }
    catch(error){

        console.error(
            "SEND MESSAGE ERROR:",
            error
        );


        alert(
            "Unable to send message.\n\n" +
            error.message
        );

    }
    finally{

        sendButton.disabled =
            false;

    }

}

messageInput.addEventListener(

        if(

            !event.shiftKey

/* =====================================================
   HELPERS
===================================================== */

function getInitials(
    name
){

    const value =
        String(
            name || ""
        ).trim();


    if(!value){

        return "?";

    }


    const parts =
        value.split(
            /\s+/
        );


    if(
        parts.length === 1
    ){

        return parts[0]
            .substring(0,2)
            .toUpperCase();

    }


    return (

        parts[0][0] +

        parts[
            parts.length - 1
        ][0]

    ).toUpperCase();

}


function getTime(
    timestamp
){

    if(!timestamp){

        return 0;

    }


    if(
        typeof timestamp.toMillis ===
        "function"
    ){

        return timestamp.toMillis();

    }


    if(
        timestamp.seconds !== undefined
    ){

        return Number(
            timestamp.seconds
        ) * 1000;

    }


    return 0;

}


function formatTime(
    timestamp
){

    const time =
        getTime(
            timestamp
        );


    if(!time){

        return "...";

    }


    return new Date(
        time
    ).toLocaleTimeString(
        "en-IN",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}
