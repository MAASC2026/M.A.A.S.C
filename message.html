<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Staff Messaging Portal</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    background:#f3f6fb;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    background:white;
}


/* =====================================================
   LEFT STAFF PANEL
===================================================== */

.sidebar{
    width:340px;
    min-width:340px;
    height:100vh;
    border-right:1px solid #dfe3e8;
    background:#ffffff;
    display:flex;
    flex-direction:column;
}

.sidebar-header{
    padding:20px;
    border-bottom:1px solid #e5e7eb;
    background:#ffffff;
}

.title{
    font-size:21px;
    font-weight:bold;
    color:#1e3a8a;
    margin-bottom:15px;
}

.subtitle{
    font-size:11px;
    color:#777;
    margin-bottom:13px;
}

.search-wrapper{
    position:relative;
}

.search-icon{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    font-size:14px;
    color:#777;
    pointer-events:none;
}

.search-box{
    width:100%;
    height:42px;
    border:1px solid #d1d5db;
    border-radius:9px;
    outline:none;
    padding:0 38px;
    font-size:13px;
    background:#f9fafb;
}

.search-box:focus{
    border-color:#2563eb;
    background:#fff;
}

.clear-search{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    width:22px;
    height:22px;
    border:none;
    border-radius:50%;
    background:#e5e7eb;
    cursor:pointer;
    display:none;
    font-size:12px;
}

.clear-search:hover{
    background:#d1d5db;
}

.search-result-count{
    font-size:10px;
    color:#777;
    margin-top:9px;
}

.staff-list{
    flex:1;
    overflow-y:auto;
}

.staff-list::-webkit-scrollbar{
    width:5px;
}

.staff-list::-webkit-scrollbar-thumb{
    background:#cbd5e1;
    border-radius:10px;
}


/* =====================================================
   STAFF ITEM
===================================================== */

.staff-item{
    width:100%;
    min-height:70px;
    padding:12px 15px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid #f0f0f0;
    cursor:pointer;
    transition:.15s;
}

.staff-item:hover{
    background:#f5f8ff;
}

.staff-item.active{
    background:#e8f0ff;
    border-left:4px solid #2563eb;
    padding-left:11px;
}

.avatar{
    width:44px;
    height:44px;
    min-width:44px;
    border-radius:50%;
    background:#2563eb;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:13px;
    font-weight:bold;
}

.staff-details{
    min-width:0;
    flex:1;
}

.staff-name{
    font-size:13px;
    font-weight:bold;
    color:#1f2937;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.staff-id{
    font-size:10px;
    color:#6b7280;
    margin-top:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


/* =====================================================
   CHAT AREA
===================================================== */

.chat-area{
    flex:1;
    height:100vh;
    min-width:0;
    display:flex;
    flex-direction:column;
    background:#f7f9fc;
}

.chat-header{
    height:72px;
    min-height:72px;
    background:white;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:10px 20px;
    gap:12px;
}

.chat-header-info{
    display:none;
}

.chat-name{
    font-size:15px;
    font-weight:bold;
    color:#111827;
}

.chat-id{
    font-size:10px;
    color:#6b7280;
    margin-top:3px;
}


/* =====================================================
   MESSAGES
===================================================== */

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.messages::-webkit-scrollbar{
    width:6px;
}

.messages::-webkit-scrollbar-thumb{
    background:#cbd5e1;
    border-radius:10px;
}

.empty-screen{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.empty-icon{
    font-size:50px;
    margin-bottom:12px;
}

.empty-title{
    font-size:16px;
    font-weight:bold;
    color:#4b5563;
}

.empty-text{
    font-size:12px;
    color:#9ca3af;
    margin-top:6px;
}

.message-row{
    display:flex;
    width:100%;
    margin-bottom:12px;
}

.message-row.sent{
    justify-content:flex-end;
}

.message-row.received{
    justify-content:flex-start;
}

.message-bubble{
    max-width:65%;
    padding:10px 13px;
    font-size:13px;
    line-height:1.45;
    word-break:break-word;
}

.message-row.sent .message-bubble{
    background:#2563eb;
    color:white;
    border-radius:13px 13px 3px 13px;
}

.message-row.received .message-bubble{
    background:white;
    color:#1f2937;
    border:1px solid #e1e5ea;
    border-radius:13px 13px 13px 3px;
}

.message-time{
    font-size:9px;
    opacity:.65;
    margin-top:5px;
    text-align:right;
}


/* =====================================================
   MESSAGE INPUT
===================================================== */

.input-area{
    min-height:70px;
    background:white;
    border-top:1px solid #ddd;
    padding:12px;
    display:none;
    gap:8px;
}

.message-input{
    flex:1;
    height:46px;
    resize:none;
    border:1px solid #d1d5db;
    border-radius:9px;
    outline:none;
    padding:13px;
    font-size:13px;
}

.message-input:focus{
    border-color:#2563eb;
}

.send-button{
    width:55px;
    height:46px;
    border:none;
    border-radius:9px;
    background:#2563eb;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.send-button:hover{
    background:#1d4ed8;
}

.send-button:disabled{
    opacity:.5;
    cursor:not-allowed;
}


/* =====================================================
   LOADING
===================================================== */

.loading{
    padding:30px;
    text-align:center;
    color:#777;
    font-size:12px;
}

.spinner{
    width:25px;
    height:25px;
    border:3px solid #e5e7eb;
    border-top-color:#2563eb;
    border-radius:50%;
    animation:spin .7s linear infinite;
    margin:0 auto 10px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* =====================================================
   STATUS
===================================================== */

.status{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#111827;
    color:white;
    padding:11px 17px;
    border-radius:8px;
    font-size:12px;
    display:none;
    z-index:9999;
}

.status.show{
    display:block;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .sidebar{
        width:100%;
        min-width:100%;
    }

    .chat-area{
        display:none;
    }

    .app.mobile-chat .sidebar{
        display:none;
    }

    .app.mobile-chat .chat-area{
        display:flex;
    }

    .message-bubble{
        max-width:82%;
    }

}

</style>

</head>


<body>


<div
    id="app"
    class="app"
>


    <!-- =================================================
         STAFF SIDEBAR
    ================================================== -->

    <aside class="sidebar">

        <div class="sidebar-header">

            <div class="title">
                💬 Staff Messaging
            </div>

            <div class="subtitle">
                Select a staff member to start a conversation
            </div>


            <div class="search-wrapper">

                <span class="search-icon">
                    🔍
                </span>

                <input
                    id="searchBox"
                    class="search-box"
                    type="text"
                    autocomplete="off"
                    placeholder="Search name, staff ID or department..."
                >

                <button
                    id="clearSearch"
                    class="clear-search"
                    type="button"
                >
                    ×
                </button>

            </div>


            <div
                id="searchResultCount"
                class="search-result-count"
            >
                Loading staff...
            </div>

        </div>


        <div
            id="staffList"
            class="staff-list"
        >

            <div class="loading">

                <div class="spinner"></div>

                Loading staff...

            </div>

        </div>

    </aside>



    <!-- =================================================
         CHAT
    ================================================== -->

    <main class="chat-area">


        <div class="chat-header">

            <div
                id="chatAvatar"
                class="avatar"
            >
                ?
            </div>


            <div
                id="chatHeaderInfo"
                class="chat-header-info"
            >

                <div
                    id="chatName"
                    class="chat-name"
                >
                    Staff
                </div>

                <div
                    id="chatId"
                    class="chat-id"
                >
                    -
                </div>

            </div>

        </div>



        <div
            id="messages"
            class="messages"
        >

            <div class="empty-screen">

                <div>

                    <div class="empty-icon">
                        💬
                    </div>

                    <div class="empty-title">
                        Select a staff member
                    </div>

                    <div class="empty-text">
                        Choose someone from the staff list.
                    </div>

                </div>

            </div>

        </div>



        <div
            id="inputArea"

            <textarea

            ></textarea>


            <button

            >
                ➤
            </button>

        </div>


    </main>


</div>



<div
    id="status"
    class="status"
></div>



<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    query,
    where,
    onSnapshot,
    updateDoc,
    doc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAIv3091VM-gkmdwEAn7OhXWd9Cm2zh2bo",

    authDomain:
        "maasc-2026.firebaseapp.com",

    projectId:
        "maasc-2026",

    storageBucket:
        "maasc-2026.appspot.com",

    messagingSenderId:
        "585813001586",

    appId:
        "1:585813001586:web:664e0e90ff0725d2e849eb"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const firebaseApp =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(
        firebaseApp
    );


const db =
    getFirestore(
        firebaseApp
    );


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let loggedInUser = null;

let loggedInStaff = null;

let staffList = [];

let filteredStaffList = [];

let selectedStaff = null;

let unsubscribeSent = null;

let unsubscribeReceived = null;

let sentMessages = [];

let receivedMessages = [];


/* =====================================================
   DOM
===================================================== */

const app =
    document.getElementById(
        "app"
    );


const staffListElement =
    document.getElementById(
        "staffList"
    );


const searchBox =
    document.getElementById(
        "searchBox"
    );


const clearSearch =
    document.getElementById(
        "clearSearch"
    );


const searchResultCount =
    document.getElementById(
        "searchResultCount"
    );


const messagesElement =
    document.getElementById(
        "messages"
    );


const messageInput =
    document.getElementById(
        "messageInput"
    );


const sendButton =
    document.getElementById(
        "sendButton"
    );


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
    auth,
    async function(user){

        console.log(
            "AUTH STATE:",
            user
        );


        loggedInUser =
            user;


        /*
           Always load staff.

           We do NOT redirect to login here.
        */

        await loadStaff();


        if(user){

            findCurrentStaff(
                user
            );

        }

    }
);


/* =====================================================
   LOAD STAFF
===================================================== */

async function loadStaff(){

    staffListElement.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            Loading staff...

        </div>

    `;


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "staff"
                )
            );


        console.log(
            "STAFF COUNT:",
            snapshot.size
        );


        staffList = [];


        snapshot.forEach(
            function(docSnap){

                const data =
                    docSnap.data();


                console.log(
                    "STAFF DOCUMENT:",
                    docSnap.id,
                    data
                );


                const staffId =
                    getStaffId(
                        data,
                        docSnap.id
                    );


                const name =
                    getStaffName(
                        data
                    );


                const department =
                    getDepartment(
                        data
                    );


                staffList.push({

                    docId:
                        docSnap.id,

                    staffId:
                        staffId,

                    name:
                        name,

                    department:
                        department,

                    data:
                        data

                });

            }
        );


        /*
           Sort by name
        */

        staffList.sort(
            function(a,b){

                return a.name
                    .toLowerCase()
                    .localeCompare(
                        b.name.toLowerCase()
                    );

            }
        );


        filteredStaffList =
            [...staffList];


        renderStaff();


    }
    catch(error){

        console.error(
            "STAFF LOAD ERROR:",
            error
        );


        staffListElement.innerHTML = `

            <div style="
                padding:30px 20px;
                text-align:center;
                color:#dc2626;
                font-size:12px;
            ">

                <b>Unable to load staff</b>

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;


        searchResultCount.textContent =
            "Staff loading failed.";

    }

}


/* =====================================================
   GET STAFF ID
===================================================== */

function getStaffId(
    data,
    documentId
){

    return String(

        data.staffId ||

        data.staffID ||

        data.staff_id ||

        data.employeeId ||

        data.employeeID ||

        data.employee_id ||

        documentId

    ).trim();

}


/* =====================================================
   GET STAFF NAME
===================================================== */

function getStaffName(data){

    return String(

        data.name ||

        data.staffName ||

        data.staff_name ||

        data.fullName ||

        data.full_name ||

        data.displayName ||

        data.employeeName ||

        data.employee_name ||

        data.username ||

        data.staffId ||

        "Staff"

    ).trim();

}


/* =====================================================
   GET DEPARTMENT
===================================================== */

function getDepartment(data){

    return String(

        data.department ||

        data.departmentName ||

        data.department_name ||

        data.dept ||

        data.deptName ||

        ""

    ).trim();

}


/* =====================================================
   FIND CURRENT STAFF
===================================================== */

function findCurrentStaff(user){

    const uid =
        String(
            user.uid || ""
        ).trim();


    const email =
        String(
            user.email || ""
        )
        .trim()
        .toLowerCase();


    loggedInStaff = null;


    /*
       Search through staff records
    */

    for(
        const staff
        of staffList
    ){

        const data =
            staff.data;


        const possibleUid =
            String(

                data.uid ||

                data.authUid ||

                data.authUID ||

                data.userId ||

                data.userID ||

                data.firebaseUid ||

                ""

            )
            .trim();


        const possibleEmail =
            String(

                data.email ||

                data.personalEmail ||

                data.officialEmail ||

                data.officialMail ||

                data.personalMail ||

                ""

            )
            .trim()
            .toLowerCase();


        /*
           Firebase UID match
        */

        if(
            possibleUid &&
            possibleUid === uid
        ){

            loggedInStaff =
                staff;

            break;

        }


        /*
           Email match
        */

        if(
            email &&
            possibleEmail &&
            email === possibleEmail
        ){

            loggedInStaff =
                staff;

            break;

        }


        /*
           Document ID match
        */

        if(
            staff.docId === uid
        ){

            loggedInStaff =
                staff;

            break;

        }

    }


    console.log(
        "CURRENT STAFF:",
        loggedInStaff
    );


    renderStaff();

}


/* =====================================================
   CURRENT STAFF ID
===================================================== */

function getCurrentStaffId(){

    /*
       FIRST:
       Firestore staff record
    */

    if(loggedInStaff){

        if(
            loggedInStaff.staffId
        ){

            return String(
                loggedInStaff.staffId
            ).trim();

        }

    }


    /*
       SECOND:
       localStorage
    */

    const keys = [

        "staffId",
        "staffID",
        "staff_id",
        "employeeId",
        "employeeID",
        "employee_id",
        "currentStaffId",
        "loggedInStaffId",
        "userStaffId"

    ];


    for(
        const key
        of keys
    ){

        const value =
            localStorage.getItem(
                key
            );


        if(
            value &&
            value.trim()
        ){

            return value.trim();

        }

    }


    /*
       THIRD:
       sessionStorage
    */

    for(
        const key
        of keys
    ){

        const value =
            sessionStorage.getItem(
                key
            );


        if(
            value &&
            value.trim()
        ){

            return value.trim();

        }

    }


    /*
       FOURTH:
       Firebase Auth UID
    */

    if(
        loggedInUser &&
        loggedInUser.uid
    ){

        return String(
            loggedInUser.uid
        ).trim();

    }


    return "";

}


/* =====================================================
   CURRENT STAFF NAME
===================================================== */

function getCurrentStaffName(){

    if(loggedInStaff){

        return loggedInStaff.name;

    }


    if(
        loggedInUser &&
        loggedInUser.displayName
    ){

        return loggedInUser.displayName;

    }


    if(
        loggedInUser &&
        loggedInUser.email
    ){

        return loggedInUser.email;

    }


    return "Staff";

}


/* =====================================================
   SEARCH
===================================================== */

searchBox.addEventListener(
    "input",
    function(){

        performSearch();

    }
);


/* =====================================================
   SEARCH FUNCTION
===================================================== */

function performSearch(){

    const text =
        searchBox.value
            .trim()
            .toLowerCase();


    /*
       Clear button
    */

    if(text){

        clearSearch.style.display =
            "block";

    }
    else{

        clearSearch.style.display =
            "none";

    }


    /*
       No search text
    */

    if(!text){

        filteredStaffList =
            [...staffList];

    }
    else{

        filteredStaffList =
            staffList.filter(
                function(staff){

                    const name =
                        String(
                            staff.name || ""
                        )
                        .toLowerCase();


                    const id =
                        String(
                            staff.staffId || ""
                        )
                        .toLowerCase();


                    const department =
                        String(
                            staff.department || ""
                        )
                        .toLowerCase();


                    /*
                       Also search complete data
                    */

                    let allData = "";


                    try{

                        allData =
                            JSON.stringify(
                                staff.data || {}
                            )
                            .toLowerCase();

                    }
                    catch(error){

                        allData = "";

                    }


                    return (

                        name.includes(
                            text
                        )

                        ||

                        id.includes(
                            text
                        )

                        ||

                        department.includes(
                            text
                        )

                        ||

                        allData.includes(
                            text
                        )

                    );

                }
            );

    }


    console.log(
        "SEARCH TEXT:",
        text
    );


    console.log(
        "SEARCH RESULTS:",
        filteredStaffList.length
    );


    renderStaff();

}


/* =====================================================
   CLEAR SEARCH
===================================================== */

clearSearch.addEventListener(
    "click",
    function(){

        searchBox.value = "";

        filteredStaffList =
            [...staffList];

        clearSearch.style.display =
            "none";

        renderStaff();

        searchBox.focus();

    }
);


/* =====================================================
   RENDER STAFF
===================================================== */

function renderStaff(){

    staffListElement.innerHTML = "";


    let displayedCount = 0;


    filteredStaffList.forEach(
        function(staff){

            /*
               Don't display current staff
            */

            if(
                loggedInStaff &&
                staff.staffId ===
                loggedInStaff.staffId
            ){

                return;

            }


            displayedCount++;


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "staff-item";


            if(
                selectedStaff &&
                selectedStaff.staffId ===
                staff.staffId
            ){

                item.classList.add(
                    "active"
                );

            }


            const initials =
                getInitials(
                    staff.name
                );


            item.innerHTML = `

                <div class="avatar">

                    ${escapeHtml(
                        initials
                    )}

                </div>


                <div class="staff-details">

                    <div class="staff-name">

                        ${escapeHtml(
                            staff.name
                        )}

                    </div>


                    <div class="staff-id">

                        ${escapeHtml(
                            staff.staffId
                        )}

                        ${
                            staff.department
                            ?
                            " • " +
                            escapeHtml(
                                staff.department
                            )
                            :
                            ""
                        }

                    </div>

                </div>

            `;


            item.addEventListener(
                "click",
                function(){

                    openChat(
                        staff
                    );

                }
            );


            staffListElement.appendChild(
                item
            );

        }
    );


    /*
       Result count
    */

    if(
        searchBox.value.trim()
    ){

        searchResultCount.textContent =
            displayedCount +
            " staff found";

    }
    else{

        searchResultCount.textContent =
            displayedCount +
            " staff available";

    }


    /*
       No results
    */

    if(
        displayedCount === 0
    ){

        staffListElement.innerHTML = `

            <div style="
                padding:40px 20px;
                text-align:center;
                color:#777;
            ">

                <div style="
                    font-size:35px;
                    margin-bottom:10px;
                ">
                    🔍
                </div>

                <div style="
                    font-weight:bold;
                    color:#555;
                    font-size:13px;
                ">
                    No staff found
                </div>

                <div style="
                    font-size:11px;
                    margin-top:5px;
                ">
                    Try another name or staff ID.
                </div>

            </div>

        `;

    }

}


/* =====================================================
   INITIALS
===================================================== */

function getInitials(name){

    const value =
        String(
            name || ""
        ).trim();


    if(!value){

        return "?";

    }


    const parts =
        value.split(
            /\s+/
        );


    if(
        parts.length === 1
    ){

        return parts[0]
            .substring(
                0,
                2
            )
            .toUpperCase();

    }


    return (

        parts[0].charAt(0) +

        parts[
            parts.length - 1
        ].charAt(0)

    ).toUpperCase();

}

   OPEN CHAT

/* =====================================================
   LOAD CONVERSATION
===================================================== */

function loadConversation(){

    if(!selectedStaff){

        return;

    }


    /*
       Remove previous listeners
    */

    if(
        unsubscribeSent
    ){

        unsubscribeSent();

        unsubscribeSent =
            null;

    }


    if(
        unsubscribeReceived
    ){

        unsubscribeReceived();

        unsubscribeReceived =
            null;

    }


    sentMessages = [];

    receivedMessages = [];


    const myId =
        getCurrentStaffId();


    const otherId =
        String(
            selectedStaff.staffId
        ).trim();


    console.log(
        "MY ID:",
        myId
    );


    console.log(
        "OTHER ID:",
        otherId
    );


    if(!myId){

        messagesElement.innerHTML = `

            <div class="empty-screen">

                <div>

                    <div class="empty-icon">
                        ⚠️
                    </div>

                    <div class="empty-title">
                        Staff ID not found
                    </div>

                    <div class="empty-text">
                        Your ERP login staff ID could not be detected.
                    </div>

                </div>

            </div>

        `;

        return;

    }


    /*
       SENT QUERY
    */

    const sentQuery =
        query(

            collection(
                db,
                "messages"
            ),

            where(
                "senderId",
                "==",
                myId
            ),

            where(
                "receiverId",
                "==",
                otherId
            )

        );


    /*
       RECEIVED QUERY
    */

    const receivedQuery =
        query(

            collection(
                db,
                "messages"
            ),

            where(
                "senderId",
                "==",
                otherId
            ),

            where(
                "receiverId",
                "==",
                myId
            )

        );


    /*
       SENT LISTENER
    */

    unsubscribeSent =
        onSnapshot(

            sentQuery,

            function(snapshot){

                sentMessages =
                    snapshot.docs.map(
                        function(docSnap){

                            return {

                                id:
                                    docSnap.id,

                                ...docSnap.data()

                            };

                        }
                    );


                renderMessages();

            },

            function(error){

                console.error(
                    "SENT MESSAGE ERROR:",
                    error
                );

                showStatus(
                    error.message
                );

            }

        );


    /*
       RECEIVED LISTENER
    */

    unsubscribeReceived =
        onSnapshot(

            receivedQuery,

            function(snapshot){

                receivedMessages =
                    snapshot.docs.map(
                        function(docSnap){

                            return {

                                id:
                                    docSnap.id,

                                ...docSnap.data()

                            };

                        }
                    );


                renderMessages();


                markReceivedMessagesRead();

            },

            function(error){

                console.error(
                    "RECEIVED MESSAGE ERROR:",
                    error
                );

                showStatus(
                    error.message
                );

            }

        );

}


/* =====================================================
   RENDER MESSAGES
===================================================== */

function renderMessages(){

    const allMessages = [

        ...sentMessages,

        ...receivedMessages

    ];


    allMessages.sort(
        function(a,b){

            return getTimestamp(
                a.timestamp
            )
            -
            getTimestamp(
                b.timestamp
            );

        }
    );


    messagesElement.innerHTML = "";


    if(
        allMessages.length === 0
    ){

        messagesElement.innerHTML = `

            <div class="empty-screen">

                <div>

                    <div class="empty-icon">
                        💬
                    </div>

                    <div class="empty-title">
                        No messages yet
                    </div>

                    <div class="empty-text">
                        Send a message to start the conversation.
                    </div>

                </div>

            </div>

        `;

        return;

    }


    const myId =
        getCurrentStaffId();


    allMessages.forEach(
        function(message){

            const isSent =
                String(
                    message.senderId
                ) ===
                String(
                    myId
                );


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                isSent
                ?
                "message-row sent"
                :
                "message-row received";


            const bubble =
                document.createElement(
                    "div"
                );


            bubble.className =
                "message-bubble";


            const messageText =
                escapeHtml(
                    message.message || ""
                )
                .replace(
                    /\n/g,
                    "<br>"
                );


            let readStatus = "";


            if(isSent){

                readStatus =
                    message.read === true
                    ?
                    " ✓✓"
                    :
                    " ✓";

            }


            bubble.innerHTML = `

                <div>
                    ${messageText}
                </div>

                <div class="message-time">

                    ${formatTime(
                        message.timestamp
                    )}

                    ${readStatus}

                </div>

            `;


            row.appendChild(
                bubble
            );


            messagesElement.appendChild(
                row
            );

        }
    );


    /*
       Scroll bottom
    */

    messagesElement.scrollTop =
        messagesElement.scrollHeight;

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

    if(!selectedStaff){

        showStatus(
            "Select a staff member first."
        );

        return;

    }


    const text =
        messageInput.value.trim();


    if(!text){

        return;

    }


    const senderId =
        getCurrentStaffId();


    const receiverId =
        String(
            selectedStaff.staffId
        ).trim();


    if(!senderId){

        alert(
            "Current Staff ID is not available."
        );

        console.error(
            "CURRENT STAFF ID NOT AVAILABLE"
        );

        return;

    }


    console.log(
        "SENDING MESSAGE"
    );


    console.log(
        "SENDER ID:",
        senderId
    );


    console.log(
        "RECEIVER ID:",
        receiverId
    );


    sendButton.disabled =
        true;


    try{

        await addDoc(

            collection(
                db,
                "messages"
            ),

            {

                senderId:
                    senderId,

                senderName:
                    getCurrentStaffName(),

                receiverId:
                    receiverId,

                receiverName:
                    selectedStaff.name,

                message:
                    text,

                read:
                    false,

                timestamp:
                    serverTimestamp()

            }

        );


        /*
           Clear textbox
        */

        messageInput.value = "";


        messageInput.focus();


        console.log(
            "MESSAGE SENT"
        );


    }
    catch(error){

        console.error(
            "SEND MESSAGE ERROR:",
            error
        );


        alert(
            "Unable to send message.\n\n" +
            error.message
        );

    }
    finally{

        sendButton.disabled =
            false;

    }

}


/* =====================================================
   SEND BUTTON
===================================================== */

sendButton.addEventListener(
    "click",
    function(){

        sendMessage();

    }
);


/* =====================================================
   ENTER TO SEND
===================================================== */

messageInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   MARK READ
===================================================== */

async function markReceivedMessagesRead(){

    for(
        const message
        of receivedMessages
    ){

        if(
            message.read === true
        ){

            continue;

        }


        try{

            await updateDoc(

                doc(
                    db,
                    "messages",
                    message.id
                ),

                {

                    read:
                        true

                }

            );

        }
        catch(error){

            console.error(
                "MARK READ ERROR:",
                error
            );

        }

    }

}


/* =====================================================
   TIMESTAMP
===================================================== */

function getTimestamp(timestamp){

    if(!timestamp){

        return 0;

    }


    if(
        typeof timestamp.toMillis ===
        "function"
    ){

        return timestamp.toMillis();

    }


    if(
        timestamp.seconds
    ){

        return Number(
            timestamp.seconds
        ) * 1000;

    }


    return 0;

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(timestamp){

    const time =
        getTimestamp(
            timestamp
        );


    if(!time){

        return "...";

    }


    return new Date(
        time
    ).toLocaleTimeString(
        "en-IN",
        {

            hour:
                "2-digit",

            minute:
                "2-digit"

        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   STATUS
===================================================== */

function showStatus(text){

    const element =
        document.getElementById(
            "status"
        );


    element.textContent =
        text;


    element.classList.add(
        "show"
    );


    setTimeout(
        function(){

            element.classList.remove(
                "show"
            );

        },
        3500
    );

}
