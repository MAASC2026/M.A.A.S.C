<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Staff Messages</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#e9edef;
    height:100vh;
    overflow:hidden;
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    background:#fff;
}

/* LEFT */

.sidebar{
    width:360px;
    min-width:360px;
    border-right:1px solid #ddd;
    background:#fff;
    display:flex;
    flex-direction:column;
}

.sidebar-header{
    background:#075e54;
    color:#fff;
    padding:18px;
}

.sidebar-header h2{
    font-size:20px;
    margin-bottom:12px;
}

.current-user{
    font-size:13px;
    opacity:.9;
}

.search-box{
    padding:10px;
    background:#f0f2f5;
}

.search-box input{
    width:100%;
    border:none;
    outline:none;
    padding:11px 15px;
    border-radius:20px;
    background:#fff;
    font-size:14px;
}

.chat-list{
    flex:1;
    overflow-y:auto;
}

.chat-item{
    display:flex;
    align-items:center;
    padding:13px 14px;
    border-bottom:1px solid #eee;
    cursor:pointer;
    transition:.15s;
}

.chat-item:hover{
    background:#f5f5f5;
}

.chat-item.active{
    background:#e9edef;
}

.avatar{
    width:48px;
    height:48px;
    min-width:48px;
    border-radius:50%;
    background:#128c7e;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:bold;
    margin-right:12px;
}

.chat-info{
    min-width:0;
    flex:1;
}

.chat-top{
    display:flex;
    justify-content:space-between;
    gap:8px;
}

.chat-name{
    font-size:15px;
    font-weight:bold;
    color:#222;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-time{
    font-size:11px;
    color:#777;
    white-space:nowrap;
}

.chat-last{
    margin-top:5px;
    font-size:13px;
    color:#777;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.unread{
    background:#25d366;
    color:#fff;
    min-width:21px;
    height:21px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:bold;
    margin-left:7px;
}

/* NEW MESSAGE */

.new-message-area{
    border-top:1px solid #ddd;
    padding:10px;
}

.new-message-btn{
    width:100%;
    border:none;
    background:#128c7e;
    color:#fff;
    padding:12px;
    border-radius:7px;
    font-size:14px;
    font-weight:bold;
}

.new-message-btn:hover{
    background:#0b766c;
}

/* CHAT */

.chat-panel{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    background:#efeae2;
}

.chat-header{
    height:70px;
    background:#075e54;
    color:#fff;
    display:flex;
    align-items:center;
    padding:10px 18px;
}

.chat-header .avatar{
    background:#128c7e;
}

.header-info{
    min-width:0;
}

.header-name{
    font-size:16px;
    font-weight:bold;
}

.header-status{
    font-size:12px;
    opacity:.85;
    margin-top:3px;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
    background-color:#efeae2;
    background-image:
        radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);
    background-size:20px 20px;
}

.message-row{
    display:flex;
    margin-bottom:7px;
}

.message-row.mine{
    justify-content:flex-end;
}

.message{
    max-width:70%;
    padding:8px 10px 5px;
    border-radius:8px;
    position:relative;
    box-shadow:0 1px 1px rgba(0,0,0,.08);
}

.message.mine .message{
    background:#d9fdd3;
    border-top-right-radius:2px;
}

.message.theirs .message{
    background:#fff;
    border-top-left-radius:2px;
}

.message-text{
    font-size:14px;
    color:#222;
    white-space:pre-wrap;
    word-break:break-word;
    line-height:1.4;
    padding-right:50px;
}

.message-meta{
    text-align:right;
    font-size:10px;
    color:#777;
    margin-top:3px;
    white-space:nowrap;
}

.read{
    color:#0b8ed1;
    font-weight:bold;
}

.sender-name{
    font-size:11px;
    color:#128c7e;
    font-weight:bold;
    margin-bottom:3px;
}

/* INPUT */

.message-input-area{
    background:#f0f2f5;
    padding:10px;
    display:flex;
    align-items:flex-end;
    gap:8px;
}

.message-input{
    flex:1;
    border:none;
    outline:none;
    resize:none;
    max-height:120px;
    min-height:42px;
    border-radius:22px;
    padding:12px 16px;
    font-size:14px;
}

.send-btn{
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    background:#128c7e;
    color:#fff;
    font-size:18px;
}

.send-btn:hover{
    background:#075e54;
}

/* EMPTY */

.empty{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    color:#777;
    text-align:center;
    padding:30px;
}

.empty-icon{
    font-size:65px;
    margin-bottom:15px;
}

.empty h2{
    color:#444;
    margin-bottom:8px;
}

.empty p{
    font-size:14px;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:500px;
    max-width:100%;
    max-height:90vh;
    overflow:hidden;
    background:#fff;
    border-radius:10px;
    box-shadow:0 10px 40px rgba(0,0,0,.3);
    display:flex;
    flex-direction:column;
}

.modal-header{
    background:#075e54;
    color:#fff;
    padding:17px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-header h3{
    font-size:18px;
}

.close-btn{
    border:none;
    background:transparent;
    color:#fff;
    font-size:25px;
}

.recipient-tabs{
    display:flex;
    border-bottom:1px solid #ddd;
}

.recipient-tab{
    flex:1;
    border:none;
    background:#fff;
    padding:13px 5px;
    font-size:13px;
}

.recipient-tab.active{
    color:#075e54;
    font-weight:bold;
    border-bottom:3px solid #075e54;
}

.modal-content{
    padding:15px;
    overflow-y:auto;
}

.recipient-search{
    width:100%;
    border:1px solid #ddd;
    outline:none;
    padding:12px;
    border-radius:7px;
    margin-bottom:10px;
}

.result-list{
    max-height:300px;
    overflow-y:auto;
}

.result-item{
    padding:12px;
    border:1px solid #eee;
    border-radius:7px;
    margin-bottom:7px;
    cursor:pointer;
}

.result-item:hover{
    background:#f0f7f5;
}

.result-title{
    font-weight:bold;
    font-size:14px;
}

.result-sub{
    color:#777;
    font-size:12px;
    margin-top:3px;
}

.selected-recipient{
    padding:10px;
    background:#e8f5e9;
    color:#075e54;
    border-radius:7px;
    margin-bottom:10px;
    display:none;
}

.compose-box{
    margin-top:12px;
}

.compose-box textarea{
    width:100%;
    min-height:100px;
    resize:vertical;
    border:1px solid #ddd;
    border-radius:7px;
    padding:12px;
    outline:none;
}

.modal-footer{
    padding:12px 15px;
    border-top:1px solid #ddd;
    display:flex;
    justify-content:flex-end;
    gap:8px;
}

.cancel-btn{
    border:none;
    background:#eee;
    padding:10px 18px;
    border-radius:6px;
}

.send-new-btn{
    border:none;
    background:#128c7e;
    color:#fff;
    padding:10px 18px;
    border-radius:6px;
    font-weight:bold;
}

.all-staff-box{
    border:1px solid #ddd;
    border-radius:8px;
    padding:15px;
    background:#fafafa;
}

.all-staff-box h4{
    margin-bottom:7px;
    color:#075e54;
}

.all-staff-count{
    color:#777;
    font-size:13px;
}

/* LOADING */

.loading{
    text-align:center;
    padding:30px;
    color:#777;
}

.no-results{
    text-align:center;
    padding:20px;
    color:#777;
    font-size:13px;
}

/* MOBILE */

@media(max-width:700px){

    .sidebar{
        width:100%;
        min-width:100%;
    }

    .chat-panel{
        display:none;
    }

    .app.chat-open .sidebar{
        display:none;
    }

    .app.chat-open .chat-panel{
        display:flex;
    }

    .mobile-back{
        display:block !important;
    }

    .message{
        max-width:85%;
    }
}

.mobile-back{
    display:none;
    border:none;
    background:transparent;
    color:#fff;
    font-size:24px;
    margin-right:10px;
}
</style>
</head>

<body>

<div class="app" id="app">

    <!-- SIDEBAR -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    doc,
    addDoc,
    setDoc,
    getDoc,
    getDocs,
    updateDoc,
    query,
    where,
    orderBy,
    onSnapshot,
    serverTimestamp,
    limit,
    arrayUnion
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

    apiKey: "AIzaSyAIv3091VM-gkmdwEAn7OhXWd9Cm2zh2bo",

    authDomain: "maasc-2026.firebaseapp.com",

    projectId: "maasc-2026",

    storageBucket: "maasc-2026.appspot.com",

    messagingSenderId: "585813001586",

    appId: "1:585813001586:web:664e0e90ff0725d2e849eb"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let currentUser = null;

let currentStaff = null;

let allStaff = [];

let currentChatId = null;

let currentChatUnsubscribe = null;

let conversationUnsubscribe = null;

let currentRecipient = null;

let recipientMode = "individual";

let conversations = [];

let unreadMap = {};

let staffMap = {};


/* =========================================================
   HELPERS
========================================================= */

function safeString(value){

    return value === undefined ||
           value === null
        ? ""
        : String(value);

}


function getStaffId(data){

    return safeString(
        data.staffId ||
        data.staffID ||
        data.id ||
        data.employeeId ||
        data.employeeID
    ).trim();

}


function getStaffName(data){

    return safeString(
        data.name ||
        data.staffName ||
        data.fullName ||
        data.displayName ||
        data.employeeName ||
        "Staff"
    ).trim();

}


function getDepartment(data){

    return safeString(
        data.department ||
        data.dept ||
        data.Department ||
        ""
    ).trim();

}


function isStaffActive(data){

    if(
        data.active === false ||
        data.isActive === false ||
        data.workerActive === false
    ){
        return false;
    }

    return true;

}


function getInitial(name){

    const value = safeString(name).trim();

    if(!value) return "?";

    return value.charAt(0).toUpperCase();

}


function escapeHtml(value){

    return safeString(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function formatTime(timestamp){

    if(!timestamp) return "";

    let date;

    try{

        if(timestamp.toDate){

            date = timestamp.toDate();

        }else{

            date = new Date(timestamp);

        }

        return date.toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }catch(e){

        return "";

    }

}


function formatDateTime(timestamp){

    if(!timestamp) return "";

    let date;

    try{

        if(timestamp.toDate){

            date = timestamp.toDate();

        }else{

            date = new Date(timestamp);

        }

        return date.toLocaleDateString(
            [],
            {
                day:"2-digit",
                month:"short",
                year:"numeric"
            }
        )
        +
        " "
        +
        date.toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }catch(e){

        return "";

    }

}


function conversationIdForIndividual(a,b){

    return [
        safeString(a),
        safeString(b)
    ]
    .sort()
    .join("__");

}


/* =========================================================
   LOAD ALL STAFF
========================================================= */

async function loadAllStaff(){

    try{

        const snapshot = await getDocs(
            collection(db,"staff")
        );

        allStaff = [];

        staffMap = {};

        snapshot.forEach(item => {

            const data = item.data();

            const staffId =
                getStaffId(data) ||
                item.id;

            if(!staffId) return;

            const staff = {

                firestoreId:item.id,

                staffId:staffId,

                name:getStaffName(data),

                department:getDepartment(data),

                active:isStaffActive(data),

                email:safeString(data.email)

            };

            allStaff.push(staff);

            staffMap[staffId] = staff;

        });


        allStaff.sort((a,b) =>
            a.name.localeCompare(
                b.name
            )
        );


        updateAllStaffCount();

        renderStaffResults("");

        renderDepartmentResults("");

        console.log(
            "STAFF LOADED:",
            allStaff.length
        );

    }catch(error){

        console.error(
            "STAFF LOAD ERROR:",
            error
        );

        document.getElementById(
            "staffResults"
        ).innerHTML =
            `<div class="no-results">
                Unable to load staff.
            </div>`;

    }

}


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            document.getElementById(
                "currentUser"
            ).textContent =
                "Not logged in";

            console.warn(
                "NO FIREBASE USER"
            );

            return;

        }


        currentUser = user;


        await loadAllStaff();


        await identifyCurrentStaff(user);


        if(currentStaff){

            document.getElementById(
                "currentUser"
            ).textContent =
                currentStaff.name +
                " • " +
                currentStaff.staffId;

            startConversationListener();

        }

    }
);


/* =========================================================
   IDENTIFY CURRENT STAFF
========================================================= */

async function identifyCurrentStaff(user){

    try{

        /*
           First try UID field.
        */

        let found = allStaff.find(
            staff =>
                staff.firestoreId === user.uid
        );


        /*
           Try staff UID field.
        */

        if(!found){

            found = allStaff.find(
                staff => {

                    const original =
                        allStaff.find(
                            x =>
                                x.firestoreId ===
                                staff.firestoreId
                        );

                    return false;

                }
            );

        }


        /*
           Try email.
        */

        if(!found && user.email){

            const email =
                user.email.toLowerCase();

            found = allStaff.find(
                staff =>
                    safeString(
                        staff.email
                    ).toLowerCase() === email
            );

        }


        /*
           Try localStorage values commonly
           used in your existing staff login.
        */

        if(!found){

            const possibleKeys = [

                "staffId",
                "staffID",
                "currentStaffId",
                "loggedInStaffId",
                "staff_id"

            ];

            for(
                const key of possibleKeys
            ){

                const stored =
                    localStorage.getItem(key);

                if(stored){

                    found =
                        allStaff.find(
                            staff =>
                                staff.staffId
                                    .toUpperCase() ===
                                stored
                                    .toUpperCase()
                        );

                    if(found) break;

                }

            }

        }


        /*
           Try Firebase user displayName
        */

        if(!found && user.displayName){

            found =
                allStaff.find(
                    staff =>
                        staff.name
                            .toLowerCase() ===
                        user.displayName
                            .toLowerCase()
                );

        }


        if(found){

            currentStaff = found;

            console.log(
                "CURRENT STAFF:",
                currentStaff
            );

        }else{

            console.error(
                "CURRENT STAFF NOT FOUND"
            );

            document.getElementById(
                "currentUser"
            ).textContent =
                "Staff profile not found";

        }

    }catch(error){

        console.error(
            "IDENTIFY STAFF ERROR:",
            error
        );

    }

}


/* =========================================================
   CONVERSATIONS LISTENER
========================================================= */

function startConversationListener(){

    if(!currentStaff) return;


    if(conversationUnsubscribe){

        conversationUnsubscribe();

    }


    const conversationsRef =
        collection(
            db,
            "staffConversations"
        );


    const q = query(
        conversationsRef,
        where(
            "participantIds",
            "array-contains",
            currentStaff.staffId
        )
    );


    conversationUnsubscribe =
        onSnapshot(
            q,
            snapshot => {

                conversations = [];

                snapshot.forEach(item => {

                    conversations.push({

                        id:item.id,

                        ...item.data()

                    });

                });


                conversations.sort(
                    (a,b) => {

                        const at =
                            a.lastMessageTime &&
                            a.lastMessageTime.toMillis
                                ? a.lastMessageTime.toMillis()
                                : 0;

                        const bt =
                            b.lastMessageTime &&
                            b.lastMessageTime.toMillis
                                ? b.lastMessageTime.toMillis()
                                : 0;

                        return bt - at;

                    }
                );


                renderConversations();

            },
            error => {

                console.error(
                    "CONVERSATION LIST ERROR:",
                    error
                );

            }
        );

}


/* =========================================================
   RENDER CONVERSATIONS
========================================================= */

function renderConversations(){

    const list =
        document.getElementById(
            "chatList"
        );

    const search =
        document.getElementById(
            "conversationSearch"
        )
        .value
        .trim()
        .toLowerCase();


    const filtered =
        conversations.filter(
            chat => {

                if(!search) return true;

                return safeString(
                    chat.title
                )
                .toLowerCase()
                .includes(search);

            }
        );


    if(!filtered.length){

        list.innerHTML = `
            <div class="no-results">
                No conversations yet.
            </div>
        `;

        return;

    }


    list.innerHTML = "";


    filtered.forEach(chat => {

        const div =
            document.createElement("div");

        div.className =
            "chat-item" +
            (
                currentChatId === chat.id
                    ? " active"
                    : ""
            );


        const title =
            chat.title ||
            "Staff Conversation";


        const initials =
            chat.type === "all"
                ? "A"
                : chat.type === "department"
                    ? "D"
                    : getInitial(title);


        const unread =
            Number(
                chat.unreadCounts &&
                chat.unreadCounts[
                    currentStaff.staffId
                ]
                || 0
            );


        div.innerHTML = `

            <div class="avatar">
                ${escapeHtml(initials)}
            </div>

            <div class="chat-info">

                <div class="chat-top">

                    <div class="chat-name">
                        ${escapeHtml(title)}
                    </div>

                    <div class="chat-time">
                        ${
                            formatTime(
                                chat.lastMessageTime
                            )
                        }
                    </div>

                </div>

                <div class="chat-last">

                    ${
                        escapeHtml(
                            chat.lastMessage ||
                            "No messages yet"
                        )
                    }

                </div>

            </div>

            ${
                unread > 0
                    ? `
                    <div class="unread">
                        ${unread > 99 ? "99+" : unread}
                    </div>
                    `
                    : ""
            }

        `;


        div.addEventListener(
            "click",
            () =>
                openConversation(
                    chat.id
                )
        );


        list.appendChild(div);

    });

}


/* =========================================================
   OPEN CONVERSATION
========================================================= */

async function openConversation(chatId){

    currentChatId = chatId;


    const chat =
        conversations.find(
            x => x.id === chatId
        );


    if(!chat) return;


    document.getElementById(
        "emptyChat"
    ).style.display = "none";


    document.getElementById(
        "chatHeader"
    ).style.display = "flex";


    document.getElementById(
        "messages"
    ).style.display = "block";


    document.getElementById(
        "messageInputArea"
    ).style.display = "flex";


    document.getElementById(
        "headerName"
    ).textContent =
        chat.title ||
        "Staff Conversation";


    document.getElementById(
        "headerAvatar"
    ).textContent =
        chat.type === "all"
            ? "A"
            : chat.type === "department"
                ? "D"
                : getInitial(
                    chat.title
                );


    document.getElementById(
        "headerStatus"
    ).textContent =
        chat.type === "all"
            ? "All Staff"
            : chat.type === "department"
                ? "Department Staff"
                : "Staff Conversation";


    if(currentChatUnsubscribe){

        currentChatUnsubscribe();

    }


    const messagesRef =
        collection(
            db,
            "staffConversations",
            chatId,
            "messages"
        );


    const q = query(
        messagesRef,
        orderBy(
            "timestamp",
            "asc"
        )
    );


    currentChatUnsubscribe =
        onSnapshot(
            q,
            snapshot => {

                renderMessages(
                    snapshot
                );

            },
            error => {

                console.error(
                    "MESSAGE LIST ERROR:",
                    error
                );

            }
        );


    /*
       Mark conversation read.
    */

    try{

        const chatRef =
            doc(
                db,
                "staffConversations",
                chatId
            );


        const currentUnread =
            chat.unreadCounts || {};


        currentUnread[
            currentStaff.staffId
        ] = 0;


        await updateDoc(
            chatRef,
            {
                unreadCounts:
                    currentUnread
            }
        );

    }catch(error){

        console.warn(
            "READ UPDATE:",
            error
        );

    }


    renderConversations();


    document.getElementById(
        "app"
    ).classList.add(
        "chat-open"
    );


    setTimeout(
        () => {

            document.getElementById(
                "messageInput"
            ).focus();

        },
        200
    );

}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(snapshot){

    const container =
        document.getElementById(
            "messages"
        );


    container.innerHTML = "";


    snapshot.forEach(item => {

        const data =
            item.data();


        const mine =
            data.senderId ===
            currentStaff.staffId;


        const row =
            document.createElement(
                "div"
            );


        row.className =
            "message-row " +
            (
                mine
                    ? "mine"
                    : "theirs"
            );


        const bubble =
            document.createElement(
                "div"
            );


        bubble.className =
            "message";


        let senderHtml = "";


        if(
            !mine &&
            (
                data.senderName ||
                data.senderId
            )
        ){

            senderHtml = `

                <div class="sender-name">

                    ${escapeHtml(
                        data.senderName ||
                        data.senderId
                    )}

                </div>

            `;

        }


        bubble.innerHTML = `

            ${senderHtml}

            <div class="message-text">

                ${escapeHtml(
                    data.text || ""
                )}

            </div>

            <div class="message-meta">

                ${formatTime(
                    data.timestamp
                )}

                ${
                    mine
                        ? `
                        <span
                            class="${
                                data.readBy &&
                                data.readBy.length > 1
                                    ? "read"
                                    : ""
                            }"
                        >
                            ${
                                data.readBy &&
                                data.readBy.length > 1
                                    ? "✓✓"
                                    : "✓"
                            }
                        </span>
                        `
                        : ""
                }

            </div>

        `;


        row.appendChild(
            bubble
        );


        container.appendChild(
            row
        );

    });


    container.scrollTop =
        container.scrollHeight;

}


/* =========================================================
   SEND MESSAGE IN CURRENT CHAT
========================================================= */

window.sendMessage = async function(){

    if(!currentChatId) return;

    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if(!text) return;


    if(!currentStaff){

        alert(
            "Staff profile not found."
        );

        return;

    }


    input.value = "";


    try{

        const chatRef =
            doc(
                db,
                "staffConversations",
                currentChatId
            );


        const chatSnapshot =
            await getDoc(
                chatRef
            );


        if(!chatSnapshot.exists()){

            alert(
                "Conversation no longer exists."
            );

            return;

        }


        const chat =
            chatSnapshot.data();


        const messageRef =
            collection(
                db,
                "staffConversations",
                currentChatId,
                "messages"
            );


        await addDoc(
            messageRef,
            {

                senderId:
                    currentStaff.staffId,

                senderName:
                    currentStaff.name,

                text:text,

                timestamp:
                    serverTimestamp(),

                readBy:[
                    currentStaff.staffId
                ]

            }
        );


        const unreadCounts =
            {
                ...(chat.unreadCounts || {})
            };


        const participants =
            chat.participantIds || [];


        participants.forEach(
            id => {

                if(
                    id !==
                    currentStaff.staffId
                ){

                    unreadCounts[id] =
                        Number(
                            unreadCounts[id] ||
                            0
                        ) + 1;

                }

            }
        );


        await updateDoc(
            chatRef,
            {

                lastMessage:text,

                lastMessageTime:
                    serverTimestamp(),

                lastSenderId:
                    currentStaff.staffId,

                unreadCounts:
                    unreadCounts

            }
        );


    }catch(error){

        console.error(
            "SEND MESSAGE ERROR:",
            error
        );


        alert(
            "Unable to send message.\n\n" +
            error.message
        );

        input.value = text;

    }

};

/* =========================================================
   RECIPIENT MODE
========================================================= */

window.selectRecipientMode =
function(mode){

    recipientMode = mode;


    document
        .querySelectorAll(
            ".recipient-tab"
        )
        .forEach(
            tab =>
                tab.classList.remove(
                    "active"
                )
        );


    if(mode === "individual"){

        document.getElementById(
            "tabIndividual"
        ).classList.add("active");

        document.getElementById(
            "individualSection"
        ).style.display = "block";

        document.getElementById(
            "departmentSection"
        ).style.display = "none";

        document.getElementById(
            "allSection"
        ).style.display = "none";

    }


    if(mode === "department"){

        document.getElementById(
            "tabDepartment"
        ).classList.add("active");

        document.getElementById(
            "individualSection"
        ).style.display = "none";

        document.getElementById(
            "departmentSection"
        ).style.display = "block";

        document.getElementById(
            "allSection"
        ).style.display = "none";

        renderDepartmentResults("");

    }


    if(mode === "all"){

        document.getElementById(
            "tabAll"
        ).classList.add("active");

        document.getElementById(
            "individualSection"
        ).style.display = "none";

        document.getElementById(
            "departmentSection"
        ).style.display = "none";

        document.getElementById(
            "allSection"
        ).style.display = "block";

        currentRecipient = {

            type:"all",

            title:"All Staff"

        };

    }


    updateSelectedRecipient();

};


/* =========================================================
   STAFF SEARCH
========================================================= */

document.getElementById(
    "staffSearch"
).addEventListener(
    "input",
    function(){

        renderStaffResults(
            this.value
        );

    }
);


function renderStaffResults(search){

    const container =
        document.getElementById(
            "staffResults"
        );


    if(!container) return;


    const term =
        safeString(search)
            .trim()
            .toLowerCase();


    let results =
        allStaff.filter(
            staff => {

                if(
                    currentStaff &&
                    staff.staffId ===
                    currentStaff.staffId
                ){

                    return false;

                }


                if(!term) return true;


                return (

                    staff.name
                        .toLowerCase()
                        .includes(term)

                    ||

                    staff.staffId
                        .toLowerCase()
                        .includes(term)

                    ||

                    staff.department
                        .toLowerCase()
                        .includes(term)

                );

            }
        );


    results =
        results.slice(
            0,
            50
        );


    if(!results.length){

        container.innerHTML = `
            <div class="no-results">
                No staff found.
            </div>
        `;

        return;

    }


    container.innerHTML = "";


    results.forEach(
        staff => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "result-item";


            div.innerHTML = `

                <div class="result-title">

                    ${escapeHtml(
                        staff.name
                    )}

                </div>

                <div class="result-sub">

                    ${escapeHtml(
                        staff.staffId
                    )}

                    ${
                        staff.department
                            ? " • " +
                              escapeHtml(
                                  staff.department
                              )
                            : ""
                    }

                </div>

            `;


            div.onclick = () => {

                currentRecipient = {

                    type:"individual",

                    staffId:
                        staff.staffId,

                    title:
                        staff.name,

                    name:
                        staff.name,

                    department:
                        staff.department

                };


                updateSelectedRecipient();

            };


            container.appendChild(
                div
            );

        }
    );

}


/* =========================================================
   DEPARTMENT SEARCH
========================================================= */

document.getElementById(
    "departmentSearch"
).addEventListener(
    "input",
    function(){

        renderDepartmentResults(
            this.value
        );

    }
);


function getDepartments(){

    const map = {};


    allStaff.forEach(
        staff => {

            if(!staff.department)
                return;


            const key =
                staff.department
                    .trim();


            if(!map[key]){

                map[key] = {

                    name:key,

                    count:0

                };

            }


            if(staff.active){

                map[key].count++;

            }

        }
    );


    return Object.values(map)
        .sort(
            (a,b) =>
                a.name.localeCompare(
                    b.name
                )
        );

}


function renderDepartmentResults(search){

    const container =
        document.getElementById(
            "departmentResults"
        );


    if(!container) return;


    const term =
        safeString(search)
            .trim()
            .toLowerCase();


    let departments =
        getDepartments();


    if(term){

        departments =
            departments.filter(
                dept =>
                    dept.name
                        .toLowerCase()
                        .includes(term)
            );

    }


    if(!departments.length){

        container.innerHTML = `
            <div class="no-results">
                No department found.
            </div>
        `;

        return;

    }


    container.innerHTML = "";


    departments.forEach(
        department => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "result-item";


            div.innerHTML = `

                <div class="result-title">

                    🏢 ${escapeHtml(
                        department.name
                    )}

                </div>

                <div class="result-sub">

                    ${
                        department.count
                    }
                    active staff

                </div>

            `;


            div.onclick = () => {

                currentRecipient = {

                    type:"department",

                    department:
                        department.name,

                    title:
                        department.name +
                        " Staff"

                };


                updateSelectedRecipient();

            };


            container.appendChild(
                div
            );

        }
    );

}


/* =========================================================
   ALL STAFF COUNT
========================================================= */

function updateAllStaffCount(){

    const activeCount =
        allStaff.filter(
            staff =>
                staff.active &&
                (
                    !currentStaff ||
                    staff.staffId !==
                    currentStaff.staffId
                )
        ).length;


    const element =
        document.getElementById(
            "allStaffCount"
        );


    if(element){

        element.textContent =
            activeCount +
            " active staff will receive this message.";

    }

}


/* =========================================================
   SELECTED RECIPIENT
========================================================= */

function updateSelectedRecipient(){

    const box =
        document.getElementById(
            "selectedRecipient"
        );


    if(!currentRecipient){

        box.style.display =
            "none";

        return;

    }


    box.style.display =
        "block";


    if(
        currentRecipient.type ===
        "individual"
    ){

        box.innerHTML =
            "👤 Sending to: <strong>" +
            escapeHtml(
                currentRecipient.name
            ) +
            "</strong> (" +
            escapeHtml(
                currentRecipient.staffId
            ) +
            ")";

    }
    else if(
        currentRecipient.type ===
        "department"
    ){

        box.innerHTML =
            "🏢 Sending to: <strong>" +
            escapeHtml(
                currentRecipient.department
            ) +
            "</strong> staff";

    }
    else{

        box.innerHTML =
            "📢 Sending to <strong>ALL ACTIVE STAFF</strong>";

    }

}


/* =========================================================
   RESET RECIPIENT
========================================================= */

function resetRecipient(){

    currentRecipient = null;


    document.getElementById(
        "newMessageText"
    ).value = "";


    document.getElementById(
        "staffSearch"
    ).value = "";


    document.getElementById(
        "departmentSearch"
    ).value = "";


    document.getElementById(
        "selectedRecipient"
    ).style.display =
        "none";


    renderStaffResults("");

    renderDepartmentResults("");

}


/* =========================================================
   SEND NEW MESSAGE
========================================================= */

window.sendNewMessage =
async function(){

    if(!currentStaff){

        alert(
            "Your staff profile could not be identified."
        );

        return;

    }


    const text =
        document.getElementById(
            "newMessageText"
        )
        .value
        .trim();


    if(!text){

        alert(
            "Please type a message."
        );

        return;

    }


    if(!currentRecipient){

        alert(
            "Please select a recipient."
        );

        return;

    }


    try{

        let participantStaff = [];


        /*
         INDIVIDUAL
        */

        if(
            currentRecipient.type ===
            "individual"
        ){

            participantStaff = [

                currentStaff,

                staffMap[
                    currentRecipient.staffId
                ]

            ].filter(Boolean);


        }


        /*
         DEPARTMENT
        */

        else if(
            currentRecipient.type ===
            "department"
        ){

            participantStaff =
                allStaff.filter(
                    staff =>

                        staff.active &&

                        staff.department
                            .trim()
                            .toLowerCase() ===
                        currentRecipient.department
                            .trim()
                            .toLowerCase()

                );


            if(
                !participantStaff.some(
                    staff =>
                        staff.staffId ===
                        currentStaff.staffId
                )
            ){

                participantStaff.push(
                    currentStaff
                );

            }

        }


        /*
         ALL STAFF
        */

        else if(
            currentRecipient.type ===
            "all"
        ){

            participantStaff =
                allStaff.filter(
                    staff =>
                        staff.active
                );


            if(
                !participantStaff.some(
                    staff =>
                        staff.staffId ===
                        currentStaff.staffId
                )
            ){

                participantStaff.push(
                    currentStaff
                );

            }

        }


        participantStaff =
            participantStaff.filter(
                Boolean
            );


        const participantIds =
            [
                ...new Set(
                    participantStaff.map(
                        staff =>
                            staff.staffId
                    )
                )
            ];


        if(
            participantIds.length <
            2
        ){

            alert(
                "No valid staff recipients found."
            );

            return;

        }


        let chatId = "";

        let title = "";

        let type =
            currentRecipient.type;


        /*
         INDIVIDUAL CHAT ID
        */

        if(
            type ===
            "individual"
        ){

            chatId =
                conversationIdForIndividual(
                    currentStaff.staffId,
                    currentRecipient.staffId
                );


            title =
                currentRecipient.name;

        }


        /*
         DEPARTMENT / ALL
        */

        else{

            /*
               Create a unique conversation
               for every new broadcast.

               This allows the sender to send
               multiple All Staff messages
               without mixing unrelated
               conversations.
            */

            const conversationRef =
                doc(
                    collection(
                        db,
                        "staffConversations"
                    )
                );


            chatId =
                conversationRef.id;


            title =
                type === "all"
                    ? "All Staff"
                    : currentRecipient.department +
                      " Staff";

        }


        const chatRef =
            doc(
                db,
                "staffConversations",
                chatId
            );


        /*
           For individual existing chat,
           get existing unread counts.
        */

        let existing = null;


        try{

            const existingSnapshot =
                await getDoc(
                    chatRef
                );


            if(
                existingSnapshot.exists()
            ){

                existing =
                    existingSnapshot.data();

            }

        }catch(e){}


        const unreadCounts =
            {
                ...(
                    existing &&
                    existing.unreadCounts
                        ? existing.unreadCounts
                        : {}
                )
            };


        participantIds.forEach(
            id => {

                unreadCounts[id] =
                    Number(
                        unreadCounts[id] ||
                        0
                    );

            }
        );


        participantIds.forEach(
            id => {

                if(
                    id !==
                    currentStaff.staffId
                ){

                    unreadCounts[id] =
                        Number(
                            unreadCounts[id] ||
                            0
                        ) + 1;

                }

            }
        );


        await setDoc(
            chatRef,
            {

                title:title,

                type:type,

                participantIds:
                    participantIds,

                participantNames:
                    participantStaff.map(
                        staff =>
                            staff.name
                    ),

                department:
                    currentRecipient.department ||
                    "",

                lastMessage:text,

                lastSenderId:
                    currentStaff.staffId,

                lastSenderName:
                    currentStaff.name,

                lastMessageTime:
                    serverTimestamp(),

                unreadCounts:
                    unreadCounts,

                createdBy:
                    currentStaff.staffId,

                createdAt:
                    existing &&
                    existing.createdAt
                        ? existing.createdAt
                        : serverTimestamp()

            },
            {
                merge:true
            }
        );


        const messagesRef =
            collection(
                db,
                "staffConversations",
                chatId,
                "messages"
            );


        await addDoc(
            messagesRef,
            {

                senderId:
                    currentStaff.staffId,

                senderName:
                    currentStaff.name,

                text:text,

                timestamp:
                    serverTimestamp(),

                readBy:[
                    currentStaff.staffId
                ]

            }
        );


        closeNewMessage();


        /*
           Open the newly created conversation.
        */

        setTimeout(
            () => {

                openConversation(
                    chatId
                );

            },
            500
        );


    }catch(error){

        console.error(
            "NEW MESSAGE ERROR:",
            error
        );


        alert(
            "Message could not be sent.\n\n" +
            error.message
        );

    }

};


/* =========================================================
   CONVERSATION SEARCH
========================================================= */

document.getElementById(
    "conversationSearch"
).addEventListener(
    "input",
    renderConversations
);


/* =========================================================
   ENTER TO SEND
========================================================= */

document.getElementById(

    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);
