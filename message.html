<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Staff Messaging</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f3f6fa;
    height:100vh;
    overflow:hidden;
}

/* =========================
   APP
========================= */

.app{
    height:100vh;
    width:100%;
    display:flex;
    background:#fff;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:330px;
    min-width:330px;
    height:100%;
    border-right:1px solid #ddd;
    background:#fff;
    display:flex;
    flex-direction:column;
}

.sidebar-header{
    padding:18px;
    border-bottom:1px solid #ddd;
}

.sidebar-title{
    font-size:22px;
    font-weight:bold;
    color:#1e3a8a;
    margin-bottom:15px;
}

.search-box{
    width:100%;
    padding:11px 13px;
    border:1px solid #d1d5db;
    border-radius:8px;
    outline:none;
    font-size:13px;
}

.search-box:focus{
    border-color:#2563eb;
}

.staff-list{
    flex:1;
    overflow-y:auto;
}

/* =========================
   STAFF ITEM
========================= */

.staff-item{
    width:100%;
    padding:13px 15px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
    border-bottom:1px solid #f0f0f0;
    transition:.15s;
}

.staff-item:hover{
    background:#f5f8ff;
}

.staff-item.active{
    background:#eaf1ff;
}

.avatar{
    width:44px;
    height:44px;
    min-width:44px;
    border-radius:50%;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:bold;
}

.staff-details{
    flex:1;
    min-width:0;
}

.staff-name{
    font-size:14px;
    font-weight:bold;
    color:#1f2937;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.staff-id{
    font-size:11px;
    color:#6b7280;
    margin-top:4px;
}

/* =========================
   CHAT
========================= */

.chat-area{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    height:100%;
}

.chat-header{
    height:70px;
    min-height:70px;
    display:flex;
    align-items:center;
    padding:10px 18px;
    background:white;
    border-bottom:1px solid #ddd;
}

.chat-header-details{
    display:none;
}

.chat-name{
    font-size:15px;
    font-weight:bold;
    color:#111827;
}

.chat-id{
    font-size:11px;
    color:#6b7280;
    margin-top:3px;
}

/* =========================
   MESSAGES
========================= */

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
    background:#f7f9fc;
}

.empty-message{
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:#888;
}

.empty-icon{
    font-size:50px;
    margin-bottom:12px;
}

.empty-title{
    font-size:15px;
    font-weight:bold;
    color:#555;
}

.empty-text{
    margin-top:6px;
    font-size:12px;
    color:#888;
}

/* =========================
   MESSAGE ROW
========================= */

.message-row{
    width:100%;
    display:flex;
    margin-bottom:12px;
}

.message-row.sent{
    justify-content:flex-end;
}

.message-row.received{
    justify-content:flex-start;
}

.message-bubble{
    max-width:65%;
    padding:10px 13px;
    border-radius:12px;
    font-size:13px;
    line-height:1.45;
    word-break:break-word;
}

.sent .message-bubble{
    background:#2563eb;
    color:#fff;
    border-bottom-right-radius:3px;
}

.received .message-bubble{
    background:#fff;
    color:#222;
    border:1px solid #ddd;
    border-bottom-left-radius:3px;
}

.message-time{
    font-size:9px;
    opacity:.65;
    margin-top:4px;
    text-align:right;
}

/* =========================
   INPUT
========================= */

.input-area{
    display:none;
    padding:12px;
    border-top:1px solid #ddd;
    background:#fff;
    gap:8px;
}

.message-input{
    flex:1;
    height:45px;
    resize:none;
    border:1px solid #d1d5db;
    border-radius:8px;
    outline:none;
    padding:12px;
    font-size:13px;
}

.message-input:focus{
    border-color:#2563eb;
}

.send-button{
    width:52px;
    height:45px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.send-button:hover{
    background:#1d4ed8;
}

.send-button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* =========================
   STATUS
========================= */

.status-box{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#111827;
    color:white;
    padding:11px 16px;
    border-radius:8px;
    font-size:12px;
    display:none;
    z-index:9999;
}

.status-box.show{
    display:block;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .sidebar{
        width:100%;
        min-width:100%;
    }

    .chat-area{
        display:none;
    }

    .app.mobile-chat .sidebar{
        display:none;
    }

    .app.mobile-chat .chat-area{
        display:flex;
    }

    .message-bubble{
        max-width:82%;
    }

}

</style>
</head>


<body>


<div class="app" id="app">


    <!-- =====================================
         STAFF SIDEBAR
    ====================================== -->

    <div class="sidebar">

        <div class="sidebar-header">

            <div class="sidebar-title">
                💬 Staff Messages
            </div>

            <input
                type="text"
                id="searchBox"
                class="search-box"
                placeholder="Search staff..."
            >

        </div>


        <div
            id="staffList"
            class="staff-list"
        >

            <div style="
                padding:30px;
                text-align:center;
                color:#888;
                font-size:13px;
            ">
                Loading staff...
            </div>

        </div>

    </div>



    <!-- =====================================
         CHAT AREA
    ====================================== -->

    <div class="chat-area">


        <!-- CHAT HEADER -->

        <div class="chat-header">


            <div
                id="chatAvatar"
                class="avatar"
            >
                ?
            </div>


            <div
                id="chatHeaderDetails"
                class="chat-header-details"
            >

                <div
                    id="chatName"
                    class="chat-name"
                >
                    Staff
                </div>

                <div
                    id="chatId"
                    class="chat-id"
                >
                    -
                </div>

            </div>


        </div>



        <!-- MESSAGES -->

        <div
            id="messages"
            class="messages"
        >

            <div class="empty-message">

                <div>

                    <div class="empty-icon">
                        💬
                    </div>

                    <div class="empty-title">
                        Select a staff member
                    </div>

                    <div class="empty-text">
                        Select a staff member to start messaging.
                    </div>

                </div>

            </div>

        </div>



        <!-- INPUT -->

        <div
            id="inputArea"
            class="input-area"
        >

            <textarea
                id="messageInput"
                class="message-input"
                placeholder="Type your message..."
            ></textarea>


            <button
                id="sendButton"
                class="send-button"
            >
                ➤
            </button>

        </div>


    </div>


</div>



<div
    id="statusBox"
    class="status-box"
></div>



<script type="module">


/* =========================================================
   FIREBASE IMPORTS
========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    query,
    where,
    onSnapshot,
    updateDoc,
    doc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyAIv3091VM-gkmdwEAn7OhXWd9Cm2zh2bo",

    authDomain:
        "maasc-2026.firebaseapp.com",

    projectId:
        "maasc-2026",

    storageBucket:
        "maasc-2026.appspot.com",

    messagingSenderId:
        "585813001586",

    appId:
        "1:585813001586:web:664e0e90ff0725d2e849eb"

};



/* =========================================================
   INITIALIZE
========================================================= */

const firebaseApp =
    initializeApp(firebaseConfig);


const auth =
    getAuth(firebaseApp);


const db =
    getFirestore(firebaseApp);



/* =========================================================
   VARIABLES
========================================================= */

let loggedInUser = null;

let loggedInStaff = null;

let staffList = [];

let selectedStaff = null;

let unsubscribeSent = null;

let unsubscribeReceived = null;

let sentMessages = [];

let receivedMessages = [];



/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
    auth,
    async function(user){

        console.log(
            "AUTH STATE:",
            user
        );


        loggedInUser = user;


        /*
           VERY IMPORTANT:

           Staff list loads independently.

           It does NOT depend on finding
           the current staff profile.
        */

        await loadStaffList();


        /*
           Find current staff separately.
        */

        if(user){

            findLoggedInStaff(user);

        }

    }
);



/* =========================================================
   LOAD STAFF LIST
========================================================= */

async function loadStaffList(){

    const container =
        document.getElementById(
            "staffList"
        );


    container.innerHTML = `

        <div style="
            padding:30px;
            text-align:center;
            color:#888;
            font-size:13px;
        ">
            Loading staff...
        </div>

    `;


    try{

        console.log(
            "READING FIRESTORE: staff"
        );


        const snapshot =
            await getDocs(
                collection(
                    db,
                    "staff"
                )
            );


        console.log(
            "STAFF COUNT:",
            snapshot.size
        );


        staffList = [];


        snapshot.forEach(
            function(documentSnapshot){

                const data =
                    documentSnapshot.data();


                console.log(
                    "STAFF DATA:",
                    documentSnapshot.id,
                    data
                );


                const staffId =
                    String(

                        data.staffId ||

                        data.staffID ||

                        data.staff_id ||

                        data.employeeId ||

                        data.employeeID ||

                        documentSnapshot.id

                    ).trim();


                const staffName =
                    String(

                        data.name ||

                        data.staffName ||

                        data.fullName ||

                        data.displayName ||

                        data.employeeName ||

                        data.staff_name ||

                        staffId

                    ).trim();


                /*
                   Department is optional.
                */

                const department =
                    String(

                        data.department ||

                        data.dept ||

                        data.departmentName ||

                        ""

                    ).trim();


                staffList.push({

                    docId:
                        documentSnapshot.id,

                    staffId:
                        staffId,

                    name:
                        staffName,

                    department:
                        department,

                    ...data

                });

            }
        );


        /*
           Sort by name.
        */

        staffList.sort(
            function(a,b){

                return getStaffName(a)
                    .toLowerCase()
                    .localeCompare(
                        getStaffName(b)
                            .toLowerCase()
                    );

            }
        );


        console.log(
            "FINAL STAFF LIST:",
            staffList
        );


        renderStaffList();


    }
    catch(error){

        console.error(
            "STAFF LOAD ERROR:",
            error
        );


        container.innerHTML = `

            <div style="
                padding:30px 20px;
                text-align:center;
                color:#dc2626;
                font-size:12px;
            ">

                <b>Staff loading failed</b>

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}



/* =========================================================
   FIND LOGGED IN STAFF
========================================================= */

function findLoggedInStaff(user){

    const uid =
        String(
            user.uid || ""
        ).trim();


    const email =
        String(
            user.email || ""
        )
        .trim()
        .toLowerCase();


    loggedInStaff = null;


    for(
        const staff
        of staffList
    ){

        const staffUid =
            String(

                staff.uid ||

                staff.authUid ||

                staff.userId ||

                staff.authUserId ||

                ""

            ).trim();


        const staffEmail =
            String(

                staff.email ||

                staff.officialEmail ||

                staff.officialMail ||

                staff.personalEmail ||

                ""

            )
            .trim()
            .toLowerCase();


        /*
           UID match
        */

        if(
            staffUid &&
            staffUid === uid
        ){

            loggedInStaff =
                staff;

            break;

        }


        /*
           Email match
        */

        if(
            email &&
            staffEmail &&
            email === staffEmail
        ){

            loggedInStaff =
                staff;

            break;

        }


        /*
           Document ID match
        */

        if(
            staff.docId === uid
        ){

            loggedInStaff =
                staff;

            break;

        }

    }


    console.log(
        "LOGGED IN STAFF:",
        loggedInStaff
    );


    /*
       Re-render so current staff can
       be hidden if matched.
    */

    renderStaffList();

}



/* =========================================================
   RENDER STAFF
========================================================= */

function renderStaffList(){

    const container =
        document.getElementById(
            "staffList"
        );


    container.innerHTML = "";


    if(
        staffList.length === 0
    ){

        container.innerHTML = `

            <div style="
                padding:30px;
                text-align:center;
                color:#777;
                font-size:13px;
            ">
                No staff found.
            </div>

        `;

        return;

    }


    let displayedCount = 0;


    staffList.forEach(
        function(staff){

            /*
               Hide current staff if
               current staff was identified.
            */

            if(
                loggedInStaff &&
                staff.staffId ===
                loggedInStaff.staffId
            ){

                return;

            }


            displayedCount++;


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "staff-item";


            item.dataset.staffId =
                staff.staffId;


            const name =
                getStaffName(
                    staff
                );


            const initials =
                getInitials(
                    name
                );


            item.innerHTML = `

                <div class="avatar">

                    ${escapeHtml(
                        initials
                    )}

                </div>


                <div class="staff-details">

                    <div class="staff-name">

                        ${escapeHtml(
                            name
                        )}

                    </div>


                    <div class="staff-id">

                        ${escapeHtml(
                            staff.staffId
                        )}

                        ${
                            staff.department
                            ?
                            " • " +
                            escapeHtml(
                                staff.department
                            )
                            :
                            ""
                        }

                    </div>

                </div>

            `;


            item.addEventListener(
                "click",
                function(){

                    openChat(
                        staff
                    );

                }
            );


            container.appendChild(
                item
            );

        }
    );


    if(
        displayedCount === 0
    ){

        container.innerHTML = `

            <div style="
                padding:30px;
                text-align:center;
                color:#777;
                font-size:13px;
            ">
                No other staff found.
            </div>

        `;

    }

}



/* =========================================================
   STAFF NAME
========================================================= */

function getStaffName(staff){

    if(!staff){

        return "";

    }


    return String(

        staff.name ||

        staff.staffName ||

        staff.fullName ||

        staff.displayName ||

        staff.employeeName ||

        staff.staff_name ||

        staff.staffId ||

        "Staff"

    ).trim();

}



/* =========================================================
   INITIALS
========================================================= */

function getInitials(name){

    const clean =
        String(
            name || ""
        ).trim();


    if(!clean){

        return "?";

    }


    const parts =
        clean.split(
            /\s+/
        );


    if(
        parts.length === 1
    ){

        return parts[0]
            .substring(
                0,
                2
            )
            .toUpperCase();

    }


    return (

        parts[0][0] +

        parts[
            parts.length - 1
        ][0]

    ).toUpperCase();

}



/* =========================================================
   SEARCH
========================================================= */

document.getElementById(
    "searchBox"
).addEventListener(
    "input",
    function(){

        const search =
            this.value
                .trim()
                .toLowerCase();


        document
            .querySelectorAll(
                ".staff-item"
            )
            .forEach(
                function(item){

                    const text =
                        item.textContent
                            .toLowerCase();


                    if(
                        text.includes(
                            search
                        )
                    ){

                        item.style.display =
                            "flex";

                    }
                    else{

                        item.style.display =
                            "none";

                    }

                }
            );

    }
);



/* =========================================================
   OPEN CHAT
========================================================= */

function openChat(staff){

    selectedStaff =
        staff;


    console.log(
        "OPENING CHAT:",
        staff
    );


    /*
       Active staff UI
    */

    document
        .querySelectorAll(
            ".staff-item"
        )
        .forEach(
            function(item){

                item.classList.remove(
                    "active"
                );

            }
        );


    const selected =
        document.querySelector(
            '.staff-item[data-staff-id="' +
            cssEscape(
                staff.staffId
            ) +
            '"]'
        );


    if(selected){

        selected.classList.add(
            "active"
        );

    }


    const name =
        getStaffName(
            staff
        );


    /*
       Header
    */

    document.getElementById(
        "chatAvatar"
    ).textContent =
        getInitials(
            name
        );


    document.getElementById(
        "chatName"
    ).textContent =
        name;


    document.getElementById(
        "chatId"
    ).textContent =
        staff.staffId;


    document.getElementById(
        "chatHeaderDetails"
    ).style.display =
        "block";


    /*
       Input
    */

    document.getElementById(
        "inputArea"
    ).style.display =
        "flex";


    /*
       Mobile
    */

    document.getElementById(
        "app"
    ).classList.add(
        "mobile-chat"
    );


    /*
       Load conversation
    */

    loadConversation();

}



/* =========================================================
   GET CURRENT STAFF ID
========================================================= */

function getCurrentStaffId(){

    if(
        loggedInStaff
    ){

        return String(

            loggedInStaff.staffId ||

            loggedInStaff.staffID ||

            loggedInStaff.docId ||

            ""

        ).trim();

    }


    /*
       If staff profile wasn't matched,
       use Firebase UID.

       This prevents the system from
       breaking.
    */

    if(
        loggedInUser
    ){

        return String(
            loggedInUser.uid
        ).trim();

    }


    return "";

}



/* =========================================================
   GET CURRENT STAFF NAME
========================================================= */

function getCurrentStaffName(){

    if(
        loggedInStaff
    ){

        return getStaffName(
            loggedInStaff
        );

    }


    if(
        loggedInUser
    ){

        return (
            loggedInUser.displayName ||
            loggedInUser.email ||
            "Staff"
        );

    }


    return "Staff";

}



/* =========================================================
   LOAD CONVERSATION
========================================================= */

function loadConversation(){

    if(
        !selectedStaff
    ){

        return;

    }


    if(
        unsubscribeSent
    ){

        unsubscribeSent();

        unsubscribeSent = null;

    }


    if(
        unsubscribeReceived
    ){

        unsubscribeReceived();

        unsubscribeReceived = null;

    }


    sentMessages = [];

    receivedMessages = [];


    const myId =
        getCurrentStaffId();


    const otherId =
        String(
            selectedStaff.staffId
        ).trim();


    if(
        !myId
    ){

        showStatus(
            "Current staff ID not available."
        );

        return;

    }


    /*
       SENT
    */

    const sentQuery =
        query(

            collection(
                db,
                "messages"
            ),

            where(
                "senderId",
                "==",
                myId
            ),

            where(
                "receiverId",
                "==",
                otherId
            )

        );


    /*
       RECEIVED
    */

    const receivedQuery =
        query(

            collection(
                db,
                "messages"
            ),

            where(
                "senderId",
                "==",
                otherId
            ),

            where(
                "receiverId",
                "==",
                myId
            )

        );


    unsubscribeSent =
        onSnapshot(
            sentQuery,
            function(snapshot){

                sentMessages =
                    snapshot.docs.map(
                        function(item){

                            return {

                                id:
                                    item.id,

                                ...item.data()

                            };

                        }
                    );


                renderConversation();

            },
            function(error){

                console.error(
                    "SENT MESSAGE ERROR:",
                    error
                );


                showStatus(
                    "Unable to load sent messages."
                );

            }
        );


    unsubscribeReceived =
        onSnapshot(
            receivedQuery,
            function(snapshot){

                receivedMessages =
                    snapshot.docs.map(
                        function(item){

                            return {

                                id:
                                    item.id,

                                ...item.data()

                            };

                        }
                    );


                renderConversation();


                markReceivedMessagesRead();

            },
            function(error){

                console.error(
                    "RECEIVED MESSAGE ERROR:",
                    error
                );


                showStatus(
                    "Unable to load received messages."
                );

            }
        );

}



/* =========================================================
   RENDER CONVERSATION
========================================================= */

function renderConversation(){

    const container =
        document.getElementById(
            "messages"
        );


    const allMessages = [

        ...sentMessages,

        ...receivedMessages

    ];


    allMessages.sort(
        function(a,b){

            return getTimestamp(
                a.timestamp
            )
            -
            getTimestamp(
                b.timestamp
            );

        }
    );


    container.innerHTML = "";


    if(
        allMessages.length === 0
    ){

        container.innerHTML = `

            <div class="empty-message">

                <div>

                    <div class="empty-icon">
                        💬
                    </div>

                    <div class="empty-title">
                        No messages yet
                    </div>

                    <div class="empty-text">
                        Send a message to start the conversation.
                    </div>

                </div>

            </div>

        `;

        return;

    }


    allMessages.forEach(
        function(message){

            const isSent =
                String(
                    message.senderId
                ) ===
                String(
                    getCurrentStaffId()
                );


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "message-row " +
                (
                    isSent
                    ?
                    "sent"
                    :
                    "received"
                );


            const bubble =
                document.createElement(
                    "div"
                );


            bubble.className =
                "message-bubble";


            const text =
                escapeHtml(
                    message.message || ""
                )
                .replace(
                    /\n/g,
                    "<br>"
                );


            let status = "";


            if(isSent){

                status =
                    message.read === true
                    ?
                    " ✓✓"
                    :
                    " ✓";

            }


            bubble.innerHTML = `

                <div>
                    ${text}
                </div>

                <div class="message-time">

                    ${formatTime(
                        message.timestamp
                    )}

                    ${status}

                </div>

            `;


            row.appendChild(
                bubble
            );


            container.appendChild(
                row
            );

        }
    );


    container.scrollTop =
        container.scrollHeight;

}



/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

    if(
        !selectedStaff
    ){

        showStatus(
            "Select a staff member."
        );

        return;

    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const message =
        input.value.trim();


    if(!message){

        return;

    }


    const senderId =
        getCurrentStaffId();


    if(!senderId){

        showStatus(
            "Current staff ID not available."
        );

        return;

    }


    const button =
        document.getElementById(
            "sendButton"
        );


    button.disabled =
        true;


    try{

        await addDoc(

            collection(
                db,
                "messages"
            ),

            {

                senderId:
                    senderId,

                senderName:
                    getCurrentStaffName(),

                receiverId:
                    String(
                        selectedStaff.staffId
                    ),

                receiverName:
                    getStaffName(
                        selectedStaff
                    ),

                message:
                    message,

                read:
                    false,

                timestamp:
                    serverTimestamp()

            }

        );


        input.value = "";

        input.focus();


    }
    catch(error){

        console.error(
            "SEND MESSAGE ERROR:",
            error
        );


        alert(
            "Message sending failed:\n\n" +
            error.message
        );

    }
    finally{

        button.disabled =
            false;

    }

}



/* =========================================================
   SEND BUTTON
========================================================= */

document.getElementById(
    "sendButton"
).addEventListener(
    "click",
    sendMessage
);



/* =========================================================
   ENTER TO SEND
========================================================= */

document.getElementById(
    "messageInput"
).addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);



/* =========================================================
   MARK READ
========================================================= */

async function markReceivedMessagesRead(){

    for(
        const message
        of receivedMessages
    ){

        if(
            message.read === true
        ){

            continue;

        }


        try{

            await updateDoc(

                doc(
                    db,
                    "messages",
                    message.id
                ),

                {

                    read:
                        true

                }

            );

        }
        catch(error){

            console.error(
                "MARK READ ERROR:",
                error
            );

        }

    }

}



/* =========================================================
   TIMESTAMP
========================================================= */

function getTimestamp(timestamp){

    if(!timestamp){

        return 0;

    }


    if(
        typeof timestamp.toMillis ===
        "function"
    ){

        return timestamp.toMillis();

    }


    if(
        timestamp.seconds
    ){

        return Number(
            timestamp.seconds
        ) * 1000;

    }


    return 0;

}



/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(timestamp){

    const value =
        getTimestamp(
            timestamp
        );


    if(!value){

        return "...";

    }


    return new Date(
        value
    ).toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}



/* =========================================================
   CSS ESCAPE
========================================================= */

function cssEscape(value){

    return String(
        value
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /"/g,
        '\\"'
    );

}



/* =========================================================
   STATUS
========================================================= */

function showStatus(message){

    const box =
        document.getElementById(
            "statusBox"
        );


    box.textContent =
        message;


    box.classList.add(
        "show"
    );


    setTimeout(
        function(){

            box.classList.remove(
                "show"
            );

        },
        3000
    );

}



/* =========================================================
   PAGE CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    function(){

        if(
            unsubscribeSent
        ){

            unsubscribeSent();

        }


        if(
            unsubscribeReceived
        ){

            unsubscribeReceived();

        }

    }
);
