<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Staff Messaging</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f3f6fa;
    color:#222;
}

/* HEADER */

.header{
    background:#17365d;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
}

.header h2{
    font-size:22px;
}

.staff-info{
    text-align:right;
    font-size:14px;
}

#loggedStaffName{
    font-weight:bold;
}

#loggedStaffId{
    opacity:.85;
    margin-top:3px;
}

/* MAIN */

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}

/* TOP */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.tabs{
    display:flex;
    gap:8px;
}

.tab{
    border:none;
    padding:11px 18px;
    border-radius:7px;
    cursor:pointer;
    background:#ddd;
    font-weight:bold;
}

.tab.active{
    background:#17365d;
    color:white;
}

.new-message-btn{
    border:none;
    background:#198754;
    color:white;
    padding:12px 20px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.new-message-btn:hover{
    background:#146c43;
}

.unread{
    background:#dc3545;
    color:white;
    border-radius:20px;
    padding:3px 8px;
    font-size:11px;
    margin-left:5px;
}

/* MESSAGE CARD */

.message-card{
    background:white;
    border-radius:10px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
    overflow:hidden;
}

.message-item{
    padding:18px;
    border-bottom:1px solid #eee;
    cursor:pointer;
    transition:.2s;
}

.message-item:hover{
    background:#f7f9fb;
}

.message-item.unread-message{
    background:#edf5ff;
    border-left:5px solid #17365d;
}

.message-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.person{
    font-weight:bold;
    font-size:16px;
}

.time{
    color:#777;
    font-size:12px;
}

.preview{
    margin-top:8px;
    color:#555;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.red-dot{
    display:inline-block;
    width:9px;
    height:9px;
    background:#dc3545;
    border-radius:50%;
    margin-right:6px;
}

.empty{
    padding:55px 20px;
    text-align:center;
    color:#777;
}

.loading{
    padding:40px;
    text-align:center;
    color:#777;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:9999;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:600px;
    max-height:90vh;
    overflow-y:auto;
    background:white;
    border-radius:12px;
    padding:25px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-header h3{
    color:#17365d;
}

.close{
    border:none;
    background:none;
    font-size:28px;
    cursor:pointer;
    color:#555;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

select,
textarea{
    width:100%;
    border:1px solid #ccc;
    border-radius:7px;
    padding:12px;
    font-size:14px;
    margin-bottom:18px;
}

textarea{
    min-height:150px;
    resize:vertical;
}

.send-btn{
    width:100%;
    border:none;
    background:#198754;
    color:white;
    padding:13px;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
}

.send-btn:hover{
    background:#146c43;
}

/* VIEW */

.detail{
    margin-bottom:10px;
    color:#666;
    font-size:14px;
}

.message-body{
    background:#f4f6f8;
    border-radius:8px;
    padding:18px;
    line-height:1.6;
    white-space:pre-wrap;
    margin:18px 0;
}

.action-row{
    display:flex;
    gap:8px;
}

.reply-btn{
    border:none;
    background:#17365d;
    color:white;
    padding:11px 18px;
    border-radius:7px;
    cursor:pointer;
}

.delete-btn{
    border:none;
    background:#dc3545;
    color:white;
    padding:11px 18px;
    border-radius:7px;
    cursor:pointer;
}

.status{
    margin-bottom:15px;
    padding:10px 13px;
    border-radius:7px;
    display:none;
    font-size:14px;
}

.status.error{
    display:block;
    background:#f8d7da;
    color:#842029;
}

.status.success{
    display:block;
    background:#d1e7dd;
    color:#0f5132;
}

@media(max-width:600px){

    .header{
        padding:15px;
    }

    .staff-info{
        text-align:left;
    }

    .topbar{
        align-items:stretch;
    }

    .tabs{
        width:100%;
    }

    .tab{
        flex:1;
    }

    .new-message-btn{
        width:100%;
    }

    .message-top{
        align-items:flex-start;
        flex-direction:column;
    }
}
</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

    <div>
        <h2>✉ Staff Messages</h2>
    </div>

    <div class="staff-info">
        <div id="loggedStaffName">Loading...</div>
        <div id="loggedStaffId"></div>
    </div>

</div>


<div class="container">

    <div id="statusBox" class="status"></div>


    <!-- TOP BAR -->

    <div class="topbar">

        <div class="tabs">

            <button
                id="inboxTab"
                class="tab active"
                onclick="showInbox()">

                📥 Inbox

                <span
                    id="unreadCount"
                    class="unread"
                    style="display:none;">
                    0
                </span>

            </button>


            <button
                id="sentTab"
                class="tab"
                onclick="showSent()">

                📤 Sent

            </button>

        </div>


        <button
            class="new-message-btn"
            onclick="openCompose()">

            ✍ New Message

        </button>

    </div>


    <!-- MESSAGE LIST -->

    <div class="message-card">

        <div id="messageList">

            <div class="loading">
                Loading messages...
            </div>

        </div>

    </div>

</div>


<!-- COMPOSE MODAL -->

<div
    id="composeModal"
    class="modal">

    <div class="modal-box">

        <div class="modal-header">

            <h3>New Message</h3>

            <button
                class="close"
                onclick="closeCompose()">

                ×

            </button>

        </div>


        <label>Select Staff</label>

        <select id="receiverSelect">

            <option value="">
                Loading staff...
            </option>

        </select>


        <label>Message</label>

        <textarea
            id="messageText"
            placeholder="Type your message here..."></textarea>


        <button
            class="send-btn"
            onclick="sendMessage()">

            Send Message

        </button>

    </div>

</div>


<!-- VIEW MESSAGE MODAL -->

<div
    id="viewModal"
    class="modal">

    <div class="modal-box">

        <div class="modal-header">

            <h3>Message</h3>

            <button
                class="close"
                onclick="closeView()">

                ×

            </button>

        </div>


        <div id="viewContent"></div>

    </div>

</div>


<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";


import {
    getFirestore,
    collection,
    getDocs,
    getDoc,
    doc,
    addDoc,
    updateDoc,
    onSnapshot,
    query,
    where,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyAIv3091VM-gkmdwEAn7OhXWd9Cm2zh2bo",

    authDomain:
        "maasc-2026.firebaseapp.com",

    projectId:
        "maasc-2026",

    storageBucket:
        "maasc-2026.appspot.com",

    messagingSenderId:
        "585813001586",

    appId:
        "1:585813001586:web:664e0e90ff0725d2e849eb"

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);


/* =========================================================
   VARIABLES
========================================================= */

let currentStaff = null;

let currentUser = null;

let allStaff = [];

let currentMode = "inbox";

let inboxUnsubscribe = null;

let sentUnsubscribe = null;


/* =========================================================
   START
========================================================= */

/*
 * IMPORTANT:
 *
 * We do NOT immediately reject the user when
 * Firebase Auth returns null.
 *
 * First we try the staff information already
 * stored by your existing dashboard/login.
 */

startMessaging();


async function startMessaging(){

    showLoading(
        "Loading your staff details..."
    );


    /*
     * Try existing dashboard/session information
     * FIRST.
     */

    const localStaff =
        getStaffFromLocalStorage();


    if(localStaff){

        console.log(
            "STAFF FOUND FROM SESSION:",
            localStaff
        );


        currentStaff =
            localStaff;


        displayCurrentStaff();


        await loadAllStaff();

        showInbox();

    }


    /*
     * Also listen for Firebase Auth.
     *
     * This is useful when your existing login
     * uses Firebase Authentication.
     */

    onAuthStateChanged(
        auth,
        async(user) => {

            currentUser = user;


            console.log(
                "FIREBASE AUTH USER:",
                user
            );


            if(user){

                /*
                 * If staff was not found from localStorage,
                 * try Firestore using the authenticated user.
                 */

                if(!currentStaff){

                    await findStaffFromFirebaseUser(
                        user
                    );

                }


                if(currentStaff){

                    displayCurrentStaff();

                    await loadAllStaff();

                    showInbox();

                }

            }

        }
    );


    /*
     * If localStorage had nothing and Firebase auth
     * is also not active, wait briefly before showing
     * the error.
     */

    setTimeout(() => {

        if(!currentStaff){

            showError(
                "Staff details could not be identified. " +
                "Please open this page from your logged-in staff dashboard."
            );

        }

    },2500);

}


/* =========================================================
   GET STAFF FROM EXISTING LOGIN SESSION
========================================================= */

function getStaffFromLocalStorage(){

    const possibleIds = [

        "staffId",
        "staffID",
        "staff_id",
        "employeeId",
        "employeeID",
        "employee_id"

    ];


    let staffId = "";


    for(
        const key of possibleIds
    ){

        const value =
            localStorage.getItem(key);


        if(
            value &&
            value.trim()
        ){

            staffId =
                value.trim();

            break;

        }

    }


    /*
     * Sometimes the entire staff object
     * is stored in localStorage.
     */

    const possibleObjects = [

        "staffData",
        "staffDetails",
        "currentStaff",
        "loggedStaff",
        "userData",
        "user"

    ];


    for(
        const key of possibleObjects
    ){

        try{

            const raw =
                localStorage.getItem(key);


            if(!raw) continue;


            const data =
                JSON.parse(raw);


            if(
                data &&
                (
                    data.staffId ||
                    data.staffID ||
                    data.staff_id ||
                    data.employeeId
                )
            ){

                const id =
                    String(
                        data.staffId ||
                        data.staffID ||
                        data.staff_id ||
                        data.employeeId
                    )
                    .trim()
                    .toUpperCase();


                return {

                    staffId:id,

                    name:
                        data.name ||
                        data.staffName ||
                        data.fullName ||
                        data.displayName ||
                        data.employeeName ||
                        id,

                    email:
                        data.email ||
                        data.officialEmail ||
                        data.personalEmail ||
                        ""

                };

            }

        }
        catch(e){

            /*
             * Ignore non-JSON localStorage values.
             */

        }

    }


    if(staffId){

        return {

            staffId:
                staffId.toUpperCase(),

            name:
                localStorage.getItem("staffName") ||
                localStorage.getItem("name") ||
                localStorage.getItem("fullName") ||
                staffId,

            email:
                localStorage.getItem("staffEmail") ||
                localStorage.getItem("email") ||
                ""

        };

    }


    return null;

}


/* =========================================================
   FIND STAFF FROM FIREBASE AUTH
========================================================= */

async function findStaffFromFirebaseUser(user){

    try{

        /*
         * First search UID.
         */

        let q =
            query(
                collection(db,"staff"),
                where(
                    "uid",
                    "==",
                    user.uid
                )
            );


        let snapshot =
            await getDocs(q);


        if(!snapshot.empty){

            const staffDoc =
                snapshot.docs[0];


            const data =
                staffDoc.data();


            currentStaff = {

                staffId:
                    String(
                        data.staffId ||
                        data.staffID ||
                        staffDoc.id
                    )
                    .trim()
                    .toUpperCase(),

                name:
                    data.name ||
                    data.staffName ||
                    data.fullName ||
                    data.displayName ||
                    staffDoc.id,

                email:
                    data.email ||
                    data.officialEmail ||
                    data.personalEmail ||
                    user.email ||
                    ""

            };


            return;

        }


        /*
         * Try email.
         */

        if(user.email){

            q =
                query(
                    collection(db,"staff"),
                    where(
                        "email",
                        "==",
                        user.email
                    )
                );


            snapshot =
                await getDocs(q);


            if(!snapshot.empty){

                const staffDoc =
                    snapshot.docs[0];


                const data =
                    staffDoc.data();


                currentStaff = {

                    staffId:
                        String(
                            data.staffId ||
                            data.staffID ||
                            staffDoc.id
                        )
                        .trim()
                        .toUpperCase(),

                    name:
                        data.name ||
                        data.staffName ||
                        data.fullName ||
                        staffDoc.id,

                    email:
                        data.email ||
                        user.email ||
                        ""

                };

            }

        }

    }
    catch(error){

        console.error(
            "Firebase staff search error:",
            error
        );

    }

}


/* =========================================================
   DISPLAY CURRENT STAFF
========================================================= */

function displayCurrentStaff(){

    if(!currentStaff) return;


    document
        .getElementById(
            "loggedStaffName"
        )
        .textContent =
            currentStaff.name;


    document
        .getElementById(
            "loggedStaffId"
        )
        .textContent =
            currentStaff.staffId;

}


/* =========================================================
   LOAD ALL STAFF
========================================================= */

async function loadAllStaff(){

    try{

        console.log(
            "Loading staff collection..."
        );


        const snapshot =
            await getDocs(
                collection(db,"staff")
            );


        console.log(
            "STAFF DOCUMENT COUNT:",
            snapshot.size
        );


        allStaff = [];


        snapshot.forEach(
            staffDoc => {

                const data =
                    staffDoc.data();


                /*
                 * Support several possible field names.
                 */

                const staffId =
                    String(

                        data.staffId ||

                        data.staffID ||

                        data.staff_id ||

                        data.employeeId ||

                        data.employeeID ||

                        staffDoc.id ||

                        ""

                    )
                    .trim()
                    .toUpperCase();


                if(!staffId){

                    return;

                }


                /*
                 * Do not show the logged-in staff
                 * as their own recipient.
                 */

                if(
                    currentStaff &&
                    staffId ===
                    currentStaff.staffId
                ){

                    return;

                }


                const name =
                    data.name ||

                    data.staffName ||

                    data.fullName ||

                    data.displayName ||

                    data.employeeName ||

                    data.NAME ||

                    staffId;


                const department =
                    data.department ||

                    data.Department ||

                    data.dept ||

                    data.DEPT ||

                    "";


                allStaff.push({

                    staffId:
                        staffId,

                    name:
                        String(name),

                    department:
                        String(department)

                });

            }
        );


        /*
         * Sort alphabetically.
         */

        allStaff.sort(
            (a,b) =>
                a.name.localeCompare(
                    b.name
                )
        );


        console.log(
            "STAFF AVAILABLE:",
            allStaff
        );


        populateStaffList();


    }
    catch(error){

        console.error(
            "STAFF LOAD ERROR:",
            error
        );


        showError(
            "Staff list could not be loaded: " +
            error.message
        );

    }

}


/* =========================================================
   POPULATE STAFF DROPDOWN
========================================================= */

function populateStaffList(){

    const select =
        document.getElementById(
            "receiverSelect"
        );


    select.innerHTML =
        "";


    if(allStaff.length === 0){

        select.innerHTML =
            `
            <option value="">
                No other staff found
            </option>
            `;

        return;

    }


    select.innerHTML =
        `
        <option value="">
            Select staff member
        </option>
        `;


    allStaff.forEach(
        staff => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                staff.staffId;


            option.textContent =
                staff.name +
                " (" +
                staff.staffId +
                ")" +
                (
                    staff.department
                        ? " - " +
                          staff.department
                        : ""
                );


            select.appendChild(
                option
            );

        }
    );

}


/* =========================================================
   SHOW INBOX
========================================================= */

window.showInbox = function(){

    currentMode =
        "inbox";


    document
        .getElementById("inboxTab")
        .classList.add("active");


    document
        .getElementById("sentTab")
        .classList.remove("active");


    if(sentUnsubscribe){

        sentUnsubscribe();

        sentUnsubscribe =
            null;

    }


    if(!currentStaff){

        showError(
            "Your staff details are not available."
        );

        return;

    }


    showLoading(
        "Loading inbox..."
    );


    if(inboxUnsubscribe){

        inboxUnsubscribe();

    }


    /*
     * IMPORTANT:
     * No orderBy() here.
     * This avoids composite index problems.
     */

    const q =
        query(
            collection(
                db,
                "messages"
            ),
            where(
                "receiverId",
                "==",
                currentStaff.staffId
            )
        );


    inboxUnsubscribe =
        onSnapshot(
            q,
            snapshot => {

                const messages = [];


                snapshot.forEach(
                    messageDoc => {

                        const data =
                            messageDoc.data();


                        if(
                            data.deletedByReceiver ===
                            true
                        ){

                            return;

                        }


                        messages.push({

                            id:
                                messageDoc.id,

                            ...data

                        });

                    }
                );


                sortMessages(
                    messages
                );


                renderMessages(
                    messages
                );


                updateUnreadCount(
                    messages
                );

            },
            error => {

                console.error(
                    "INBOX ERROR:",
                    error
                );


                showError(
                    "Inbox error: " +
                    error.message
                );

            }
        );

};


/* =========================================================
   SHOW SENT
========================================================= */

window.showSent = function(){

    currentMode =
        "sent";


    document
        .getElementById("sentTab")
        .classList.add("active");


    document
        .getElementById("inboxTab")
        .classList.remove("active");


    if(inboxUnsubscribe){

        inboxUnsubscribe();

        inboxUnsubscribe =
            null;

    }


    if(!currentStaff){

        showError(
            "Your staff details are not available."
        );

        return;

    }


    showLoading(
        "Loading sent messages..."
    );


    if(sentUnsubscribe){

        sentUnsubscribe();

    }


    const q =
        query(
            collection(
                db,
                "messages"
            ),
            where(
                "senderId",
                "==",
                currentStaff.staffId
            )
        );


    sentUnsubscribe =
        onSnapshot(
            q,
            snapshot => {

                const messages = [];


                snapshot.forEach(
                    messageDoc => {

                        const data =
                            messageDoc.data();


                        if(
                            data.deletedBySender ===
                            true
                        ){

                            return;

                        }


                        messages.push({

                            id:
                                messageDoc.id,

                            ...data

                        });

                    }
                );


                sortMessages(
                    messages
                );


                renderMessages(
                    messages
                );

            },
            error => {

                console.error(
                    "SENT ERROR:",
                    error
                );


                showError(
                    "Sent messages error: " +
                    error.message
                );

            }
        );

};


/* =========================================================
   SORT NEWEST FIRST
========================================================= */

function sortMessages(messages){

    messages.sort(
        (a,b) => {

            const aTime =
                getTime(
                    a.timestamp
                );


            const bTime =
                getTime(
                    b.timestamp
                );


            return bTime - aTime;

        }
    );

}


/* =========================================================
   GET TIME
========================================================= */

function getTime(timestamp){

    if(!timestamp){

        return 0;

    }


    if(
        typeof timestamp.toMillis ===
        "function"
    ){

        return timestamp.toMillis();

    }


    if(
        typeof timestamp.toDate ===
        "function"
    ){

        return timestamp.toDate()
            .getTime();

    }


    return 0;

}


/* =========================================================
   RENDER
========================================================= */

function renderMessages(messages){

    const list =
        document.getElementById(
            "messageList"
        );


    if(messages.length === 0){

        list.innerHTML =
            `
            <div class="empty">

                ${
                    currentMode === "inbox"

                    ? "📭 No messages received."

                    : "📤 No sent messages."

                }

            </div>
            `;

        return;

    }


    list.innerHTML =
        "";


    messages.forEach(
        message => {

            const item =
                document.createElement(
                    "div"
                );


            const isUnread =
                currentMode === "inbox" &&
                message.read !== true;


            item.className =
                "message-item " +
                (
                    isUnread
                        ? "unread-message"
                        : ""
                );


            const person =
                currentMode === "inbox"

                    ? (
                        message.senderName ||
                        message.senderId ||
                        "Unknown"
                    )

                    : (
                        message.receiverName ||
                        message.receiverId ||
                        "Unknown"
                    );


            item.innerHTML =
                `

                <div class="message-top">

                    <div class="person">

                        ${
                            isUnread
                                ? '<span class="red-dot"></span>'
                                : ''
                        }

                        ${escapeHTML(person)}

                    </div>


                    <div class="time">

                        ${formatTime(
                            message.timestamp
                        )}

                    </div>

                </div>


                <div class="preview">

                    ${escapeHTML(
                        message.message ||
                        ""
                    )}

                </div>

                `;


            item.onclick =
                () => openMessage(
                    message
                );


            list.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   UNREAD COUNT
========================================================= */

function updateUnreadCount(messages){

    const count =
        messages.filter(
            message =>
                message.read !== true
        ).length;


    const element =
        document.getElementById(
            "unreadCount"
        );


    element.textContent =
        count;


    element.style.display =
        count > 0
            ? "inline-block"
            : "none";

}


/* =========================================================
   OPEN MESSAGE
========================================================= */

async function openMessage(message){

    /*
     * Mark received message as read.
     */

    if(
        currentMode === "inbox" &&
        message.read !== true
    ){

        try{

            await updateDoc(
                doc(
                    db,
                    "messages",
                    message.id
                ),
                {

                    read:true,

                    readAt:
                        serverTimestamp()

                }
            );

        }
        catch(error){

            console.error(
                "READ ERROR:",
                error
            );

        }

    }


    const person =
        currentMode === "inbox"

            ? message.senderName

            : message.receiverName;


    const personId =
        currentMode === "inbox"

            ? message.senderId

            : message.receiverId;


    const html =
        `

        <div class="detail">

            <strong>
                ${
                    currentMode === "inbox"
                        ? "From"
                        : "To"
                }:
            </strong>

            ${escapeHTML(
                person || ""
            )}

        </div>


        <div class="detail">

            <strong>Staff ID:</strong>

            ${escapeHTML(
                personId || ""
            )}

        </div>


        <div class="detail">

            <strong>Time:</strong>

            ${formatTime(
                message.timestamp
            )}

        </div>


        <div class="message-body">

            ${escapeHTML(
                message.message || ""
            )}

        </div>


        <div class="action-row">

            ${
                currentMode === "inbox"

                ?

                `
                <button
                    class="reply-btn"
                    id="replyButton">

                    ↩ Reply

                </button>
                `

                :

                ""
            }


            <button
                class="delete-btn"
                id="deleteButton">

                🗑 Delete

            </button>

        </div>

        `;


    document
        .getElementById(
            "viewContent"
        )
        .innerHTML =
            html;


    if(
        currentMode === "inbox"
    ){

        document
            .getElementById(
                "replyButton"
            )
            .onclick =
                () => {

                    closeView();

                    openCompose();

                    setTimeout(
                        () => {

                            const select =
                                document
                                .getElementById(
                                    "receiverSelect"
                                );


                            select.value =
                                message.senderId;


                            document
                                .getElementById(
                                    "messageText"
                                )
                                .focus();

                        },
                        100
                    );

                };

    }


    document
        .getElementById(
            "deleteButton"
        )
        .onclick =
            () => deleteMessage(
                message.id
            );


    document
        .getElementById(
            "viewModal"
        )
        .classList.add(
            "show"
        );

}


/* =========================================================
   SEND MESSAGE
========================================================= */

window.sendMessage = async function(){

    if(!currentStaff){

        alert(
            "Your staff details are not loaded."
        );

        return;

    }


    const receiverId =
        document
            .getElementById(
                "receiverSelect"
            )
            .value;


    const text =
        document
            .getElementById(
                "messageText"
            )
            .value
            .trim();


    if(!receiverId){

        alert(
            "Please select a staff member."
        );

        return;

    }


    if(!text){

        alert(
            "Please type a message."
        );

        return;

    }


    const receiver =
        allStaff.find(
            staff =>
                staff.staffId ===
                receiverId
        );


    try{

        await addDoc(
            collection(
                db,
                "messages"
            ),
            {

                senderId:
                    currentStaff.staffId,

                senderName:
                    currentStaff.name,

                senderEmail:
                    currentStaff.email || "",

                receiverId:
                    receiverId,

                receiverName:
                    receiver
                        ? receiver.name
                        : receiverId,

                message:
                    text,

                timestamp:
                    serverTimestamp(),

                read:
                    false,

                readAt:
                    null,

                deletedBySender:
                    false,

                deletedByReceiver:
                    false

            }
        );


        document
            .getElementById(
                "messageText"
            )
            .value =
                "";


        document
            .getElementById(
                "receiverSelect"
            )
            .value =
                "";


        closeCompose();


        showSuccess(
            "Message sent successfully."
        );

    }
    catch(error){

        console.error(
            "SEND MESSAGE ERROR:",
            error
        );


        showError(
            "Message could not be sent: " +
            error.message
        );

    }

};


/* =========================================================
   DELETE
========================================================= */

async function deleteMessage(messageId){

    if(
        !confirm(
            "Delete this message?"
        )
    ){

        return;

    }


    try{

        const messageRef =
            doc(
                db,
                "messages",
                messageId
            );


        if(
            currentMode === "inbox"
        ){

            await updateDoc(
                messageRef,
                {
                    deletedByReceiver:true
                }
            );

        }
        else{

            await updateDoc(
                messageRef,
                {
                    deletedBySender:true
                }
            );

        }


        closeView();

    }
    catch(error){

        console.error(
            "DELETE ERROR:",
            error
        );


        showError(
            "Unable to delete message: " +
            error.message
        );

    }

}

/* =========================================================
   TIME
========================================================= */

function formatTime(timestamp){

    if(!timestamp){

        return "Just now";

    }


    let date;


    try{

        if(
            typeof timestamp.toDate ===
            "function"
        ){

            date =
                timestamp.toDate();

        }
        else{

            date =
                new Date(timestamp);

        }

    }
    catch(e){

        return "Just now";

    }


    if(
        isNaN(
            date.getTime()
        )
    ){

        return "Just now";

    }


    return date.toLocaleString(
        "en-IN",
        {

            day:"2-digit",

            month:"short",

            year:"numeric",

            hour:"2-digit",

            minute:"2-digit"

        }
    );

}


/* =========================================================
   UI HELPERS
========================================================= */

function showLoading(text){

    document
        .getElementById(
            "messageList"
        )
        .innerHTML =
            `
            <div class="loading">
                ${escapeHTML(text)}
            </div>
            `;

}


function showError(text){

    const box =
        document.getElementById(
            "statusBox"
        );


    box.className =
        "status error";


    box.textContent =
        text;


    setTimeout(
        () => {

            box.className =
                "status";

        },
        7000
    );

}


function showSuccess(text){

    const box =
        document.getElementById(
            "statusBox"
        );


    box.className =
        "status success";


    box.textContent =
        text;


    setTimeout(
        () => {

            box.className =
                "status";

        },
        4000
    );

}


/* =========================================================
   HTML SECURITY
========================================================= */

function escapeHTML(value){

    return String(value || "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
