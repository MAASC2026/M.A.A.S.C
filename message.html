<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Staff Messages</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f3f6fb;
    color:#1f2937;
}

.header{
    background:#1e3a8a;
    color:white;
    padding:20px 28px;
}

.header h1{
    font-size:24px;
}

.header p{
    margin-top:5px;
    opacity:.9;
    font-size:14px;
}

.container{
    max-width:1250px;
    margin:25px auto;
    padding:0 18px;
}

.layout{
    display:grid;
    grid-template-columns:330px 1fr;
    gap:20px;
}

.card{
    background:white;
    border-radius:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.left{
    min-height:650px;
}

.right{
    min-height:650px;
}

.card-header{
    padding:18px;
    border-bottom:1px solid #e5e7eb;
    font-weight:bold;
    font-size:17px;
}

.staff-search{
    padding:12px;
    border-bottom:1px solid #e5e7eb;
}

.staff-search input{
    width:100%;
    padding:10px;
    border:1px solid #d1d5db;
    border-radius:7px;
    outline:none;
}

.staff-list{
    max-height:560px;
    overflow-y:auto;
}

.staff-item{
    padding:13px 15px;
    border-bottom:1px solid #f0f0f0;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.staff-item:hover{
    background:#f3f7ff;
}

.staff-item.active{
    background:#dbeafe;
}

.staff-name{
    font-weight:bold;
    font-size:14px;
}

.staff-info{

}

.unread{
    background:#dc2626;
    color:white;
    min-width:22px;
    height:22px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;

    font-weight:bold;
}

.compose{
    padding:20px;
}

.recipient-tabs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.tab{
    padding:10px 15px;
    border:1px solid #d1d5db;
    border-radius:7px;
    background:#fff;
    cursor:pointer;
    font-weight:bold;
    font-size:13px;
}

.tab.active{
    background:#2563eb;
    color:white;
    border-color:#2563eb;
}

.group{
    margin-bottom:16px;
}

.group label{
    display:block;
    font-weight:bold;
    font-size:13px;
    margin-bottom:7px;
}

select,
textarea,
input{
    width:100%;
    padding:11px;
    border:1px solid #d1d5db;
    border-radius:7px;
    outline:none;
    font-size:14px;
}

textarea{
    min-height:140px;
    resize:vertical;
}

select:focus,
textarea:focus,
input:focus{
    border-color:#2563eb;
}

.btn{
    padding:11px 20px;
    border:0;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.send{
    background:#2563eb;
    color:white;
}

.send:hover{
    background:#1d4ed8;
}

.clear{
    background:#e5e7eb;
    margin-left:8px;
}

.message{
    padding:12px;
    margin-top:15px;
    border-radius:7px;
    display:none;
    font-size:13px;
}

.message.show{
    display:block;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.info{
    background:#dbeafe;
    color:#1e40af;
}

.conversation{
    display:none;
}

.conversation.show{
    display:block;
}

.conversation-header{
    padding:18px;
    border-bottom:1px solid #e5e7eb;
}

.conversation-header h2{
    font-size:18px;
}

.conversation-header p{
    font-size:12px;
    color:#6b7280;
    margin-top:4px;
}

.messages{
    height:450px;
    overflow-y:auto;
    padding:20px;
    background:#f8fafc;
}

.msg{
    max-width:75%;
    margin-bottom:15px;
}

.msg.mine{
    margin-left:auto;
}

.msg-bubble{
    padding:12px 14px;
    border-radius:10px;
    background:white;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
}

.msg.mine .msg-bubble{
    background:#dbeafe;
}

.msg-sender{
    font-size:11px;
    font-weight:bold;
    margin-bottom:5px;
    color:#374151;
}

.msg-time{
    font-size:10px;
    color:#6b7280;
    margin-top:5px;
}

.reply{
    display:flex;
    gap:8px;
    padding:15px;
    border-top:1px solid #e5e7eb;
}

.reply textarea{
    min-height:45px;
    max-height:100px;
}

.reply button{
    align-self:flex-end;
    height:45px;
}

.empty{
    text-align:center;
    color:#6b7280;
    padding:40px 15px;
}

.loading{
    text-align:center;
    padding:30px;
    color:#6b7280;
}

.top-actions{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.action-btn{
    padding:10px 14px;
    border-radius:7px;
    border:0;
    cursor:pointer;
    font-weight:bold;
}

.inbox-btn{
    background:#2563eb;
    color:white;
}

.sent-btn{
    background:#e5e7eb;
}

.count{
    display:inline-flex;
    min-width:20px;
    height:20px;
    align-items:center;
    justify-content:center;
    background:#dc2626;
    color:#fff;
    border-radius:50%;
    font-size:10px;
    margin-left:5px;
}

@media(max-width:850px){

    .layout{
        grid-template-columns:1fr;
    }

    .left{
        min-height:auto;
    }

    .staff-list{
        max-height:300px;
    }

    .right{
        min-height:auto;
    }

    .messages{
        height:400px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>💬 Staff Messaging</h1>
    <p>Send messages to individual staff, departments or all staff</p>
</div>

<div class="container">

    <div class="layout">

        <!-- LEFT -->
        <div class="card left">

            <div class="card-header">
                Staff
            </div>

            <div class="staff-search">
                <input
                    type="text"
                    id="staffSearch"
                    placeholder="Search staff...">
            </div>

            <div
                id="staffList"
                class="staff-list">

                <div class="loading">
                    Loading staff...
                </div>

            </div>

        </div>


        <!-- RIGHT -->
        <div class="card right">

            <div class="compose">

                <div class="top-actions">

                    <button
                        id="inboxBtn"
                        class="action-btn inbox-btn">

                        📥 Inbox
                        <span
                            id="unreadCount"
                            class="count"
                            style="display:none">
                            0
                        </span>

                    </button>

                    <button
                        id="sentBtn"
                        class="action-btn sent-btn">

                        📤 Sent

                    </button>

                </div>


                <div class="recipient-tabs">

                    <button
                        class="tab active"
                        data-type="individual">

                        👤 Individual Staff

                    </button>

                    <button
                        class="tab"
                        data-type="department">

                        🏢 Department Staff

                    </button>

                    <button
                        class="tab"
                        data-type="all">

                        📢 All Staff

                    </button>

                </div>


                <!-- INDIVIDUAL -->

                <div
                    id="individualBox">

                    <div class="group">

                        <label>
                            Select Staff
                        </label>

                        <select id="individualStaff">

                            <option value="">

                            </option>

                        </select>

                    </div>

                </div>


                <!-- DEPARTMENT -->

                <div
                    id="departmentBox"
                    style="display:none">

                    <div class="group">

                        <label>
                            Select Department
                        </label>

                        <select id="departmentSelect">

                            <option value="">
                                Select Department
                            </option>

                        </select>

                    </div>

                </div>


                <!-- ALL -->

                <div
                    id="allBox"
                    style="display:none">

                    <div class="message show info">

                        📢 This message will be sent to
                        <b>all active staff</b>.

                    </div>

                </div>


                <div class="group">

                    <label>
                        Message
                    </label>

                    <textarea
                        id="messageText"
                        placeholder="Type your message..."></textarea>

                </div>


                <button
                    id="sendBtn"
                    class="btn send">

                    SEND MESSAGE

                </button>


                <button
                    id="clearBtn"
                    class="btn clear">

                    CLEAR

                </button>


                <div
                    id="sendMessage"
                    class="message">
                </div>

            </div>


            <!-- CONVERSATION -->

            <div
                id="conversation"
                class="conversation">

                <div
                    class="conversation-header">

                    <h2 id="conversationTitle">
                        Messages
                    </h2>

                    <p id="conversationInfo">
                    </p>

                </div>


                <div
                    id="messages"
                    class="messages">

                    <div class="empty">
                        No messages
                    </div>

                </div>


                <div class="reply">

                    <textarea
                        id="replyText"
                        placeholder="Write a reply..."></textarea>

                    <button
                        id="replyBtn"
                        class="btn send">

                        Send

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>


<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    query,
    where,
    orderBy,
    onSnapshot,
    doc,
    updateDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyAIv3091VM-gkmdwEAn7OhXWd9Cm2zh2bo",

    authDomain:
        "maasc-2026.firebaseapp.com",

    projectId:
        "maasc-2026",

    storageBucket:
        "maasc-2026.appspot.com",

    messagingSenderId:
        "585813001586",

    appId:
        "1:585813001586:web:664e0e90ff0725d2e849eb"

};


const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


/* =========================================================
   VARIABLES
========================================================= */

let currentStaff = null;

let allStaff = [];

let currentType = "individual";

let selectedConversationStaff = null;

let unsubscribeInbox = null;

let unsubscribeConversation = null;


/* =========================================================
   HELPERS
========================================================= */

const $ =
    id => document.getElementById(id);


function clean(v){

    return String(v ?? "").trim();

}


function upper(v){

    return clean(v).toUpperCase();

}


function esc(v){

    return String(v ?? "")

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


function showMessage(
    text,
    type="success"
){

    const box =
        $("sendMessage");

    box.textContent =
        text;

    box.className =
        "message show " +
        type;

}


function hideMessage(){

    $("sendMessage")
        .className =
        "message";

}


/* =========================================================
   GET LOGGED IN STAFF
========================================================= */

function getLoggedInStaff(){

    const keys = [

        "staffSession",
        "staff_session",
        "loggedInStaff",
        "currentStaff",
        "staffData",
        "userData",
        "user"

    ];


    for(
        const key of keys
    ){

        try{

            const raw =
                localStorage.getItem(key) ||
                sessionStorage.getItem(key);

            if(!raw)
                continue;

            const data =
                JSON.parse(raw);

            if(
                data &&
                typeof data === "object"
            ){

                return data;

            }

        }
        catch(e){

        }

    }


    const idKeys = [

        "staffId",
        "staffID",
        "loggedInStaffId",
        "currentStaffId",
        "userStaffId"

    ];


    for(
        const key of idKeys
    ){

        const id =
            localStorage.getItem(key) ||
            sessionStorage.getItem(key);

        if(id){

            return {
                staffId:id
            };

        }

    }


    return null;

}


/* =========================================================
   STAFF FIELD HELPERS
========================================================= */

function getStaffId(d){

    return clean(

        d.staffId ??
        d.staffID ??
        d.staff_id ??
        d.id

    );

}


function getStaffName(d){

    return clean(

        d.staffName ??
        d.name ??
        d.staff_name ??
        d.displayName

    );

}


function getDepartment(d){

    return clean(

        d.department ??
        d.dept ??
        d.departmentName

    );

}


/* =========================================================
   LOAD CURRENT STAFF
========================================================= */

async function loadCurrentStaff(){

    const session =
        getLoggedInStaff();


    if(!session){

        alert(
            "Staff login session not found. Please login first."
        );

        return false;

    }


    const id =
        clean(

            session.staffId ??
            session.staffID ??
            session.staff_id ??
            session.id

        );


    if(!id){

        alert(
            "Staff ID was not found in the login session."
        );

        return false;

    }


    currentStaff = {

        staffId:id,

        staffName:
            clean(
                session.staffName ??
                session.name ??
                session.staff_name
            ),

        department:
            clean(
                session.department ??
                session.dept ??
                session.departmentName
            )

    };


    /*
     * Get latest details from Firestore.
     */

    try{

        const snap =
            await getDocs(
                collection(
                    db,
                    "staff"
                )
            );


        snap.forEach(
            d => {

                const data =
                    d.data();

                const sid =
                    getStaffId(data);


                if(
                    upper(sid) ===
                    upper(currentStaff.staffId)
                ){

                    currentStaff.staffName =
                        currentStaff.staffName ||
                        getStaffName(data);

                    currentStaff.department =
                        currentStaff.department ||
                        getDepartment(data);

                }

            }
        );

    }
    catch(e){

        console.error(
            "Staff lookup error:",
            e
        );

    }


    return true;

}


/* =========================================================
   LOAD STAFF
========================================================= */

async function loadStaff(){

    const box =
        $("staffList");

    box.innerHTML =
        `<div class="loading">Loading staff...</div>`;


    try{

        const snap =
            await getDocs(
                collection(
                    db,
                    "staff"
                )
            );


        const map =
            new Map();


        snap.forEach(
            d => {

                const data =
                    d.data();

                const staffId =
                    getStaffId(data);


                if(!staffId)
                    return;


                /*
                 * Don't show logged-in staff
                 * in recipient list.
                 */

                if(
                    upper(staffId) ===
                    upper(currentStaff.staffId)
                ){

                    return;

                }


                map.set(
                    upper(staffId),
                    {

                        id:
                            d.id,

                        staffId:
                            staffId,

                        staffName:
                            getStaffName(data) ||
                            staffId,

                        department:
                            getDepartment(data)

                    }
                );

            }
        );


        allStaff =
            Array.from(
                map.values()
            );


        allStaff.sort(
            (a,b) =>
                String(
                    a.staffName
                ).localeCompare(
                    String(
                        b.staffName
                    )
                )
        );


        populateIndividualStaff();

        populateDepartments();

        renderStaffList(
            allStaff
        );

    }
    catch(error){

        console.error(
            "STAFF LOAD ERROR:",
            error
        );


        box.innerHTML =
            `
            <div class="empty">

                Unable to load staff.

                <br><br>

                ${esc(
                    error.message
                )}

            </div>
            `;

    }

}


/* =========================================================
   POPULATE INDIVIDUAL STAFF
========================================================= */

function populateIndividualStaff(){

    const select =
        $("individualStaff");


    select.innerHTML =
        `
        <option value="">
            Select Staff
        </option>
        `;


    allStaff.forEach(
        staff => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                staff.staffId;


            option.textContent =

                staff.staffName +
                " (" +
                staff.staffId +
                ")" +
                (
                    staff.department
                        ? " - " +
                          staff.department
                        : ""
                );


            select.appendChild(
                option
            );

        }
    );

}


/* =========================================================
   POPULATE DEPARTMENTS
========================================================= */

function populateDepartments(){

    const select =
        $("departmentSelect");


    const departments =
        [
            ...new Set(

                allStaff

                    .map(
                        s =>
                            clean(
                                s.department
                            )
                    )

                    .filter(Boolean)

            )
        ];


    departments.sort(
        (a,b) =>
            a.localeCompare(b)
    );


    select.innerHTML =
        `
        <option value="">
            Select Department
        </option>
        `;


    departments.forEach(
        department => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                department;


            option.textContent =
                department;


            select.appendChild(
                option
            );

        }
    );

}


/* =========================================================
   STAFF LIST
========================================================= */

function renderStaffList(
    list
){

    const box =
        $("staffList");


    if(!list.length){

        box.innerHTML =
            `
            <div class="empty">
                No staff found.
            </div>
            `;

        return;

    }


    box.innerHTML =
        list.map(
            staff => `

            <div
                class="staff-item"
                data-id="${esc(
                    staff.staffId
                )}">

                <div>

                    <div class="staff-name">

                        ${esc(
                            staff.staffName
                        )}

                    </div>

                    <div class="staff-info">

                        ${esc(
                            staff.staffId
                        )}

                        ${
                            staff.department
                                ? " • " +
                                  esc(
                                      staff.department
                                  )
                                : ""
                        }

                    </div>

                </div>

                <span
                    class="unread"
                    id="unread-${safeId(
                        staff.staffId
                    )}"
                    style="display:none">
                    0
                </span>

            </div>

            `
        )
        .join("");


    box
        .querySelectorAll(
            ".staff-item"
        )
        .forEach(
            item => {

                item.addEventListener(
                    "click",
                    () => {

                        const staff =
                            allStaff.find(
                                s =>
                                    upper(
                                        s.staffId
                                    ) ===
                                    upper(
                                        item.dataset.id
                                    )
                            );


                        if(staff){

                            selectedConversationStaff =
                                staff;


                            openConversation(
                                staff
                            );

                        }

                    }
                );

            }
        );


    loadUnreadCounts();

}


/* =========================================================
   SAFE ID
========================================================= */

function safeId(v){

    return String(v)
        .replace(
            /[^a-zA-Z0-9_-]/g,
            "_"
        );

}


/* =========================================================
   TAB SWITCHING
========================================================= */

document
    .querySelectorAll(".tab")
    .forEach(
        tab => {

            tab.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(
                            ".tab"
                        )
                        .forEach(
                            t =>
                                t.classList.remove(
                                    "active"
                                )
                        );


                    tab.classList.add(
                        "active"
                    );


                    currentType =
                        tab.dataset.type;


                    $("individualBox")
                        .style
                        .display =
                            currentType ===
                            "individual"
                                ? "block"
                                : "none";


                    $("departmentBox")
                        .style
                        .display =
                            currentType ===
                            "department"
                                ? "block"
                                : "none";


                    $("allBox")
                        .style
                        .display =
                            currentType ===
                            "all"
                                ? "block"
                                : "none";


                    hideMessage();

                }
            );

        }
    );


/* =========================================================
   SEARCH
========================================================= */

$("staffSearch")
    .addEventListener(
        "input",
        e => {

            const text =
                upper(
                    e.target.value
                );


            const filtered =
                allStaff.filter(
                    staff =>

                        upper(
                            staff.staffName
                        ).includes(text)

                        ||

                        upper(
                            staff.staffId
                        ).includes(text)

                        ||

                        upper(
                            staff.department
                        ).includes(text)

                );


            renderStaffList(
                filtered
            );

        }
    );


/* =========================================================
   SEND MESSAGE
========================================================= */

$("sendBtn")
    .addEventListener(
        "click",
        sendMessage
    );


async function sendMessage(){

    hideMessage();


    const text =
        clean(
            $("messageText").value
        );


    if(!text){

        showMessage(
            "Please type a message.",
            "error"
        );

        return;

    }


    let recipients = [];


    /*
     * INDIVIDUAL
     */

    if(
        currentType ===
        "individual"
    ){

        const id =
            $("individualStaff").value;


        if(!id){

            showMessage(
                "Please select a staff member.",
                "error"
            );

            return;

        }


        const staff =
            allStaff.find(
                s =>
                    upper(
                        s.staffId
                    ) ===
                    upper(id)
            );


        if(!staff){

            showMessage(
                "Selected staff was not found.",
                "error"
            );

            return;

        }


        recipients = [
            staff
        ];

    }


    /*
     * DEPARTMENT
     */

    else if(
        currentType ===
        "department"
    ){

        const department =
            $("departmentSelect").value;


        if(!department){

            showMessage(
                "Please select a department.",
                "error"
            );

            return;

        }


        recipients =
            allStaff.filter(
                staff =>
                    upper(
                        staff.department
                    ) ===
                    upper(
                        department
                    )
            );


        if(!recipients.length){

            showMessage(
                "No staff found in this department.",
                "error"
            );

            return;

        }

    }


    /*
     * ALL STAFF
     */

    else if(
        currentType ===
        "all"
    ){

        recipients =
            [...allStaff];


        if(!recipients.length){

            showMessage(
                "No staff members are available.",
                "error"
            );

            return;

        }

    }


    const sendBtn =
        $("sendBtn");


    sendBtn.disabled =
        true;


    sendBtn.textContent =
        "SENDING...";


    try{

        /*
         * Each recipient gets an
         * independent Firestore message.
         *
         * This makes unread counts,
         * individual inboxes and
         * department messages work
         * correctly.
         */

        const promises =
            recipients.map(
                recipient =>

                    addDoc(
                        collection(
                            db,
                            "staffMessages"
                        ),
                        {

                            senderId:
                                currentStaff.staffId,

                            senderName:
                                currentStaff.staffName ||
                                currentStaff.staffId,

                            senderDepartment:
                                currentStaff.department ||
                                "",

                            receiverId:
                                recipient.staffId,

                            receiverName:
                                recipient.staffName,

                            receiverDepartment:
                                recipient.department ||
                                "",

                            message:
                                text,

                            type:
                                currentType,

                            isRead:
                                false,

                            createdAt:
                                serverTimestamp()

                        }
                    )
            );


        await Promise.all(
            promises
        );


        showMessage(

            currentType ===
            "all"

                ? `Message sent to ${recipients.length} staff members.`

                : currentType ===
                  "department"

                    ? `Message sent to ${recipients.length} staff members in the selected department.`

                    : `Message sent to ${recipients[0].staffName}.`,

            "success"

        );


        $("messageText")
            .value =
            "";


    }
    catch(error){

        console.error(
            "SEND MESSAGE ERROR:",
            error
        );


        showMessage(
            "Message could not be sent: " +
            error.message,
            "error"
        );

    }
    finally{

        sendBtn.disabled =
            false;

        sendBtn.textContent =
            "SEND MESSAGE";

    }

}

/* =========================================================
   LOAD CONVERSATION
========================================================= */

function loadConversation(
    staff
){

    if(
        unsubscribeConversation
    ){

        unsubscribeConversation();

    }


    const messagesRef =
        collection(
            db,
            "staffMessages"
        );


    /*
     * We intentionally query only
     * by sender/receiver instead of
     * requiring a composite Firestore
     * index.
     */

    const q =
        query(
            messagesRef,
            where(
                "senderId",
                "in",
                [
                    currentStaff.staffId,
                    staff.staffId
                ]
            )
        );


    unsubscribeConversation =
        onSnapshot(
            q,
            async snapshot => {

                const messages = [];


                snapshot.forEach(
                    d => {

                        const data =
                            d.data();


                        const isConversation =

                            (

                                upper(
                                    data.senderId
                                ) ===
                                upper(
                                    currentStaff.staffId
                                )

                                &&

                                upper(
                                    data.receiverId
                                ) ===
                                upper(
                                    staff.staffId
                                )

                            )

                            ||

                            (

                                upper(
                                    data.senderId
                                ) ===
                                upper(
                                    staff.staffId
                                )

                                &&

                                upper(
                                    data.receiverId
                                ) ===
                                upper(
                                    currentStaff.staffId
                                )

                            );


                        if(
                            isConversation
                        ){

                            messages.push({

                                id:
                                    d.id,

                                ...data

                            });

                        }

                    }
                );


                messages.sort(
                    (a,b) => {

                        const aTime =
                            a.createdAt?.seconds ||
                            0;

                        const bTime =
                            b.createdAt?.seconds ||
                            0;

                        return (
                            aTime -
                            bTime
                        );

                    }
                );


                renderConversation(
                    messages
                );


                /*
                 * Mark received messages
                 * as read.
                 */

                for(
                    const msg
                    of messages
                ){

                    if(

                        upper(
                            msg.receiverId
                        ) ===
                        upper(
                            currentStaff.staffId
                        )

                        &&

                        msg.isRead !==
                        true

                    ){

                        try{

                            await updateDoc(

                                doc(
                                    db,
                                    "staffMessages",
                                    msg.id
                                ),

                                {
                                    isRead:true
                                }

                            );

                        }
                        catch(e){

                            console.error(e);

                        }

                    }

                }

            },

            error => {

                console.error(
                    "CONVERSATION ERROR:",
                    error
                );

            }
        );

}


/* =========================================================
   RENDER CONVERSATION
========================================================= */

function renderConversation(
    messages
){

    const box =
        $("messages");


    if(!messages.length){

        box.innerHTML =
            `
            <div class="empty">

                No messages with this staff member.

            </div>
            `;

        return;

    }


    box.innerHTML =
        messages.map(
            msg => {

                const mine =

                    upper(
                        msg.senderId
                    ) ===
                    upper(
                        currentStaff.staffId
                    );


                const time =
                    formatTimestamp(
                        msg.createdAt
                    );


                return `

                <div
                    class="msg ${
                        mine
                            ? "mine"
                            : ""
                    }">

                    <div
                        class="msg-bubble">

                        <div
                            class="msg-sender">

                            ${esc(
                                msg.senderName ||
                                msg.senderId
                            )}

                        </div>

                        <div>

                            ${esc(
                                msg.message
                            )}

                        </div>

                        <div
                            class="msg-time">

                            ${esc(time)}

                        </div>

                    </div>

                </div>

                `;

            }
        )
        .join("");


    box.scrollTop =
        box.scrollHeight;

}

/* =========================================================
   UNREAD COUNTS
========================================================= */

function loadUnreadCounts(){

    if(
        unsubscribeInbox
    ){

        unsubscribeInbox();

    }


    const q =
        query(

            collection(
                db,
                "staffMessages"
            ),

            where(
                "receiverId",
                "==",
                currentStaff.staffId
            ),

            where(
                "isRead",
                "==",
                false
            )

        );


    unsubscribeInbox =
        onSnapshot(
            q,
            snapshot => {

                const count =
                    snapshot.size;


                const badge =
                    $("unreadCount");


                badge.textContent =
                    count;


                badge.style.display =
                    count > 0
                        ? "inline-flex"
                        : "none";


                /*
                 * Per-staff unread counts
                 */

                const counts =
                    {};


                snapshot.forEach(
                    d => {

                        const data =
                            d.data();


                        const id =
                            data.senderId;


                        if(!id)
                            return;


                        counts[id] =
                            (
                                counts[id] ||
                                0
                            ) + 1;

                    }
                );


                allStaff.forEach(
                    staff => {

                        const element =
                            document.getElementById(
                                "unread-" +
                                safeId(
                                    staff.staffId
                                )
                            );


                        if(!element)
                            return;


                        const number =
                            counts[
                                staff.staffId
                            ] || 0;


                        element.textContent =
                            number;


                        element.style.display =
                            number > 0
                                ? "flex"
                                : "none";

                    }
                );

            },

            error => {

                console.error(
                    "UNREAD ERROR:",
                    error
                );

            }
        );

}

            }
        );


        messages.sort(

                    0
                )
        );


        $("conversation")

            .textContent =
            "📥 Inbox";

            .textContent =

            messages.length

                ? messages.map(
                    msg => `

                    <div
                        class="msg">

                        <div
                            class="msg-bubble">

                            <div
                                class="msg-sender">

                                ${esc(
                                    msg.senderName ||
                                    msg.senderId
                                )}

                                ${
                                    msg.type ===
                                    "all"

                                        : msg.type ===
                                          "department"

                                            ? " • 🏢 Department"

                                            : ""
                                }

                            </div>


                            <div>

                                ${esc(
                                    msg.message
                                )}

                            </div>


                            <div
                                class="msg-time">

                                ${esc(
                                    formatTimestamp(
                                        msg.createdAt
                                    )
                                )}

                            </div>

                        </div>

                    </div>

                    `
                )
                .join("")

                :

                `
                <div class="empty">

                    No received messages.

                </div>
                `;


        /*
         * Mark all displayed inbox
         * messages as read.
         */

        for(
            const msg of messages

            if(
                msg.isRead !== true

                try{

                    await updateDoc(

                        doc(
                            db,

                            msg.id
                        ),

                        {
                            isRead:true
                        }

                    );

                }
                catch(e){

                    console.error(e);

                }

            }

        }

    }
    catch(error){

        console.error(error);


        $("messages")
            .innerHTML =

            `
            <div class="empty">

                Unable to load inbox.

                <br><br>

                ${esc(
                    error.message
                )}

            </div>
            `;

    }

}

/* =========================================================
   TIME
========================================================= */

function formatTimestamp(
    timestamp
){

    if(
        !timestamp
    ){

        return "Just now";

    }


    try{

        const date =
            timestamp.toDate
                ? timestamp.toDate()
                : new Date(
                    timestamp.seconds * 1000
                );


        return date.toLocaleString(
            "en-IN",
            {
                day:"2-digit",
                month:"short",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }
    catch(e){

        return "Just now";

    }

}
