<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Staff Messaging</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f7fb;
    height:100vh;
    overflow:hidden;
    color:#1f2937;
}

/* ================================
   MAIN
================================ */

.messaging-app{
    height:100vh;
    display:flex;
}

/* ================================
   LEFT PANEL
================================ */

.left-panel{
    width:340px;
    background:#fff;
    border-right:1px solid #e5e7eb;
    display:flex;
    flex-direction:column;
}

.left-header{
    padding:18px;
    border-bottom:1px solid #e5e7eb;
}

.title{
    font-size:21px;
    font-weight:bold;
    color:#172554;
}

.subtitle{
    margin-top:5px;
    font-size:12px;
    color:#6b7280;
}

.search-box{
    margin-top:15px;
}

.search-box input{
    width:100%;
    padding:11px 13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    outline:none;
    font-size:13px;
}

.search-box input:focus{
    border-color:#2563eb;
}

/* ================================
   CONVERSATIONS
================================ */

.conversations{
    flex:1;
    overflow-y:auto;
}

.conversation{
    padding:13px 15px;
    display:flex;
    gap:11px;
    border-bottom:1px solid #f1f5f9;
    cursor:pointer;
}

.conversation:hover{
    background:#f8fafc;
}

.conversation.active{
    background:#eff6ff;
}

.avatar{
    width:43px;
    height:43px;
    min-width:43px;
    border-radius:50%;
    background:#dbeafe;
    color:#1d4ed8;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:bold;
}

.conversation-content{
    min-width:0;
    flex:1;
}

.conversation-name-row{
    display:flex;
    justify-content:space-between;
    gap:5px;
}

.conversation-name{
    font-size:13px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.conversation-time{
    font-size:9px;
    color:#9ca3af;
    white-space:nowrap;
}

.conversation-preview{
    margin-top:4px;
    font-size:11px;
    color:#6b7280;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.unread-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#2563eb;
    margin-top:6px;
}

/* ================================
   CHAT
================================ */

.chat-panel{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

.chat-header{
    height:70px;
    background:#fff;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    padding:0 20px;
}

.chat-user-avatar{
    width:43px;
    height:43px;
    border-radius:50%;
    background:#dbeafe;
    color:#1d4ed8;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:bold;
    margin-right:12px;
}

.chat-user-name{
    font-size:14px;
    font-weight:bold;
}

.chat-user-id{
    font-size:10px;
    color:#6b7280;
    margin-top:3px;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
    background:#f8fafc;
}

.no-chat{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#9ca3af;
}

.no-chat-icon{
    font-size:55px;
    margin-bottom:10px;
}

.no-chat-title{
    font-size:15px;
    font-weight:bold;
    color:#6b7280;
}

.no-chat-text{
    font-size:11px;
    margin-top:5px;
}

/* ================================
   MESSAGE
================================ */

.message-row{
    display:flex;
    margin-bottom:10px;
}

.message-row.sent{
    justify-content:flex-end;
}

.message-row.received{
    justify-content:flex-start;
}

.message{
    max-width:65%;
    padding:9px 12px;
    border-radius:12px;
    font-size:12px;
    line-height:1.5;
}

.sent .message{
    background:#2563eb;
    color:#fff;
    border-bottom-right-radius:3px;
}

.received .message{
    background:#fff;
    border:1px solid #e5e7eb;
    border-bottom-left-radius:3px;
}

.message-time{
    font-size:8px;
    opacity:.65;
    text-align:right;
    margin-top:3px;
}

/* ================================
   INPUT
================================ */

.message-input-area{
    background:#fff;
    border-top:1px solid #e5e7eb;
    padding:12px;
    display:flex;
    gap:9px;
}

.message-input{
    flex:1;
    resize:none;
    height:43px;
    max-height:100px;
    padding:11px 12px;
    border:1px solid #d1d5db;
    border-radius:9px;
    outline:none;
    font-size:12px;
}

.message-input:focus{
    border-color:#2563eb;
}

.send-btn{
    width:46px;
    height:43px;
    border:none;
    border-radius:9px;
    background:#2563eb;
    color:#fff;
    font-size:18px;
    cursor:pointer;
}

.send-btn:hover{
    background:#1d4ed8;
}

.send-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* ================================
   NEW MESSAGE BUTTON
================================ */

.new-message-btn{
    margin-top:13px;
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
}

.new-message-btn:hover{
    background:#1d4ed8;
}

/* ================================
   MODAL
================================ */

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
}

.modal-overlay.show{
    display:flex;
}

.modal{
    width:500px;
    max-width:calc(100% - 25px);
    background:#fff;
    border-radius:12px;
    overflow:hidden;
}

.modal-header{
    padding:15px 18px;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-title{
    font-size:16px;
    font-weight:bold;
}

.close-btn{
    border:none;
    background:none;
    font-size:24px;
    color:#6b7280;
    cursor:pointer;
}

.modal-body{
    padding:18px;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;
    font-size:11px;
    font-weight:bold;
    margin-bottom:6px;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:10px;
    border:1px solid #d1d5db;
    border-radius:8px;
    outline:none;
    font-size:12px;
}

.form-group textarea{
    height:110px;
    resize:vertical;
}

.modal-footer{
    padding:13px 18px;
    border-top:1px solid #e5e7eb;
    display:flex;
    justify-content:flex-end;
    gap:8px;
}

.cancel-btn{
    padding:9px 15px;
    border:1px solid #d1d5db;
    border-radius:7px;
    background:#fff;
    cursor:pointer;
}

.send-new-btn{
    padding:9px 15px;
    border:none;
    border-radius:7px;
    background:#2563eb;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

/* ================================
   STATUS
================================ */

.status{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#111827;
    color:#fff;
    padding:10px 15px;
    border-radius:8px;
    font-size:12px;
    display:none;
    z-index:2000;
}

.status.show{
    display:block;
}

/* ================================
   MOBILE
================================ */

@media(max-width:700px){

    .left-panel{
        width:100%;
    }

    .chat-panel{
        display:none;
    }

    .messaging-app.chat-open .left-panel{
        display:none;
    }

    .messaging-app.chat-open .chat-panel{
        display:flex;
    }

    .message{
        max-width:82%;
    }

}
</style>
</head>

<body>

<div class="messaging-app" id="messagingApp">

    <!-- ============================
         LEFT
    ============================= -->

    <div class="left-panel">

        <div class="left-header">

            </div>

            <div class="subtitle">

<!-- ================================

================================ -->

<div
    class="modal-overlay"
    id="newMessageModal"
>

    <div class="modal">

        <div class="modal-header">

            <div class="modal-title">
                New Message
            </div>

            <button
                class="close-btn"
                id="closeModalBtn"
            >
                ×
            </button>

        </div>


        <div class="modal-body">

            <div class="form-group">

                <label>

                </label>

                <input

                >

            </div>

                    Staff
                </label>

                <select id="staffSelect">

                        Select Staff
                    </option>

            </div>

                <label>
                    Message
                </label>

        </div>


        <div class="modal-footer">

            <button

        </div>

</div>


<div
    class="status"
    id="status"

<script type="module">

/* ============================================================
   FIREBASE
============================================================ */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    query,
    where,
    onSnapshot,
    updateDoc,
    doc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ============================================================
   YOUR FIREBASE CONFIG
============================================================ */

const firebaseConfig = {

    apiKey:
        "AIzaSyAIv3091VM-gkmdwEAn7OhXWd9Cm2zh2bo",

    authDomain:
        "maasc-2026.firebaseapp.com",

    projectId:
        "maasc-2026",

    storageBucket:
        "maasc-2026.appspot.com",

    messagingSenderId:
        "585813001586",

    appId:
        "1:585813001586:web:664e0e90ff0725d2e849eb"

};


/* ============================================================
   INIT
============================================================ */

const app =
    initializeApp(
        firebaseConfig
    );

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* ============================================================
   GLOBAL VARIABLES
============================================================ */

let currentUser = null;

let currentStaff = null;

let staffList = [];

let messages = [];

let selectedStaffId = null;

let unsubscribeSent = null;

let unsubscribeReceived = null;


/* ============================================================
   AUTH

   IMPORTANT:
   NO LOGIN REDIRECT HERE.

   This module only checks the existing ERP
   authentication session.
============================================================ */

onAuthStateChanged(
    auth,
    async user => {

        console.log(
            "Messaging Auth:",
            user
        );


        if (!user) {

            showStatus(
                "Please login to ERP first."
            );

            renderNotLoggedIn();

            return;

        }


        currentUser =
            user;


        console.log(
            "Logged in UID:",
            user.uid
        );


        await loadCurrentStaff();

    }
);


/* ============================================================
   LOAD CURRENT STAFF
============================================================ */

async function loadCurrentStaff(){

    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "staff"
                )
            );


        let found = null;


        snapshot.forEach(
            item => {

                const data =
                    item.data();


                const uid =
                    String(
                        data.uid ||
                        data.authUid ||
                        data.userId ||
                        ""
                    ).trim();


                const email =
                    String(
                        data.email ||
                        data.personalEmail ||
                        data.officialEmail ||
                        data.officialMail ||
                        ""
                    )
                    .toLowerCase()
                    .trim();


                const authEmail =
                    String(
                        currentUser.email ||
                        ""
                    )
                    .toLowerCase()
                    .trim();


                const staffId =
                    String(
                        data.staffId ||
                        data.staffID ||
                        item.id
                    ).trim();


                /*
                 * Match UID
                 */

                if(
                    uid &&
                    uid === currentUser.uid
                ){

                    found = {
                        docId:item.id,
                        ...data,
                        staffId
                    };

                }


                /*
                 * Match document ID
                 */

                if(
                    item.id === currentUser.uid
                ){

                    found = {
                        docId:item.id,
                        ...data,
                        staffId
                    };

                }


                /*
                 * Match email
                 */

                if(
                    email &&
                    authEmail &&
                    email === authEmail
                ){

                    found = {
                        docId:item.id,
                        ...data,
                        staffId
                    };

                }

            }
        );


        if(!found){

            console.error(
                "STAFF PROFILE NOT FOUND"
            );

            console.log(
                "UID:",
                currentUser.uid
            );

            console.log(
                "EMAIL:",
                currentUser.email
            );


            renderStaffNotFound();

            return;

        }


        currentStaff =
            found;


        console.log(
            "CURRENT STAFF:",
            currentStaff
        );


        await loadStaffList();

        startMessaging();

    }

    catch(error){

        console.error(
            "STAFF LOAD ERROR:",
            error
        );

        showStatus(
            "Unable to load staff details."
        );

    }

}


/* ============================================================
   STAFF ID
============================================================ */

function myStaffId(){

    return String(

        currentStaff.staffId ||

        currentStaff.staffID ||

        currentStaff.docId ||

        currentUser.uid

    ).trim();

}


/* ============================================================
   STAFF NAME
============================================================ */

function myStaffName(){

    return (

        currentStaff.name ||

        currentStaff.staffName ||

        currentStaff.fullName ||

        currentStaff.displayName ||

        myStaffId()

    );

}


/* ============================================================
   LOAD STAFF
============================================================ */

async function loadStaffList(){

    const snapshot =
        await getDocs(
            collection(
                db,
                "staff"
            )
        );


    staffList = [];


    snapshot.forEach(
        item => {

            const data =
                item.data();


            const id =
                String(
                    data.staffId ||
                    data.staffID ||
                    item.id
                ).trim();


            if(
                id !== myStaffId()
            ){

                staffList.push({

                    docId:item.id,

                    staffId:id,

                    ...data

                });

            }

        }
    );


    staffList.sort(
        (a,b) => {

            const nameA =
                String(
                    a.name ||
                    a.staffName ||
                    ""
                )
                .toLowerCase();


            const nameB =
                String(
                    b.name ||
                    b.staffName ||
                    ""
                )
                .toLowerCase();


            return nameA.localeCompare(
                nameB
            );

        }
    );


    populateStaffSelect();

}


/* ============================================================
   START MESSAGING
============================================================ */

function startMessaging(){

    const id =
        myStaffId();


    console.log(
        "Messaging Staff ID:",
        id
    );


    const sentQuery =
        query(
            collection(
                db,
                "messages"
            ),
            where(
                "senderId",
                "==",
                id
            )
        );


    const receivedQuery =
        query(
            collection(
                db,
                "messages"
            ),
            where(
                "receiverId",
                "==",
                id
            )
        );


    if(
        unsubscribeSent
    ){

        unsubscribeSent();

    }


    if(
        unsubscribeReceived
    ){

        unsubscribeReceived();

    }


    let sentMessages = [];

    let receivedMessages = [];


    unsubscribeSent =
        onSnapshot(
            sentQuery,
            snapshot => {

                sentMessages =
                    snapshot.docs.map(
                        item => ({
                            id:item.id,
                            ...item.data()
                        })
                    );


                rebuildMessages(
                    sentMessages,
                    receivedMessages
                );

            },
            error => {

                console.error(
                    "SENT LISTENER ERROR:",
                    error
                );

            }
        );


    unsubscribeReceived =
        onSnapshot(
            receivedQuery,
            snapshot => {

                receivedMessages =
                    snapshot.docs.map(
                        item => ({
                            id:item.id,
                            ...item.data()
                        })
                    );


                rebuildMessages(
                    sentMessages,
                    receivedMessages
                );

            },
            error => {

                console.error(
                    "RECEIVED LISTENER ERROR:",
                    error
                );

            }
        );

}


/* ============================================================
   REBUILD
============================================================ */

function rebuildMessages(
    sent,
    received
){

    const map =
        new Map();


    [...sent,...received]
        .forEach(
            message => {

                map.set(
                    message.id,
                    message
                );

            }
        );


    messages =
        Array.from(
            map.values()
        );


    messages.sort(
        (a,b) => {

            return timeValue(
                a.timestamp
            )
            -
            timeValue(
                b.timestamp
            );

        }
    );


    renderConversations();


    if(
        selectedStaffId
    ){

        renderChat();

    }

}


/* ============================================================
   CONVERSATIONS
============================================================ */

function renderConversations(){

    const container =
        document.getElementById(
            "conversations"
        );


    const myId =
        myStaffId();


    const latest =
        new Map();


    messages.forEach(
        message => {

            let otherId;


            if(
                String(
                    message.senderId
                ) === myId
            ){

                otherId =
                    String(
                        message.receiverId
                    );

            }
            else{

                otherId =
                    String(
                        message.senderId
                    );

            }


            if(!otherId) return;


            latest.set(
                otherId,
                message
            );

        }
    );


    container.innerHTML = "";


    if(
        latest.size === 0
    ){

        container.innerHTML = `

            <div style="
                padding:30px;
                text-align:center;
                color:#9ca3af;
                font-size:12px;
            ">

                No conversations yet.

                <br><br>

                Click
                <b>New Message</b>
                to start.

            </div>

        `;

        return;

    }


    latest.forEach(
        (message,otherId) => {

            const staff =
                findStaff(
                    otherId
                );


            const name =
                staffName(
                    staff
                ) ||
                message.senderName ||
                message.receiverName ||
                otherId;


            const unread =
                String(
                    message.receiverId
                ) === myId
                &&
                message.read !== true;


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "conversation";


            if(
                selectedStaffId ===
                otherId
            ){

                item.classList.add(
                    "active"
                );

            }


            item.innerHTML = `

                <div class="avatar">

                    ${escapeHtml(
                        initials(name)
                    )}

                </div>


                <div class="conversation-content">

                    <div class="conversation-name-row">

                        <div class="conversation-name">

                            ${escapeHtml(
                                name
                            )}

                        </div>

                        <div class="conversation-time">

                            ${formatTime(
                                message.timestamp
                            )}

                        </div>

                    </div>


                    <div class="conversation-preview">

                        ${escapeHtml(
                            message.message || ""
                        )}

                    </div>

                </div>


                ${
                    unread
                    ?
                    `<div class="unread-dot"></div>`
                    :
                    ""
                }

            `;


            item.onclick =
                () =>
                    openConversation(
                        otherId
                    );


            container.appendChild(
                item
            );

        }
    );


    applyConversationSearch();

}


/* ============================================================
   OPEN CONVERSATION
============================================================ */

async function openConversation(
    staffId
){

    selectedStaffId =
        String(
            staffId
        );


    const staff =
        findStaff(
            selectedStaffId
        );


    const name =
        staffName(
            staff
        ) ||
        selectedStaffId;


    document.getElementById(
        "chatHeader"
    ).style.display =
        "flex";


    document.getElementById(
        "messageInputArea"
    ).style.display =
        "flex";


    document.getElementById(
        "chatName"
    ).textContent =
        name;


    document.getElementById(
        "chatStaffId"
    ).textContent =
        selectedStaffId;


    document.getElementById(
        "chatAvatar"
    ).textContent =
        initials(name);


    document.getElementById(
        "messagingApp"
    ).classList.add(
        "chat-open"
    );


    renderChat();


    await markRead(
        selectedStaffId
    );


    renderConversations();


    document.getElementById(
        "messageInput"
    ).focus();

}


/* ============================================================
   RENDER CHAT
============================================================ */

function renderChat(){

    if(
        !selectedStaffId
    ) return;


    const container =
        document.getElementById(
            "messages"
        );


    const id =
        myStaffId();


    const conversation =
        messages.filter(
            message => {

                return (

                    String(
                        message.senderId
                    ) === id

                    &&

                    String(
                        message.receiverId
                    ) ===
                    selectedStaffId

                )
                ||

                (

                    String(
                        message.senderId
                    ) ===
                    selectedStaffId

                    &&

                    String(
                        message.receiverId
                    ) === id

                );

            }
        );


    container.innerHTML = "";


    if(
        conversation.length === 0
    ){

        container.innerHTML = `

            <div class="no-chat">

                <div>

                    <div class="no-chat-icon">
                        💬
                    </div>

                    <div class="no-chat-title">
                        Start conversation
                    </div>

                    <div class="no-chat-text">
                        Type your first message below.
                    </div>

                </div>

            </div>

        `;

        return;

    }


    conversation.forEach(
        message => {

            const sent =
                String(
                    message.senderId
                ) === id;


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "message-row " +
                (
                    sent
                    ? "sent"
                    : "received"
                );


            const bubble =
                document.createElement(
                    "div"
                );


            bubble.className =
                "message";


            bubble.innerHTML = `

                <div>
                    ${escapeHtml(
                        message.message || ""
                    ).replace(
                        /\n/g,
                        "<br>"
                    )}
                </div>

                <div class="message-time">

                    ${formatTime(
                        message.timestamp
                    )}

                    ${
                        sent
                        ?
                        (
                            message.read
                            ? " ✓✓"
                            : " ✓"
                        )
                        :
                        ""
                    }

                </div>

            `;


            row.appendChild(
                bubble
            );


            container.appendChild(
                row
            );

        }
    );


    container.scrollTop =
        container.scrollHeight;

}


/* ============================================================
   SEND MESSAGE
============================================================ */

async function sendMessage(){

    if(
        !selectedStaffId
    ){

        showStatus(
            "Select a staff member."
        );

        return;

    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if(!text) return;


    const button =
        document.getElementById(
            "sendBtn"
        );


    button.disabled =
        true;


    try{

        await addDoc(
            collection(
                db,
                "messages"
            ),
            {

                senderId:
                    myStaffId(),

                senderName:
                    myStaffName(),

                receiverId:
                    selectedStaffId,

                receiverName:
                    getStaffName(
                        selectedStaffId
                    ),

                message:
                    text,

                read:
                    false,

                timestamp:
                    serverTimestamp()

            }
        );


        input.value = "";


    }
    catch(error){

        console.error(
            "SEND ERROR:",
            error
        );


        showStatus(
            "Message failed. Check Firestore rules."
        );

    }
    finally{

        button.disabled =
            false;

    }

}


/* ============================================================
   MARK READ
============================================================ */

async function markRead(
    otherId
){

    const id =
        myStaffId();


    const unread =
        messages.filter(
            message => {

                return (

                    String(
                        message.senderId
                    ) ===
                    String(otherId)

                    &&

                    String(
                        message.receiverId
                    ) === id

                    &&

                    message.read !== true

                );

            }
        );


    for(
        const message
        of unread
    ){

        try{

            await updateDoc(
                doc(
                    db,
                    "messages",
                    message.id
                ),
                {
                    read:true
                }
            );

        }
        catch(error){

            console.error(
                "READ UPDATE ERROR:",
                error
            );

        }

    }

}

/* ============================================================
   STAFF SELECT
============================================================ */

function populateStaffSelect(
    search=""
){

    const select =
        document.getElementById(
            "staffSelect"
        );


    select.innerHTML = `

        <option value="">
            Select Staff
        </option>

    `;


    const term =
        search
        .trim()
        .toLowerCase();


    staffList.forEach(
        staff => {

            const name =
                staffName(
                    staff
                );


            const department =
                staff.department ||
                staff.dept ||
                "";


            const text =
                (
                    name +
                    " " +
                    staff.staffId +
                    " " +
                    department
                )
                .toLowerCase();


            if(
                !term ||
                text.includes(
                    term
                )
            ){

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    staff.staffId;


                option.textContent =
                    `${name} (${staff.staffId})`;


                select.appendChild(
                    option
                );

            }

        }
    );

}


document.getElementById(
    "staffSearch"
).addEventListener(
    "input",
    event => {

        populateStaffSelect(
            event.target.value
        );

    }
);

            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    document
        .querySelectorAll(
            ".conversation"
        )

/* ============================================================
   HELPERS
============================================================ */

function findStaff(
    id
){

    return staffList.find(
        staff =>
            String(
                staff.staffId
            ) ===
            String(id)
    );

}


function getStaffName(
    id
){

    const staff =
        findStaff(id);


    if(!staff){

        return id;

    }


    return staffName(
        staff
    );

}


function staffName(
    staff
){

    if(!staff){

        return "";

    }


    return (

        staff.name ||

        staff.staffName ||

        staff.fullName ||

        staff.displayName ||

        staff.staffId ||

        ""

    );

}


function initials(
    name
){

    if(!name){

        return "?";

    }


    const parts =
        String(name)
        .trim()
        .split(/\s+/);


    if(
        parts.length === 1
    ){

        return parts[0]
            .substring(0,2)
            .toUpperCase();

    }


    return (
        parts[0][0] +
        parts[parts.length-1][0]
    ).toUpperCase();

}


function timeValue(
    timestamp
){

    if(!timestamp){

        return 0;

    }


    if(
        typeof timestamp.toMillis ===
        "function"
    ){

        return timestamp.toMillis();

    }


    if(
        timestamp.seconds
    ){

        return Number(
            timestamp.seconds
        ) * 1000;

    }


    return 0;

}


function formatTime(
    timestamp
){

    const value =
        timeValue(
            timestamp
        );


    if(!value){

        return "...";

    }


    return new Date(
        value
    ).toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* ============================================================
   STATUS
============================================================ */

function showStatus(
    message
){

    const status =
        document.getElementById(

    );

}
