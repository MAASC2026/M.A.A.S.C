<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Staff Messaging</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:#efeae2;
}

/* =====================================================
   MAIN
===================================================== */

.messaging-app{
    width:100%;
    height:100vh;
    display:flex;
}

/* =====================================================
   LEFT SIDE
===================================================== */

.sidebar{
    width:360px;
    min-width:360px;
    height:100vh;
    background:#fff;
    border-right:1px solid #ddd;
    display:flex;
    flex-direction:column;
}

.sidebar-header{
    height:70px;
    background:#500454;
    color:white;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.sidebar-title{
    font-size:20px;
    font-weight:bold;
}

.my-details{
    font-size:11px;
    margin-top:4px;
    opacity:.9;
}

.new-message-btn{
    border:none;
    background:white;
    color:#500454;
    width:38px;
    height:38px;
    border-radius:50%;
    font-size:20px;
    cursor:pointer;
}

.search-area{
    padding:10px;
    background:#f0f2f5;
}

.search-input{
    width:100%;
    border:none;
    outline:none;
    background:white;
    padding:11px 15px;
    border-radius:22px;
    font-size:14px;
}

.conversation-list{
    flex:1;
    overflow-y:auto;
}

.conversation{
    display:flex;
    align-items:center;
    padding:13px;
    border-bottom:1px solid #eee;
    cursor:pointer;
}

.conversation:hover{
    background:#f5f5f5;
}

.conversation.active{
    background:#e9edef;
}

.avatar{
    width:48px;
    height:48px;
    min-width:48px;
    border-radius:50%;
    background:#500454;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:bold;
    margin-right:12px;
}

.conversation-content{
    flex:1;
    min-width:0;
}

.conversation-top{
    display:flex;
    justify-content:space-between;
    gap:8px;
}

.conversation-name{
    font-weight:bold;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.conversation-time{
    color:#777;
    font-size:10px;
    white-space:nowrap;
}

.last-message{
    color:#777;
    font-size:12px;
    margin-top:5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.unread{
    background:#25d366;
    color:white;
    min-width:20px;
    height:20px;
    padding:0 5px;
    border-radius:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:10px;
    font-weight:bold;
    margin-left:7px;
}

.no-conversations{
    padding:40px 20px;
    text-align:center;
    color:#777;
    font-size:13px;
}

/* =====================================================
   CHAT
===================================================== */

.chat-area{
    flex:1;
    min-width:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:#efeae2;
}

.chat-header{
    height:70px;
    min-height:70px;
    background:#500454;
    color:white;
    display:none;
    align-items:center;
    padding:10px 16px;
}

.back-btn{
    display:none;
    border:none;
    background:none;
    color:white;
    font-size:28px;
    margin-right:8px;
    cursor:pointer;
}

.chat-avatar{
    width:44px;
    height:44px;
    border-radius:50%;
    background:white;
    color:#500454;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    margin-right:12px;
}

.chat-name{
    font-size:16px;
    font-weight:bold;
}

.chat-status{
    font-size:11px;
    opacity:.85;
    margin-top:3px;
}

.chat-messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
    display:none;
}

.message-row{
    display:flex;
    margin-bottom:8px;
}

.message-row.mine{
    justify-content:flex-end;
}

.message-bubble{
    max-width:70%;
    padding:8px 10px 5px;
    border-radius:8px;
    background:white;
    box-shadow:0 1px 1px rgba(0,0,0,.08);
}

.message-row.mine .message-bubble{
    background:#dcf8c6;
}

.message-sender{
    color:#500454;
    font-size:11px;
    font-weight:bold;
    margin-bottom:4px;
}

.message-text{
    font-size:14px;
    line-height:1.45;
    white-space:pre-wrap;
    word-break:break-word;
}

.message-time{
    text-align:right;
    color:#777;
    font-size:9px;
    margin-top:4px;
}

.message-input-area{
    display:none;
    padding:9px;
    background:#f0f2f5;
    gap:8px;
}

.message-input{
    flex:1;
    resize:none;
    border:none;
    outline:none;
    border-radius:22px;
    padding:12px 16px;
    min-height:44px;
    max-height:120px;
    font-size:14px;
}

.send-button{
    width:44px;
    height:44px;
    min-width:44px;
    border:none;
    border-radius:50%;
    background:#500454;
    color:white;
    font-size:18px;
    cursor:pointer;
}

/* =====================================================
   WELCOME
===================================================== */

.welcome{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#777;
}

.welcome-icon{
    font-size:65px;
    margin-bottom:15px;
}

.welcome h2{
    color:#500454;
    margin-bottom:8px;
}

.welcome p{
    font-size:14px;
}

/* =====================================================
   MODAL
===================================================== */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    justify-content:center;
    align-items:center;
    padding:15px;
    z-index:9999;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:540px;
    max-width:100%;
    max-height:90vh;
    background:white;
    border-radius:10px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

.modal-header{
    background:#500454;
    color:white;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.close-modal{
    border:none;
    background:none;
    color:white;
    font-size:25px;
    cursor:pointer;
}

.tabs{
    display:flex;
    border-bottom:1px solid #ddd;
}

.tab{
    flex:1;
    padding:13px 5px;
    border:none;
    background:white;
    cursor:pointer;
    font-weight:bold;
}

.tab.active{
    color:#500454;
    border-bottom:3px solid #500454;
}

.modal-body{
    padding:15px;
    overflow-y:auto;
}

.search-box{
    width:100%;
    border:1px solid #ddd;
    outline:none;
    border-radius:7px;
    padding:11px;
    margin-bottom:10px;
}

.results{
    max-height:250px;
    overflow-y:auto;
}

.result-item{
    border:1px solid #eee;
    padding:11px;
    margin-bottom:7px;
    border-radius:7px;
    cursor:pointer;
}

.result-item:hover{
    background:#f5f0f5;
}

.result-name{
    font-weight:bold;
    font-size:14px;
}

.result-details{
    color:#777;
    font-size:11px;
    margin-top:4px;
}

.selected-recipient{
    margin-top:10px;
    background:#f3e8f4;
    color:#500454;
    padding:10px;
    border-radius:7px;
    display:none;
    font-size:13px;
}

.compose-box{
    margin-top:12px;
}

.compose-box textarea{
    width:100%;
    min-height:100px;
    resize:vertical;
    border:1px solid #ddd;
    outline:none;
    border-radius:7px;
    padding:12px;
    font-size:14px;
}

.modal-footer{
    border-top:1px solid #ddd;
    padding:12px;
    display:flex;
    justify-content:flex-end;
    gap:8px;
}

.cancel-btn{
    border:none;
    padding:10px 18px;
    border-radius:6px;
    cursor:pointer;
}

.send-new-btn{
    border:none;
    padding:10px 18px;
    border-radius:6px;
    background:#500454;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.all-info{
    background:#f7f7f7;
    border:1px solid #ddd;
    border-radius:8px;
    padding:18px;
}

.all-info h3{
    color:#500454;
    margin-bottom:8px;
}

.all-info p{
    color:#777;
    font-size:13px;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:700px){

    .sidebar{
        width:100%;
        min-width:100%;
    }

    .chat-area{
        display:none;
    }

    .messaging-app.chat-open .sidebar{
        display:none;
    }

    .messaging-app.chat-open .chat-area{
        display:flex;
    }

    .back-btn{
        display:block;
    }

    .message-bubble{
        max-width:85%;
    }

}

</style>

</head>

<body>

<div class="messaging-app" id="messagingApp">

<!-- ===================================================
     SIDEBAR
=================================================== -->

<div class="sidebar">

    <div class="sidebar-header">

        <div>

            <div class="sidebar-title">
                Staff Messages
            </div>

            <div
                class="my-details"
                id="myDetails">
                Loading...
            </div>

        </div>

        <button
            class="new-message-btn"
            id="newMessageBtn">
            +
        </button>

    </div>


    <div class="search-area">

        <input
            type="text"
            class="search-input"
            id="conversationSearch"
            placeholder="🔍 Search conversations">

    </div>


    <div
        class="conversation-list"
        id="conversationList">

        <div class="no-conversations">
            Loading messages...
        </div>

    </div>

</div>


<!-- ===================================================
     CHAT
=================================================== -->

<div class="chat-area">

    <div
        class="welcome"
        id="welcomeScreen">

        <div class="welcome-icon">
            💬
        </div>

        <h2>
            Staff Messaging
        </h2>

        <p>
            Select a conversation or click + to send a message.
        </p>

    </div>


    <div
        class="chat-header"
        id="chatHeader">

        <button
            class="back-btn"
            id="backBtn">
            ‹
        </button>

        <div
            class="chat-avatar"
            id="chatAvatar">
            ?
        </div>

        <div>

            <div
                class="chat-name"
                id="chatName">
                Staff
            </div>

            <div
                class="chat-status"
                id="chatStatus">
                Staff
            </div>

        </div>

    </div>


    <div
        class="chat-messages"
        id="chatMessages">
    </div>


    <div
        class="message-input-area"
        id="messageInputArea">

        <textarea
            class="message-input"
            id="messageInput"
            rows="1"
            placeholder="Type a message..."></textarea>

        <button
            class="send-button"
            id="sendButton">
            ➤
        </button>

    </div>

</div>

</div>


<!-- ===================================================
     NEW MESSAGE MODAL
=================================================== -->

<div
    class="modal"
    id="messageModal">

    <div class="modal-box">

        <div class="modal-header">

            <h3>
                New Message
            </h3>

            <button
                class="close-modal"
                id="closeModal">
                ×
            </button>

        </div>


        <div class="tabs">

            <button
                class="tab active"
                id="individualTab">
                👤 Individual
            </button>

            <button
                class="tab"
                id="departmentTab">
                🏢 Department
            </button>

            <button
                class="tab"
                id="allTab">
                📢 All Staff
            </button>

        </div>


        <div class="modal-body">

            <!-- INDIVIDUAL -->

            <div id="individualPanel">

                <input
                    class="search-box"
                    id="staffSearch"
                    placeholder="Type Staff Name or Staff ID">

                <div
                    class="results"
                    id="staffResults">
                </div>

            </div>


            <!-- DEPARTMENT -->

            <div
                id="departmentPanel"
                style="display:none;">

                <input
                    class="search-box"
                    id="departmentSearch"
                    placeholder="Type Department">

                <div
                    class="results"
                    id="departmentResults">
                </div>

            </div>


            <!-- ALL -->

            <div
                id="allPanel"
                style="display:none;">

                <div class="all-info">

                    <h3>
                        📢 Send to All Staff
                    </h3>

                    <p id="allStaffCount">
                        Loading staff...
                    </p>

                </div>

            </div>


            <div
                class="selected-recipient"
                id="selectedRecipient">
            </div>


            <div class="compose-box">

                <textarea
                    id="newMessageText"
                    placeholder="Type your message..."></textarea>

            </div>

        </div>


        <div class="modal-footer">

            <button
                class="cancel-btn"
                id="cancelModal">
                Cancel
            </button>

            <button
                class="send-new-btn"
                id="sendNewMessage">
                Send ➤
            </button>

        </div>

    </div>

</div>


<script type="module">

/* =====================================================
   USE YOUR EXISTING FIREBASE CONFIG
===================================================== */

import { db } from "./firebase-config.js";

import {
    collection,
    doc,
    getDocs,
    getDoc,
    setDoc,
    addDoc,
    updateDoc,
    query,
    where,
    orderBy,
    onSnapshot,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   EXACT SAME STAFF SESSION AS YOUR DASHBOARD
===================================================== */

const staffId =
    sessionStorage.getItem("staffId");

const staffName =
    sessionStorage.getItem("staffName");

const department =
    sessionStorage.getItem("department");


/* =====================================================
   LOGIN CHECK
===================================================== */

if(!staffId){

    alert("Please Login");

    window.location.href =
        "login.html";

}


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let allStaff = [];

let conversations = [];

let currentConversationId = null;

let messageUnsubscribe = null;

let conversationUnsubscribe = null;

let selectedRecipient = null;

let currentMode = "individual";


/* =====================================================
   BASIC HELPERS
===================================================== */

function safe(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(value);

}


function escapeHtml(value){

    return safe(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function initial(name){

    const value =
        safe(name).trim();

    if(!value){

        return "?";

    }

    return value
        .charAt(0)
        .toUpperCase();

}


function getMillis(value){

    if(
        value &&
        typeof value.toMillis ===
        "function"
    ){

        return value.toMillis();

    }

    return 0;

}


function formatTime(value){

    if(!value){

        return "";

    }

    try{

        const date =
            value.toDate
                ? value.toDate()
                : new Date(value);

        return date.toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }
    catch(error){

        return "";

    }

}


/* =====================================================
   DISPLAY CURRENT STAFF
===================================================== */

document.getElementById(
    "myDetails"
).textContent =

    safe(staffName) +
    " • " +
    safe(staffId);


/* =====================================================
   LOAD STAFF
===================================================== */

async function loadStaff(){

    const snapshot =
        await getDocs(
            collection(
                db,
                "staff"
            )
        );


    allStaff = [];


    snapshot.forEach(
        item => {

            const data =
                item.data();


            const id =
                safe(
                    data.staffId ||
                    data.staffID ||
                    data.employeeId ||
                    data.employeeID ||
                    data.staffCode ||
                    item.id
                ).trim();


            if(!id){

                return;

            }


            const name =
                safe(
                    data.name ||
                    data.staffName ||
                    data.fullName ||
                    data.employeeName
                ).trim();


            const dept =
                safe(
                    data.department ||
                    data.dept ||
                    data.Department
                ).trim();


            let active = true;


            if(
                data.active === false ||
                data.isActive === false
            ){

                active = false;

            }


            allStaff.push({

                firestoreId:
                    item.id,

                staffId:
                    id,

                name:
                    name,

                department:
                    dept,

                active:
                    active

            });

        }
    );


    allStaff.sort(
        (a,b) =>
            a.name.localeCompare(
                b.name
            )
    );


    document.getElementById(
        "allStaffCount"
    ).textContent =

        allStaff.filter(
            item =>
                item.active
        ).length +

        " active staff available.";

}


/* =====================================================
   CONVERSATION ID
===================================================== */

function individualConversationId(
    otherStaffId
){

    return [

        safe(staffId),

        safe(otherStaffId)

    ]
    .sort()
    .join("__");

}


function departmentConversationId(
    dept
){

    return "DEPARTMENT__" +
        safe(dept)
            .trim()
            .toUpperCase()
            .replace(
                /[^A-Z0-9]+/g,
                "_"
            );

}


function allStaffConversationId(){

    return "ALL_STAFF";

}


/* =====================================================
   FIND STAFF
===================================================== */

function findStaff(id){

    return allStaff.find(
        item =>
            item.staffId
                .toUpperCase() ===
            safe(id)
                .toUpperCase()
    );

}


/* =====================================================
   LOAD CONVERSATIONS
===================================================== */

function listenConversations(){

    if(
        conversationUnsubscribe
    ){

        conversationUnsubscribe();

    }


    const q =
        query(
            collection(
                db,
                "staffConversations"
            ),
            where(
                "participantIds",
                "array-contains",
                staffId
            )
        );


    conversationUnsubscribe =
        onSnapshot(
            q,
            snapshot => {

                conversations = [];


                snapshot.forEach(
                    item => {

                        conversations.push({

                            id:
                                item.id,

                            ...item.data()

                        });

                    }
                );


                conversations.sort(
                    (a,b) =>

                        getMillis(
                            b.lastMessageTime
                        ) -

                        getMillis(
                            a.lastMessageTime
                        )
                );


                renderConversations();

            },
            error => {

                console.error(
                    "CONVERSATION ERROR:",
                    error
                );

                document.getElementById(
                    "conversationList"
                ).innerHTML = `

                    <div class="no-conversations">

                        Unable to load messages.

                        <br><br>

                        ${escapeHtml(
                            error.message
                        )}

                    </div>

                `;

            }
        );

}



/* =====================================================
   GET CORRECT INDIVIDUAL CONVERSATION NAME
   The conversation document is shared by both staff.
   Therefore chat.title cannot be used for individual
   conversations because it may contain the sender's name.
   Always resolve the other participant from participantIds.
===================================================== */
function getConversationDisplayName(chat){

    if(!chat){
        return "Staff";
    }

    if(chat.type === "all"){
        return "All Staff";
    }

    if(chat.type === "department"){
        return safe(chat.department)
            ? safe(chat.department) + " Staff"
            : (chat.title || "Department Staff");
    }

    const participants =
        Array.isArray(chat.participantIds)
            ? chat.participantIds
            : [];

    const myId =
        safe(staffId).trim().toUpperCase();

    const otherId =
        participants.find(
            id =>
                safe(id).trim().toUpperCase() !== myId
        );

    if(otherId){

        const otherStaff =
            findStaff(otherId);

        if(
            otherStaff &&
            safe(otherStaff.name).trim()
        ){
            return otherStaff.name.trim();
        }
    }

    /* Fallback for older conversation records */
    if(
        safe(chat.lastSenderId).trim() &&
        safe(chat.lastSenderId).trim().toUpperCase() !== myId &&
        safe(chat.lastSenderName).trim()
    ){
        return chat.lastSenderName.trim();
    }

    return safe(chat.title).trim() || "Staff";
}


/* =====================================================
   RENDER CONVERSATIONS
===================================================== */

function renderConversations(){

    const search =
        document.getElementById(
            "conversationSearch"
        )
        .value
        .trim()
        .toLowerCase();


    const filtered =
        conversations.filter(
            chat => {

                if(!search){

                    return true;

                }


                const displayName =
                    getConversationDisplayName(chat);

                return (

                    safe(displayName)
                        .toLowerCase()
                        .includes(search)

                    ||

                    safe(chat.lastMessage)
                        .toLowerCase()
                        .includes(search)

                );

            }
        );


    const container =
        document.getElementById(
            "conversationList"
        );


    if(!filtered.length){

        container.innerHTML = `

            <div class="no-conversations">

                No messages yet.

                <br><br>

                Click + to start a conversation.

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    filtered.forEach(
        chat => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "conversation";


            if(
                chat.id ===
                currentConversationId
            ){

                row.classList.add(
                    "active"
                );

            }


            const unread =
                Number(
                    (
                        chat.unreadCounts ||
                        {}
                    )[staffId] ||
                    0
                );


            const displayName =
                getConversationDisplayName(chat);

            let avatar =
                initial(
                    displayName
                );


            if(
                chat.type ===
                "all"
            ){

                avatar = "A";

            }


            if(
                chat.type ===
                "department"
            ){

                avatar = "D";

            }


            row.innerHTML = `

                <div class="avatar">

                    ${escapeHtml(
                        avatar
                    )}

                </div>


                <div class="conversation-content">

                    <div class="conversation-top">

                        <div class="conversation-name">

                            ${escapeHtml(
                                displayName
                            )}

                        </div>

                        <div class="conversation-time">

                            ${formatTime(
                                chat.lastMessageTime
                            )}

                        </div>

                    </div>


                    <div class="last-message">

                        ${escapeHtml(
                            chat.lastMessage ||
                            ""
                        )}

                    </div>

                </div>


                ${
                    unread > 0
                    ?
                    `
                    <div class="unread">

                        ${
                            unread > 99
                                ? "99+"
                                : unread
                        }

                    </div>
                    `
                    :
                    ""
                }

            `;


            row.onclick =
                () =>
                    openConversation(
                        chat.id
                    );


            container.appendChild(
                row
            );

        }
    );

}


/* =====================================================
   OPEN CONVERSATION
===================================================== */

async function openConversation(id){

    const chat =
        conversations.find(
            item =>
                item.id === id
        );


    if(!chat){

        return;

    }


    currentConversationId =
        id;


    document.getElementById(
        "welcomeScreen"
    ).style.display =
        "none";


    document.getElementById(
        "chatHeader"
    ).style.display =
        "flex";


    document.getElementById(
        "chatMessages"
    ).style.display =
        "block";


    document.getElementById(
        "messageInputArea"
    ).style.display =
        "flex";


    const displayName =
        getConversationDisplayName(chat);

    document.getElementById(
        "chatName"
    ).textContent =
        displayName;


    if(
        chat.type ===
        "all"
    ){

        document.getElementById(
            "chatStatus"
        ).textContent =
            "All Staff";

    }
    else if(
        chat.type ===
        "department"
    ){

        document.getElementById(
            "chatStatus"
        ).textContent =
            "Department Staff";

    }
    else{

        document.getElementById(
            "chatStatus"
        ).textContent =
            "Staff";

    }


    document.getElementById(
        "chatAvatar"
    ).textContent =

        chat.type === "all"
            ? "A"
            :
        chat.type === "department"
            ? "D"
            :
            initial(
                displayName
            );


    if(
        messageUnsubscribe
    ){

        messageUnsubscribe();

    }


    const q =
        query(
            collection(
                db,
                "staffConversations",
                id,
                "messages"
            ),
            orderBy(
                "timestamp",
                "asc"
            )
        );


    messageUnsubscribe =
        onSnapshot(
            q,
            snapshot => {

                renderMessages(
                    snapshot
                );

            },
            error => {

                console.error(
                    "MESSAGE LIST ERROR:",
                    error
                );

            }
        );


    /* MARK READ */

    try{

        const counts =
            {
                ...(chat.unreadCounts || {})
            };


        counts[staffId] = 0;


        await updateDoc(
            doc(
                db,
                "staffConversations",
                id
            ),
            {

                unreadCounts:
                    counts

            }
        );

    }
    catch(error){

        console.log(
            "READ UPDATE:",
            error
        );

    }


    document.getElementById(
        "messagingApp"
    ).classList.add(
        "chat-open"
    );


    renderConversations();


    document.getElementById(
        "messageInput"
    ).focus();

}


/* =====================================================
   RENDER MESSAGES
===================================================== */

function renderMessages(
    snapshot
){

    const container =
        document.getElementById(
            "chatMessages"
        );


    container.innerHTML = "";


    snapshot.forEach(
        item => {

            const data =
                item.data();


            const mine =
                data.senderId ===
                staffId;


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "message-row";


            if(mine){

                row.classList.add(
                    "mine"
                );

            }


            const bubble =
                document.createElement(
                    "div"
                );


            bubble.className =
                "message-bubble";


            const sender =
                mine
                    ? ""
                    :
                    `
                    <div class="message-sender">

                        ${escapeHtml(
                            data.senderName ||
                            data.senderId ||
                            "Staff"
                        )}

                    </div>
                    `;


            bubble.innerHTML = `

                ${sender}

                <div class="message-text">

                    ${escapeHtml(
                        data.text
                    )}

                </div>

                <div class="message-time">

                    ${formatTime(
                        data.timestamp
                    )}

                    ${
                        mine
                        ?
                        " ✓✓"
                        :
                        ""
                    }

                </div>

            `;


            row.appendChild(
                bubble
            );


            container.appendChild(
                row
            );

        }
    );


    container.scrollTop =
        container.scrollHeight;

}


/* =====================================================
   SEND MESSAGE IN EXISTING CHAT
===================================================== */

async function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );


    const message =
        input.value.trim();


    if(!message){

        return;

    }


    if(
        !currentConversationId
    ){

        return;

    }


    input.value = "";


    try{

        const conversationRef =
            doc(
                db,
                "staffConversations",
                currentConversationId
            );


        const conversationSnap =
            await getDoc(
                conversationRef
            );


        if(
            !conversationSnap.exists()
        ){

            alert(
                "Conversation not found."
            );

            return;

        }


        const conversation =
            conversationSnap.data();


        await addDoc(
            collection(
                db,
                "staffConversations",
                currentConversationId,
                "messages"
            ),
            {

                senderId:
                    staffId,

                senderName:
                    staffName,

                text:
                    message,

                timestamp:
                    serverTimestamp(),

                readBy:
                    [staffId]

            }
        );


        const unreadCounts =
            {
                ...(conversation.unreadCounts || {})
            };


        (
            conversation.participantIds ||
            []
        )
        .forEach(
            id => {

                if(
                    id !== staffId
                ){

                    unreadCounts[id] =
                        Number(
                            unreadCounts[id] ||
                            0
                        ) + 1;

                }

            }
        );


        await updateDoc(
            conversationRef,
            {

                lastMessage:
                    message,

                lastSenderId:
                    staffId,

                lastSenderName:
                    staffName,

                lastMessageTime:
                    serverTimestamp(),

                unreadCounts:
                    unreadCounts

            }
        );

    }
    catch(error){

        console.error(
            "SEND ERROR:",
            error
        );


        alert(
            "Message could not be sent.\n\n" +
            error.message
        );


        input.value =
            message;

    }

}

/* =====================================================
   STAFF SEARCH
===================================================== */

function renderStaffResults(
    search
){

    const container =
        document.getElementById(
            "staffResults"
        );


    const term =
        safe(search)
            .trim()
            .toLowerCase();


    const results =
        allStaff
            .filter(
                item => {

                    /* Don't show myself */

                    if(
                        item.staffId
                            .toUpperCase() ===
                        staffId
                            .toUpperCase()
                    ){

                        return false;

                    }


                    if(!term){

                        return true;

                    }


                    return (

                        item.name
                            .toLowerCase()
                            .includes(term)

                        ||

                        item.staffId
                            .toLowerCase()
                            .includes(term)

                        ||

                        item.department
                            .toLowerCase()
                            .includes(term)

                    );

                }
            )
            .slice(
                0,
                100
            );


    if(!results.length){

        container.innerHTML = `

            <div class="no-conversations">

                No staff found.

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    results.forEach(
        staff => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "result-item";


            div.innerHTML = `

                <div class="result-name">

                    ${escapeHtml(
                        staff.name
                    )}

                </div>

                <div class="result-details">

                    Staff ID:
                    ${escapeHtml(
                        staff.staffId
                    )}

                    ${
                        staff.department
                        ?
                        " • " +
                        escapeHtml(
                            staff.department
                        )
                        :
                        ""
                    }

                </div>

            `;


            div.onclick =
                () => {

                    selectedRecipient = {

                        type:
                            "individual",

                        staffId:
                            staff.staffId,

                        name:
                            staff.name,

                        department:
                            staff.department

                    };


                    updateSelectedRecipient();

                };


            container.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   DEPARTMENT SEARCH
===================================================== */

function getDepartments(){

    const map =
        new Map();


    allStaff.forEach(
        staff => {

            if(
                !staff.department
            ){

                return;

            }


            const key =
                staff.department
                    .trim()
                    .toLowerCase();


            if(
                !map.has(key)
            ){

                map.set(
                    key,
                    {

                        name:
                            staff.department
                                .trim(),

                        count:
                            0

                    }
                );

            }


            if(
                staff.active
            ){

                map.get(
                    key
                ).count++;

            }

        }
    );


    return Array.from(
        map.values()
    );

}


function renderDepartmentResults(
    search
){

    const container =
        document.getElementById(
            "departmentResults"
        );


    const term =
        safe(search)
            .trim()
            .toLowerCase();


    const departments =
        getDepartments()
            .filter(
                item =>

                    !term ||

                    item.name
                        .toLowerCase()
                        .includes(term)

            );


    if(!departments.length){

        container.innerHTML = `

            <div class="no-conversations">

                No department found.

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    departments.forEach(
        dept => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "result-item";


            div.innerHTML = `

                <div class="result-name">

                    🏢 ${escapeHtml(
                        dept.name
                    )}

                </div>

                <div class="result-details">

                    ${dept.count}
                    active staff

                </div>

            `;


            div.onclick =
                () => {

                    selectedRecipient = {

                        type:
                            "department",

                        department:
                            dept.name,

                        title:
                            dept.name +
                            " Staff"

                    };


                    updateSelectedRecipient();

                };


            container.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   SELECTED RECIPIENT
===================================================== */

function updateSelectedRecipient(){

    const box =
        document.getElementById(
            "selectedRecipient"
        );


    if(
        !selectedRecipient
    ){

        box.style.display =
            "none";

        box.innerHTML =
            "";

        return;

    }


    box.style.display =
        "block";


    if(
        selectedRecipient.type ===
        "individual"
    ){

        box.innerHTML =

            "👤 Selected: <b>" +

            escapeHtml(
                selectedRecipient.name
            ) +

            "</b> (" +

            escapeHtml(
                selectedRecipient.staffId
            ) +

            ")";

    }
    else if(
        selectedRecipient.type ===
        "department"
    ){

        box.innerHTML =

            "🏢 Selected Department: <b>" +

            escapeHtml(
                selectedRecipient.department
            ) +

            "</b>";

    }
    else{

        box.innerHTML =

            "📢 Selected: <b>ALL STAFF</b>";

    }

}


/* =====================================================
   SEND NEW MESSAGE
===================================================== */

async function sendNewMessage(){

    const message =
        document.getElementById(
            "newMessageText"
        )
        .value
        .trim();


    if(!message){

        alert(
            "Please type a message."
        );

        return;

    }


    if(
        !selectedRecipient
    ){

        alert(
            "Please select a recipient."
        );

        return;

    }


    try{

        let participantIds = [];

        let conversationId = "";

        let title = "";


        /* =============================================
           INDIVIDUAL
        ============================================= */

        if(
            selectedRecipient.type ===
            "individual"
        ){

            conversationId =
                individualConversationId(
                    selectedRecipient.staffId
                );


            participantIds = [

                staffId,

                selectedRecipient.staffId

            ];


            title =
                selectedRecipient.name;

        }


        /* =============================================
           DEPARTMENT
        ============================================= */

        else if(
            selectedRecipient.type ===
            "department"
        ){

            const dept =
                selectedRecipient.department
                    .trim()
                    .toLowerCase();


            participantIds =
                allStaff
                    .filter(
                        staff =>

                            staff.active &&

                            staff.department
                                .trim()
                                .toLowerCase() ===
                            dept

                    )
                    .map(
                        staff =>
                            staff.staffId
                    );


            /*
               Make sure sender is included.
            */

            if(
                !participantIds.includes(
                    staffId
                )
            ){

                participantIds.push(
                    staffId
                );

            }


            participantIds =
                [
                    ...new Set(
                        participantIds
                    )
                ];


            conversationId =
                departmentConversationId(
                    selectedRecipient.department
                );


            title =
                selectedRecipient.department +
                " Staff";

        }


        /* =============================================
           ALL STAFF
        ============================================= */

        else if(
            selectedRecipient.type ===
            "all"
        ){

            participantIds =
                allStaff
                    .filter(
                        staff =>
                            staff.active
                    )
                    .map(
                        staff =>
                            staff.staffId
                    );


            if(
                !participantIds.includes(
                    staffId
                )
            ){

                participantIds.push(
                    staffId
                );

            }


            participantIds =
                [
                    ...new Set(
                        participantIds
                    )
                ];


            conversationId =
                allStaffConversationId();


            title =
                "All Staff";

        }


        if(
            participantIds.length < 2
        ){

            alert(
                "No recipient found."
            );

            return;

        }


        /* =============================================
           CREATE / UPDATE CONVERSATION
        ============================================= */

        const conversationRef =
            doc(
                db,
                "staffConversations",
                conversationId
            );


        const existing =
            await getDoc(
                conversationRef
            );


        let unreadCounts = {};


        if(
            existing.exists()
        ){

            unreadCounts =
                {
                    ...(
                        existing.data()
                            .unreadCounts ||
                        {}
                    )
                };

        }


        participantIds.forEach(
            id => {

                if(
                    id === staffId
                ){

                    unreadCounts[id] =
                        0;

                }
                else{

                    unreadCounts[id] =
                        Number(
                            unreadCounts[id] ||
                            0
                        ) + 1;

                }

            }
        );


        await setDoc(
            conversationRef,
            {

                title:
                    title,

                type:
                    selectedRecipient.type,

                participantIds:
                    participantIds,

                department:
                    selectedRecipient.department ||
                    "",

                lastMessage:
                    message,

                lastSenderId:
                    staffId,

                lastSenderName:
                    staffName,

                lastMessageTime:
                    serverTimestamp(),

                unreadCounts:
                    unreadCounts,

                updatedAt:
                    serverTimestamp()

            },
            {
                merge:true
            }
        );


        /* =============================================
           ADD MESSAGE
        ============================================= */

        await addDoc(
            collection(
                db,
                "staffConversations",
                conversationId,
                "messages"
            ),
            {

                senderId:
                    staffId,

                senderName:
                    staffName,

                text:
                    message,

                timestamp:
                    serverTimestamp(),

                readBy:
                    [staffId]

            }
        );


        /* =============================================
           CLOSE MODAL
        ============================================= */

        closeModal();


        document.getElementById(
            "newMessageText"
        ).value =
            "";


        /*
           Wait for conversation listener
           and open it.
        */

        setTimeout(
            () => {

                openConversation(
                    conversationId
                );

            },
            500
        );

    }
    catch(error){

        console.error(
            "NEW MESSAGE ERROR:",
            error
        );


        alert(
            "Unable to send message.\n\n" +
            error.message
        );

    }

}
