<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Staff Messaging Portal</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:#e5ddd5;
}

button,input,textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

#app{
    height:100vh;
    display:flex;
}

/* ================= SIDEBAR ================= */

.sidebar{
    width:360px;
    min-width:360px;
    background:#fff;
    border-right:1px solid #ddd;
    display:flex;
    flex-direction:column;
}

.sidebar-header{
    background:#075e54;
    color:#fff;
    padding:16px;
}

.sidebar-header h2{
    font-size:20px;
}

.logged-user{
    margin-top:6px;
    font-size:12px;
    opacity:.9;
}

.search-box{
    padding:10px;
    background:#f0f2f5;
}

.search-box input{
    width:100%;
    border:0;
    outline:0;
    border-radius:20px;
    padding:11px 15px;
    background:#fff;
}

.conversation-list{
    flex:1;
    overflow-y:auto;
}

.conversation{
    display:flex;
    padding:13px;
    border-bottom:1px solid #eee;
    cursor:pointer;
}

.conversation:hover{
    background:#f5f5f5;
}

.conversation.active{
    background:#e9edef;
}

.avatar{
    width:48px;
    height:48px;
    min-width:48px;
    border-radius:50%;
    background:#128c7e;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    margin-right:12px;
}

.conversation-info{
    flex:1;
    min-width:0;
}

.conversation-top{
    display:flex;
    justify-content:space-between;
    gap:8px;
}

.conversation-name{
    font-weight:bold;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.conversation-time{
    font-size:10px;
    color:#777;
}

.last-message{
    margin-top:5px;
    font-size:12px;
    color:#777;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.unread{
    min-width:20px;
    height:20px;
    padding:0 5px;
    border-radius:50%;
    background:#25d366;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    font-weight:bold;
    margin-left:5px;
}

.new-message{
    padding:10px;
    border-top:1px solid #ddd;
}

.new-message button{
    width:100%;
    border:0;
    background:#128c7e;
    color:#fff;
    padding:12px;
    border-radius:7px;
    font-weight:bold;
}

.new-message button:hover{
    background:#075e54;
}

/* ================= CHAT ================= */

.chat{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    background:#efeae2;
}

.empty{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:#777;
    text-align:center;
}

.empty-icon{
    font-size:60px;
    margin-bottom:12px;
}

.chat-header{
    height:68px;
    min-height:68px;
    background:#075e54;
    color:#fff;
    display:flex;
    align-items:center;
    padding:9px 14px;
}

.back{
    display:none;
    border:0;
    background:transparent;
    color:#fff;
    font-size:28px;
    margin-right:8px;
}

.header-name{
    font-weight:bold;
}

.header-status{
    font-size:11px;
    margin-top:4px;
    opacity:.85;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:18px;
}

.message-row{
    display:flex;
    margin-bottom:7px;
}

.message-row.mine{
    justify-content:flex-end;
}

.message{
    max-width:70%;
    padding:8px 10px 5px;
    border-radius:8px;
    box-shadow:0 1px 1px rgba(0,0,0,.08);
}

.message.mine{
    background:#d9fdd3;
    border-top-right-radius:2px;
}

.message.other{
    background:#fff;
    border-top-left-radius:2px;
}

.sender{
    font-size:11px;
    font-weight:bold;
    color:#128c7e;
    margin-bottom:3px;
}

.message-text{
    font-size:14px;
    line-height:1.4;
    white-space:pre-wrap;
    word-break:break-word;
}

.message-meta{
    text-align:right;
    color:#777;
    font-size:10px;
    margin-top:3px;
}

.blue{
    color:#008fd5;
}

.message-input-area{
    display:flex;
    gap:8px;
    padding:9px;
    background:#f0f2f5;
}

.message-input{
    flex:1;
    resize:none;
    border:0;
    outline:0;
    border-radius:22px;
    padding:12px 16px;
    min-height:43px;
    max-height:120px;
}

.send{
    width:45px;
    min-width:45px;
    height:45px;
    border:0;
    border-radius:50%;
    background:#128c7e;
    color:#fff;
    font-size:18px;
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    justify-content:center;
    align-items:center;
    padding:15px;
    z-index:1000;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:530px;
    max-width:100%;
    max-height:90vh;
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

.modal-header{
    background:#075e54;
    color:#fff;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.close{
    border:0;
    background:none;
    color:#fff;
    font-size:25px;
}

.tabs{
    display:flex;
    border-bottom:1px solid #ddd;
}

.tab{
    flex:1;
    padding:13px 5px;
    border:0;
    background:#fff;
}

.tab.active{
    color:#075e54;
    font-weight:bold;
    border-bottom:3px solid #075e54;
}

.modal-body{
    padding:15px;
    overflow-y:auto;
}

.modal-search{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:7px;
    outline:0;
    margin-bottom:10px;
}

.results{
    max-height:250px;
    overflow-y:auto;
}

.result{
    border:1px solid #eee;
    padding:12px;
    border-radius:7px;
    margin-bottom:7px;
    cursor:pointer;
}

.result:hover{
    background:#f2f8f7;
}

.result-name{
    font-weight:bold;
    font-size:14px;
}

.result-info{
    color:#777;
    font-size:12px;
    margin-top:3px;
}

.selected{
    display:none;
    background:#e8f5e9;
    color:#075e54;
    padding:10px;
    border-radius:7px;
    margin-top:10px;
}

.compose{
    margin-top:12px;
}

.compose textarea{
    width:100%;
    min-height:100px;
    resize:vertical;
    border:1px solid #ddd;
    outline:0;
    border-radius:7px;
    padding:12px;
}

.all-box{
    padding:18px;
    background:#f7f7f7;
    border:1px solid #ddd;
    border-radius:8px;
}

.all-box h3{
    color:#075e54;
    margin-bottom:7px;
}

.all-box p{
    color:#777;
    font-size:13px;
}

.modal-footer{
    border-top:1px solid #ddd;
    padding:12px;
    display:flex;
    justify-content:flex-end;
    gap:8px;
}

.cancel{
    border:0;
    padding:10px 18px;
    border-radius:6px;
}

.send-new{
    border:0;
    padding:10px 18px;
    border-radius:6px;
    background:#128c7e;
    color:#fff;
    font-weight:bold;
}

.no-data{
    padding:25px;
    text-align:center;
    color:#777;
    font-size:13px;
}

@media(max-width:700px){

    .sidebar{
        width:100%;
        min-width:100%;
    }

    .chat{
        display:none;
    }

    #app.chat-open .sidebar{
        display:none;
    }

    #app.chat-open .chat{
        display:flex;
    }

    .back{
        display:block;
    }

    .message{
        max-width:85%;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- SIDEBAR -->

        </div>

        <div

        </div>

    <!-- CHAT -->

        <div

<!-- NEW MESSAGE -->

<div
    class="modal"
    id="modal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h3>New Message</h3>

            <button
                class="close"
                id="closeModal"
            >
                ×
            </button>

        </div>


        <div class="tabs">

            <button
                class="tab active"

            >
                👤 Individual

            <button

            >

                class="tab"

        <div class="modal-body">

            <!-- INDIVIDUAL -->

            <div id="individualArea">

                    id="staffSearch"

                <div
                    class="results"

            <!-- DEPARTMENT -->

            <div

            >

                <input

            <div

<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    doc,
    getDocs,
    getDoc,
    setDoc,
    addDoc,
    updateDoc,
    query,
    where,
    orderBy,
    onSnapshot,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyAIv3091VM-gkmdwEAn7OhXWd9Cm2zh2bo",

    authDomain:
        "maasc-2026.firebaseapp.com",

    projectId:
        "maasc-2026",

    storageBucket:
        "maasc-2026.appspot.com",

    messagingSenderId:
        "585813001586",

    appId:
        "1:585813001586:web:664e0e90ff0725d2e849eb"

};


const app =
    initializeApp(
        firebaseConfig
    );

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =========================================================
   GLOBALS
========================================================= */

let firebaseUser = null;

let currentStaff = null;

let allStaff = [];

let staffById = {};

let conversations = [];

let currentConversationId = null;

let currentMessageUnsubscribe = null;

let conversationUnsubscribe = null;

let selectedRecipient = null;

let mode = "individual";


/* =========================================================
   HELPERS
========================================================= */

function text(value){

    return value === null ||
           value === undefined
        ? ""
        : String(value);

}


function escapeHTML(value){

    return text(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function getInitial(name){

    const value =
        text(name).trim();

    return value
        ? value.charAt(0).toUpperCase()
        : "?";

}


function millis(value){

    try{

        if(
            value &&
            typeof value.toMillis === "function"
        ){

            return value.toMillis();

        }

    }
    catch(error){}

    return 0;
}


function time(value){

    if(!value){

        return "";

    }

    try{

        const date =
            value.toDate
                ? value.toDate()
                : new Date(value);

        return date.toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }
    catch(error){

        return "";

    }

}


/* =========================================================
   STAFF DATA
========================================================= */

function getStaffId(data,id){

    return text(
        data.staffId ||
        data.staffID ||
        data.employeeId ||
        data.employeeID ||
        data.staffCode ||
        id
    ).trim();

}


function getStaffName(data){

    return text(
        data.name ||
        data.staffName ||
        data.fullName ||
        data.employeeName
    ).trim();

}


function getDepartment(data){

    return text(
        data.department ||
        data.dept ||
        data.Department
    ).trim();

}


function activeStaff(data){

    if(data.active === false)
        return false;

    if(data.isActive === false)
        return false;

    if(data.workerActive === false)
        return false;

    return true;

}


async function loadStaff(){

    const snapshot =
        await getDocs(
            collection(
                db,
                "staff"
            )
        );


    allStaff = [];

    staffById = {};


    snapshot.forEach(
        item => {

            const data =
                item.data();

            const staffId =
                getStaffId(
                    data,
                    item.id
                );


            if(!staffId){

                return;

            }


            const staff = {

                firestoreId:
                    item.id,

                staffId:
                    staffId,

                name:
                    getStaffName(data),

                department:
                    getDepartment(data),

                active:
                    activeStaff(data)

            };


            allStaff.push(
                staff
            );


            staffById[
                staffId.toUpperCase()
            ] =
                staff;

        }
    );


    allStaff.sort(
        (a,b) =>
            a.name.localeCompare(
                b.name
            )
    );

}


/* =========================================================
   IMPORTANT:
   FIND STAFF BY STAFF ID ONLY
========================================================= */

function getStoredStaffId(){

    const keys = [

        "staffId",
        "staffID",
        "currentStaffId",
        "currentStaffID",
        "loggedInStaffId",
        "loggedInStaffID",
        "employeeId",
        "employeeID",
        "staffCode",
        "employeeCode"

    ];


    for(
        const key of keys
    ){

        try{

            const value =
                localStorage.getItem(
                    key
                );

            if(
                value &&
                value.trim()
            ){

                return value.trim();

            }

        }
        catch(error){}


        try{

            const value =
                sessionStorage.getItem(
                    key
                );

            if(
                value &&
                value.trim()
            ){

                return value.trim();

            }

        }
        catch(error){}

    }


    return "";

}


function findStaffById(id){

    if(!id){

        return null;

    }


    return staffById[
        id.trim().toUpperCase()
    ] || null;

}


/*
   IMPORTANT:
   We deliberately DO NOT use:

   user.displayName
   staff.name
   email
   first staff document

   to identify the logged-in person.
*/

async function identifyCurrentStaff(){

    const storedId =
        getStoredStaffId();


    console.log(
        "MESSAGING STAFF ID:",
        storedId
    );


    if(
        storedId
    ){

        const staff =
            findStaffById(
                storedId
            );


        if(staff){

            return staff;

        }

    }


    /*
       Firebase Auth UID is used ONLY if
       the staff Firestore document itself
       has that UID as its document ID.
    */

    if(
        firebaseUser
    ){

        const directDoc =
            await getDoc(
                doc(
                    db,
                    "staff",
                    firebaseUser.uid
                )
            );


        if(
            directDoc.exists()
        ){

            const data =
                directDoc.data();

            const id =
                getStaffId(
                    data,
                    directDoc.id
                );


            const staff =
                findStaffById(
                    id
                );


            if(staff){

                return staff;

            }

        }

    }


    return null;

}


/* =========================================================
   START
========================================================= */

async function start(){

    try{

        await loadStaff();


        currentStaff =
            await identifyCurrentStaff();


        if(
            !currentStaff
        ){

            document.getElementById(
                "loggedUser"
            ).textContent =
                "STAFF ID NOT FOUND";


            document.getElementById(
                "conversationList"
            ).innerHTML = `

                <div class="no-data">

                    Staff ID could not be identified.

                    <br><br>

                    Please open this page after
                    logging into your staff dashboard.

                    <br><br>

                    <b>
                    No other staff account will be selected.
                    </b>

                </div>

            `;


            console.error(
                "NO STAFF ID FOUND"
            );


            return;

        }


        document.getElementById(
            "loggedUser"
        ).textContent =

            currentStaff.name +
            " • " +
            currentStaff.staffId;


        updateAllCount();

        startConversationListener();

    }
    catch(error){

        console.error(
            "MESSAGING START ERROR:",
            error
        );


        document.getElementById(
            "conversationList"
        ).innerHTML = `

            <div class="no-data">

                Error loading messaging.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        firebaseUser =
            user;

        console.log(
            "FIREBASE USER:",
            user
        );

        /*
           Even when Firebase auth is null,
           the existing Staff ID session can
           still identify the user.
        */

        await start();

    }
);


/* =========================================================
   CONVERSATIONS
========================================================= */

function startConversationListener(){

    if(
        !currentStaff
    ){

        return;

    }


    if(
        conversationUnsubscribe
    ){

        conversationUnsubscribe();

    }


    const q =
        query(
            collection(
                db,
                "staffConversations"
            ),
            where(
                "participantIds",
                "array-contains",
                currentStaff.staffId
            )
        );


    conversationUnsubscribe =
        onSnapshot(
            q,
            snapshot => {

                conversations = [];


                snapshot.forEach(
                    item => {

                        conversations.push({

                            id:
                                item.id,

                            ...item.data()

                        });

                    }
                );


                conversations.sort(
                    (a,b) =>
                        millis(
                            b.lastMessageTime
                        ) -
                        millis(
                            a.lastMessageTime
                        )
                );


                renderConversations();

            },
            error => {

                console.error(
                    "CONVERSATION LIST ERROR:",
                    error
                );

            }
        );

}


/* =========================================================
   CONVERSATION UI
========================================================= */

function renderConversations(){

    const search =
        document.getElementById(
            "conversationSearch"
        )
        .value
        .trim()
        .toLowerCase();


    const list =
        conversations.filter(
            chat => {

                if(!search)
                    return true;

                return (

                    text(chat.title)
                        .toLowerCase()
                        .includes(search)

                    ||

                    text(chat.lastMessage)
                        .toLowerCase()
                        .includes(search)

                );

            }
        );


    const container =
        document.getElementById(
            "conversationList"
        );


    if(!list.length){

        container.innerHTML = `

            <div class="no-data">

                No conversations yet.

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    list.forEach(
        chat => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "conversation" +
                (
                    currentConversationId === chat.id
                        ? " active"
                        : ""
                );


            const unread =
                Number(
                    (
                        chat.unreadCounts || {}
                    )[
                        currentStaff.staffId
                    ] || 0
                );


            let avatar =
                getInitial(
                    chat.title
                );


            if(
                chat.type === "all"
            ){

                avatar = "A";

            }


            if(
                chat.type === "department"
            ){

                avatar = "D";

            }


            item.innerHTML = `

                <div class="avatar">

                    ${escapeHTML(
                        avatar
                    )}

                </div>


                <div class="conversation-info">

                    <div class="conversation-top">

                        <div class="conversation-name">

                            ${escapeHTML(
                                chat.title ||
                                "Staff"
                            )}

                        </div>

                        <div class="conversation-time">

                            ${time(
                                chat.lastMessageTime
                            )}

                        </div>

                    </div>


                    <div class="last-message">

                        ${escapeHTML(
                            chat.lastMessage ||
                            ""
                        )}

                    </div>

                </div>


                ${
                    unread > 0
                        ? `
                            <div class="unread">
                                ${
                                    unread > 99
                                        ? "99+"
                                        : unread
                                }
                            </div>
                          `
                        : ""
                }

            `;


            item.onclick =
                () =>
                    openConversation(
                        chat.id
                    );


            container.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   OPEN CONVERSATION
========================================================= */

async function openConversation(id){

    const chat =
        conversations.find(
            item =>
                item.id === id
        );


    if(!chat)
        return;


    currentConversationId =
        id;


    document.getElementById(
        "emptyChat"
    ).style.display =
        "none";


    document.getElementById(
        "chatHeader"
    ).style.display =
        "flex";


    document.getElementById(
        "messages"
    ).style.display =
        "block";


    document.getElementById(
        "messageInputArea"
    ).style.display =
        "flex";


    document.getElementById(
        "chatName"
    ).textContent =
        chat.title ||
        "Staff";


    document.getElementById(
        "chatStatus"
    ).textContent =

        chat.type === "all"
            ? "All Staff"
            :
        chat.type === "department"
            ? "Department Staff"
            :
            "Staff Conversation";


    document.getElementById(
        "chatAvatar"
    ).textContent =

        chat.type === "all"
            ? "A"
            :
        chat.type === "department"
            ? "D"
            :
            getInitial(
                chat.title
            );


    if(
        currentMessageUnsubscribe
    ){

        currentMessageUnsubscribe();

    }


    const q =
        query(
            collection(
                db,
                "staffConversations",
                id,
                "messages"
            ),
            orderBy(
                "timestamp",
                "asc"
            )
        );


    currentMessageUnsubscribe =
        onSnapshot(
            q,
            snapshot => {

                renderMessages(
                    snapshot
                );

            },
            error => {

                console.error(
                    "MESSAGE ERROR:",
                    error
                );

            }
        );


    /*
       Mark current user's unread count as zero.
    */

    try{

        const counts =
            {
                ...(chat.unreadCounts || {})
            };


        counts[
            currentStaff.staffId
        ] = 0;


        await updateDoc(
            doc(
                db,
                "staffConversations",
                id
            ),
            {
                unreadCounts:
                    counts
            }
        );

    }
    catch(error){

        console.warn(
            "UNREAD UPDATE:",
            error
        );

    }


    document
        .getElementById("app")
        .classList.add(
            "chat-open"
        );


    renderConversations();


    document.getElementById(
        "messageInput"
    ).focus();

}


/* =========================================================
   MESSAGES
========================================================= */

function renderMessages(snapshot){

    const container =
        document.getElementById(
            "messages"
        );


    container.innerHTML = "";


    snapshot.forEach(
        item => {

            const data =
                item.data();


            const mine =
                data.senderId ===
                currentStaff.staffId;


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "message-row" +
                (
                    mine
                        ? " mine"
                        : ""
                );


            const bubble =
                document.createElement(
                    "div"
                );


            bubble.className =
                "message " +
                (
                    mine
                        ? "mine"
                        : "other"
                );


            const sender =
                mine
                    ? ""
                    : `

                        <div class="sender">

                            ${escapeHTML(
                                data.senderName ||
                                data.senderId ||
                                "Staff"
                            )}

                        </div>

                      `;


            const read =
                Array.isArray(
                    data.readBy
                ) &&
                data.readBy.length > 1;


            bubble.innerHTML = `

                ${sender}

                <div class="message-text">

                    ${escapeHTML(
                        data.text
                    )}

                </div>

                <div class="message-meta">

                    ${time(
                        data.timestamp
                    )}

                    ${
                        mine
                            ? `
                                <span
                                    class="${
                                        read
                                            ? "blue"
                                            : ""
                                    }"
                                >
                                    ${
                                        read
                                            ? "✓✓"
                                            : "✓"
                                    }
                                </span>
                              `
                            : ""
                    }

                </div>

            `;


            row.appendChild(
                bubble
            );


            container.appendChild(
                row
            );

        }
    );


    container.scrollTop =
        container.scrollHeight;

}


/* =========================================================
   SEND CURRENT MESSAGE
========================================================= */

async function sendMessage(){

    if(
        !currentConversationId
    )
        return;


    const input =
        document.getElementById(
            "messageInput"
        );


    const value =
        input.value.trim();


    if(!value)
        return;


    input.value = "";


    try{

        const chatRef =
            doc(
                db,
                "staffConversations",
                currentConversationId
            );


        const chatSnapshot =
            await getDoc(
                chatRef
            );


        if(
            !chatSnapshot.exists()
        ){

            alert(
                "Conversation not found."
            );

            return;

        }


        const chat =
            chatSnapshot.data();


        await addDoc(
            collection(
                db,
                "staffConversations",
                currentConversationId,
                "messages"
            ),
            {

                senderId:
                    currentStaff.staffId,

                senderName:
                    currentStaff.name,

                text:
                    value,

                timestamp:
                    serverTimestamp(),

                readBy:
                    [
                        currentStaff.staffId
                    ]

            }
        );


        const counts =
            {
                ...(chat.unreadCounts || {})
            };


        (
            chat.participantIds ||
            []
        )
        .forEach(
            id => {

                if(
                    id !==
                    currentStaff.staffId
                ){

                    counts[id] =
                        Number(
                            counts[id] || 0
                        ) + 1;

                }

            }
        );


        await updateDoc(
            chatRef,
            {

                lastMessage:
                    value,

                lastSenderId:
                    currentStaff.staffId,

                lastSenderName:
                    currentStaff.name,

                lastMessageTime:
                    serverTimestamp(),

                unreadCounts:
                    counts

            }
        );

    }
    catch(error){

        console.error(
            "SEND MESSAGE ERROR:",
            error
        );


        alert(
            "Message failed:\n\n" +
            error.message
        );


        input.value =
            value;

    }

}


/* =========================================================
   MODAL
========================================================= */

function openModal(){

    document.getElementById(
        "modal"
    ).classList.add(
        "show"
    );


    selectedRecipient =
        null;


    document.getElementById(
        "newMessage"
    ).value =
        "";


    document.getElementById(
        "selected"
    ).style.display =
        "none";


    setMode(
        "individual"
    );

}


function closeModal(){

    document.getElementById(
        "modal"
    ).classList.remove(
        "show"
    );

}


function setMode(newMode){

    mode =
        newMode;


    selectedRecipient =
        null;


    document
        .querySelectorAll(
            ".tab"
        )
        .forEach(
            tab =>
                tab.classList.remove(
                    "active"
                )
        );


    document.getElementById(
        "individualArea"
    ).style.display =
        "none";


    document.getElementById(
        "departmentArea"
    ).style.display =
        "none";


    document.getElementById(
        "allArea"
    ).style.display =
        "none";


    if(
        newMode ===
        "individual"
    ){

        document.getElementById(
            "tabIndividual"
        ).classList.add(
            "active"
        );


        document.getElementById(
            "individualArea"
        ).style.display =
            "block";


        renderStaffResults(
            ""
        );

    }


    if(
        newMode ===
        "department"
    ){

        document.getElementById(
            "tabDepartment"
        ).classList.add(
            "active"
        );


        document.getElementById(
            "departmentArea"
        ).style.display =
            "block";


        renderDepartments(
            ""
        );

    }


    if(
        newMode ===
        "all"
    ){

        document.getElementById(
            "tabAll"
        ).classList.add(
            "active"
        );


        document.getElementById(
            "allArea"
        ).style.display =
            "block";


        selectedRecipient = {

            type:
                "all",

            title:
                "All Staff"

        };

    }


    updateSelected();

}


/* =========================================================
   STAFF SEARCH
========================================================= */

function renderStaffResults(search){

    const container =
        document.getElementById(
            "staffResults"
        );


    const term =
        text(search)
            .trim()
            .toLowerCase();


    let list =
        allStaff.filter(
            staff => {

                /*
                   Don't show yourself as recipient.
                */

                if(
                    currentStaff &&
                    staff.staffId ===
                    currentStaff.staffId
                ){

                    return false;

                }


                if(!term)
                    return true;


                return (

                    staff.name
                        .toLowerCase()
                        .includes(term)

                    ||

                    staff.staffId
                        .toLowerCase()
                        .includes(term)

                    ||

                    staff.department
                        .toLowerCase()
                        .includes(term)

                );

            }
        );


    list =
        list.slice(
            0,
            100
        );


    if(!list.length){

        container.innerHTML = `

            <div class="no-data">
                No staff found.
            </div>

        `;

        return;

    }


    container.innerHTML = "";


    list.forEach(
        staff => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "result";


            div.innerHTML = `

                <div class="result-name">

                    ${escapeHTML(
                        staff.name
                    )}

                </div>

                <div class="result-info">

                    ${escapeHTML(
                        staff.staffId
                    )}

                    ${
                        staff.department
                            ? " • " +
                              escapeHTML(
                                  staff.department
                              )
                            : ""
                    }

                </div>

            `;


            div.onclick =
                () => {

                    selectedRecipient = {

                        type:
                            "individual",

                        staffId:
                            staff.staffId,

                        name:
                            staff.name,

                        title:
                            staff.name,

                        department:
                            staff.department

                    };


                    updateSelected();

                };


            container.appendChild(
                div
            );

        }
    );

}


/* =========================================================
   DEPARTMENT
========================================================= */

function departments(){

    const map = {};


    allStaff.forEach(
        staff => {

            if(
                !staff.department
            )
                return;


            const name =
                staff.department.trim();


            if(
                !map[
                    name.toLowerCase()
                ]
            ){

                map[
                    name.toLowerCase()
                ] = {

                    name:
                        name,

                    count:
                        0

                };

            }


            if(
                staff.active
            ){

                map[
                    name.toLowerCase()
                ].count++;

            }

        }
    );


    return Object.values(
        map
    );

}


function renderDepartments(search){

    const container =
        document.getElementById(
            "departmentResults"
        );


    const term =
        text(search)
            .trim()
            .toLowerCase();


    let list =
        departments();


    if(term){

        list =
            list.filter(
                item =>
                    item.name
                        .toLowerCase()
                        .includes(term)
            );

    }


    if(!list.length){

        container.innerHTML = `

            <div class="no-data">
                No department found.
            </div>

        `;

        return;

    }


    container.innerHTML = "";


    list.forEach(
        department => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "result";


            div.innerHTML = `

                <div class="result-name">

                    🏢 ${escapeHTML(
                        department.name
                    )}

                </div>

                <div class="result-info">

                    ${department.count}
                    active staff

                </div>

            `;


            div.onclick =
                () => {

                    selectedRecipient = {

                        type:
                            "department",

                        department:
                            department.name,

                        title:
                            department.name +
                            " Staff"

                    };


                    updateSelected();

                };


            container.appendChild(
                div
            );

        }
    );

}


/* =========================================================
   ALL COUNT
========================================================= */

function updateAllCount(){

    const count =
        allStaff.filter(
            staff =>
                staff.active &&
                (
                    !currentStaff ||
                    staff.staffId !==
                    currentStaff.staffId
                )
        ).length;


    document.getElementById(
        "allCount"
    ).textContent =
        count +
        " active staff will receive this message.";

}


/* =========================================================
   SELECTED
========================================================= */

function updateSelected(){

    const box =
        document.getElementById(
            "selected"
        );


    if(
        !selectedRecipient
    ){

        box.style.display =
            "none";

        return;

    }


    box.style.display =
        "block";


    if(
        selectedRecipient.type ===
        "individual"
    ){

        box.innerHTML =

            "👤 Sending to <b>" +

            escapeHTML(
                selectedRecipient.name
            ) +

            "</b> (" +

            escapeHTML(
                selectedRecipient.staffId
            ) +

            ")";

    }
    else if(
        selectedRecipient.type ===
        "department"
    ){

        box.innerHTML =

            "🏢 Sending to <b>" +

            escapeHTML(
                selectedRecipient.department
            ) +

            "</b> staff";

    }
    else{

        box.innerHTML =

            "📢 Sending to <b>ALL ACTIVE STAFF</b>";

    }

}


/* =========================================================
   CREATE / SEND NEW MESSAGE
========================================================= */

async function sendNewMessage(){

    if(
        !currentStaff
    ){

        alert(
            "Staff ID not found."
        );

        return;

    }


    if(
        !selectedRecipient
    ){

        alert(
            "Select a recipient first."
        );

        return;

    }


    const textValue =
        document.getElementById(
            "newMessage"
        )
        .value
        .trim();


    if(!textValue){

        alert(
            "Type your message."
        );

        return;

    }


    try{

        let recipients = [];


        /* INDIVIDUAL */

        if(
            selectedRecipient.type ===
            "individual"
        ){

            const target =
                findStaffById(
                    selectedRecipient.staffId
                );


            if(target){

                recipients.push(
                    target
                );

            }

        }


        /* DEPARTMENT */

        if(
            selectedRecipient.type ===
            "department"
        ){

            recipients =
                allStaff.filter(
                    staff =>

                        staff.active &&

                        staff.department
                            .trim()
                            .toLowerCase() ===

                        selectedRecipient
                            .department
                            .trim()
                            .toLowerCase()

                );

        }


        /* ALL */

        if(
            selectedRecipient.type ===
            "all"
        ){

            recipients =
                allStaff.filter(
                    staff =>
                        staff.active
                );

        }


        /*
           Always include sender in participant list.
        */

        if(
            !recipients.some(
                staff =>
                    staff.staffId ===
                    currentStaff.staffId
            )
        ){

            recipients.push(
                currentStaff
            );

        }


        const participantIds =
            [
                ...new Set(
                    recipients.map(
                        staff =>
                            staff.staffId
                    )
                )
            ];


        if(
            participantIds.length < 2
        ){

            alert(
                "No recipient found."
            );

            return;

        }


        let conversationId;

        let title;


        /* =================================================
           INDIVIDUAL
        ================================================= */

        if(
            selectedRecipient.type ===
            "individual"
        ){

            conversationId =
                [
                    currentStaff.staffId,
                    selectedRecipient.staffId
                ]
                .sort()
                .join(
                    "__"
                );


            title =
                selectedRecipient.name;

        }


        /* =================================================
           DEPARTMENT / ALL
        ================================================= */

        else{

            /*
               Generate a unique conversation.
               This prevents unrelated group chats
               from being merged accidentally.
            */

            conversationId =
                doc(
                    collection(
                        db,
                        "staffConversations"
                    )
                ).id;


            title =
                selectedRecipient.type ===
                "all"

                    ? "All Staff"

                    : selectedRecipient.department +
                      " Staff";

        }


        const chatRef =
            doc(
                db,
                "staffConversations",
                conversationId
            );


        const unreadCounts = {};


        participantIds.forEach(
            id => {

                unreadCounts[id] =

                    id ===
                    currentStaff.staffId

                        ? 0
                        : 1;

            }
        );


        await setDoc(
            chatRef,
            {

                title:
                    title,

                type:
                    selectedRecipient.type,

                participantIds:
                    participantIds,

                participantNames:
                    recipients.map(
                        staff =>
                            staff.name
                    ),

                department:
                    selectedRecipient.department ||
                    "",

                lastMessage:
                    textValue,

                lastSenderId:
                    currentStaff.staffId,

                lastSenderName:
                    currentStaff.name,

                lastMessageTime:
                    serverTimestamp(),

                unreadCounts:
                    unreadCounts,

                createdBy:
                    currentStaff.staffId,

                createdAt:
                    serverTimestamp()

            },
            {
                merge:true
            }
        );


        await addDoc(
            collection(
                db,
                "staffConversations",
                conversationId,
                "messages"
            ),
            {

                senderId:
                    currentStaff.staffId,

                senderName:
                    currentStaff.name,

                text:
                    textValue,

                timestamp:
                    serverTimestamp(),

                readBy:
                    [
                        currentStaff.staffId
                    ]

            }
        );


        closeModal();


        setTimeout(
            () =>
                openConversation(
                    conversationId
                ),
            400
        );

    }
    catch(error){

        console.error(
            "NEW MESSAGE ERROR:",
            error
        );


        alert(
            "Unable to send message:\n\n" +
            error.message
        );

    }

}
