<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Head Leave Apply</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f6f9;
}

.container{
    max-width:1200px;
    margin:30px auto;
    padding:20px;
}

.header{
    background:#500454;
    color:white;
    padding:22px;
    border-radius:12px;
    margin-bottom:20px;
}

.header h2{
    margin-bottom:10px;
}

.info{
    line-height:1.8;
}

.balance-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    margin-bottom:20px;
}

.balance{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.balance h3{
    color:#500454;
    margin-bottom:10px;
}

.balance-number{
    font-size:38px;
    font-weight:bold;
    color:#500454;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.card h3{
    color:#500454;
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.form-group{
    margin-bottom:18px;
}

.full{
    grid-column:1/-1;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

button{
    padding:13px 22px;
    border:none;
    border-radius:7px;
    background:#500454;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.message{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:7px;
    font-weight:bold;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.table-container{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:800px;
}

th,
td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:left;
}

th{
    background:#500454;
    color:white;
}

@media(max-width:700px){

    .balance-grid,
    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

}

</style>

</head>

<body>

<div class="container">


<div class="header">

    <h2>
        Head Staff - Leave Apply
    </h2>

    <div class="info">

        Staff Name:
        <b id="staffName"></b>
        <br>

        Staff ID:
        <b id="staffId"></b>
        <br>

        Department:
        <b id="department"></b>

    </div>

</div>


<div class="balance-grid">

    <div class="balance">

        <h3>
            Casual Leave
        </h3>

        <div
            class="balance-number"
            id="clBalance">
            11
        </div>

        <p>
            Available this month
        </p>

    </div>


    <div class="balance">

        <h3>
            Sick Leave
        </h3>

        <div
            class="balance-number"
            id="slBalance">
            3
        </div>

        <p>
            Available this month
        </p>

    </div>

</div>


<div class="card">

    <h3>
        Apply Leave
    </h3>

    <form id="leaveForm">

        <div class="form-grid">

            <div class="form-group">

                <label>
                    Leave Type
                </label>

                <select
                    id="leaveType"
                    required>

                    <option value="">
                        Select Leave Type
                    </option>

                    <option value="CASUAL">
                        Casual Leave
                    </option>

                    <option value="SICK">
                        Sick Leave
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    From Date
                </label>

                <input
                    type="date"
                    id="fromDate"
                    required>

            </div>


            <div class="form-group">

                <label>
                    To Date
                </label>

                <input
                    type="date"
                    id="toDate"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Number of Days
                </label>

                <input
                    type="text"
                    id="days"
                    readonly>

            </div>


            <div class="form-group full">

                <label>
                    Reason
                </label>

                <textarea
                    id="reason"
                    required
                    placeholder="Enter reason">
                </textarea>

            </div>

        </div>


        <button type="submit">
            Apply Leave
        </button>

    </form>


    <div
        id="message"
        class="message">
    </div>

</div>


<div class="card">

    <h3>
        My Leave Applications
    </h3>

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>Type</th>
                    <th>From</th>
                    <th>To</th>
                    <th>Days</th>
                    <th>Status</th>
                    <th>Reason</th>

                </tr>

            </thead>

            <tbody id="table">

                <tr>
                    <td colspan="6">
                        Loading...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>

</div>


<script type="module">

import { db } from "./firebase-config.js";

import {
    collection,
    addDoc,
    getDocs,
    query,
    where,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ======================================
   EXISTING ERP SESSION
====================================== */

const staffId =
    sessionStorage.getItem("staffId");

const staffName =
    sessionStorage.getItem("staffName");

const department =
    sessionStorage.getItem("department");


if(!staffId){

    alert("Please Login");

    window.location.href="login.html";

}


document.getElementById("staffId").textContent =
    staffId || "";

document.getElementById("staffName").textContent =
    staffName || "";

document.getElementById("department").textContent =
    department || "";


/* ======================================
   MONTH
====================================== */

const now=new Date();

const currentMonth =
    now.getFullYear() +
    "-" +
    String(now.getMonth()+1).padStart(2,"0");


/* ======================================
   DAYS
====================================== */

function calculateDays(){

    const from =
        document.getElementById("fromDate").value;

    const to =
        document.getElementById("toDate").value;

    if(!from || !to){

        document.getElementById("days").value="";

        return 0;

    }

    const a =
        new Date(from+"T00:00:00");

    const b =
        new Date(to+"T00:00:00");


    if(b<a){

        document.getElementById("days").value="";

        return 0;

    }


    const days =
        Math.floor(
            (b-a)/(1000*60*60*24)
        )+1;


    document.getElementById("days").value =
        days;


    return days;

}


document
.getElementById("fromDate")
.addEventListener(
    "change",
    calculateDays
);

document
.getElementById("toDate")
.addEventListener(
    "change",
    calculateDays
);


/* ======================================
   MESSAGE
====================================== */

function showMessage(text,type){

    const box =
        document.getElementById("message");

    box.textContent=text;

    box.className=
        "message "+type;

    box.style.display="block";

}


/* ======================================
   BALANCE
====================================== */

async function getUsage(){

    const result={
        casual:0,
        sick:0
    };


    const q=query(

        collection(db,"leave_requests"),

        where(
            "applicantUid",
            "==",
            staffId
        ),

        where(
            "month",
            "==",
            currentMonth
        )

    );


    const snap =
        await getDocs(q);


    snap.forEach(doc=>{

        const d=doc.data();


        if(
            d.status==="REJECTED_BY_HEAD" ||
            d.status==="REJECTED_BY_HR" ||
            d.status==="CANCELLED"
        ){

            return;

        }


        if(d.leaveType==="CASUAL"){

            result.casual +=
                Number(d.days||0);

        }


        if(d.leaveType==="SICK"){

            result.sick +=
                Number(d.days||0);

        }

    });


    return result;

}


async function loadBalance(){

    const usage =
        await getUsage();


    document.getElementById("clBalance")
    .textContent =
        Math.max(
            0,
            11-usage.casual
        );


    document.getElementById("slBalance")
    .textContent =
        Math.max(
            0,
            3-usage.sick
        );

}


/* ======================================
   APPLICATIONS
====================================== */

async function loadApplications(){

    const table =
        document.getElementById("table");


    const q=query(

        collection(db,"leave_requests"),

        where(
            "applicantUid",
            "==",
            staffId
        )

    );


    const snap =
        await getDocs(q);


    table.innerHTML="";


    if(snap.empty){

        table.innerHTML=
        `<tr>
            <td colspan="6">
                No leave applications.
            </td>
        </tr>`;

        return;

    }


    const records=[];


    snap.forEach(doc=>{

        records.push(doc.data());

    });


    records.sort((a,b)=>
        String(
            b.fromDate||""
        ).localeCompare(
            String(
                a.fromDate||""
            )
        )
    );


    records.forEach(d=>{

        const row=
            document.createElement("tr");


        row.innerHTML=`

            <td>
                ${d.leaveType||""}
            </td>

            <td>
                ${d.fromDate||""}
            </td>

            <td>
                ${d.toDate||""}
            </td>

            <td>
                ${d.days||""}
            </td>

            <td>
                ${d.status||""}
            </td>

            <td>
                ${d.reason||""}
            </td>

        `;


        table.appendChild(row);

    });

}


/* ======================================
   SUBMIT
====================================== */

document
.getElementById("leaveForm")
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const leaveType =
            document.getElementById(
                "leaveType"
            ).value;


        const fromDate =
            document.getElementById(
                "fromDate"
            ).value;


        const toDate =
            document.getElementById(
                "toDate"
            ).value;


        const reason =
            document.getElementById(
                "reason"
            ).value.trim();


        const days =
            calculateDays();


        if(days<=0){

            showMessage(
                "Please select valid dates.",
                "error"
            );

            return;

        }


        const fromMonth =
            fromDate.substring(0,7);

        const toMonth =
            toDate.substring(0,7);


        if(fromMonth!==toMonth){

            showMessage(
                "Leave cannot cross two different months.",
                "error"
            );

            return;

        }


        const usage =
            await getUsage();


        const used =
            leaveType==="CASUAL"
            ? usage.casual
            : usage.sick;


        const limit =
            leaveType==="CASUAL"
            ? 11
            : 3;


        const available =
            Math.max(
                0,
                limit-used
            );


        if(days>available){

            showMessage(
                `Only ${available} day(s) available.`,
                "error"
            );

            return;

        }


        try{

            await addDoc(

                collection(
                    db,
                    "leave_requests"
                ),

                {

                    applicantUid:
                        staffId,

                    applicantName:
                        staffName || "",

                    staffId:
                        staffId,

                    department:
                        department || "",

                    applicantRole:
                        "HEAD",

                    applicantEmail:
                        "",

                    leaveType:
                        leaveType,

                    fromDate:
                        fromDate,

                    toDate:
                        toDate,

                    days:
                        days,

                    month:
                        fromMonth,

                    reason:
                        reason,

                    /*
                       HEAD LEAVE GOES DIRECTLY TO HR
                    */

                    status:
                        "PENDING_HR",

                    headAction:
                        "NOT_REQUIRED",

                    headActionBy:
                        "",

                    headActionAt:
                        null,

                    hrAction:
                        "",

                    hrActionBy:
                        "",

                    hrActionAt:
                        null,

                    createdAt:
                        serverTimestamp()

                }

            );


            showMessage(
                "Leave applied successfully. It has been sent directly to HR for approval.",
                "success"
            );


            document
            .getElementById("leaveForm")
            .reset();


            document.getElementById("days")
            .value="";


            await loadBalance();

            await loadApplications();


        }catch(error){

            console.error(error);

            showMessage(
                "Unable to apply leave: "+
                error.message,
                "error"
            );

        }

    }
);


loadBalance();

loadApplications();

</script>

</body>

</html>
