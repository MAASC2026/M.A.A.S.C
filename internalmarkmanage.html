<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Internal Mark Report Update Delete</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}


body{

background:#f4f6f9;
padding:20px;

}


.container{

max-width:1400px;
margin:auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 2px 10px #ccc;

}



h2{

text-align:center;
margin-bottom:25px;
color:#2c3e50;

}




.filters{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:15px;

}



.filters div{

display:flex;
flex-direction:column;

}


label{

font-weight:bold;
margin-bottom:5px;

}



select,input{

padding:10px;
border:1px solid #aaa;
border-radius:5px;

}




.buttons{

text-align:center;
margin:25px;

}



button{

padding:10px 25px;
border:none;
border-radius:5px;
background:#0d6efd;
color:white;
cursor:pointer;
margin:5px;

}



.updateBtn{

background:#198754;

}



.deleteBtn{

background:#dc3545;

}




table{

width:100%;
border-collapse:collapse;
margin-top:20px;

}


th{

background:#0d6efd;
color:white;
padding:12px;

}


td{

padding:10px;
text-align:center;
border:1px solid #ddd;

}



.markInput{

width:80px;
text-align:center;

}


</style>


</head>



<body>


<div class="container">


<h2>
Internal Mark Report / Update / Delete
</h2>



<div class="filters">


<div>

<label>Department</label>


<select id="department">


<option value="">Select Department</option>

<option>B.Com General</option>
<option>B.Com BM</option>
<option>B.Com MM</option>
<option>B.Com CS</option>
<option>B.Com A&F</option>
<option>B.Com ISM</option>
<option>B.Com CA</option>
<option>B.Com BUS.AD</option>

<option>B.A DEFENCE</option>
<option>B.A PUB.AD</option>
<option>B.A TAMIL</option>
<option>B.A TOURISM</option>

<option>B.Sc CS</option>
<option>B.Sc CS WITH AI</option>
<option>B.Sc CRIMINOLOGY</option>
<option>B.Sc SA</option>
<option>B.Sc PHYS WITH CA</option>
<option>B.Sc MATHS WITH CA</option>
<option>B.Sc ELECTRONICS WITH AI</option>
<option>B.Sc VISCOM</option>
<option>B.Sc ELECTRONIC MEDIA</option>
<option>B.Sc IDD</option>
<option>B.Sc PHYSICS</option>

<option>BCA COMPUTER APPLICATION</option>


</select>


</div>





<div>

<label>Class</label>


<select id="year">

<option value="">Select Year</option>

<option value="I">I Year</option>

<option value="II">II Year</option>

<option value="III">III Year</option>


</select>


</div>





<div>

<label>Section</label>


<select id="section">


<option value="">Select Section</option>

<option>A</option>

<option>B</option>

<option>C</option>

<option>D</option>


</select>


</div>





<div>

<label>Subject</label>


<select id="subject">


<option value="">Select Subject</option>

<option>Data Structure Programming</option>

<option>Web Technology</option>

<option>RDBMS - SA</option>

<option>ASP.NET - SA</option>


</select>


</div>





<div>

<label>Program Number</label>


<select id="examType">


<option value="">Select Program</option>
<option>PG 1</option>
<option>PRG 1</option>

<option>PRG 2</option>

<option>PRG 3</option>

<option>PRG 4</option>

<option>PRG 5</option>


</select>


</div>


</div>





<div class="buttons">


<button onclick="loadReport()">

Generate Report

</button>



<button onclick="window.print()">

Print

</button>



</div>





<table>


<thead>


<tr>

<th>S.No</th>

<th>Roll No</th>

<th>Student Name</th>

<th>Mark</th>

<th>Max Mark</th>

<th>Percentage</th>

<th>Action</th>


</tr>


</thead>


<tbody id="reportBody">


</tbody>


</table>


</div>
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getFirestore,
collection,
getDocs,
doc,
updateDoc,
deleteDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



// ===============================
// FIREBASE CONFIG
// ===============================

const firebaseConfig = {

apiKey: "AIzaSyAIv3091VM-gkmdwEAn7OhXWd9Cm2zh2bo",

authDomain: "maasc-2026.firebaseapp.com",

projectId: "maasc-2026",

storageBucket: "maasc-2026.appspot.com",

messagingSenderId: "585813001586",

appId: "1:585813001586:web:664e0e90ff0725d2e849eb"

};



const app = initializeApp(firebaseConfig);

const db = getFirestore(app);




// ===============================
// LOAD REPORT
// ===============================


window.loadReport = async function(){


const department =
document.getElementById("department").value;


const year =
document.getElementById("year").value;


const section =
document.getElementById("section").value;


const subject =
document.getElementById("subject").value;


const examType =
document.getElementById("examType").value;



if(
department=="" ||
year=="" ||
section=="" ||
subject=="" ||
examType==""
)

{

alert("Select all filters");

return;

}




const tbody =
document.getElementById("reportBody");


tbody.innerHTML="Loading...";



try{


// Get all marks

const snapshot = await getDocs(

collection(db,"internalMarks")

);




// Store unique records

let marks=[];


let unique = new Set();



snapshot.forEach((docSnap)=>{


const data = docSnap.data();



if(

data.department === department &&

data.year === year &&

data.section === section &&

data.subject === subject &&

data.examType === examType

)

{


// Create unique key

let key =

data.rollNo + "_" +

data.subject + "_" +

data.examType;



// Prevent duplicate students

if(!unique.has(key))

{

unique.add(key);



marks.push({

id:docSnap.id,

...data

});


}



}



});





// Sort Roll Number

marks.sort((a,b)=>{


return String(a.rollNo)

.localeCompare(

String(b.rollNo),

undefined,

{

numeric:true

}

);


});






tbody.innerHTML="";



if(marks.length===0)

{


tbody.innerHTML=`

<tr>

<td colspan="7">

No Marks Found

</td>

</tr>

`;

return;


}





let sno=1;



marks.forEach(item=>{



let percentage =

(

(Number(item.mark) /

Number(item.maxMark))

*100

).toFixed(2);





tbody.innerHTML += `


<tr>


<td>

${sno++}

</td>


<td>

${item.rollNo}

</td>



<td>

${item.studentName}

</td>



<td>


<input

type="number"

class="markInput"

id="mark_${item.id}"

value="${item.mark}"

>


</td>



<td>

${item.maxMark}

</td>




<td>

${percentage}%

</td>




<td>


<button

class="updateBtn"

onclick="updateMark('${item.id}')">

Update

</button>



<button

class="deleteBtn"

onclick="deleteMark('${item.id}')">

Delete

</button>



</td>


</tr>


`;



});




}


catch(error)

{


console.error(error);

alert(error.message);


}



}

// ===============================
// UPDATE MARK
// ===============================

window.updateMark = async function(id){


const markInput = 
document.getElementById("mark_"+id);



if(!markInput){

alert("Mark field not found");

return;

}



const newMark = Number(markInput.value);



if(markInput.value==""){

alert("Enter mark");

return;

}



try{


await updateDoc(

doc(db,"internalMarks",id),

{

mark:newMark

}

);



alert("Mark Updated Successfully");


loadReport();



}


catch(error){


console.error(error);

alert(error.message);


}



}




// ===============================
// DELETE MARK
// ===============================


window.deleteMark = async function(id){



let confirmDelete = confirm(

"Are you sure you want to delete this mark?"

);



if(!confirmDelete){

return;

}



try{


await deleteDoc(

doc(db,"internalMarks",id)

);



alert("Mark Deleted Successfully");


loadReport();



}


catch(error){


console.error(error);

alert(error.message);


}



}



</script>
</body>
</html>
