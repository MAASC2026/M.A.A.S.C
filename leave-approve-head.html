<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Leave Approve - Head</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f6f9;
}

.container{
    max-width:1500px;
    margin:30px auto;
    padding:20px;
}

.header{
    background:#500454;
    color:white;
    padding:22px;
    border-radius:12px;
    margin-bottom:20px;
}

.header h2{
    margin-bottom:8px;
}

.card{
    background:white;
    padding:22px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.card h3{
    color:#500454;
    margin-bottom:18px;
}

.info{
    line-height:1.7;
}

.table-container{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1100px;
}

th,
td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:left;
    vertical-align:top;
}

th{
    background:#500454;
    color:white;
}

button{
    padding:9px 14px;
    border:none;
    border-radius:6px;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin:2px;
}

.approve{
    background:#16a34a;
}

.reject{
    background:#dc2626;
}

.message{
    display:none;
    padding:12px;
    margin-bottom:18px;
    border-radius:7px;
    font-weight:bold;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.empty{
    text-align:center;
    padding:25px;
    color:#666;
}

</style>

</head>

<body>

<div class="container">


<div class="header">

    <h2>
        Leave Approval - Department Head
    </h2>

    <div class="info">

        Head:
        <b id="headName"></b>
        <br>

        Staff ID:
        <b id="headId"></b>
        <br>

        Department:
        <b id="headDepartment"></b>

    </div>

</div>


<div class="card">

    <div
        id="message"
        class="message">
    </div>


    <h3>
        Pending Staff / Worker Leave Applications
    </h3>


    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>Staff Name</th>
                    <th>Staff ID</th>
                    <th>Department</th>
                    <th>Leave Type</th>
                    <th>From</th>
                    <th>To</th>
                    <th>Days</th>
                    <th>Reason</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="table">

                <tr>
                    <td colspan="9">
                        Loading...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>

</div>


<script type="module">

import { db } from "./firebase-config.js";

import {
    collection,
    getDocs,
    query,
    where,
    doc,
    updateDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================
   EXISTING ERP SESSION
===================================== */

const headId =
    sessionStorage.getItem("staffId");

const headName =
    sessionStorage.getItem("staffName");

const headDepartment =
    sessionStorage.getItem("department");


if(!headId){

    alert("Please Login");

    window.location.href="login.html";

}


document.getElementById("headId").textContent =
    headId || "";

document.getElementById("headName").textContent =
    headName || "";

document.getElementById("headDepartment").textContent =
    headDepartment || "";


/* =====================================
   MESSAGE
===================================== */

function showMessage(text,type){

    const box =
        document.getElementById("message");

    box.textContent=text;

    box.className=
        "message "+type;

    box.style.display="block";

}


/* =====================================
   LOAD PENDING REQUESTS
===================================== */

async function loadRequests(){

    const table =
        document.getElementById("table");


    table.innerHTML=
        `<tr>
            <td colspan="9">
                Loading...
            </td>
        </tr>`;


    try{

        /*
           We query PENDING_HEAD.
           Then filter department in JavaScript.

           This avoids requiring a Firestore
           composite index.
        */

        const q=query(

            collection(
                db,
                "leave_requests"
            ),

            where(
                "status",
                "==",
                "PENDING_HEAD"
            )

        );


        const snap =
            await getDocs(q);


        table.innerHTML="";


        let count=0;


        snap.forEach(item=>{

            const data =
                item.data();


            /*
               Only STAFF applications.

               HEAD applications never come here.
            */

            if(
                data.applicantRole !== "STAFF"
            ){

                return;

            }


            /*
               Only this department.
            */

            const requestDepartment =
                String(
                    data.department || ""
                )
                .trim()
                .toUpperCase();


            const myDepartment =
                String(
                    headDepartment || ""
                )
                .trim()
                .toUpperCase();


            if(
                requestDepartment !==
                myDepartment
            ){

                return;

            }


            count++;


            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${data.applicantName || ""}
                </td>

                <td>
                    ${data.staffId || ""}
                </td>

                <td>
                    ${data.department || ""}
                </td>

                <td>
                    ${data.leaveType || ""}
                </td>

                <td>
                    ${data.fromDate || ""}
                </td>

                <td>
                    ${data.toDate || ""}
                </td>

                <td>
                    ${data.days || ""}
                </td>

                <td>
                    ${data.reason || ""}
                </td>

                <td>

                    <button
                        class="approve"
                        data-id="${item.id}"
                        data-action="APPROVE">
                        Approve
                    </button>

                    <button
                        class="reject"
                        data-id="${item.id}"
                        data-action="REJECT">
                        Reject
                    </button>

                </td>

            `;


            table.appendChild(row);

        });


        if(count===0){

            table.innerHTML =
                `<tr>
                    <td
                        colspan="9"
                        class="empty">
                        No pending leave applications for your department.
                    </td>
                </tr>`;

        }


    }catch(error){

        console.error(error);

        table.innerHTML =
            `<tr>
                <td
                    colspan="9"
                    class="empty">
                    Error loading leave applications.
                </td>
            </tr>`;

    }

}


/* =====================================
   APPROVE / REJECT
===================================== */

document
.getElementById("table")
.addEventListener(
    "click",
    async function(e){

        const button =
            e.target.closest("button");


        if(!button){
            return;
        }


        const id =
            button.dataset.id;


        const action =
            button.dataset.action;


        if(action==="APPROVE"){

            if(
                !confirm(
                    "Approve this leave application?"
                )
            ){

                return;

            }

        }


        if(action==="REJECT"){

            if(
                !confirm(
                    "Reject this leave application?"
                )
            ){

                return;

            }

        }


        try{

            const ref =
                doc(
                    db,
                    "leave_requests",
                    id
                );


            if(action==="APPROVE"){

                await updateDoc(
                    ref,
                    {

                        /*
                           Staff leave now reaches HR report.
                        */

                        status:
                            "APPROVED_BY_HEAD",

                        headAction:
                            "APPROVED",

                        headActionBy:
                            headId,

                        headActionAt:
                            serverTimestamp()

                    }
                );


                showMessage(
                    "Leave approved. It has been forwarded to HR.",
                    "success"
                );

            }


            if(action==="REJECT"){

                await updateDoc(
                    ref,
                    {

                        status:
                            "REJECTED_BY_HEAD",

                        headAction:
                            "REJECTED",

                        headActionBy:
                            headId,

                        headActionAt:
                            serverTimestamp()

                    }
                );


                showMessage(
                    "Leave rejected.",
                    "success"
                );

            }


            await loadRequests();


        }catch(error){

            console.error(error);

            showMessage(
                "Unable to update leave: "+
                error.message,
                "error"
            );

        }

    }
);


loadRequests();

</script>

</body>

</html>
