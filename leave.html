<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leave Approval</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f7fb;
    color:#1f2937;
}

/* HEADER */

.header{
    background:#1e3a8a;
    color:white;
    padding:22px 30px;
}

.header h1{
    font-size:25px;
    margin-bottom:5px;
}

.header p{
    font-size:14px;
    opacity:.9;
}


/* CONTAINER */

.container{
    max-width:1250px;
    margin:30px auto;
    padding:0 18px;
}


/* MESSAGE */

.message{
    display:none;
    padding:14px 17px;
    border-radius:9px;
    margin-bottom:20px;
    font-size:14px;
    line-height:1.5;
}

.message.success{
    display:block;
    background:#dcfce7;
    color:#166534;
    border:1px solid #86efac;
}

.message.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fca5a5;
}

.message.info{
    display:block;
    background:#dbeafe;
    color:#1e40af;
    border:1px solid #93c5fd;
}


/* CARD */

.card{
    background:white;
    border-radius:14px;
    padding:24px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
    margin-bottom:22px;
}

.card-title{
    font-size:21px;
    font-weight:bold;
    color:#1e3a8a;
    margin-bottom:20px;
}


/* HEAD DETAILS */

.head-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.detail-box{
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:9px;
    padding:13px;
}

.detail-label{
    font-size:11px;
    color:#6b7280;
    font-weight:bold;
    text-transform:uppercase;
    margin-bottom:5px;
}

.detail-value{
    font-size:15px;
    font-weight:bold;
    color:#111827;
}


/* LOADING */

.loading{
    text-align:center;
    padding:35px;
    color:#6b7280;
}

.spinner{
    width:30px;
    height:30px;
    border:4px solid #dbeafe;
    border-top-color:#2563eb;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:0 auto 12px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* REQUEST GRID */

.requests{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}


/* REQUEST CARD */

.request-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:13px;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.request-header{
    background:#f8fafc;
    padding:16px;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.request-staff{
    font-size:17px;
    font-weight:bold;
    color:#111827;
}

.request-id{
    font-size:11px;
    color:#6b7280;
    margin-top:4px;
}

.status{
    background:#fef3c7;
    color:#92400e;
    border:1px solid #fcd34d;
    border-radius:20px;
    padding:6px 10px;
    font-size:11px;
    font-weight:bold;
    white-space:nowrap;
}

.request-body{
    padding:17px;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:13px;
}

.info-item{
    border-bottom:1px solid #f1f5f9;
    padding-bottom:9px;
}

.info-label{
    font-size:11px;
    color:#6b7280;
    font-weight:bold;
    margin-bottom:4px;
    text-transform:uppercase;
}

.info-value{
    font-size:14px;
    color:#111827;
    word-break:break-word;
}

.reason-box{
    margin-top:15px;
    background:#f8fafc;
    border-radius:8px;
    padding:13px;
}

.reason-label{
    font-size:11px;
    font-weight:bold;
    color:#6b7280;
    margin-bottom:6px;
    text-transform:uppercase;
}

.reason-text{
    font-size:14px;
    line-height:1.5;
    color:#374151;
}


/* ACTION */

.action-area{
    padding:16px;
    background:#fafafa;
    border-top:1px solid #e5e7eb;
}

.remarks-label{
    font-size:12px;
    font-weight:bold;
    color:#374151;
    margin-bottom:7px;
    display:block;
}

.remarks{
    width:100%;
    min-height:75px;
    resize:vertical;
    padding:10px;
    border:1px solid #d1d5db;
    border-radius:8px;
    outline:none;
    font-size:13px;
}

.remarks:focus{
    border-color:#2563eb;
}

.action-buttons{
    display:flex;
    gap:10px;
    margin-top:12px;
}

button{
    border:none;
    border-radius:8px;
    padding:11px 18px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.btn-approve{
    background:#16a34a;
    color:white;
}

.btn-approve:hover{
    background:#15803d;
}

.btn-reject{
    background:#dc2626;
    color:white;
}

.btn-reject:hover{
    background:#b91c1c;
}

.btn-refresh{
    background:#2563eb;
    color:white;
}

.btn-refresh:hover{
    background:#1d4ed8;
}


/* TOP ACTION */

.top-actions{
    display:flex;
    justify-content:flex-end;
    margin-bottom:18px;
}


/* EMPTY */

.empty{
    background:white;
    border-radius:12px;
    padding:50px 20px;
    text-align:center;
    border:1px solid #e5e7eb;
}

.empty-icon{
    font-size:42px;
    margin-bottom:12px;
}

.empty-title{
    font-size:18px;
    font-weight:bold;
    color:#374151;
    margin-bottom:6px;
}

.empty-text{
    font-size:13px;
    color:#6b7280;
}


/* MOBILE */

@media(max-width:950px){

    .head-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .requests{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){

    .header{
        padding:18px;
    }

    .container{
        padding:0 12px;
        margin-top:20px;
    }

    .card{
        padding:17px;
    }

    .head-grid{
        grid-template-columns:1fr;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

    .request-header{
        flex-direction:column;
        align-items:flex-start;
    }

    .action-buttons{
        flex-direction:column;
    }

    .action-buttons button{
        width:100%;
    }
}

</style>
</head>


<body>


<!-- HEADER -->

<div class="header">

    <h1>
        Leave Approval
    </h1>

    <p>
        Department Head Leave Approval
    </p>

</div>


<div class="container">


    <!-- MESSAGE -->

    <div
        id="message"
        class="message"
    ></div>


    <!-- HEAD DETAILS -->

    <div class="card">

        <div class="card-title">
            Logged-in Head
        </div>


        <div
            id="headLoading"
            class="loading"
        >

            <div class="spinner"></div>

            Loading Head details...

        </div>


        <div
            id="headDetails"
            style="display:none;"
        >

            <div class="head-grid">


                <div class="detail-box">

                    <div class="detail-label">
                        Staff ID
                    </div>

                    <div
                        id="headId"
                        class="detail-value"
                    >
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        Staff Name
                    </div>

                    <div
                        id="headName"
                        class="detail-value"
                    >
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        Department
                    </div>

                    <div
                        id="headDepartment"
                        class="detail-value"
                    >
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        Role
                    </div>

                    <div
                        id="headRole"
                        class="detail-value"
                    >
                    </div>

                </div>

            </div>

        </div>

    </div>



    <!-- REQUESTS -->

    <div class="card">

        <div
            style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:15px;
            margin-bottom:20px;
            "
        >

            <div class="card-title" style="margin:0;">
                Pending Leave Requests
            </div>


            <button
                id="refreshBtn"
                class="btn-refresh"
            >
                Refresh
            </button>

        </div>


        <div
            id="requestsLoading"
            class="loading"
            style="display:none;"
        >

            <div class="spinner"></div>

            Loading leave requests...

        </div>


        <div
            id="requestsContainer"
        ></div>

    </div>


</div>



<script type="module">


/* =========================================================
   FIREBASE IMPORTS
========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getFirestore,
    collection,
    getDocs,
    query,
    where,
    doc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:
        "YOUR_API_KEY",

    authDomain:
        "maasc-2026.firebaseapp.com",

    projectId:
        "maasc-2026",

    storageBucket:
        "maasc-2026.appspot.com",

    messagingSenderId:
        "YOUR_MESSAGING_SENDER_ID",

    appId:
        "YOUR_APP_ID"
};


const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getFirestore(app);



/* =========================================================
   VARIABLES
========================================================= */

let currentHead = null;


/* =========================================================
   DOM
========================================================= */

const message =
    document.getElementById(
        "message"
    );


const headLoading =
    document.getElementById(
        "headLoading"
    );


const headDetails =
    document.getElementById(
        "headDetails"
    );


const headId =
    document.getElementById(
        "headId"
    );


const headName =
    document.getElementById(
        "headName"
    );


const headDepartment =
    document.getElementById(
        "headDepartment"
    );


const headRole =
    document.getElementById(
        "headRole"
    );


const requestsLoading =
    document.getElementById(
        "requestsLoading"
    );


const requestsContainer =
    document.getElementById(
        "requestsContainer"
    );


const refreshBtn =
    document.getElementById(
        "refreshBtn"
    );



/* =========================================================
   HELPERS
========================================================= */

function firstValue(...values){

    for(
        const value of values
    ){

        if(
            value !== undefined &&
            value !== null &&
            String(value).trim() !== ""
        ){

            return value;
        }
    }

    return "";
}



function normalizeRole(role){

    return String(
        role || ""
    )
    .trim()
    .toUpperCase()
    .replace(
        /[\s-]+/g,
        "_"
    );
}



function normalizeText(value){

    return String(
        value || ""
    )
    .trim()
    .toUpperCase();
}



function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}



function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "message " + type;
}



/* =========================================================
   GET LOGGED-IN STAFF ID
========================================================= */

/*
 * IMPORTANT:
 *
 * We only use stored data to obtain
 * STAFF ID.
 *
 * We DO NOT use stored staff name.
 */

function getLoggedInStaffId(){

    const keys = [

        "currentStaff",
        "loggedInStaff",
        "staffData",
        "staff",
        "userData",
        "user",
        "currentUser",
        "loggedInUser"

    ];


    /* SESSION STORAGE */

    for(
        const key of keys
    ){

        try{

            const raw =
                sessionStorage.getItem(
                    key
                );


            if(!raw){
                continue;
            }


            const data =
                JSON.parse(raw);


            const id =
                firstValue(
                    data.staffId,
                    data.staffID,
                    data.staff_id
                );


            if(id){

                console.log(
                    "HEAD STAFF ID FROM SESSION:",
                    id
                );

                return String(
                    id
                ).trim();
            }

        }
        catch(error){

            console.warn(
                "Session storage error:",
                error
            );
        }
    }


    /* LOCAL STORAGE */

    for(
        const key of keys
    ){

        try{

            const raw =
                localStorage.getItem(
                    key
                );


            if(!raw){
                continue;
            }


            const data =
                JSON.parse(raw);


            const id =
                firstValue(
                    data.staffId,
                    data.staffID,
                    data.staff_id
                );


            if(id){

                console.log(
                    "HEAD STAFF ID FROM LOCAL:",
                    id
                );

                return String(
                    id
                ).trim();
            }

        }
        catch(error){

            console.warn(
                "Local storage error:",
                error
            );
        }
    }


    /* DIRECT VALUES */

    const directKeys = [

        "staffId",
        "staffID",
        "staff_id"

    ];


    for(
        const key of directKeys
    ){

        const sessionValue =
            sessionStorage.getItem(
                key
            );


        if(sessionValue){

            return sessionValue.trim();
        }


        const localValue =
            localStorage.getItem(
                key
            );


        if(localValue){

            return localValue.trim();
        }
    }


    return "";
}



/* =========================================================
   LOAD HEAD FROM FIRESTORE
========================================================= */

async function loadHead(){

    try{

        headLoading.style.display =
            "block";


        headDetails.style.display =
            "none";


        const staffId =
            getLoggedInStaffId();


        if(!staffId){

            throw new Error(
                "Logged-in Staff ID was not found. Please login again."
            );
        }


        console.log(
            "LOADING HEAD USING STAFF ID:",
            staffId
        );


        /*
         * EXACT STAFF ID QUERY
         */

        let q =
            query(
                collection(
                    db,
                    "staff"
                ),
                where(
                    "staffId",
                    "==",
                    staffId
                )
            );


        let snapshot =
            await getDocs(q);


        /*
         * Uppercase fallback
         */

        if(
            snapshot.empty &&
            staffId !== staffId.toUpperCase()
        ){

            q =
                query(
                    collection(
                        db,
                        "staff"
                    ),
                    where(
                        "staffId",
                        "==",
                        staffId.toUpperCase()
                    )
                );


            snapshot =
                await getDocs(q);
        }


        if(
            snapshot.empty
        ){

            throw new Error(
                "Staff record not found for Staff ID: " +
                staffId
            );
        }


        const data =
            snapshot.docs[0].data();


        currentHead = {

            staffId:
                String(
                    firstValue(
                        data.staffId,
                        data.staffID
                    )
                ).trim(),

            name:
                String(
                    firstValue(
                        data.name,
                        data.staffName
                    )
                ).trim(),

            department:
                String(
                    firstValue(
                        data.department,
                        data.dept
                    )
                ).trim(),

            serviceRole:
                normalizeRole(
                    firstValue(
                        data.serviceRole,
                        data.role
                    )
                )
        };


        console.log(
            "CURRENT HEAD:",
            currentHead
        );


        /*
         * SECURITY CHECK
         */

        if(
            currentHead.serviceRole !==
                "DEPARTMENT_HEAD" &&
            currentHead.serviceRole !==
                "DEPARTMENT_HEAD"
        ){

            throw new Error(
                "This page is only for Department Heads."
            );
        }


        /*
         * DISPLAY ACTUAL FIRESTORE DATA
         */

        headId.textContent =
            currentHead.staffId;


        headName.textContent =
            currentHead.name;


        headDepartment.textContent =
            currentHead.department;


        headRole.textContent =
            currentHead.serviceRole;


        headLoading.style.display =
            "none";


        headDetails.style.display =
            "block";


        await loadLeaveRequests();

    }
    catch(error){

        console.error(
            "HEAD LOAD ERROR:",
            error
        );


        headLoading.style.display =
            "none";


        showMessage(
            error.message,
            "error"
        );
    }
}



/* =========================================================
   LOAD LEAVE REQUESTS
========================================================= */

async function loadLeaveRequests(){

    if(!currentHead){
        return;
    }


    try{

        requestsLoading.style.display =
            "block";


        requestsContainer.innerHTML =
            "";


        /*
         * IMPORTANT:
         *
         * Only query PENDING_HEAD.
         *
         * We filter department in JavaScript
         * so Firestore composite indexes are
         * not required.
         */

        const q =
            query(
                collection(
                    db,
                    "leaveRequests"
                ),
                where(
                    "status",
                    "==",
                    "PENDING_HEAD"
                )
            );


        const snapshot =
            await getDocs(q);


        console.log(
            "PENDING HEAD REQUESTS:",
            snapshot.size
        );


        const requests = [];


        snapshot.forEach(
            item => {

                const data =
                    item.data();


                /*
                 * Department matching.
                 */

                const requestDepartment =
                    normalizeText(
                        firstValue(
                            data.department,
                            data.dept
                        )
                    );


                const headDept =
                    normalizeText(
                        currentHead.department
                    );


                /*
                 * Only show requests
                 * from this Head's department.
                 */

                if(
                    requestDepartment ===
                    headDept
                ){

                    requests.push({

                        id:
                            item.id,

                        ...data

                    });
                }

            }
        );


        requests.sort(
            (a,b) => {

                const aTime =
                    a.appliedAt?.seconds ||
                    0;

                const bTime =
                    b.appliedAt?.seconds ||
                    0;

                return bTime - aTime;
            }
        );


        requestsLoading.style.display =
            "none";


        if(
            requests.length === 0
        ){

            requestsContainer.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        ✓
                    </div>

                    <div class="empty-title">
                        No Pending Leave Requests
                    </div>

                    <div class="empty-text">
                        There are currently no leave requests
                        waiting for your approval.
                    </div>

                </div>

            `;

            return;
        }


        requestsContainer.innerHTML =
            `
            <div class="requests">

                ${
                    requests
                        .map(
                            request =>
                                createRequestCard(
                                    request
                                )
                        )
                        .join("")
                }

            </div>
            `;


    }
    catch(error){

        console.error(
            "REQUEST LOAD ERROR:",
            error
        );


        requestsLoading.style.display =
            "none";


        requestsContainer.innerHTML = `

            <div class="empty">

                <div class="empty-title">
                    Unable to Load Requests
                </div>

                <div class="empty-text">
                    ${escapeHTML(
                        error.message
                    )}
                </div>

            </div>

        `;
    }
}



/* =========================================================
   CREATE REQUEST CARD
========================================================= */

function createRequestCard(
    request
){

    const staffName =
        firstValue(
            request.staffName,
            "Unknown Staff"
        );


    const staffId =
        firstValue(
            request.staffId,
            "-"
        );


    const department =
        firstValue(
            request.department,
            "-"
        );


    const leaveType =
        firstValue(
            request.leaveType,
            "-"
        );


    const fromDate =
        firstValue(
            request.fromDate,
            "-"
        );


    const toDate =
        firstValue(
            request.toDate,
            "-"
        );


    const totalDays =
        firstValue(
            request.totalDays,
            "0"
        );


    const contact =
        firstValue(
            request.contactNumber,
            "-"
        );


    const reason =
        firstValue(
            request.reason,
            "No reason provided."
        );


    return `

        <div
            class="request-card"
            id="request-${escapeHTML(
                request.id
            )}"
        >

            <div class="request-header">

                <div>

                    <div class="request-staff">
                        ${escapeHTML(
                            staffName
                        )}
                    </div>

                    <div class="request-id">
                        Staff ID:
                        ${escapeHTML(
                            staffId
                        )}
                    </div>

                </div>


                <div class="status">
                    PENDING APPROVAL
                </div>

            </div>


            <div class="request-body">

                <div class="info-grid">


                    <div class="info-item">

                        <div class="info-label">
                            Department
                        </div>

                        <div class="info-value">
                            ${escapeHTML(
                                department
                            )}
                        </div>

                    </div>


                    <div class="info-item">

                        <div class="info-label">
                            Leave Type
                        </div>

                        <div class="info-value">
                            ${escapeHTML(
                                leaveType
                            )}
                        </div>

                    </div>


                    <div class="info-item">

                        <div class="info-label">
                            From Date
                        </div>

                        <div class="info-value">
                            ${escapeHTML(
                                fromDate
                            )}
                        </div>

                    </div>


                    <div class="info-item">

                        <div class="info-label">
                            To Date
                        </div>

                        <div class="info-value">
                            ${escapeHTML(
                                toDate
                            )}
                        </div>

                    </div>


                    <div class="info-item">

                        <div class="info-label">
                            Total Days
                        </div>

                        <div class="info-value">
                            ${escapeHTML(
                                totalDays
                            )}
                        </div>

                    </div>


                    <div class="info-item">

                        <div class="info-label">
                            Contact
                        </div>

                        <div class="info-value">
                            ${escapeHTML(
                                contact
                            )}
                        </div>

                    </div>

                </div>


                <div class="reason-box">

                    <div class="reason-label">
                        Reason
                    </div>

                    <div class="reason-text">
                        ${escapeHTML(
                            reason
                        )}
                    </div>

                </div>

            </div>


            <div class="action-area">

                <label
                    class="remarks-label"
                    for="remarks-${escapeHTML(
                        request.id
                    )}"
                >
                    Remarks
                </label>


                <textarea
                    class="remarks"
                    id="remarks-${escapeHTML(
                        request.id
                    )}"
                    placeholder="Enter remarks..."
                ></textarea>


                <div class="action-buttons">


                    <button
                        type="button"
                        class="btn-approve"
                        onclick="approveLeave(
                            '${escapeHTML(
                                request.id
                            )}'
                        )"
                    >
                        Approve & Send to HR
                    </button>


                    <button
                        type="button"
                        class="btn-reject"
                        onclick="rejectLeave(
                            '${escapeHTML(
                                request.id
                            )}'
                        )"
                    >
                        Reject
                    </button>


                </div>

            </div>

        </div>

    `;
}



/* =========================================================
   GET REMARKS
========================================================= */

function getRemarks(
    requestId
){

    const element =
        document.getElementById(
            "remarks-" +
            requestId
        );


    if(!element){
        return "";
    }


    return element.value.trim();
}



/* =========================================================
   APPROVE LEAVE
========================================================= */

window.approveLeave =
    async function(
        requestId
    ){

        if(!currentHead){
            return;
        }


        try{

            const remarks =
                getRemarks(
                    requestId
                );


            const card =
                document.getElementById(
                    "request-" +
                    requestId
                );


            const buttons =
                card?.querySelectorAll(
                    "button"
                );


            buttons?.forEach(
                button => {
                    button.disabled =
                        true;
                }
            );


            /*
             * IMPORTANT:
             *
             * Department Head approval
             * sends request to HR Head.
             */

            await updateDoc(
                doc(
                    db,
                    "leaveRequests",
                    requestId
                ),
                {

                    status:
                        "PENDING_HR",


                    headId:
                        currentHead.staffId,


                    headName:
                        currentHead.name,


                    headAction:
                        "APPROVED",


                    headRemarks:
                        remarks,


                    headActionAt:
                        serverTimestamp(),


                    updatedAt:
                        serverTimestamp()

                }
            );


            showMessage(
                "Leave request approved and sent to HR Head.",
                "success"
            );


            await loadLeaveRequests();


        }
        catch(error){

            console.error(
                "APPROVAL ERROR:",
                error
            );


            showMessage(
                "Unable to approve leave: " +
                error.message,
                "error"
            );


            await loadLeaveRequests();
        }
    };



/* =========================================================
   REJECT LEAVE
========================================================= */

window.rejectLeave =
    async function(
        requestId
    ){

        if(!currentHead){
            return;
        }


        try{

            const remarks =
                getRemarks(
                    requestId
                );


            if(!remarks){

                showMessage(
                    "Please enter a reason for rejecting the leave request.",
                    "error"
                );

                return;
            }


            const card =
                document.getElementById(
                    "request-" +
                    requestId
                );


            const buttons =
                card?.querySelectorAll(
                    "button"
                );


            buttons?.forEach(
                button => {
                    button.disabled =
                        true;
                }
            );


            /*
             * Department Head rejection.
             */

            await updateDoc(
                doc(
                    db,
                    "leaveRequests",
                    requestId
                ),
                {

                    status:
                        "HEAD_REJECTED",


                    headId:
                        currentHead.staffId,


                    headName:
                        currentHead.name,


                    headAction:
                        "REJECTED",


                    headRemarks:
                        remarks,


                    headActionAt:
                        serverTimestamp(),


                    updatedAt:
                        serverTimestamp()

                }
            );


            showMessage(
                "Leave request rejected.",
                "success"
            );


            await loadLeaveRequests();


        }
        catch(error){

            console.error(
                "REJECTION ERROR:",
                error
            );


            showMessage(
                "Unable to reject leave: " +
                error.message,
                "error"
            );


            await loadLeaveRequests();
        }
    };



/* =========================================================
   REFRESH
========================================================= */

refreshBtn.addEventListener(
    "click",
    async function(){

        if(!currentHead){
            return;
        }


        refreshBtn.disabled =
            true;

        refreshBtn.textContent =
            "Loading...";


        await loadLeaveRequests();


        refreshBtn.disabled =
            false;

        refreshBtn.textContent =
            "Refresh";
    }
);



/* =========================================================
   START
========================================================= */

loadHead();

</script>
