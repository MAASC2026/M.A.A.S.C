<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Leave Apply</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f6f9;
    color:#222;
}

.container{
    max-width:1200px;
    margin:30px auto;
    padding:20px;
}

.header{
    background:#500454;
    color:white;
    padding:22px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.header h2{
    margin-bottom:8px;
}

.staff-info{
    font-size:15px;
    line-height:1.7;
}

.balance-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    margin-bottom:20px;
}

.balance-card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.balance-card h3{
    color:#500454;
    margin-bottom:12px;
}

.balance-number{
    font-size:38px;
    font-weight:bold;
    color:#500454;
}

.balance-label{
    color:#666;
    margin-top:5px;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
    margin-bottom:20px;
}

.card h3{
    color:#500454;
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#500454;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.full{
    grid-column:1/-1;
}

button{
    padding:13px 22px;
    border:none;
    border-radius:7px;
    background:#500454;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#6e0a75;
}

.message{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:7px;
    font-weight:bold;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.table-container{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th,
td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:left;
}

th{
    background:#500454;
    color:white;
}

.status{
    font-weight:bold;
}

.pending{
    color:#b45309;
}

.approved{
    color:#15803d;
}

.rejected{
    color:#dc2626;
}

@media(max-width:700px){

    .balance-grid,
    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .container{
        padding:12px;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h2>Leave Apply</h2>

        <div class="staff-info">

            <div>
                Staff Name:
                <b id="staffName"></b>
            </div>

            <div>
                Staff ID:
                <b id="staffId"></b>
            </div>

            <div>
                Department:
                <b id="department"></b>
            </div>

            <div>
                Month:
                <b id="currentMonth"></b>
            </div>

        </div>

    </div>


    <!-- LEAVE BALANCE -->

    <div class="balance-grid">

        <div class="balance-card">

            <h3>Casual Leave</h3>

            <div
                class="balance-number"
                id="clBalance">
                11
            </div>

            <div class="balance-label">
                Available this month
            </div>

        </div>


        <div class="balance-card">

            <h3>Sick Leave</h3>

            <div
                class="balance-number"
                id="slBalance">
                3
            </div>

            <div class="balance-label">
                Available this month
            </div>

        </div>

    </div>


    <!-- APPLY -->

    <div class="card">

        <h3>Apply Leave</h3>

        <form id="leaveForm">

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Leave Type
                    </label>

                    <select
                        id="leaveType"
                        required>

                        <option value="">
                            Select Leave Type
                        </option>

                        <option value="CASUAL">
                            Casual Leave
                        </option>

                        <option value="SICK">
                            Sick Leave
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        From Date
                    </label>

                    <input
                        type="date"
                        id="fromDate"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        To Date
                    </label>

                    <input
                        type="date"
                        id="toDate"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Number of Days
                    </label>

                    <input
                        type="text"
                        id="numberOfDays"
                        readonly
                        placeholder="Automatically calculated">

                </div>


                <div class="form-group full">

                    <label>
                        Reason
                    </label>

                    <textarea
                        id="reason"
                        placeholder="Enter reason for leave"
                        required></textarea>

                </div>

            </div>


            <button type="submit">
                Apply Leave
            </button>

        </form>


        <div
            id="message"
            class="message">
        </div>

    </div>


    <!-- MY APPLICATIONS -->

    <div class="card">

        <h3>
            My Leave Applications
        </h3>

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Leave Type</th>
                        <th>From</th>
                        <th>To</th>
                        <th>Days</th>
                        <th>Status</th>
                        <th>Reason</th>
                        <th>Applied On</th>

                    </tr>

                </thead>

                <tbody id="leaveTable">

                    <tr>
                        <td colspan="7">
                            Loading...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<script type="module">

import { db } from "./firebase-config.js";

import {
    collection,
    addDoc,
    getDocs,
    query,
    where,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================
   EXISTING ERP LOGIN SYSTEM
========================================= */

const staffId =
    sessionStorage.getItem("staffId");

const staffName =
    sessionStorage.getItem("staffName");

const department =
    sessionStorage.getItem("department");


if(!staffId){

    alert("Please Login");

    window.location.href="login.html";

}


/* =========================================
   DISPLAY LOGIN DETAILS
========================================= */

document.getElementById("staffId").textContent =
    staffId || "";

document.getElementById("staffName").textContent =
    staffName || "";

document.getElementById("department").textContent =
    department || "";


/* =========================================
   CURRENT MONTH
========================================= */

const today = new Date();

const currentMonth =
    today.getFullYear() +
    "-" +
    String(today.getMonth()+1).padStart(2,"0");

document.getElementById("currentMonth").textContent =
    currentMonth;


/* =========================================
   DATE CALCULATION
========================================= */

function calculateDays(){

    const from =
        document.getElementById("fromDate").value;

    const to =
        document.getElementById("toDate").value;

    if(!from || !to){

        document.getElementById("numberOfDays").value="";

        return 0;

    }

    const start =
        new Date(from + "T00:00:00");

    const end =
        new Date(to + "T00:00:00");

    if(end < start){

        document.getElementById("numberOfDays").value="";

        return 0;

    }

    const days =
        Math.floor(
            (end-start) /
            (1000*60*60*24)
        ) + 1;

    document.getElementById("numberOfDays").value =
        days;

    return days;

}


document
.getElementById("fromDate")
.addEventListener("change",calculateDays);

document
.getElementById("toDate")
.addEventListener("change",calculateDays);


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className =
        "message " + type;

    box.style.display = "block";

}


/* =========================================
   GET MONTH USED BALANCE
========================================= */

async function getMonthlyUsage(){

    const result = {
        casual:0,
        sick:0
    };

    const q = query(

        collection(db,"leave_requests"),

        where(
            "applicantUid",
            "==",
            staffId
        ),

        where(
            "month",
            "==",
            currentMonth
        )

    );

    const snap =
        await getDocs(q);


    snap.forEach(doc => {

        const data = doc.data();

        /*
           Rejected leaves do not consume balance.
        */

        if(
            data.status === "REJECTED_BY_HEAD" ||
            data.status === "REJECTED_BY_HR" ||
            data.status === "CANCELLED"
        ){

            return;

        }


        if(data.leaveType === "CASUAL"){

            result.casual +=
                Number(data.days || 0);

        }


        if(data.leaveType === "SICK"){

            result.sick +=
                Number(data.days || 0);

        }

    });


    return result;

}


/* =========================================
   LOAD BALANCE
========================================= */

async function loadBalance(){

    try{

        const usage =
            await getMonthlyUsage();


        document.getElementById("clBalance")
        .textContent =
            Math.max(
                0,
                11 - usage.casual
            );


        document.getElementById("slBalance")
        .textContent =
            Math.max(
                0,
                3 - usage.sick
            );


    }catch(error){

        console.error(
            "Balance error:",
            error
        );

    }

}


/* =========================================
   LOAD MY LEAVES
========================================= */

async function loadLeaves(){

    const table =
        document.getElementById("leaveTable");

    table.innerHTML =
        `<tr>
            <td colspan="7">
                Loading...
            </td>
        </tr>`;


    try{

        const q = query(

            collection(db,"leave_requests"),

            where(
                "applicantUid",
                "==",
                staffId
            )

        );


        const snap =
            await getDocs(q);


        const records=[];


        snap.forEach(doc => {

            records.push({
                id:doc.id,
                ...doc.data()
            });

        });


        records.sort((a,b) =>
            String(
                b.fromDate || ""
            ).localeCompare(
                String(
                    a.fromDate || ""
                )
            )
        );


        table.innerHTML="";


        if(records.length === 0){

            table.innerHTML =
                `<tr>
                    <td colspan="7">
                        No leave applications found.
                    </td>
                </tr>`;

            return;

        }


        records.forEach(data => {

            let statusClass="";

            if(
                String(data.status || "")
                .includes("PENDING")
            ){

                statusClass="pending";

            }

            if(
                String(data.status || "")
                .includes("APPROVED")
            ){

                statusClass="approved";

            }

            if(
                String(data.status || "")
                .includes("REJECTED")
            ){

                statusClass="rejected";

            }


            let appliedOn="";

            if(
                data.createdAt &&
                data.createdAt.toDate
            ){

                appliedOn =
                    data.createdAt
                    .toDate()
                    .toLocaleDateString();

            }


            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${data.leaveType || ""}
                </td>

                <td>
                    ${data.fromDate || ""}
                </td>

                <td>
                    ${data.toDate || ""}
                </td>

                <td>
                    ${data.days || ""}
                </td>

                <td class="${statusClass}">
                    ${data.status || ""}
                </td>

                <td>
                    ${data.reason || ""}
                </td>

                <td>
                    ${appliedOn}
                </td>

            `;


            table.appendChild(row);

        });


    }catch(error){

        console.error(error);

        table.innerHTML =
            `<tr>
                <td colspan="7">
                    Unable to load leave applications.
                </td>
            </tr>`;

    }

}


/* =========================================
   APPLY LEAVE
========================================= */

document
.getElementById("leaveForm")
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const leaveType =
            document
            .getElementById("leaveType")
            .value;


        const fromDate =
            document
            .getElementById("fromDate")
            .value;


        const toDate =
            document
            .getElementById("toDate")
            .value;


        const reason =
            document
            .getElementById("reason")
            .value
            .trim();


        const days =
            calculateDays();


        if(!leaveType){

            showMessage(
                "Please select leave type.",
                "error"
            );

            return;

        }


        if(days <= 0){

            showMessage(
                "Please select valid dates.",
                "error"
            );

            return;

        }


        /*
           Leave cannot cross months.
        */

        const fromMonth =
            fromDate.substring(0,7);

        const toMonth =
            toDate.substring(0,7);


        if(fromMonth !== toMonth){

            showMessage(
                "Leave cannot cross two different months. Please apply separately for each month.",
                "error"
            );

            return;

        }


        const usage =
            await getMonthlyUsage();


        let used=0;
        let limit=0;


        if(leaveType === "CASUAL"){

            used=usage.casual;
            limit=11;

        }


        if(leaveType === "SICK"){

            used=usage.sick;
            limit=3;

        }


        const available =
            Math.max(
                0,
                limit-used
            );


        if(days > available){

            showMessage(
                `You have only ${available} day(s) available for this leave type this month.`,
                "error"
            );

            return;

        }


        try{

            await addDoc(
                collection(
                    db,
                    "leave_requests"
                ),
                {

                    applicantUid:
                        staffId,

                    applicantName:
                        staffName || "",

                    staffId:
                        staffId,

                    department:
                        department || "",

                    applicantRole:
                        "STAFF",

                    applicantEmail:
                        "",

                    leaveType:
                        leaveType,

                    fromDate:
                        fromDate,

                    toDate:
                        toDate,

                    days:
                        days,

                    month:
                        fromMonth,

                    reason:
                        reason,

                    /*
                       Staff leave first goes
                       to Department Head.
                    */

                    status:
                        "PENDING_HEAD",

                    headAction:
                        "",

                    headActionBy:
                        "",

                    headActionAt:
                        null,

                    hrAction:
                        "",

                    hrActionBy:
                        "",

                    hrActionAt:
                        null,

                    createdAt:
                        serverTimestamp()

                }
            );


            showMessage(
                "Leave applied successfully. It has been sent to your Department Head for approval.",
                "success"
            );


            document
            .getElementById("leaveForm")
            .reset();


            document
            .getElementById("numberOfDays")
            .value="";


            await loadBalance();

            await loadLeaves();


        }catch(error){

            console.error(error);

            showMessage(
                "Unable to apply leave: " +
                error.message,
                "error"
            );

        }

    }
);


/* =========================================
   INITIAL LOAD
========================================= */

loadBalance();

loadLeaves();

</script>

</body>

</html>
