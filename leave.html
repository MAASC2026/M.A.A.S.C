<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Leave Approval</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f4f7fb;color:#1f2937}
.header{background:#1e3a8a;color:#fff;padding:22px 30px}
.header h1{font-size:25px}
.header p{font-size:14px;margin-top:5px;opacity:.9}
.container{max-width:1300px;margin:25px auto;padding:0 18px}
.card{background:#fff;border-radius:14px;padding:22px;margin-bottom:20px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.title{font-size:20px;font-weight:bold;color:#1e3a8a;margin-bottom:18px}

.box{background:#f8fafc;border:1px solid #e5e7eb;border-radius:9px;padding:13px}
.label{font-size:11px;color:#6b7280;font-weight:bold;text-transform:uppercase;margin-bottom:5px}
.value{font-size:15px;font-weight:bold}
.loading{text-align:center;padding:30px;color:#6b7280}
.message{display:none;padding:13px;border-radius:8px;margin-bottom:18px}
.success{display:block;background:#dcfce7;color:#166534}
.error{display:block;background:#fee2e2;color:#991b1b}
.info{display:block;background:#dbeafe;color:#1e40af}
.requests{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.request{border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}
.req-head{padding:15px;background:#f8fafc;border-bottom:1px solid #e5e7eb}
.req-name{font-size:17px;font-weight:bold}
.req-id{font-size:12px;color:#6b7280;margin-top:4px}
.req-body{padding:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.item{padding-bottom:9px;border-bottom:1px solid #f1f5f9}
.item-label{font-size:11px;color:#6b7280;font-weight:bold;text-transform:uppercase}
.item-value{font-size:14px;margin-top:4px}
.reason{margin-top:15px;background:#f8fafc;padding:13px;border-radius:8px}
.reason strong{font-size:11px;color:#6b7280}
.reason p{margin-top:6px;line-height:1.5}
.actions{padding:15px;background:#fafafa;border-top:1px solid #e5e7eb}
textarea{width:100%;min-height:70px;padding:10px;border:1px solid #d1d5db;border-radius:8px;resize:vertical}

button:disabled{opacity:.5}
.approve{background:#16a34a;color:white}
.reject{background:#dc2626;color:white}
.forward{background:#2563eb;color:white}
.refresh{background:#2563eb;color:white}
.worker-box{margin-top:12px;display:none}
.worker-box select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px}
.status{display:inline-block;margin-top:8px;padding:5px 9px;border-radius:15px;background:#fef3c7;color:#92400e;font-size:11px;font-weight:bold}
.empty{text-align:center;padding:45px;color:#6b7280}
@media(max-width:900px){
.staff-grid,.requests{grid-template-columns:1fr 1fr}
}
@media(max-width:600px){
.staff-grid,.requests,.grid{grid-template-columns:1fr}
.buttons{flex-direction:column}
button{width:100%}
}
</style>
</head>

<body>

<div class="header">
    <h1>Leave Approval</h1>
    <p>Leave Request Approval & Forwarding</p>
</div>

<div class="container">

<div id="message" class="message"></div>

<div class="card">

<div class="title">Logged-in User</div>

<div id="userLoading" class="loading">
Loading user details...
</div>

<div id="userDetails" style="display:none">

<div class="staff-grid">

<div class="box">
<div class="label">Staff ID</div>
<div id="userId" class="value"></div>
</div>

<div class="box">
<div class="label">Staff Name</div>
<div id="userName" class="value"></div>
</div>

<div class="box">
<div class="label">Department</div>
<div id="userDepartment" class="value"></div>
</div>

<div class="box">
<div class="label">Role</div>
<div id="userRole" class="value"></div>
</div>

</div>

</div>

</div>


<div class="card">

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px">

<div class="title" style="margin:0">
Pending Leave Requests
</div>

<button id="refreshBtn" class="refresh">
Refresh
</button>

</div>

<div id="requestLoading" class="loading" style="display:none">
Loading requests...
</div>

<div id="requests"></div>

</div>

</div>


<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
query,
where,
doc,
updateDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================================
FIREBASE
========================================================= */

const firebaseConfig={
apiKey:"YOUR_API_KEY",
authDomain:"maasc-2026.firebaseapp.com",
projectId:"maasc-2026",
storageBucket:"maasc-2026.appspot.com",
messagingSenderId:"YOUR_MESSAGING_SENDER_ID",
appId:"YOUR_APP_ID"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);


/* =========================================================
VARIABLES
========================================================= */

let loggedUser=null;
let allStaff=[];


/* =========================================================
DOM
========================================================= */

const message=document.getElementById("message");
const userLoading=document.getElementById("userLoading");
const userDetails=document.getElementById("userDetails");
const requests=document.getElementById("requests");
const requestLoading=document.getElementById("requestLoading");


/* =========================================================
HELPERS
========================================================= */

function val(...x){

for(const v of x){

if(v!==undefined &&
v!==null &&
String(v).trim()!==""){

return v;

}

}

return "";

}


function norm(v){

return String(v||"")
.trim()
.toUpperCase()
.replace(/[\s-]+/g,"_");

}


function clean(v){

return String(v||"")
.trim()
.toUpperCase();

}


function esc(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function show(text,type){

message.textContent=text;
message.className="message "+type;

}


/* =========================================================
GET STAFF ID
========================================================= */

function getStaffId(){

const keys=[
"currentStaff",
"loggedInStaff",
"staffData",
"staff",
"userData",
"user",
"currentUser",
"loggedInUser"
];


/* SESSION */

for(const key of keys){

try{

const raw=sessionStorage.getItem(key);

if(!raw)continue;

const data=JSON.parse(raw);

const id=val(
data.staffId,
data.staffID,
data.staff_id
);

if(id)return String(id).trim();

}catch(e){}

}


/* LOCAL */

for(const key of keys){

try{

const raw=localStorage.getItem(key);

if(!raw)continue;

const data=JSON.parse(raw);

const id=val(
data.staffId,
data.staffID,
data.staff_id
);

if(id)return String(id).trim();

}catch(e){}

}


/* DIRECT */

for(const key of [
"staffId",
"staffID",
"staff_id"
]){

let x=sessionStorage.getItem(key);

if(x)return x.trim();

x=localStorage.getItem(key);

if(x)return x.trim();

}

return "";

}


/* =========================================================
LOAD CURRENT USER
========================================================= */

async function loadUser(){

try{

const staffId=getStaffId();

if(!staffId){

throw new Error(
"Staff ID not found. Please login again."
);

}


/*
DO NOT USE STORED NAME.
ONLY STAFF ID IS USED.
*/

let q=query(
collection(db,"staff"),
where("staffId","==",staffId)
);

let snap=await getDocs(q);


/* uppercase fallback */

if(snap.empty){

q=query(
collection(db,"staff"),
where(
"staffId",
"==",
staffId.toUpperCase()
)
);

snap=await getDocs(q);

}


if(snap.empty){

throw new Error(
"No staff record found for "+staffId
);

}


const data=snap.docs[0].data();


loggedUser={

staffId:String(
val(data.staffId,data.staffID)
).trim(),

name:String(
val(data.name,data.staffName,data.fullName)
).trim(),

department:String(
val(data.department,data.dept)
).trim(),

role:String(
val(
data.serviceRole,
data.role,
data.userRole,
data.designation
)
).trim()

};


console.log(
"LOGGED USER FROM FIRESTORE:",
loggedUser
);


/*
DISPLAY EXACT FIRESTORE DATA
*/

document.getElementById(
"userId"
).textContent=loggedUser.staffId;

document.getElementById(
"userName"
).textContent=loggedUser.name;

document.getElementById(
"userDepartment"
).textContent=loggedUser.department;

document.getElementById(
"userRole"
).textContent=loggedUser.role;


userLoading.style.display="none";
userDetails.style.display="block";


await loadRequests();


}catch(e){

console.error(e);

userLoading.style.display="none";

show(e.message,"error");

}

}


/* =========================================================
DETERMINE USER TYPE
========================================================= */

function getUserType(){

const role=norm(loggedUser.role);

const id=clean(loggedUser.staffId);


/*
HR HEAD
*/

if(
role.includes("HR_HEAD") ||
role==="HRHEAD" ||
role==="HR HEAD" ||
role.includes("HRHEAD") ||
id.startsWith("HRH")
){

return "HR_HEAD";

}


/*
DEPARTMENT HEAD
*/

if(
role.includes("DEPARTMENT_HEAD") ||
role.includes("DEPT_HEAD") ||
role==="HEAD" ||
role==="HOD" ||
role.includes("HEAD") ||
id.startsWith("HOD")
){

return "DEPARTMENT_HEAD";

}


/*
DEAN
*/

if(
role.includes("DEAN") ||
id.startsWith("DEAN")
){

return "DEAN";

}


/*
HR WORKER
*/

if(
role.includes("HR_WORKER") ||
role.includes("HR_STAFF") ||
role==="HR" ||
id.startsWith("HRW")
){

return "HR_WORKER";

}


return "STAFF";

}


/* =========================================================
LOAD REQUESTS
========================================================= */

async function loadRequests(){

if(!loggedUser)return;


requestLoading.style.display="block";
requests.innerHTML="";


try{

const type=getUserType();

console.log(
"APPROVAL USER TYPE:",
type
);


/*
=========================================================
DEPARTMENT HEAD
=========================================================

Normal staff requests:

PENDING_HEAD

Only same department.
*/

if(type==="DEPARTMENT_HEAD"){

const q=query(
collection(db,"leaveRequests"),
where("status","==","PENDING_HEAD")
);

const snap=await getDocs(q);

const result=[];

snap.forEach(d=>{

const data=d.data();

if(
clean(
val(data.department,data.dept)
)===clean(
loggedUser.department
)
){

result.push({
id:d.id,
...data
});

}

});

render(result);

return;

}


/*
=========================================================
HR HEAD
=========================================================

HR Head sees:

1. Department Head leave:
   PENDING_HR

2. Normal staff already approved by Head:
   PENDING_HR

3. HR worker completed:
   HR_WORK_COMPLETED

4. HR Head's own leave:
   not here; it goes to Dean.
*/

if(type==="HR_HEAD"){

const q1=query(
collection(db,"leaveRequests"),
where("status","==","PENDING_HR")
);

const q2=query(
collection(db,"leaveRequests"),
where(
"status",
"==",
"HR_WORK_COMPLETED"
)
);

const snap1=await getDocs(q1);
const snap2=await getDocs(q2);

const result=[];

snap1.forEach(d=>{

result.push({
id:d.id,
...d.data()
});

});

snap2.forEach(d=>{

result.push({
id:d.id,
...d.data()
});

});


render(result);

return;

}


/*
=========================================================
DEAN
=========================================================

Dean sees only HR Head leave.
*/

if(type==="DEAN"){

const q=query(
collection(db,"leaveRequests"),
where(
"status",
"==",
"PENDING_DEAN"
);

const snap=await getDocs(q);

const result=[];

snap.forEach(d=>{

result.push({
id:d.id,
...d.data()
});

});

render(result);

return;

}


/*
=========================================================
HR WORKER
=========================================================

Worker sees forwarded work.
*/

if(type==="HR_WORKER"){

const q=query(
collection(db,"leaveRequests"),
where(
"status",
"==",
"FORWARDED_TO_HR_WORKER"
)
);

const snap=await getDocs(q);

const result=[];

snap.forEach(d=>{

const data=d.data();

if(
!data.forwardedToId ||
clean(data.forwardedToId)===
clean(loggedUser.staffId)
){

result.push({
id:d.id,
...data
});

}

});

render(result);

return;

}


/*
NORMAL STAFF
*/

requests.innerHTML=`

<div class="empty">
You do not have leave approval requests.
</div>

`;

}catch(e){

console.error(
"REQUEST ERROR:",
e
);

requests.innerHTML=`

<div class="empty">
Unable to load requests.<br>
${esc(e.message)}
</div>

`;

}finally{

requestLoading.style.display="none";

}

}


/* =========================================================
RENDER
========================================================= */

function render(list){

if(!list.length){

requests.innerHTML=`

<div class="empty">
No pending leave requests.
</div>

`;

return;

}


list.sort((a,b)=>{

const aa=a.appliedAt?.seconds||0;
const bb=b.appliedAt?.seconds||0;

return bb-aa;

});


requests.innerHTML=

`<div class="requests">`+
list.map(createCard).join("")+
`</div>`;

}


/* =========================================================
CREATE CARD
========================================================= */

function createCard(r){

const type=getUserType();

let actionHTML="";


/*
DEPARTMENT HEAD
*/

if(type==="DEPARTMENT_HEAD"){

actionHTML=`

<div class="actions">

<textarea
id="remarks-${esc(r.id)}"
placeholder="Enter remarks..."
></textarea>

<div class="buttons">

<button
class="approve"
onclick="approveAsHead('${esc(r.id)}')"
>
Approve & Send to HR
</button>

<button
class="reject"
onclick="rejectAsHead('${esc(r.id)}')"
>
Reject
</button>

</div>

</div>

`;

}


/*
HR HEAD
*/

else if(type==="HR_HEAD"){

/*
If worker has completed work
*/

if(
r.status==="HR_WORK_COMPLETED"
){

actionHTML=`

<div class="actions">

<div style="margin-bottom:10px;font-size:13px">
<b>HR Worker:</b>
${esc(val(
r.workCompletedByName,
r.forwardedToName
))}
</div>

<div style="margin-bottom:10px;font-size:13px">
<b>Worker Remarks:</b>
${esc(val(
r.workRemarks,
"No remarks"
))}
</div>

<textarea
id="remarks-${esc(r.id)}"
placeholder="Final approval remarks..."
></textarea>

<div class="buttons">

<button
class="approve"
onclick="finalApprove('${esc(r.id)}')"
>
Final Approve
</button>

<button
class="reject"
onclick="rejectAsHR('${esc(r.id)}')"
>
Reject
</button>

</div>

</div>

`;

}else{


actionHTML=`

<div class="actions">

<textarea
id="remarks-${esc(r.id)}"
placeholder="Enter remarks..."
></textarea>

<div class="worker-box"
id="workerBox-${esc(r.id)}">

<select
id="worker-${esc(r.id)}"
>
<option value="">
Loading HR workers...
</option>
</select>

<button
class="forward"
style="margin-top:10px"
onclick="forwardToWorker('${esc(r.id)}')"
>
Forward to HR Worker
</button>

</div>


<div class="buttons">

<button
class="approve"
onclick="approveAsHR('${esc(r.id)}')"
>
Approve
</button>

<button
class="forward"
onclick="showWorkers('${esc(r.id)}')"
>
Forward Work
</button>

<button
class="reject"
onclick="rejectAsHR('${esc(r.id)}')"
>
Reject
</button>

</div>

</div>

`;

}

}


/*
DEAN
*/

else if(type==="DEAN"){

actionHTML=`

<div class="actions">

<textarea
id="remarks-${esc(r.id)}"
placeholder="Dean remarks..."
></textarea>

<div class="buttons">

<button
class="approve"
onclick="approveAsDean('${esc(r.id)}')"
>
Approve & Send to HR Worker
</button>

<button
class="reject"
onclick="rejectAsDean('${esc(r.id)}')"
>
Reject
</button>

</div>

</div>

`;

}


/*
HR WORKER
*/

else if(type==="HR_WORKER"){

actionHTML=`

<div class="actions">

<div style="font-size:13px;margin-bottom:10px">
<b>Forwarded By:</b>
${esc(val(
r.forwardedByName,
"-"
))}
</div>

<textarea
id="remarks-${esc(r.id)}"
placeholder="Enter completed work / remarks..."
></textarea>

<div class="buttons">

<button
class="approve"
onclick="completeWorkerWork('${esc(r.id)}')"
>
Complete Work & Send to HR Head
</button>

</div>

</div>

`;

}


return `

<div class="request" id="request-${esc(r.id)}">

<div class="req-head">

<div class="req-name">
${esc(val(
r.staffName,
"Unknown Staff"
))}
</div>

<div class="req-id">
Staff ID:
${esc(val(r.staffId,"-"))}
</div>

<div class="status">
${esc(r.status||"PENDING")}
</div>

</div>


<div class="req-body">

<div class="grid">

<div class="item">

<div class="item-label">
Department
</div>

<div class="item-value">
${esc(val(r.department,"-"))}
</div>

</div>


<div class="item">

<div class="item-label">
Leave Type
</div>

<div class="item-value">
${esc(val(r.leaveType,"-"))}
</div>

</div>


<div class="item">

<div class="item-label">
From Date
</div>

<div class="item-value">
${esc(val(r.fromDate,"-"))}
</div>

</div>


<div class="item">

<div class="item-label">
To Date
</div>

<div class="item-value">
${esc(val(r.toDate,"-"))}
</div>

</div>


<div class="item">

<div class="item-label">
Total Days
</div>

<div class="item-value">
${esc(val(r.totalDays,"0"))}
</div>

</div>


<div class="item">

<div class="item-label">
Contact
</div>

<div class="item-value">
${esc(val(r.contactNumber,"-"))}
</div>

</div>

</div>


<div class="reason">

<strong>REASON</strong>

<p>
${esc(val(
r.reason,
"No reason provided"
))}
</p>

</div>

</div>


${actionHTML}

</div>

`;

}


/* =========================================================
APPROVE DEPARTMENT HEAD
========================================================= */

window.approveAsHead=async function(id){

try{

const remarks=
document.getElementById(
"remarks-"+id
)?.value.trim()||"";


await updateDoc(
doc(db,"leaveRequests",id),
{

status:"PENDING_HR",

headId:loggedUser.staffId,
headName:loggedUser.name,
headAction:"APPROVED",
headRemarks:remarks,
headActionAt:serverTimestamp(),

updatedAt:serverTimestamp()

}
);


show(
"Leave approved and sent to HR Head.",
"success"
);


await loadRequests();

}catch(e){

console.error(e);

show(
"Approval failed: "+e.message,
"error"
);

}

};


/* =========================================================
REJECT DEPARTMENT HEAD
========================================================= */

window.rejectAsHead=async function(id){

try{

const remarks=
document.getElementById(
"remarks-"+id
)?.value.trim()||"";


if(!remarks){

show(
"Please enter rejection remarks.",
"error"
);

return;

}


await updateDoc(
doc(db,"leaveRequests",id),
{

status:"HEAD_REJECTED",

headId:loggedUser.staffId,
headName:loggedUser.name,
headAction:"REJECTED",
headRemarks:remarks,
headActionAt:serverTimestamp(),

updatedAt:serverTimestamp()

}
);


show(
"Leave request rejected.",
"success"
);


await loadRequests();

}catch(e){

show(
"Rejection failed: "+e.message,
"error"
);

}

};


/* =========================================================
HR HEAD APPROVE
========================================================= */

window.approveAsHR=async function(id){

try{

const remarks=
document.getElementById(
"remarks-"+id
)?.value.trim()||"";


await updateDoc(
doc(db,"leaveRequests",id),
{

status:"HR_APPROVED_PENDING_WORK",

hrHeadId:loggedUser.staffId,
hrHeadName:loggedUser.name,
hrAction:"APPROVED",
hrRemarks:remarks,
hrActionAt:serverTimestamp(),

updatedAt:serverTimestamp()

}
);


show(
"Leave approved by HR Head. Work can now be assigned.",
"success"
);


await loadRequests();

}catch(e){

show(
"HR approval failed: "+e.message,
"error"
);

}

};


/* =========================================================
HR HEAD REJECT
========================================================= */

window.rejectAsHR=async function(id){

try{

const remarks=
document.getElementById(
"remarks-"+id
)?.value.trim()||"";


if(!remarks){

show(
"Please enter rejection remarks.",
"error"
);

return;

}


await updateDoc(
doc(db,"leaveRequests",id),
{

status:"HR_REJECTED",

hrHeadId:loggedUser.staffId,
hrHeadName:loggedUser.name,
hrAction:"REJECTED",
hrRemarks:remarks,
hrActionAt:serverTimestamp(),

updatedAt:serverTimestamp()

}
);


show(
"Leave request rejected by HR Head.",
"success"
);


await loadRequests();

}catch(e){

show(
"HR rejection failed: "+e.message,
"error"
);

}

};


/* =========================================================
SHOW HR WORKERS
========================================================= */

window.showWorkers=async function(id){

const box=
document.getElementById(
"workerBox-"+id
);

const select=
document.getElementById(
"worker-"+id
);


box.style.display="block";


select.innerHTML=
`<option value="">
Loading HR workers...
</option>`;


try{

/*
Try all staff and identify HR workers
without depending on one exact role.
*/

const snap=
await getDocs(
collection(db,"staff")
);


const workers=[];


snap.forEach(d=>{

const s=d.data();

const sid=String(
val(
s.staffId,
s.staffID
)
).trim();

const name=String(
val(
s.name,
s.staffName,
s.fullName
)
).trim();

const dept=String(
val(
s.department,
s.dept
)
).trim();

const role=norm(
val(
s.serviceRole,
s.role,
s.userRole,
s.designation
)
);


const isHRDepartment=
clean(dept)==="HR" ||
clean(dept)==="HUMAN RESOURCES" ||
clean(dept).includes("HR");


const isHRWorker=
role.includes("HR_WORKER") ||
role.includes("HR_STAFF") ||
role==="HR" ||
role.includes("ASSISTANT") ||
role.includes("WORKER");


if(
sid &&
sid!==loggedUser.staffId &&
(
isHRDepartment ||
isHRWorker
)
){

workers.push({
id:sid,
name:name,
department:dept,
role:role
});

}

});


if(!workers.length){

select.innerHTML=
`<option value="">
No HR workers found
</option>`;

return;

}


select.innerHTML=
`<option value="">
Select HR Worker
</option>`+
workers.map(w=>`

<option value="${esc(w.id)}">
${esc(w.name)}
 - ${esc(w.id)}
</option>

`).join("");


}catch(e){

console.error(e);

select.innerHTML=
`<option value="">
Unable to load HR workers
</option>`;

}

};


/* =========================================================
FORWARD TO HR WORKER
========================================================= */

window.forwardToWorker=async function(id){

try{

const select=
document.getElementById(
"worker-"+id
);


const workerId=
select?.value;


if(!workerId){

show(
"Please select an HR worker.",
"error"
);

return;

}


const workerName=
select.options[
select.selectedIndex
].textContent.trim();


const remarks=
document.getElementById(
"remarks-"+id
)?.value.trim()||"";


await updateDoc(
doc(db,"leaveRequests",id),
{

status:"FORWARDED_TO_HR_WORKER",

forwardedToId:workerId,
forwardedToName:workerName,

forwardedById:loggedUser.staffId,
forwardedByName:loggedUser.name,

forwardRemarks:remarks,

forwardedAt:serverTimestamp(),

updatedAt:serverTimestamp()

}
);


show(
"Work forwarded to HR worker.",
"success"
);


await loadRequests();

}catch(e){

console.error(e);

show(
"Forward failed: "+e.message,
"error"
);

}

};
