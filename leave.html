<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leave Entry</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #f4f7fb;
    color: #1f2937;
}

.header {
    background: #1e3a8a;
    color: white;
    padding: 22px 30px;
}

.header h1 {
    font-size: 25px;
    margin-bottom: 5px;
}

.header p {
    font-size: 14px;
    opacity: .9;
}

.container {
    max-width: 1000px;
    margin: 30px auto;
    padding: 0 18px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 25px;
    box-shadow: 0 4px 18px rgba(0,0,0,.08);
    margin-bottom: 22px;
}

.card-title {
    font-size: 21px;
    font-weight: bold;
    color: #1e3a8a;
    margin-bottom: 20px;
}

.staff-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 18px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group.full {
    grid-column: 1 / -1;
}

label {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 7px;
    color: #374151;
}

input,
select,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
    background: white;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #2563eb;
}

input[readonly] {
    background: #f3f4f6;
}

textarea {
    resize: vertical;
    min-height: 120px;
}

.staff-loading {
    padding: 25px;
    text-align: center;
    color: #6b7280;
}

.workflow {
    margin-top: 22px;
    background: #eff6ff;
    border-left: 5px solid #2563eb;
    padding: 17px;
    border-radius: 8px;
}

.workflow-title {
    font-size: 14px;
    font-weight: bold;
    color: #1e3a8a;
    margin-bottom: 10px;
}

.workflow-text {
    font-size: 13px;
    line-height: 1.7;
    color: #374151;
}

.workflow-step {
    display: inline-block;
    background: white;
    border: 1px solid #bfdbfe;
    border-radius: 6px;
    padding: 7px 10px;
    margin: 3px;
    font-weight: bold;
    color: #1e40af;
}

.arrow {
    color: #2563eb;
    font-weight: bold;
}

.days-box {
    margin-top: 18px;
    background: #f0fdf4;
    border-left: 5px solid #16a34a;
    padding: 15px;
    border-radius: 8px;
}

.days-label {
    font-size: 12px;
    color: #166534;
    font-weight: bold;
}

.days-value {
    font-size: 24px;
    font-weight: bold;
    color: #166534;
    margin-top: 4px;
}

.button-row {
    display: flex;
    gap: 12px;
    margin-top: 22px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 22px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.btn-primary {
    background: #2563eb;
    color: white;
}

.btn-primary:hover {
    background: #1d4ed8;
}

.btn-secondary {
    background: #6b7280;
    color: white;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.message {
    display: none;
    padding: 13px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 14px;
    line-height: 1.5;
}

.message.success {
    display: block;
    background: #dcfce7;
    color: #166534;
    border: 1px solid #86efac;
}

.message.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
    border: 1px solid #fca5a5;
}

.message.info {
    display: block;
    background: #dbeafe;
    color: #1e40af;
    border: 1px solid #93c5fd;
}

@media(max-width:700px) {

    .staff-grid,
    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-group.full {
        grid-column: auto;
    }

    .card {
        padding: 18px;
    }

    .button-row {
        flex-direction: column;
    }

    button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>Staff Leave Entry</h1>
    <p>Apply for leave through the appropriate approval workflow</p>
</div>

<div class="container">

    <div id="message" class="message"></div>

    <!-- STAFF DETAILS -->
    <div class="card">

        <div class="card-title">
            Staff Details
        </div>

        <div id="staffLoading" class="staff-loading">
            Loading logged-in staff...
        </div>

        <div id="staffDetails" style="display:none;">

            <div class="staff-grid">

                <div class="form-group">
                    <label>Staff ID</label>

                    <input
                        type="text"
                        id="staffId"
                        readonly
                    >
                </div>

                <div class="form-group">
                    <label>Staff Name</label>

                    <input
                        type="text"
                        id="staffName"
                        readonly
                    >
                </div>

                <div class="form-group">
                    <label>Department</label>

                    <input
                        type="text"
                        id="department"
                        readonly
                    >
                </div>

            </div>

            <div class="form-group">

                <label>Service Role</label>

                <input
                    type="text"
                    id="serviceRole"
                    readonly
                >

            </div>

        </div>

    </div>


    <!-- LEAVE ENTRY -->
    <div
        class="card"
        id="leaveCard"
        style="display:none;"
    >

        <div class="card-title">
            Apply Leave
        </div>

        <div class="form-grid">

            <div class="form-group">

                <label>Leave Type *</label>

                <select id="leaveType">

                    <option value="">
                        Select Leave Type
                    </option>

                    <option value="CASUAL LEAVE">
                        Casual Leave
                    </option>

                    <option value="MEDICAL LEAVE">
                        Medical Leave
                    </option>

                    <option value="EARNED LEAVE">
                        Earned Leave
                    </option>

                    <option value="ON DUTY">
                        On Duty
                    </option>

                    <option value="LOSS OF PAY">
                        Loss of Pay
                    </option>

                    <option value="OTHER">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Contact Number During Leave
                </label>

                <input
                    type="tel"
                    id="contactNumber"
                    placeholder="Enter contact number"
                >

            </div>


            <div class="form-group">

                <label>
                    From Date *
                </label>

                <input
                    type="date"
                    id="fromDate"
                >

            </div>


            <div class="form-group">

                <label>
                    To Date *
                </label>

                <input
                    type="date"
                    id="toDate"
                >

            </div>


            <div class="form-group full">

                <label>
                    Reason for Leave *
                </label>

                <textarea
                    id="reason"
                    placeholder="Enter reason for leave..."
                ></textarea>

            </div>

        </div>


        <div class="days-box">

            <div class="days-label">
                TOTAL LEAVE DAYS
            </div>

            <div
                class="days-value"
                id="totalDays"
            >
                0
            </div>

        </div>


        <div class="workflow">

            <div class="workflow-title">
                Approval Workflow
            </div>

            <div
                id="workflowDisplay"
                class="workflow-text"
            ></div>

        </div>


        <div class="button-row">

            <button
                type="button"
                class="btn-primary"
                id="submitBtn"
            >
                Submit Leave Request
            </button>

            <button
                type="button"
                class="btn-secondary"
                id="clearBtn"
            >
                Clear
            </button>

        </div>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    where,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "maasc-2026.firebaseapp.com",
    projectId: "maasc-2026",
    storageBucket: "maasc-2026.appspot.com",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
};

const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);

const auth =
    getAuth(app);


/* =========================================================
   VARIABLES
========================================================= */

let currentStaff = null;


/* =========================================================
   DOM
========================================================= */

const message =
    document.getElementById("message");

const staffLoading =
    document.getElementById("staffLoading");

const staffDetails =
    document.getElementById("staffDetails");

const leaveCard =
    document.getElementById("leaveCard");

const staffIdInput =
    document.getElementById("staffId");

const staffNameInput =
    document.getElementById("staffName");

const departmentInput =
    document.getElementById("department");

const serviceRoleInput =
    document.getElementById("serviceRole");

const leaveType =
    document.getElementById("leaveType");

const contactNumber =
    document.getElementById("contactNumber");

const fromDate =
    document.getElementById("fromDate");

const toDate =
    document.getElementById("toDate");

const reason =
    document.getElementById("reason");

const totalDays =
    document.getElementById("totalDays");

const workflowDisplay =
    document.getElementById("workflowDisplay");

const submitBtn =
    document.getElementById("submitBtn");


/* =========================================================
   HELPER
========================================================= */

function firstValue(...values) {

    for (const value of values) {

        if (
            value !== undefined &&
            value !== null &&
            String(value).trim() !== ""
        ) {
            return value;
        }
    }

    return "";
}


function normalizeRole(role) {

    return String(role || "")
        .trim()
        .toUpperCase()
        .replace(/[\s-]+/g, "_");
}


function showMessage(
    text,
    type
) {

    message.textContent = text;

    message.className =
        "message " + type;
}


/* =========================================================
   GET STAFF ID ONLY
========================================================= */

/*
 * IMPORTANT:
 *
 * We DO NOT read the stored name.
 *
 * We ONLY extract Staff ID.
 *
 * Then Firestore is queried using that ID.
 */

function getLoggedInStaffId() {

    const possibleKeys = [

        "currentStaff",
        "loggedInStaff",
        "staffData",
        "staff",
        "userData",
        "user",
        "currentUser",
        "loggedInUser"

    ];


    /*
     * Check sessionStorage first.
     */

    for (
        const key of possibleKeys
    ) {

        try {

            const raw =
                sessionStorage.getItem(key);

            if (!raw) {
                continue;
            }

            const data =
                JSON.parse(raw);

            const id =
                firstValue(
                    data.staffId,
                    data.staffID,
                    data.staff_id
                );

            if (id) {

                console.log(
                    "STAFF ID FROM SESSION STORAGE:",
                    id
                );

                return String(id).trim();
            }

        } catch (error) {

            console.warn(
                "Session storage read error:",
                error
            );
        }
    }


    /*
     * Check localStorage.
     */

    for (
        const key of possibleKeys
    ) {

        try {

            const raw =
                localStorage.getItem(key);

            if (!raw) {
                continue;
            }

            const data =
                JSON.parse(raw);

            const id =
                firstValue(
                    data.staffId,
                    data.staffID,
                    data.staff_id
                );

            if (id) {

                console.log(
                    "STAFF ID FROM LOCAL STORAGE:",
                    id
                );

                return String(id).trim();
            }

        } catch (error) {

            console.warn(
                "Local storage read error:",
                error
            );
        }
    }


    /*
     * Check direct storage values.
     */

    const directKeys = [
        "staffId",
        "staffID",
        "staff_id"
    ];


    for (
        const key of directKeys
    ) {

        const sessionValue =
            sessionStorage.getItem(key);

        if (sessionValue) {

            return sessionValue.trim();
        }


        const localValue =
            localStorage.getItem(key);

        if (localValue) {

            return localValue.trim();
        }
    }


    return "";
}


/* =========================================================
   FIND STAFF BY EXACT STAFF ID
========================================================= */

async function findStaffById(
    staffId
) {

    if (!staffId) {

        throw new Error(
            "Logged-in Staff ID was not found."
        );
    }


    console.log(
        "LOOKING UP STAFF ID:",
        staffId
    );


    /*
     * IMPORTANT:
     *
     * Query Firestore using Staff ID.
     *
     * Do NOT use a stored name.
     */

    const q =
        query(
            collection(
                db,
                "staff"
            ),
            where(
                "staffId",
                "==",
                staffId
            )
        );


    const snapshot =
        await getDocs(q);


    console.log(
        "STAFF QUERY RESULT COUNT:",
        snapshot.size
    );


    if (
        snapshot.empty
    ) {

        /*
         * Try uppercase Staff ID
         * in case database values are uppercase.
         */

        const upperId =
            staffId.toUpperCase();


        const q2 =
            query(
                collection(
                    db,
                    "staff"
                ),
                where(
                    "staffId",
                    "==",
                    upperId
                )
            );


        const snapshot2 =
            await getDocs(q2);


        if (
            snapshot2.empty
        ) {

            throw new Error(
                "Staff record not found for Staff ID: " +
                staffId
            );
        }


        const data =
            snapshot2.docs[0].data();


        return {
            staffId:
                String(
                    firstValue(
                        data.staffId,
                        data.staffID
                    )
                ).trim(),

            name:
                String(
                    firstValue(
                        data.name,
                        data.staffName
                    )
                ).trim(),

            department:
                String(
                    firstValue(
                        data.department,
                        data.dept
                    )
                ).trim(),

            serviceRole:
                normalizeRole(
                    firstValue(
                        data.serviceRole,
                        data.role
                    )
                ),

            serviceHeadActive:
                data.serviceHeadActive === true,

            serviceHeadDepartment:
                String(
                    firstValue(
                        data.serviceHeadDepartment,
                        data.department
                    )
                ).trim()
        };
    }


    const data =
        snapshot.docs[0].data();


    console.log(
        "EXACT STAFF FIRESTORE RECORD:",
        data
    );


    return {

        staffId:
            String(
                firstValue(
                    data.staffId,
                    data.staffID
                )
            ).trim(),

        name:
            String(
                firstValue(
                    data.name,
                    data.staffName
                )
            ).trim(),

        department:
            String(
                firstValue(
                    data.department,
                    data.dept
                )
            ).trim(),

        serviceRole:
            normalizeRole(
                firstValue(
                    data.serviceRole,
                    data.role
                )
            ),

        serviceHeadActive:
            data.serviceHeadActive === true,

        serviceHeadDepartment:
            String(
                firstValue(
                    data.serviceHeadDepartment,
                    data.department
                )
            ).trim()
    };
}


/* =========================================================
   LOAD LOGGED-IN STAFF
========================================================= */

async function loadStaff() {

    try {

        staffLoading.style.display =
            "block";

        staffDetails.style.display =
            "none";

        leaveCard.style.display =
            "none";


        /*
         * GET ONLY STAFF ID.
         */

        const storedStaffId =
            getLoggedInStaffId();


        console.log(
            "LOGGED-IN STAFF ID:",
            storedStaffId
        );


        if (!storedStaffId) {

            throw new Error(
                "Staff ID not found. Please logout and login again."
            );
        }


        /*
         * GET THE ACTUAL STAFF RECORD
         * FROM FIRESTORE.
         */

        currentStaff =
            await findStaffById(
                storedStaffId
            );


        console.log(
            "CURRENT STAFF:",
            currentStaff
        );


        /*
         * DISPLAY FIRESTORE DATA.
         */

        staffIdInput.value =
            currentStaff.staffId;


        staffNameInput.value =
            currentStaff.name;


        departmentInput.value =
            currentStaff.department;


        serviceRoleInput.value =
            currentStaff.serviceRole;


        staffLoading.style.display =
            "none";

        staffDetails.style.display =
            "block";

        leaveCard.style.display =
            "block";


        displayWorkflow();


    } catch (error) {

        console.error(
            "STAFF LOAD ERROR:",
            error
        );


        staffLoading.style.display =
            "none";


        showMessage(
            error.message,
            "error"
        );
    }
}


/* =========================================================
   WORKFLOW
========================================================= */

function determineWorkflow(
    staff
) {

    const role =
        normalizeRole(
            staff.serviceRole
        );


    /*
     * HR HEAD
     *
     * HR HEAD
     * ↓
     * DEAN
     * ↓
     * HR WORKER
     * ↓
     * HR HEAD FINAL
     */

    if (
        role === "HR_HEAD" ||
        role === "HRHEAD"
    ) {

        return {

            workflowType:
                "HR_HEAD_LEAVE",

            status:
                "PENDING_DEAN",

            firstApproverRole:
                "DEAN",

            firstApproverLabel:
                "Dean",

            steps: [

                "HR HEAD",

                "DEAN",

                "HR WORKER",

                "HR HEAD FINAL APPROVAL"

            ]
        };
    }


    /*
     * DEPARTMENT HEAD
     *
     * DEPARTMENT HEAD
     * ↓
     * HR HEAD
     * ↓
     * HR WORKER
     * ↓
     * HR HEAD FINAL
     */

    if (
        role === "DEPARTMENT_HEAD" ||
        role === "DEPT_HEAD"
    ) {

        return {

            workflowType:
                "DEPARTMENT_HEAD_LEAVE",

            status:
                "PENDING_HR",

            firstApproverRole:
                "HR_HEAD",

            firstApproverLabel:
                "HR Head",

            steps: [

                "DEPARTMENT HEAD",

                "HR HEAD",

                "HR WORKER",

                "HR HEAD FINAL APPROVAL"

            ]
        };
    }


    /*
     * NORMAL STAFF
     *
     * STAFF
     * ↓
     * DEPARTMENT HEAD
     * ↓
     * HR HEAD
     * ↓
     * HR WORKER
     * ↓
     * HR HEAD FINAL
     */

    return {

        workflowType:
            "STAFF_LEAVE",

        status:
            "PENDING_HEAD",

        firstApproverRole:
            "DEPARTMENT_HEAD",

        firstApproverLabel:
            "Department Head",

        steps: [

            "STAFF",

            "DEPARTMENT HEAD",

            "HR HEAD",

            "HR WORKER",

            "HR HEAD FINAL APPROVAL"

        ]
    };
}


/* =========================================================
   DISPLAY WORKFLOW
========================================================= */

function displayWorkflow() {

    if (!currentStaff) {
        return;
    }


    const workflow =
        determineWorkflow(
            currentStaff
        );


    workflowDisplay.innerHTML =
        workflow.steps
            .map(
                (step, index) => {

                    let html =
                        `<span class="workflow-step">
                            ${step}
                         </span>`;


                    if (
                        index <
                        workflow.steps.length - 1
                    ) {

                        html +=
                            `<span class="arrow">
                                →
                             </span>`;
                    }


                    return html;
                }
            )
            .join("");
}


/* =========================================================
   CALCULATE DAYS
========================================================= */

function calculateDays() {

    if (
        !fromDate.value ||
        !toDate.value
    ) {

        totalDays.textContent =
            "0";

        return 0;
    }


    const start =
        new Date(
            fromDate.value +
            "T00:00:00"
        );


    const end =
        new Date(
            toDate.value +
            "T00:00:00"
        );


    if (
        end < start
    ) {

        totalDays.textContent =
            "0";

        return 0;
    }


    const difference =
        end.getTime() -
        start.getTime();


    const days =
        Math.floor(
            difference /
            (
                1000 *
                60 *
                60 *
                24
            )
        ) + 1;


    totalDays.textContent =
        days;


    return days;
}


fromDate.addEventListener(
    "change",
    calculateDays
);

toDate.addEventListener(
    "change",
    calculateDays
);


/* =========================================================
   CLEAR
========================================================= */

function clearForm() {

    leaveType.value = "";

    contactNumber.value = "";

    fromDate.value = "";

    toDate.value = "";

    reason.value = "";

    totalDays.textContent =
        "0";
}


document.getElementById(
    "clearBtn"
).addEventListener(
    "click",
    clearForm
);


/* =========================================================
   CHECK EXISTING LEAVE
========================================================= */

async function checkExistingLeave() {

    const q =
        query(
            collection(
                db,
                "leaveRequests"
            ),
            where(
                "staffId",
                "==",
                currentStaff.staffId
            )
        );


    const snapshot =
        await getDocs(q);


    const requestedStart =
        new Date(
            fromDate.value +
            "T00:00:00"
        );


    const requestedEnd =
        new Date(
            toDate.value +
            "T00:00:00"
        );


    for (
        const doc of snapshot.docs
    ) {

        const data =
            doc.data();


        const status =
            String(
                data.status || ""
            ).toUpperCase();


        if (
            status === "REJECTED" ||
            status === "HEAD_REJECTED" ||
            status === "HR_REJECTED" ||
            status === "DEAN_REJECTED"
        ) {

            continue;
        }


        if (
            !data.fromDate ||
            !data.toDate
        ) {

            continue;
        }


        const existingStart =
            new Date(
                data.fromDate +
                "T00:00:00"
            );


        const existingEnd =
            new Date(
                data.toDate +
                "T00:00:00"
            );


        if (
            requestedStart <= existingEnd &&
            requestedEnd >= existingStart
        ) {

            return true;
        }
    }


    return false;
}


/* =========================================================
   SUBMIT
========================================================= */

submitBtn.addEventListener(
    "click",
    async () => {

        try {

            if (!currentStaff) {

                showMessage(
                    "Staff details are not loaded.",
                    "error"
                );

                return;
            }


            const type =
                leaveType.value.trim();


            const start =
                fromDate.value;


            const end =
                toDate.value;


            const leaveReason =
                reason.value.trim();


            if (!type) {

                showMessage(
                    "Please select Leave Type.",
                    "error"
                );

                return;
            }


            if (!start) {

                showMessage(
                    "Please select From Date.",
                    "error"
                );

                return;
            }


            if (!end) {

                showMessage(
                    "Please select To Date.",
                    "error"
                );

                return;
            }


            if (end < start) {

                showMessage(
                    "To Date cannot be before From Date.",
                    "error"
                );

                return;
            }


            if (!leaveReason) {

                showMessage(
                    "Please enter the reason.",
                    "error"
                );

                return;
            }


            const days =
                calculateDays();


            if (days <= 0) {

                showMessage(
                    "Invalid leave dates.",
                    "error"
                );

                return;
            }


            submitBtn.disabled =
                true;

            submitBtn.textContent =
                "Checking...";


            const duplicate =
                await checkExistingLeave();


            if (duplicate) {

                submitBtn.disabled =
                    false;

                submitBtn.textContent =
                    "Submit Leave Request";


                showMessage(
                    "You already have a leave request covering these dates.",
                    "error"
                );

                return;
            }


            /*
             * DETERMINE CORRECT ROUTE.
             */

            const workflow =
                determineWorkflow(
                    currentStaff
                );


            /*
             * IMPORTANT:
             *
             * STAFF INFORMATION COMES
             * DIRECTLY FROM FIRESTORE.
             *
             * NOT FROM STORED NAME.
             */

            const leaveData = {

                staffId:
                    currentStaff.staffId,

                staffName:
                    currentStaff.name,

                department:
                    currentStaff.department,

                serviceRole:
                    currentStaff.serviceRole,


                leaveType:
                    type,

                fromDate:
                    start,

                toDate:
                    end,

                totalDays:
                    days,

                contactNumber:
                    contactNumber.value.trim(),

                reason:
                    leaveReason,


                workflowType:
                    workflow.workflowType,

                firstApproverRole:
                    workflow.firstApproverRole,

                firstApproverLabel:
                    workflow.firstApproverLabel,

                status:
                    workflow.status,


                headId: "",
                headName: "",
                headAction: "",
                headRemarks: "",
                headActionAt: null,


                hrHeadId: "",
                hrHeadName: "",
                hrAction: "",
                hrRemarks: "",
                hrActionAt: null,


                deanId: "",
                deanName: "",
                deanAction: "",
                deanRemarks: "",
                deanActionAt: null,


                forwardedToId: "",
                forwardedToName: "",
                forwardedById: "",
                forwardedByName: "",
                forwardRemarks: "",
                forwardedAt: null,


                workCompletedBy: "",
                workCompletedByName: "",
                workCompletedAt: null,
                workRemarks: "",


                finalApprovedBy: "",
                finalApprovedByName: "",
                finalApprovalAt: null,
                finalRemarks: "",


                appliedAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()
            };


            console.log(
                "FINAL LEAVE DATA:",
                leaveData
            );


            submitBtn.textContent =
                "Submitting...";


            const ref =
                await addDoc(
                    collection(
                        db,
                        "leaveRequests"
                    ),
                    leaveData
                );


            console.log(
                "LEAVE REQUEST ID:",
                ref.id
            );


            showMessage(
                "Leave request submitted successfully and sent to " +
                workflow.firstApproverLabel +
                ".",
                "success"
            );


            clearForm();


        } catch (error) {

            console.error(
                "LEAVE SUBMIT ERROR:",
                error
            );


            showMessage(
                "Unable to submit leave request: " +
                error.message,
                "error"
            );

        } finally {

            submitBtn.disabled =
                false;

            submitBtn.textContent =
                "Submit Leave Request";
        }

    }
);


/* =========================================================
   FIREBASE AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async (user) => {

        /*
         * We don't use the Firebase user's
         * displayName.
         *
         * We still load the staff record
         * from Firestore using Staff ID.
         */

        await loadStaff();
    }
);

</script>
