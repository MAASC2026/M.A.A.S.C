<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Leave Apply</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f6f9;
    color:#222;
}

.container{
    max-width:1100px;
    margin:30px auto;
    padding:20px;
}

.header{
    background:#fff;
    padding:22px;
    border-radius:14px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.header h2{
    margin-bottom:6px;
}

.header p{
    color:#666;
}

.balance-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
    margin-bottom:20px;
}

.balance{
    background:#fff;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.balance h3{
    margin-bottom:10px;
}

.balance .number{
    font-size:32px;
    font-weight:bold;
}

.form-box{
    background:#fff;
    padding:25px;
    border-radius:14px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

button{
    border:0;
    padding:13px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.btn{
    background:#2563eb;
    color:white;
}

.btn:hover{
    background:#1d4ed8;
}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    display:none;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.table-box{
    margin-top:25px;
    background:#fff;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:left;
}

th{
    background:#f8fafc;
}

.status{
    font-weight:bold;
}

@media(max-width:700px){
    .balance-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h2>Leave Apply</h2>
        <p id="staffInfo">Loading staff details...</p>
    </div>

    <div class="balance-grid">

        <div class="balance">
            <h3>Casual Leave</h3>
            <div class="number" id="clBalance">11</div>
            <p>Available this month</p>
        </div>

        <div class="balance">
            <h3>Sick Leave</h3>
            <div class="number" id="slBalance">3</div>
            <p>Available this month</p>
        </div>

    </div>

    <div class="form-box">

        <h3>Apply Leave</h3>

        <br>

        <form id="leaveForm">

            <div class="form-group">
                <label>Leave Type</label>

                <select id="leaveType" required>
                    <option value="">Select Leave Type</option>
                    <option value="CASUAL">Casual Leave</option>
                    <option value="SICK">Sick Leave</option>
                </select>
            </div>

            <div class="form-group">
                <label>From Date</label>
                <input type="date" id="fromDate" required>
            </div>

            <div class="form-group">
                <label>To Date</label>
                <input type="date" id="toDate" required>
            </div>

            <div class="form-group">
                <label>Reason</label>
                <textarea id="reason" placeholder="Enter reason..." required></textarea>
            </div>

            <button class="btn" type="submit">
                Apply Leave
            </button>

        </form>

        <div id="message" class="message"></div>

    </div>

    <div class="table-box">

        <h3>My Leave Applications</h3>

        <br>

        <table>
            <thead>
                <tr>
                    <th>Type</th>
                    <th>From</th>
                    <th>To</th>
                    <th>Days</th>
                    <th>Status</th>
                    <th>Reason</th>
                </tr>
            </thead>

            <tbody id="leaveTable">
                <tr>
                    <td colspan="6">Loading...</td>
                </tr>
            </tbody>

        </table>

    </div>

</div>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    where,
    orderBy,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "maasc-2026.firebaseapp.com",
    projectId: "maasc-2026",
    storageBucket: "maasc-2026.firebasestorage.app",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let currentStaff = null;


function daysBetween(from,to){

    const start = new Date(from + "T00:00:00");
    const end = new Date(to + "T00:00:00");

    if(end < start) return 0;

    return Math.floor(
        (end-start)/(1000*60*60*24)
    ) + 1;
}


function showMessage(text,type){

    const box = document.getElementById("message");

    box.textContent = text;
    box.className = "message " + type;
    box.style.display = "block";
}


async function loadStaff(){

    if(!currentUser) return;

    let staff = null;

    /*
       First try UID.
    */

    const uidQuery = query(
        collection(db,"staff"),
        where("uid","==",currentUser.uid)
    );

    const uidSnap = await getDocs(uidQuery);

    if(!uidSnap.empty){

        staff = {
            id:uidSnap.docs[0].id,
            ...uidSnap.docs[0].data()
        };

    }else{

        /*
           Fallback to email.
        */

        const emailQuery = query(
            collection(db,"staff"),
            where("email","==",currentUser.email)
        );

        const emailSnap = await getDocs(emailQuery);

        if(!emailSnap.empty){

            staff = {
                id:emailSnap.docs[0].id,
                ...emailSnap.docs[0].data()
            };

        }

    }

    if(!staff){

        showMessage(
            "Staff profile not found.",
            "error"
        );

        return;
    }

    currentStaff = staff;

    const name =
        staff.name ||
        staff.staffName ||
        staff.displayName ||
        currentUser.email;

    const staffId =
        staff.staffId ||
        staff.id ||
        "";

    const department =
        staff.department ||
        staff.dep ||
        "";

    document.getElementById("staffInfo").textContent =
        `${name} | ${staffId} | ${department}`;

    await loadBalance();
    await loadLeaves();
}


async function loadBalance(){

    if(!currentStaff) return;

    const now = new Date();

    const month =
        now.getFullYear() +
        "-" +
        String(now.getMonth()+1).padStart(2,"0");

    const q = query(
        collection(db,"leave_requests"),
        where("applicantUid","==",currentUser.uid),
        where("month","==",month)
    );

    const snap = await getDocs(q);

    let clUsed = 0;
    let slUsed = 0;

    snap.forEach(doc => {

        const data = doc.data();

        /*
           Pending and approved leaves are counted
           to prevent multiple applications exceeding
           the monthly balance.
        */

        if(
            data.status !== "REJECTED" &&
            data.status !== "CANCELLED"
        ){

            if(data.leaveType === "CASUAL"){
                clUsed += Number(data.days || 0);
            }

            if(data.leaveType === "SICK"){
                slUsed += Number(data.days || 0);
            }

        }

    });

    document.getElementById("clBalance").textContent =
        Math.max(0,11-clUsed);

    document.getElementById("slBalance").textContent =
        Math.max(0,3-slUsed);
}


async function loadLeaves(){

    const table =
        document.getElementById("leaveTable");

    table.innerHTML =
        `<tr><td colspan="6">Loading...</td></tr>`;

    const q = query(
        collection(db,"leave_requests"),
        where("applicantUid","==",currentUser.uid)
    );

    const snap = await getDocs(q);

    if(snap.empty){

        table.innerHTML =
            `<tr><td colspan="6">No leave applications</td></tr>`;

        return;
    }

    const rows = [];

    snap.forEach(doc => {

        const d = doc.data();

        rows.push({
            ...d,
            id:doc.id
        });

    });

    rows.sort(
        (a,b) =>
        String(b.createdAt?.seconds || 0)
        .localeCompare(
            String(a.createdAt?.seconds || 0)
        )
    );

    table.innerHTML = "";

    rows.forEach(d => {

        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${d.leaveType || ""}</td>
            <td>${d.fromDate || ""}</td>
            <td>${d.toDate || ""}</td>
            <td>${d.days || ""}</td>
            <td class="status">${d.status || ""}</td>
            <td>${d.reason || ""}</td>
        `;

        table.appendChild(tr);

    });

}


document
.getElementById("leaveForm")
.addEventListener("submit",async e => {

    e.preventDefault();

    if(!currentUser || !currentStaff){

        showMessage(
            "Staff details are not loaded.",
            "error"
        );

        return;
    }

    const leaveType =
        document.getElementById("leaveType").value;

    const fromDate =
        document.getElementById("fromDate").value;

    const toDate =
        document.getElementById("toDate").value;

    const reason =
        document.getElementById("reason").value.trim();

    const days =
        daysBetween(fromDate,toDate);

    if(days <= 0){

        showMessage(
            "Invalid date selection.",
            "error"
        );

        return;
    }

    /*
       This portal intentionally prevents a leave
       application from crossing months.
    */

    const fromMonth = fromDate.substring(0,7);
    const toMonth = toDate.substring(0,7);

    if(fromMonth !== toMonth){

        showMessage(
            "Leave application cannot cross different months. Apply separately for each month.",
            "error"
        );

        return;
    }

    const q = query(
        collection(db,"leave_requests"),
        where("applicantUid","==",currentUser.uid),
        where("month","==",fromMonth)
    );

    const snap = await getDocs(q);

    let usedCL = 0;
    let usedSL = 0;

    snap.forEach(doc => {

        const d = doc.data();

        if(
            d.status !== "REJECTED" &&
            d.status !== "CANCELLED"
        ){

            if(d.leaveType === "CASUAL"){
                usedCL += Number(d.days || 0);
            }

            if(d.leaveType === "SICK"){
                usedSL += Number(d.days || 0);
            }

        }

    });

    const limit =
        leaveType === "CASUAL" ? 11 : 3;

    const used =
        leaveType === "CASUAL" ? usedCL : usedSL;

    if(used + days > limit){

        showMessage(
            `${leaveType === "CASUAL" ? "Casual" : "Sick"} Leave balance exceeded. Available: ${Math.max(0,limit-used)} day(s).`,
            "error"
        );

        return;
    }

    const name =
        currentStaff.name ||
        currentStaff.staffName ||
        currentUser.email;

    const staffId =
        currentStaff.staffId ||
        currentStaff.id ||
        "";

    const department =
        currentStaff.department ||
        currentStaff.dep ||
        "";

    await addDoc(
        collection(db,"leave_requests"),
        {

            applicantUid:currentUser.uid,

            applicantEmail:
                currentUser.email || "",

            applicantName:name,

            staffId:staffId,

            department:department,

            applicantRole:"STAFF",

            leaveType:leaveType,

            fromDate:fromDate,

            toDate:toDate,

            days:days,

            month:fromMonth,

            reason:reason,

            status:"PENDING_HEAD",

            headAction:"",
            headActionBy:"",
            headActionAt:null,

            hrAction:"",
            hrActionBy:"",
            hrActionAt:null,

            createdAt:serverTimestamp()

        }
    );

    showMessage(
        "Leave applied successfully. It has been sent to your Department Head.",
        "success"
    );

    document.getElementById("leaveForm").reset();

    await loadBalance();
    await loadLeaves();

});


onAuthStateChanged(auth,async user => {

    if(!user){

        showMessage(
            "Please login first.",
            "error"
        );

        return;
    }

    currentUser = user;

    await loadStaff();

});

</script>

</body>
</html>
