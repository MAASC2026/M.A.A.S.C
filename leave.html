<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Leave Apply</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f6f9;
    min-height:100vh;
}

/* =========================
   HEADER
========================= */

.header{
    height:70px;
    background:#500454;
    color:white;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 25px;

    box-shadow:0 2px 10px rgba(0,0,0,.25);
}

.header h2{
    font-size:23px;
}

.header .user{
    font-size:15px;
}


/* =========================
   CONTAINER
========================= */

.container{
    max-width:1100px;
    margin:30px auto;
    padding:0 20px;
}


/* =========================
   CARD
========================= */

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    margin-bottom:25px;

    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.card h2{
    color:#500454;
    margin-bottom:20px;
}


/* =========================
   STAFF DETAILS
========================= */

.staff-details{
    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

    gap:15px;
}

.detail-box{
    background:#f8f8f8;
    border:1px solid #e2e2e2;

    border-radius:8px;

    padding:15px;
}

.detail-box label{
    display:block;

    font-size:13px;
    color:#777;

    margin-bottom:6px;
}

.detail-box strong{
    font-size:16px;
    color:#333;
}


/* =========================
   FORM
========================= */

.form-grid{
    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr));

    gap:20px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group label{
    font-weight:bold;
    color:#333;

    margin-bottom:8px;
}

input,
select,
textarea{
    width:100%;

    padding:12px;

    border:1px solid #ccc;

    border-radius:7px;

    font-size:15px;

    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#500454;
}

textarea{
    resize:vertical;
    min-height:100px;
}


/* =========================
   LEAVE BALANCE
========================= */

.balance-grid{
    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(200px,1fr));

    gap:20px;
}

.balance{
    text-align:center;

    padding:20px;

    border-radius:10px;

    background:#fafafa;

    border:1px solid #ddd;
}

.balance h1{
    font-size:38px;
    color:#500454;

    margin-bottom:5px;
}

.balance p{
    font-weight:bold;
    color:#555;
}


/* =========================
   BUTTON
========================= */

button{
    border:none;

    border-radius:7px;

    padding:13px 24px;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;
}

.apply-btn{
    background:#500454;
    color:white;
}

.apply-btn:hover{
    background:#6d0873;
}

.clear-btn{
    background:#777;
    color:white;

    margin-left:8px;
}

.clear-btn:hover{
    background:#555;
}


/* =========================
   STATUS
========================= */

#status{
    display:none;

    margin-top:15px;

    padding:13px;

    border-radius:7px;

    font-weight:bold;
}


/* =========================
   TABLE
========================= */

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;

    border-collapse:collapse;
}

th,
td{
    padding:12px;

    border-bottom:1px solid #eee;

    text-align:left;
}

th{
    background:#500454;
    color:white;
}

tr:hover{
    background:#fafafa;
}


/* =========================
   STATUS BADGES
========================= */

.badge{
    display:inline-block;

    padding:6px 10px;

    border-radius:15px;

    font-size:12px;

    font-weight:bold;
}

.pending{
    background:#fff3cd;
    color:#856404;
}

.approved{
    background:#d4edda;
    color:#155724;
}

.rejected{
    background:#f8d7da;
    color:#721c24;
}

.forwarded{
    background:#d1ecf1;
    color:#0c5460;
}


/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;

    padding:25px;

    color:#777;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .header{
        padding:0 15px;
    }

    .header h2{
        font-size:18px;
    }

    .header .user{
        font-size:12px;
    }

    .container{
        padding:0 10px;
        margin-top:20px;
    }

    .card{
        padding:18px;
    }

    th,
    td{
        font-size:12px;
        padding:9px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<div class="header">

    <h2>
        LEAVE APPLY
    </h2>

    <div class="user">

        Welcome,
        <span id="headerStaffName">
            Staff
        </span>

    </div>

</div>


<div class="container">


<!-- =========================
     STAFF DETAILS
========================= -->

<div class="card">

    <h2>
        Staff Details
    </h2>


    <div class="staff-details">


        <div class="detail-box">

            <label>
                Staff ID
            </label>

            <strong id="staffId">
                -
            </strong>

        </div>


        <div class="detail-box">

            <label>
                Staff Name
            </label>

            <strong id="staffName">
                -
            </strong>

        </div>


        <div class="detail-box">

            <label>
                Department
            </label>

            <strong id="department">
                -
            </strong>

        </div>


    </div>

</div>


<!-- =========================
     LEAVE BALANCE
========================= -->

<div class="card">

    <h2>
        Leave Balance
    </h2>


    <div class="balance-grid">


        <div class="balance">

            <h1 id="casualBalance">
                11
            </h1>

            <p>
                Casual Leave
            </p>

        </div>


        <div class="balance">

            <h1 id="sickBalance">
                3
            </h1>

            <p>
                Sick Leave
            </p>

        </div>


    </div>

</div>


<!-- =========================
     APPLY LEAVE
========================= -->

<div class="card">

    <h2>
        Apply Leave
    </h2>


    <div class="form-grid">


        <!-- LEAVE TYPE -->

        <div class="form-group">

            <label>
                Leave Type
            </label>

            <select id="leaveType">

                <option value="">
                    -- Select Leave Type --
                </option>

                <option value="Casual Leave">
                    Casual Leave
                </option>

                <option value="Sick Leave">
                    Sick Leave
                </option>

            </select>

        </div>


        <!-- FROM DATE -->

        <div class="form-group">

            <label>
                From Date
            </label>

            <input
                type="date"
                id="fromDate">

        </div>


        <!-- TO DATE -->

        <div class="form-group">

            <label>
                To Date
            </label>

            <input
                type="date"
                id="toDate">

        </div>


        <!-- NUMBER OF DAYS -->

        <div class="form-group">

            <label>
                Number of Days
            </label>

            <input
                type="number"
                id="numberOfDays"
                min="1"
                readonly
                placeholder="Automatically calculated">

        </div>


    </div>


    <br>


    <!-- REASON -->

    <div class="form-group">

        <label>
            Reason
        </label>

        <textarea
            id="reason"
            placeholder="Enter reason for leave"></textarea>

    </div>


    <br>


    <button
        class="apply-btn"
        onclick="applyLeave()">

        APPLY LEAVE

    </button>


    <button
        class="clear-btn"
        onclick="clearForm()">

        CLEAR

    </button>


    <div id="status"></div>

</div>


<!-- =========================
     MY LEAVE REQUESTS
========================= -->

<div class="card">

    <h2>
        My Leave Requests
    </h2>


    <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>
                        Date
                    </th>

                    <th>
                        Leave Type
                    </th>

                    <th>
                        From
                    </th>

                    <th>
                        To
                    </th>

                    <th>
                        Days
                    </th>

                    <th>
                        Reason
                    </th>

                    <th>
                        Status
                    </th>

                </tr>

            </thead>


            <tbody id="leaveTable">

                <tr>

                    <td
                        colspan="7"
                        class="empty">

                        Loading...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


</div>


<script type="module">


/* ==========================================
   FIREBASE
========================================== */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    where,
    orderBy,
    Timestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ==========================================
   FIREBASE CONFIG
========================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyAIv3091VM-gkmdwEAn7OhXWd9Cm2zh2bo",

    authDomain:
    "maasc-2026.firebaseapp.com",

    projectId:
    "maasc-2026",

    storageBucket:
    "maasc-2026.appspot.com",

    messagingSenderId:
    "585813001586",

    appId:
    "1:585813001586:web:664e0e90ff0725d2e849eb"

};


const app =
initializeApp(
    firebaseConfig
);


const db =
getFirestore(app);


/* ==========================================
   EXISTING LOGIN SESSION
========================================== */

const staffId =
sessionStorage.getItem(
    "staffId"
);

const staffName =
sessionStorage.getItem(
    "staffName"
);

const department =
sessionStorage.getItem(
    "department"
);


/*
 * IMPORTANT:
 *
 * We are using the SAME session
 * values as your existing
 * Staff Dashboard.
 *
 * No Firebase Auth login is
 * introduced here.
 */


/* ==========================================
   CHECK LOGIN
========================================== */

if(
    !staffId ||
    !staffName ||
    !department
){

    alert(
        "Staff login session not found. Please login again."
    );

    window.location.href =
        "login.html";

}


/* ==========================================
   DISPLAY STAFF
========================================== */

document
.getElementById(
    "headerStaffName"
)
.textContent =
staffName || "-";


document
.getElementById(
    "staffId"
)
.textContent =
staffId || "-";


document
.getElementById(
    "staffName"
)
.textContent =
staffName || "-";


document
.getElementById(
    "department"
)
.textContent =
department || "-";


/* ==========================================
   DATE CALCULATION
========================================== */

const fromDate =
document.getElementById(
    "fromDate"
);


const toDate =
document.getElementById(
    "toDate"
);


const numberOfDays =
document.getElementById(
    "numberOfDays"
);


function calculateDays(){

    if(
        !fromDate.value ||
        !toDate.value
    ){

        numberOfDays.value = "";

        return;

    }


    const from =
    new Date(
        fromDate.value +
        "T00:00:00"
    );


    const to =
    new Date(
        toDate.value +
        "T00:00:00"
    );


    if(to < from){

        numberOfDays.value = "";

        showStatus(
            "To Date cannot be before From Date.",
            "error"
        );

        return;

    }


    const difference =
    to.getTime() -
    from.getTime();


    const days =
    Math.floor(
        difference /
        (1000 * 60 * 60 * 24)
    ) + 1;


    numberOfDays.value =
    days;

}


fromDate.addEventListener(
    "change",
    calculateDays
);


toDate.addEventListener(
    "change",
    calculateDays
);


/* ==========================================
   APPLY LEAVE
========================================== */

window.applyLeave =
async function(){

    const leaveType =
    document.getElementById(
        "leaveType"
    ).value;


    const from =
    fromDate.value;


    const to =
    toDate.value;


    const days =
    Number(
        numberOfDays.value
    );


    const reason =
    document.getElementById(
        "reason"
    ).value.trim();


    /* =========================
       VALIDATION
    ========================= */

    if(!leaveType){

        showStatus(
            "Please select Leave Type.",
            "error"
        );

        return;

    }


    if(!from){

        showStatus(
            "Please select From Date.",
            "error"
        );

        return;

    }


    if(!to){

        showStatus(
            "Please select To Date.",
            "error"
        );

        return;

    }


    if(!days || days < 1){

        showStatus(
            "Invalid number of leave days.",
            "error"
        );

        return;

    }


    if(!reason){

        showStatus(
            "Please enter the reason for leave.",
            "error"
        );

        return;

    }


    /* =========================
       CHECK MONTH
    ========================= */

    const fromMonth =
    from.substring(
        0,
        7
    );


    const toMonth =
    to.substring(
        0,
        7
    );


    if(
        fromMonth !==
        toMonth
    ){

        showStatus(
            "Leave application cannot cross different months. Please apply separately for each month.",
            "error"
        );

        return;

    }


    /* =========================
       CHECK BALANCE
    ========================= */

    try{

        const used =
        await getUsedLeave(
            leaveType,
            fromMonth
        );


        let allowed = 0;


        if(
            leaveType ===
            "Casual Leave"
        ){

            allowed = 11;

        }


        if(
            leaveType ===
            "Sick Leave"
        ){

            allowed = 3;

        }


        const remaining =
        allowed - used;


        if(
            days > remaining
        ){

            showStatus(

                leaveType +
                " balance is only " +
                remaining +
                " day(s) remaining for " +
                formatMonth(fromMonth) +
                ".",

                "error"

            );

            return;

        }


        /* =========================
           CREATE REQUEST
        ========================= */

        await addDoc(

            collection(
                db,
                "leaveRequests"
            ),

            {

                staffId:
                staffId,

                staffName:
                staffName,

                department:
                department,

                applicantType:
                "Staff",

                leaveType:
                leaveType,

                fromDate:
                from,

                toDate:
                to,

                numberOfDays:
                days,

                reason:
                reason,

                status:
                "Pending Head Approval",

                headStatus:
                "Pending",

                hrStatus:
                "Not Required",

                createdAt:
                Timestamp.now(),

                createdBy:
                staffId

            }

        );


        showStatus(
            "Leave applied successfully. It has been sent to the Department Head for approval.",
            "success"
        );


        clearForm();


        await loadMyLeaves();


        await loadBalances();


    }catch(error){

        console.error(
            "LEAVE APPLY ERROR:",
            error
        );


        showStatus(
            "Unable to apply leave. Please check Firestore permissions.",
            "error"
        );

    }

};


/* ==========================================
   GET USED LEAVE
========================================== */

async function getUsedLeave(
    leaveType,
    month
){

    let total = 0;


    try{

        const q =
        query(

            collection(
                db,
                "leaveRequests"
            ),

            where(
                "staffId",
                "==",
                staffId
            ),

            where(
                "leaveType",
                "==",
                leaveType
            )

        );


        const snap =
        await getDocs(q);


        snap.forEach(
            item => {

                const data =
                item.data();


                /*
                 * Only count leave
                 * from the requested month.
                 */

                const requestMonth =
                String(
                    data.fromDate ||
                    ""
                ).substring(
                    0,
                    7
                );


                if(
                    requestMonth !==
                    month
                ){

                    return;

                }


                /*
                 * Rejected requests
                 * should not consume
                 * balance.
                 */

                if(
                    data.status ===
                    "Rejected"
                ){

                    return;

                }


                total +=
                Number(
                    data.numberOfDays ||
                    0
                );

            }
        );


    }catch(error){

        console.error(
            "BALANCE ERROR:",
            error
        );

    }


    return total;

}


/* ==========================================
   LOAD BALANCES
========================================== */

async function loadBalances(){

    const now =
    new Date();


    const year =
    now.getFullYear();


    const month =
    String(
        now.getMonth() + 1
    ).padStart(
        2,
        "0"
    );


    const currentMonth =
    year +
    "-" +
    month;


    try{

        const casualUsed =
        await getUsedLeave(
            "Casual Leave",
            currentMonth
        );


        const sickUsed =
        await getUsedLeave(
            "Sick Leave",
            currentMonth
        );


        const casualRemaining =
        Math.max(
            0,
            11 - casualUsed
        );


        const sickRemaining =
        Math.max(
            0,
            3 - sickUsed
        );


        document
        .getElementById(
            "casualBalance"
        )
        .textContent =
        casualRemaining;


        document
        .getElementById(
            "sickBalance"
        )
        .textContent =
        sickRemaining;


    }catch(error){

        console.error(error);

    }

}


/* ==========================================
   LOAD MY LEAVE REQUESTS
========================================== */

async function loadMyLeaves(){

    const table =
    document.getElementById(
        "leaveTable"
    );


    table.innerHTML = `

        <tr>

            <td
                colspan="7"
                class="empty">

                Loading...

            </td>

        </tr>

    `;


    try{

        /*
         * Query only by staffId.
         *
         * This avoids requiring a Firestore
         * composite index.
         */

        const q =
        query(

            collection(
                db,
                "leaveRequests"
            ),

            where(
                "staffId",
                "==",
                staffId
            )

        );


        const snap =
        await getDocs(q);


        const leaves = [];


        snap.forEach(
            item => {

                const data =
                item.data();


                leaves.push({

                    id:
                    item.id,

                    ...data

                });

            }
        );


        leaves.sort(
            (a,b) => {

                const dateA =
                String(
                    a.createdAt?.seconds ||
                    0
                );

                const dateB =
                String(
                    b.createdAt?.seconds ||
                    0
                );

                return (
                    Number(dateB) -
                    Number(dateA)
                );

            }
        );


        table.innerHTML = "";


        if(
            leaves.length === 0
        ){

            table.innerHTML = `

                <tr>

                    <td
                        colspan="7"
                        class="empty">

                        No leave applications found.

                    </td>

                </tr>

            `;

            return;

        }


        leaves.forEach(
            leave => {

                const tr =
                document.createElement(
                    "tr"
                );


                tr.innerHTML = `

                    <td>
                        ${formatTimestamp(
                            leave.createdAt
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            leave.leaveType
                        )}
                    </td>

                    <td>
                        ${formatDate(
                            leave.fromDate
                        )}
                    </td>

                    <td>
                        ${formatDate(
                            leave.toDate
                        )}
                    </td>

                    <td>
                        ${leave.numberOfDays || 0}
                    </td>

                    <td>
                        ${escapeHtml(
                            leave.reason
                        )}
                    </td>

                    <td>
                        ${statusBadge(
                            leave.status
                        )}
                    </td>

                `;


                table.appendChild(
                    tr
                );

            }
        );


    }catch(error){

        console.error(
            "LOAD LEAVES ERROR:",
            error
        );


        table.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="empty">

                    Unable to load leave applications.

                </td>

            </tr>

        `;

    }

}


/* ==========================================
   CLEAR FORM
========================================== */

window.clearForm =
function(){

    document
    .getElementById(
        "leaveType"
    )
    .value = "";


    document
    .getElementById(
        "fromDate"
    )
    .value = "";


    document
    .getElementById(
        "toDate"
    )
    .value = "";


    document
    .getElementById(
        "numberOfDays"
    )
    .value = "";


    document
    .getElementById(
        "reason"
    )
    .value = "";


    hideStatus();

};


/* ==========================================
   STATUS
========================================== */

function showStatus(
    message,
    type
){

    const status =
    document.getElementById(
        "status"
    );


    status.style.display =
    "block";


    status.textContent =
    message;


    if(
        type ===
        "success"
    ){

        status.style.background =
        "#d4edda";

        status.style.color =
        "#155724";

    }else{

        status.style.background =
        "#f8d7da";

        status.style.color =
        "#721c24";

    }

}


function hideStatus(){

    document
    .getElementById(
        "status"
    )
    .style.display =
    "none";

}


/* ==========================================
   FORMAT DATE
========================================== */

function formatDate(
    value
){

    if(!value){

        return "-";

    }


    const parts =
    String(value)
    .split("-");


    if(
        parts.length !== 3
    ){

        return value;

    }


    return (
        parts[2] +
        "-" +
        parts[1] +
        "-" +
        parts[0]
    );

}


/* ==========================================
   FORMAT TIMESTAMP
========================================== */

function formatTimestamp(
    timestamp
){

    if(
        !timestamp ||
        !timestamp.seconds
    ){

        return "-";

    }


    const date =
    new Date(
        timestamp.seconds * 1000
    );


    return date.toLocaleDateString(
        "en-IN"
    );

}


/* ==========================================
   FORMAT MONTH
========================================== */

function formatMonth(
    month
){

    const parts =
    String(month)
    .split("-");


    if(
        parts.length !== 2
    ){

        return month;

    }


    const date =
    new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        1
    );


    return date.toLocaleDateString(
        "en-IN",
        {
            month:"long",
            year:"numeric"
        }
    );

}


/* ==========================================
   STATUS BADGE
========================================== */

function statusBadge(
    status
){

    const value =
    String(
        status || "Pending"
    );


    let className =
    "pending";


    if(
        value.includes(
            "Approved"
        )
    ){

        className =
        "approved";

    }


    if(
        value.includes(
            "Rejected"
        )
    ){

        className =
        "rejected";

    }


    if(
        value.includes(
            "HR"
        )
    ){

        className =
        "forwarded";

    }


    return `

        <span class="badge ${className}">

            ${escapeHtml(
                value
            )}

        </span>

    `;

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHtml(
    value
){

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}
