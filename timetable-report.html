<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Update Staff Timetable</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}
body{
    background:#f4f7fb;
    color:#1f2937;
}
.header{
    background:#500454;
    color:#fff;
    padding:18px 24px;
}
.header h1{
    font-size:24px;
}
.header p{
    margin-top:5px;
    opacity:.9;
}
.container{
    width:min(1450px,96%);
    margin:22px auto;
}
.card{
    background:#fff;
    border-radius:12px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}
.card-title{
    font-size:18px;
    font-weight:bold;
    color:#500454;
    margin-bottom:15px;
}
.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}
.field label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}
.field input,
.field select{
    width:100%;
    padding:11px 12px;
    border:1px solid #d1d5db;
    border-radius:7px;
    background:#fff;
    outline:none;
}
.field input:focus,
.field select:focus{
    border-color:#6d0872;
}
.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:15px;
}
button{
    border:0;
    border-radius:7px;
    padding:11px 17px;
    cursor:pointer;
    font-weight:bold;
}
.primary{
    background:#500454;
    color:#fff;
}
.secondary{
    background:#e5e7eb;
    color:#111827;
}
.success{
    background:#15803d;
    color:#fff;
}
.danger{
    background:#b91c1c;
    color:#fff;
}
button:disabled{
    opacity:.55;
    cursor:not-allowed;
}
.message{
    display:none;
    padding:12px 14px;
    border-radius:7px;
    margin-top:15px;
}
.message.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}
.message.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}
.message.info{
    display:block;
    background:#dbeafe;
    color:#1e40af;
}
.staff-info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}
.info-box{
    background:#f8fafc;
    border:1px solid #e5e7eb;
    padding:12px;
    border-radius:8px;
}
.info-box span{
    display:block;
    font-size:12px;
    color:#6b7280;
    margin-bottom:4px;
}
.info-box strong{
    color:#111827;
}
.table-wrap{
    width:100%;
    overflow-x:auto;
}
table{
    width:100%;
    min-width:1250px;
    border-collapse:collapse;
}
th{
    background:#6d0872;
    color:#fff;
    padding:10px 8px;
    border:1px solid #d1d5db;
    font-size:12px;
}
td{
    border:1px solid #d1d5db;
    padding:8px;
    text-align:center;
    vertical-align:middle;
    min-width:180px;
    height:125px;
}
.day{
    background:#f3e8ff;
    color:#500454;
    font-weight:bold;
    min-width:105px;
}
.period{
    min-height:95px;
    padding:8px;
    border-radius:7px;
}
.assigned{
    background:#fef3c7;
    border-left:4px solid #d97706;
}
.free{
    background:#f0fdf4;
    border-left:4px solid #16a34a;
}
.subject{
    font-weight:bold;
    color:#92400e;
    margin-bottom:6px;
}
.details{
    font-size:12px;
    line-height:1.5;
}
.time{
    margin-top:7px;
    font-size:11px;
    color:#6b7280;
}
.edit-note{
    margin-top:7px;
    font-size:10px;
    color:#6d0872;
    font-weight:bold;
}
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:15px;
}
.modal-box{
    width:min(650px,100%);
    max-height:90vh;
    overflow:auto;
    background:#fff;
    border-radius:12px;
    padding:22px;
}
.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}
.modal-header h2{
    color:#500454;
}
.close{
    background:#e5e7eb;
    padding:7px 11px;
}
.modal-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}
.full{
    grid-column:1/-1;
}
.existing{
    background:#f8fafc;
    border:1px solid #e5e7eb;
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
    line-height:1.7;
}
@media(max-width:900px){
    .grid,
    .staff-info{
        grid-template-columns:repeat(2,1fr);
    }
}
@media(max-width:600px){
    .grid,
    .staff-info,
    .modal-grid{
        grid-template-columns:1fr;
    }
    .full{
        grid-column:auto;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>Update Staff Timetable</h1>
    <p>Edit the existing timetable directly without creating duplicate timetable entries.</p>
</div>

<div class="container">

    <div class="card">
        <div class="card-title">Select Staff</div>

        <div class="grid">
            <div class="field">

    <div class="card" id="timetableCard" style="display:none;">

</div>

<div class="modal" id="editModal">
    <div class="modal-box">

        <div class="modal-header">
            <h2 id="modalTitle">Edit Timetable</h2>
            <button class="close" id="closeModal">X</button>

        <div class="modal-grid">

            </div>

                <input id="editSection" type="text">

            </div>

            </div>

                    <option value="DAY 03">DAY 03</option>

                    <option value="DAY 06">DAY 06</option>

                <button class="danger" id="deleteBtn">Delete This Period</button>

</div>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    updateDoc,
    deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
    getAuth
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAIv3091VM-gkmdwEAn7OhXWd9Cm2zh2bo",

    authDomain:
        "maasc-2026.firebaseapp.com",

    projectId:
        "maasc-2026",

    storageBucket:
        "maasc-2026.appspot.com",

    messagingSenderId:
        "585813001586",

    appId:
        "1:585813001586:web:664e0e90ff0725d2e849eb"

};

const app =
    initializeApp(
        firebaseConfig
    );

const db =
    getFirestore(app);

const auth =
    getAuth(app);


/* =====================================================
   DOM
===================================================== */

const staffSearch =
    document.getElementById("staffSearch");

const staffSelect =
    document.getElementById("staffSelect");

const sessionSelect =
    document.getElementById("sessionSelect");

const daySelect =
    document.getElementById("daySelect");

const loadBtn =
    document.getElementById("loadBtn");

const resetBtn =
    document.getElementById("resetBtn");

const message =
    document.getElementById("message");

const staffCard =
    document.getElementById("staffCard");

const timetableCard =
    document.getElementById("timetableCard");

const timetableTable =
    document.getElementById("timetableTable");

const editModal =
    document.getElementById("editModal");

const closeModal =
    document.getElementById("closeModal");

const cancelBtn =
    document.getElementById("cancelBtn");

const saveBtn =
    document.getElementById("saveBtn");

const deleteBtn =
    document.getElementById("deleteBtn");


/* =====================================================
   DATA
===================================================== */

let allStaff = [];
let allTimetable = [];
let currentStaff = null;
let editingRecord = null;
let currentStaffLoaded = false;


/* =====================================================
   HELPERS
===================================================== */

function firstValue(...values){

    for(const value of values){

        if(
            value !== undefined &&
            value !== null &&
            String(value).trim() !== ""
        ){

            return value;

        }

    }

    return "";

}


function normalizeText(value){

    return String(value ?? "")
        .trim()
        .replace(/\s+/g," ")
        .toUpperCase();

}


function normalizeDay(value){

    const text =
        normalizeText(value);

    const match =
        text.match(/(?:DAY\s*)?0*(\d+)/);

    if(match){

        return "DAY " +
            String(
                Number(match[1])
            ).padStart(2,"0");

    }

    return text;

}


function normalizeSession(value){

    const text =
        normalizeText(value);

    if(
        text === "FN" ||
        text === "FORENOON" ||
        text === "MORNING"
    ){

        return "FN";

    }

    if(
        text === "AN" ||
        text === "AFTERNOON" ||
        text === "EVENING"
    ){

        return "AN";

    }

    return text;

}


function getStaffId(data,docId=""){

    return String(
        firstValue(
            data.staffId,
            data.staffID,
            data.staff_id,
            data.staffCode,
            data.staff_code,
            data.employeeId,
            data.employeeID,
            data.employee_id,
            data.teacherId,
            data.teacherID,
            data.id,
            data.ID,
            docId
        )
    ).trim();

}


function getStaffName(data){

    return String(
        firstValue(
            data.staffName,
            data.staff_name,
            data.name,
            data.fullName,
            data.full_name,
            data.employeeName,
            data.employee_name,
            data.teacherName,
            data.teacher_name,
            data.teacher
        )
    ).trim();

}


function getDepartment(data){

    return String(
        firstValue(
            data.department,
            data.dept,
            data.departmentName,
            data.department_name,
            data.deptName,
            data.dept_name,
            data.Department,
            data.DEPT,
            data.branch,
            data.branchName,
            data.programDepartment,
            data.staffDepartment
        )
    ).trim();

}


function getHour(data){

    const raw =
        firstValue(
            data.hour,
            data.period,
            data.hourNo,
            data.hourNumber,
            data.periodNo,
            data.periodNumber,
            data.hourIndex
        );

    if(typeof raw === "number"){
        return raw;
    }

    const match =
        String(raw ?? "")
        .match(/\d+/);

    return match
        ? Number(match[0])
        : 0;

}


function getSubject(data){

    return String(
        firstValue(
            data.subject,
            data.subjectName,
            data.subject_name,
            data.title,
            data.name
        )
    ).trim();

}


function getSubjectCode(data){

    return String(
        firstValue(
            data.subjectCode,
            data.subject_code,
            data.code,
            data.paperCode,
            data.paper_code
        )
    ).trim();

}


function getClassYear(data){

    return String(
        firstValue(
            data.classYear,
            data.class,
            data.year,
            data.className,
            data.class_name,
            data.yearName,
            data.year_name
        )
    ).trim();

}


function getSection(data){

    return String(
        firstValue(
            data.section,
            data.sec,
            data.Section,
            data.SECTION
        )
    ).trim();

}


function getRoom(data){

    return String(
        firstValue(
            data.roomNo,
            data.room_no,
            data.room,
            data.roomNumber,
            data.room_number,
            data.RoomNo,
            data.Room,
            data.classRoom,
            data.classroom,
            data.roomName,
            data.room_name
        )
    ).trim();

}


function normalizeRecord(id,data){

    return {

        id,

        staffId:
            getStaffId(data,id),

        staffName:
            getStaffName(data),

        department:
            getDepartment(data),

        day:
            normalizeDay(
                firstValue(
                    data.day,
                    data.dayName,
                    data.dayNo,
                    data.dayNumber,
                    data.dayOrder,
                    data.day_order
                )
            ),

        session:
            normalizeSession(
                firstValue(
                    data.session,
                    data.shift,
                    data.sessionName
                )
            ),

        hour:
            getHour(data),

        subjectCode:
            getSubjectCode(data),

        subjectId:
            String(
                firstValue(
                    data.subjectId,
                    data.subject_id
                )
            ).trim(),

        subject:
            getSubject(data),

        classYear:
            getClassYear(data),

        section:
            getSection(data),

        room:
            getRoom(data)

    };

}


function showMessage(text,type){

    message.className =
        "message " + type;

    message.textContent =
        text;

}


function clearMessage(){

    message.className =
        "message";

    message.textContent =
        "";

}


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   CURRENT STAFF SESSION
   Uses the SAME matching approach as the current
   Substitute Assignment portal.
===================================================== */

function clean(value){
    return String(value ?? "").trim();
}

function upper(value){
    return clean(value).toUpperCase();
}

function getCurrentStaffId(){

    const keys = [
        "staffId",
        "staffID",
        "loggedInStaffId",
        "currentStaffId",
        "userStaffId"
    ];

    for(const key of keys){

        const value =
            clean(
                sessionStorage.getItem(key) ||
                localStorage.getItem(key)
            );

        if(value){
            return value;
        }

    }

    const objectKeys = [
        "staffSession",
        "staff_session",
        "loggedInStaff",
        "currentStaff",
        "staffData",
        "userData",
        "user"
    ];

    for(const key of objectKeys){

        try{

            const raw =
                sessionStorage.getItem(key) ||
                localStorage.getItem(key);

            if(!raw){
                continue;
            }

            const obj =
                JSON.parse(raw);

            const id =
                clean(
                    obj?.staffId ??
                    obj?.staffID ??
                    obj?.staff ??
                    obj?.staff_id ??
                    obj?.id
                );

            if(id){
                return id;
            }

        }catch(e){}

    }

    return "";

}


/* =====================================================
   LOAD CURRENT LOGGED-IN STAFF
===================================================== */

async function loadCurrentStaff(){

    const storedStaffId =
        getCurrentStaffId();

    const user =
        auth.currentUser;

    console.log(
        "CURRENT STAFF SEARCH:",
        {
            storedStaffId,
            authUid:
                user?.uid || "",
            authEmail:
                user?.email || ""
        }
    );

    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "staff"
                )
            );

        let found =
            null;

        snapshot.forEach(
            documentSnapshot => {

                if(found){
                    return;
                }

                const data =
                    documentSnapshot.data() || {};

                const dbStaffId =
                    getStaffId(
                        data,
                        documentSnapshot.id
                    );

                const dbEmail =
                    clean(
                        data.email ??
                        data.emailId ??
                        data.emailID ??
                        data.mail ??
                        data.mailId ??
                        data.officialEmail ??
                        data.officialMail ??
                        data.officialMailId ??
                        data.officialMailID ??
                        data.staffEmail ??
                        data.staff_email
                    );

                const dbUid =
                    clean(
                        data.uid ??
                        data.userId ??
                        data.userID ??
                        data.authUid ??
                        data.firebaseUid ??
                        data.firebaseUID ??
                        data.authUserId ??
                        data.authUID
                    );

                const idMatch =
                    storedStaffId &&
                    upper(dbStaffId) ===
                    upper(storedStaffId);

                const uidMatch =
                    user &&
                    user.uid &&
                    (
                        dbUid === user.uid ||
                        documentSnapshot.id === user.uid
                    );

                const emailMatch =
                    user &&
                    user.email &&
                    dbEmail &&
                    upper(dbEmail) ===
                    upper(user.email);

                if(
                    idMatch ||
                    uidMatch ||
                    emailMatch
                ){

                    found = {

                        firestoreId:
                            documentSnapshot.id,

                        staffId:
                            dbStaffId ||
                            storedStaffId ||
                            user?.uid ||
                            "",

                        staffName:
                            getStaffName(data) ||
                            user?.displayName ||
                            "",

                        department:
                            getDepartment(data) ||
                            ""

                    };

                }

            }
        );


        if(!found){

            console.error(
                "CURRENT STAFF NOT FOUND",
                {
                    storedStaffId,
                    authUid:
                        user?.uid || "",
                    authEmail:
                        user?.email || ""
                }
            );

            showMessage(
                "Current logged-in staff could not be matched. Please open this portal from the Staff Dashboard after login.",
                "error"
            );

            return false;

        }


        currentStaff =
            found;

        currentStaffLoaded =
            true;

        console.log(
            "CURRENT STAFF LOADED:",
            currentStaff
        );


        /* Put the current staff first in the dropdown. */
        staffSelect.value =
            currentStaff.staffId;


        const exists =
            [...staffSelect.options]
            .some(
                option =>
                    upper(option.value) ===
                    upper(currentStaff.staffId)
            );

        if(!exists){

            const option =
                document.createElement("option");

            option.value =
                currentStaff.staffId;

            option.textContent =
                (
                    currentStaff.staffName ||
                    currentStaff.staffId
                ) +
                " (" +
                currentStaff.staffId +
                ")" +
                (
                    currentStaff.department
                    ? " - " +
                      currentStaff.department
                    : ""
                );

            staffSelect.appendChild(
                option
            );

        }


        document.getElementById(
            "infoStaffId"
        ).textContent =
            currentStaff.staffId;

        document.getElementById(
            "infoStaffName"
        ).textContent =
            currentStaff.staffName ||
            "-";

        document.getElementById(
            "infoDepartment"
        ).textContent =
            currentStaff.department ||
            "-";

        staffCard.style.display =
            "block";


        /*
         * Keep the same session values updated,
         * exactly like the current portal.
         */
        sessionStorage.setItem(
            "staffId",
            currentStaff.staffId
        );

        sessionStorage.setItem(
            "staffName",
            currentStaff.staffName || ""
        );

        sessionStorage.setItem(
            "department",
            currentStaff.department || ""
        );


        return true;

    }catch(error){

        console.error(
            "LOAD CURRENT STAFF ERROR:",
            error
        );

        showMessage(
            "Unable to load current staff: " +
            error.message,
            "error"
        );

        return false;

    }

}


/* =====================================================
   LOAD STAFF
===================================================== */

async function loadStaff(){

    const snapshot =
        await getDocs(
            collection(
                db,
                "staff"
            )
        );

    allStaff = [];

    snapshot.forEach(
        documentSnapshot => {

            const data =
                documentSnapshot.data() || {};

            const staffId =
                getStaffId(
                    data,
                    documentSnapshot.id
                );

            if(!staffId){
                return;
            }

            allStaff.push({

                id:
                    documentSnapshot.id,

                staffId,

                staffName:
                    getStaffName(data) ||
                    staffId,

                department:
                    getDepartment(data)

            });

        }
    );

    allStaff.sort(
        (a,b) =>
            normalizeText(a.staffName)
            .localeCompare(
                normalizeText(b.staffName)
            )
    );

    renderStaffOptions();

}


/* =====================================================
   STAFF SEARCH
===================================================== */

function renderStaffOptions(){

    const search =
        normalizeText(
            staffSearch.value
        );

    const selected =
        staffSelect.value;

    staffSelect.innerHTML =
        '<option value="">Select Staff</option>';

    allStaff
        .filter(staff => {

            if(!search){
                return true;
            }

            return (
                normalizeText(
                    staff.staffName
                ).includes(search) ||

                normalizeText(
                    staff.staffId
                ).includes(search)
            );

        })
        .forEach(staff => {

            const option =
                document.createElement("option");

            option.value =
                staff.staffId;

            option.textContent =
                staff.staffName +
                " (" +
                staff.staffId +
                ")" +
                (
                    staff.department
                    ? " - " +
                      staff.department
                    : ""
                );

            staffSelect.appendChild(
                option
            );

        });

    if(
        [...staffSelect.options]
        .some(
            option =>
                option.value === selected
        )
    ){

        staffSelect.value =
            selected;

    }

}


/* =====================================================
   LOAD EXISTING TIMETABLE
===================================================== */

async function loadTimetable(){

    const snapshot =
        await getDocs(
            collection(
                db,
                "timetableAssignments"
            )
        );

    allTimetable = [];

    snapshot.forEach(
        documentSnapshot => {

            const data =
                documentSnapshot.data() || {};

            const record =
                normalizeRecord(
                    documentSnapshot.id,
                    data
                );

            if(record.staffId){

                allTimetable.push(
                    record
                );

            }

        }
    );

}


/* =====================================================
   STAFF SELECT
===================================================== */

staffSelect.addEventListener(
    "change",
    async () => {

        currentStaff =
            allStaff.find(
                staff =>
                    normalizeText(
                        staff.staffId
                    ) ===
                    normalizeText(
                        staffSelect.value
                    )
            ) || (
                currentStaff &&
                normalizeText(
                    currentStaff.staffId
                ) ===
                normalizeText(
                    staffSelect.value
                )
                    ? currentStaff
                    : null
            );

        if(currentStaff){

            document.getElementById(
                "infoStaffId"
            ).textContent =
                currentStaff.staffId;

            document.getElementById(
                "infoStaffName"
            ).textContent =
                currentStaff.staffName;

            document.getElementById(
                "infoDepartment"
            ).textContent =
                currentStaff.department || "-";

            staffCard.style.display =
                "block";

        }else{

            staffCard.style.display =
                "none";

        }

        if(
            currentStaff &&
            allTimetable.length
        ){

            renderTimetable();

        }

    }
);


/* =====================================================
   SEARCH
===================================================== */

staffSearch.addEventListener(
    "input",
    renderStaffOptions
);


/* =====================================================
   SESSION TIMES
===================================================== */

function getSessionTimes(session){

    if(
        normalizeSession(session) ===
        "AN"
    ){

        return [
            "1:30 - 2:20",
            "2:20 - 3:10",
            "3:30 - 4:20",
            "4:20 - 5:10",
            "5:10 - 6:00"
        ];

    }

    return [
        "8:30 - 9:20",
        "9:20 - 10:10",
        "10:10 - 11:00",
        "11:30 - 12:20",
        "12:20 - 1:10"
    ];

}


/* =====================================================
   LOAD BUTTON
===================================================== */

loadBtn.addEventListener(
    "click",
    async () => {

        clearMessage();

        const staffId =
            staffSelect.value;

        if(!staffId){

            showMessage(
                "Please select a staff.",
                "error"
            );

            return;

        }

        loadBtn.disabled =
            true;

        loadBtn.textContent =
            "Loading...";

        try{

            await loadTimetable();

            currentStaff =
                allStaff.find(
                    staff =>
                        normalizeText(
                            staff.staffId
                        ) ===
                        normalizeText(
                            staffId
                        )
                ) || null;

            if(currentStaff){

                document.getElementById(
                    "infoStaffId"
                ).textContent =
                    currentStaff.staffId;

                document.getElementById(
                    "infoStaffName"
                ).textContent =
                    currentStaff.staffName;

                document.getElementById(
                    "infoDepartment"
                ).textContent =
                    currentStaff.department || "-";

                staffCard.style.display =
                    "block";

            }

            renderTimetable();

            timetableCard.style.display =
                "block";

            const count =
                allTimetable.filter(
                    item =>
                        normalizeText(
                            item.staffId
                        ) ===
                        normalizeText(
                            staffId
                        )
                ).length;

            showMessage(
                count +
                " existing timetable period(s) loaded.",
                "success"
            );

        }catch(error){

            console.error(
                "LOAD TIMETABLE ERROR:",
                error
            );

            showMessage(
                "Unable to load timetable: " +
                error.message,
                "error"
            );

        }finally{

            loadBtn.disabled =
                false;

            loadBtn.textContent =
                "Load Existing Timetable";

        }

    }
);


/* =====================================================
   RENDER TIMETABLE
===================================================== */

function renderTimetable(){

    const selectedSession =
        normalizeText(
            sessionSelect.value
        );

    const selectedDay =
        normalizeText(
            daySelect.value
        );

    const sessions =
        selectedSession === "ALL"
        ? ["FN","AN"]
        : [selectedSession];

    const days =
        selectedDay === "ALL"
        ? [
            "DAY 01",
            "DAY 02",
            "DAY 03",
            "DAY 04",
            "DAY 05",
            "DAY 06"
        ]
        : [selectedDay];

    let head =
        "<tr><th>Day Order</th>";

    sessions.forEach(
        session => {

            getSessionTimes(
                session
            ).forEach(
                (time,index) => {

                    head +=
                        "<th>" +
                        session +
                        " - Hour " +
                        (index+1) +
                        "<br>" +
                        "<small>" +
                        escapeHtml(time) +
                        "</small></th>";

                }
            );

        }
    );

    head += "</tr>";

    timetableTable
        .querySelector("thead")
        .innerHTML =
        head;

    const body =
        timetableTable
        .querySelector("tbody");

    body.innerHTML = "";

    const staffId =
        currentStaff
        ? currentStaff.staffId
        : staffSelect.value;

    days.forEach(
        day => {

            const row =
                document.createElement("tr");

            const dayCell =
                document.createElement("td");

            dayCell.className =
                "day";

            dayCell.textContent =
                day;

            row.appendChild(
                dayCell
            );

            sessions.forEach(
                session => {

                    for(
                        let hour=1;
                        hour<=5;
                        hour++
                    ){

                        const cell =
                            document.createElement("td");

                        const entry =
                            allTimetable.find(
                                item =>
                                    normalizeText(
                                        item.staffId
                                    ) ===
                                    normalizeText(
                                        staffId
                                    ) &&
                                    normalizeDay(
                                        item.day
                                    ) ===
                                    normalizeDay(day) &&
                                    normalizeSession(
                                        item.session
                                    ) ===
                                    normalizeSession(
                                        session
                                    ) &&
                                    Number(
                                        item.hour
                                    ) ===
                                    hour
                            );

                        const time =
                            getSessionTimes(
                                session
                            )[hour-1];

                        if(entry){

                            cell.innerHTML =
                                `
                                <div class="period assigned">
                                    <div class="subject">
                                        ${escapeHtml(
                                            entry.subject || "Subject"
                                        )}
                                    </div>

                                    <div class="details">
                                        <b>Department:</b>
                                        ${escapeHtml(
                                            entry.department || "-"
                                        )}
                                        <br>
                                        <b>Year:</b>
                                        ${escapeHtml(
                                            entry.classYear || "-"
                                        )}
                                        <br>
                                        <b>Section:</b>
                                        ${escapeHtml(
                                            entry.section || "-"
                                        )}
                                        <br>
                                        <b>Room:</b>
                                        ${escapeHtml(
                                            entry.room || "Not Available"
                                        )}
                                    </div>

                                    <div class="time">
                                        ${escapeHtml(time)}
                                    </div>

                                    <div class="edit-note">
                                        CLICK TO EDIT
                                    </div>
                                </div>
                                `;

                            cell
                                .querySelector(
                                    ".period"
                                )
                                .addEventListener(
                                    "click",
                                    () =>
                                        openEdit(
                                            entry
                                        )
                                );

                        }else{

                            cell.innerHTML =
                                `
                                <div class="period free">
                                    <b>FREE</b>
                                    <div class="time">
                                        ${escapeHtml(time)}
                                    </div>
                                </div>
                                `;

                        }

                        row.appendChild(
                            cell
                        );

                    }

                }
            );

            body.appendChild(
                row
            );

        }
    );

}


/* =====================================================
   EDIT MODAL
===================================================== */

function openEdit(entry){

    editingRecord =
        entry;

    document.getElementById(
        "modalTitle"
    ).textContent =
        "Edit " +
        (entry.subject || "Timetable Period");

    document.getElementById(
        "existingDetails"
    ).innerHTML =
        `
        <b>Staff:</b>
        ${escapeHtml(entry.staffName || currentStaff?.staffName || "-")}
        <br>
        <b>Current Period:</b>
        ${escapeHtml(entry.day)}
        / ${escapeHtml(entry.session)}
        / Hour ${escapeHtml(entry.hour)}
        `;

    document.getElementById(
        "editDepartment"
    ).value =
        entry.department || "";

    document.getElementById(
        "editYear"
    ).value =
        entry.classYear || "";

    document.getElementById(
        "editSection"
    ).value =
        entry.section || "";

    document.getElementById(
        "editSubject"
    ).value =
        entry.subject || "";

    document.getElementById(
        "editSubjectCode"
    ).value =
        entry.subjectCode || "";

    document.getElementById(
        "editRoom"
    ).value =
        entry.room || "";

    document.getElementById(
        "editDay"
    ).value =
        normalizeDay(entry.day);

    document.getElementById(
        "editSession"
    ).value =
        normalizeSession(entry.session);

    document.getElementById(
        "editHour"
    ).value =
        String(entry.hour);

    editModal.style.display =
        "flex";

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeEdit(){

    editingRecord =
        null;

    editModal.style.display =
        "none";

}

closeModal.addEventListener(
    "click",
    closeEdit
);

cancelBtn.addEventListener(
    "click",
    closeEdit
);

editModal.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            editModal
        ){

            closeEdit();

        }

    }
);


/* =====================================================
   CHECK DUPLICATE SLOT
===================================================== */

function slotAlreadyUsed(
    staffId,
    day,
    session,
    hour,
    ignoreId
){

    return allTimetable.some(
        item =>

            item.id !== ignoreId &&

            normalizeText(
                item.staffId
            ) ===
            normalizeText(
                staffId
            ) &&

            normalizeDay(
                item.day
            ) ===
            normalizeDay(day) &&

            normalizeSession(
                item.session
            ) ===
            normalizeSession(session) &&

            Number(item.hour) ===
            Number(hour)

    );

}


/* =====================================================
   UPDATE EXISTING RECORD
===================================================== */

saveBtn.addEventListener(
    "click",
    async () => {

        if(!editingRecord){

            return;

        }

        const department =
            document.getElementById(
                "editDepartment"
            ).value.trim();

        const year =
            document.getElementById(
                "editYear"
            ).value.trim();

        const section =
            document.getElementById(
                "editSection"
            ).value.trim();

        const subject =
            document.getElementById(
                "editSubject"
            ).value.trim();

        const subjectCode =
            document.getElementById(
                "editSubjectCode"
            ).value.trim();

        const room =
            document.getElementById(
                "editRoom"
            ).value.trim();

        const day =
            normalizeDay(
                document.getElementById(
                    "editDay"
                ).value
            );

        const session =
            normalizeSession(
                document.getElementById(
                    "editSession"
                ).value
            );

        const hour =
            Number(
                document.getElementById(
                    "editHour"
                ).value
            );

        if(
            !department ||
            !year ||
            !section ||
            !subject ||
            !day ||
            !session ||
            !hour
        ){

            alert(
                "Please fill Department, Year, Section, Subject, Day, Session and Hour."
            );

            return;

        }

        if(
            slotAlreadyUsed(
                editingRecord.staffId,
                day,
                session,
                hour,
                editingRecord.id
            )
        ){

            alert(
                "This staff already has another timetable entry in the selected Day / Session / Hour."
            );

            return;

        }

        saveBtn.disabled =
            true;

        deleteBtn.disabled =
            true;

        saveBtn.textContent =
            "Updating...";

        try{

            /*
             * IMPORTANT:
             * update the EXISTING Firestore document.
             * No new timetable document is created.
             */

            await updateDoc(
                doc(
                    db,
                    "timetableAssignments",
                    editingRecord.id
                ),
                {

                    staffId:
                        editingRecord.staffId,

                    staffName:
                        editingRecord.staffName ||
                        currentStaff?.staffName ||
                        "",

                    department,

                    classYear:
                        year,

                    section,

                    subject,

                    subjectCode,

                    subjectId:
                        editingRecord.subjectId ||
                        "",

                    day,

                    session,

                    hour,

                    room

                }
            );

            showMessage(
                "Timetable updated successfully.",
                "success"
            );

            await loadTimetable();

            closeEdit();

            renderTimetable();

        }catch(error){

            console.error(
                "UPDATE TIMETABLE ERROR:",
                error
            );

            alert(
                "Unable to update timetable:\n" +
                error.message
            );

        }finally{

            saveBtn.disabled =
                false;

            deleteBtn.disabled =
                false;

            saveBtn.textContent =
                "Update Timetable";

        }

    }
);


/* =====================================================
   DELETE EXISTING PERIOD
===================================================== */

deleteBtn.addEventListener(
    "click",
    async () => {

        if(!editingRecord){

            return;

        }

        const confirmed =
            confirm(
                "Delete this timetable period?\n\n" +
                (
                    editingRecord.subject ||
                    "Timetable entry"
                ) +
                "\n" +
                editingRecord.day +
                " / " +
                editingRecord.session +
                " / Hour " +
                editingRecord.hour
            );

        if(!confirmed){

            return;

        }

        saveBtn.disabled =
            true;

        deleteBtn.disabled =
            true;

        deleteBtn.textContent =
            "Deleting...";

        try{

            await deleteDoc(
                doc(
                    db,
                    "timetableAssignments",
                    editingRecord.id
                )
            );

            showMessage(
                "Timetable period deleted successfully.",
                "success"
            );

            await loadTimetable();

            closeEdit();

            renderTimetable();

        }catch(error){

            console.error(
                "DELETE TIMETABLE ERROR:",
                error
            );

            alert(
                "Unable to delete timetable:\n" +
                error.message
            );

        }finally{

            saveBtn.disabled =
                false;

            deleteBtn.disabled =
                false;

            deleteBtn.textContent =
                "Delete This Period";

        }

    }
);


/* =====================================================
   FILTER CHANGES
===================================================== */

sessionSelect.addEventListener(
    "change",
    () => {

        if(
            currentStaff &&
            allTimetable.length
        ){

            renderTimetable();

        }

    }
);

daySelect.addEventListener(
    "change",
    () => {

        if(
            currentStaff &&
            allTimetable.length
        ){

            renderTimetable();

        }

    }
);


/* =====================================================
   RESET
===================================================== */

resetBtn.addEventListener(
    "click",
    () => {

        staffSearch.value =
            "";

        staffSelect.value =
            "";

        sessionSelect.value =
            "ALL";

        daySelect.value =
            "ALL";

        currentStaff =
            null;

        allTimetable =
            [];

        timetableTable
            .querySelector("thead")
            .innerHTML =
            "";

        timetableTable
            .querySelector("tbody")
            .innerHTML =
            "";

        staffCard.style.display =
            "none";

        timetableCard.style.display =
            "none";

        clearMessage();

        renderStaffOptions();

    }
);


/* =====================================================
   INITIAL LOAD
===================================================== */

async function start(){

    try{

        /*
         * Wait for Firebase Authentication to restore
         * the current login session, just like the
         * current Substitute Assignment portal.
         */
        if(!auth.currentUser){

            await new Promise(
                resolve => {

                    let finished =
                        false;

                    const timer =
                        setTimeout(
                            () => {

                                if(!finished){

                                    finished =
                                        true;

                                    resolve();

                                }

                            },
                            5000
                        );

                    const unsubscribe =
                        auth.onAuthStateChanged(
                            () => {

                                if(!finished){

                                    finished =
                                        true;

                                    clearTimeout(
                                        timer
                                    );

                                    unsubscribe();

                                    resolve();

                                }

                            }
                        );

                }
            );

        }


        console.log(
            "AUTH READY:",
            auth.currentUser
                ? {
                    uid:
                        auth.currentUser.uid,
                    email:
                        auth.currentUser.email
                }
                : null
        );


        await loadStaff();


        /*
         * IMPORTANT:
         * Automatically load the CURRENT LOGGED-IN STAFF.
         */
        const loaded =
            await loadCurrentStaff();


        if(loaded){

            staffSelect.value =
                currentStaff.staffId;

            await loadTimetable();

            renderTimetable();

            timetableCard.style.display =
                "block";

            const count =
                allTimetable.filter(
                    item =>
                        upper(
                            item.staffId
                        ) ===
                        upper(
                            currentStaff.staffId
                        )
                ).length;

            showMessage(
                "Current staff loaded: " +
                currentStaff.staffName +
                " (" +
                currentStaff.staffId +
                "). " +
                count +
                " existing timetable period(s) found.",
                "success"
            );

        }else{

            showMessage(
                "Staff list loaded, but the current logged-in staff could not be identified.",
                "error"
            );

        }

    }catch(error){

        console.error(
            "INITIAL LOAD ERROR:",
            error
        );

        showMessage(
            "Unable to load current staff/timetable: " +
            error.message,
            "error"
        );

    }

}

start();

</script>
