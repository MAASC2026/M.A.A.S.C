<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Timetable Report</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #f4f7fb;
    color: #1f2937;
}

.header {
    background: #1e3a8a;
    color: #fff;
    padding: 22px 30px;
}

.header h1 {
    font-size: 25px;
    margin-bottom: 6px;
}

.header p {
    font-size: 14px;
    opacity: .9;
}

.container {
    max-width: 1500px;
    margin: 25px auto;
    padding: 0 18px;
}

.card {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 22px;
    box-shadow: 0 3px 14px rgba(0,0,0,.08);
}

.card-title {
    color: #1e3a8a;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 18px;
}

.form-grid {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
    gap: 16px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group label {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 7px;
}

select,
input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    background: #fff;
    outline: none;
    font-size: 14px;
}

input[readonly] {
    background: #f3f4f6;
}

.staff-info {
    display: none;
    margin-top: 20px;
    background: #eff6ff;
    border-left: 5px solid #2563eb;
    padding: 17px;
    border-radius: 8px;
}

.staff-info-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.info-item {
    font-size: 13px;
}

.info-label {
    font-weight: bold;
    color: #1e3a8a;
    margin-bottom: 4px;
}

.info-value {
    color: #374151;
}

.message {
    display: none;
    margin-top: 15px;
    padding: 12px;
    border-radius: 7px;
    font-size: 14px;
}

.message.success {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.message.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.message.info {
    display: block;
    background: #dbeafe;
    color: #1e40af;
}

.report-card {
    display: none;
}

.report-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.report-title {
    font-size: 22px;
    color: #1e3a8a;
    font-weight: bold;
}

.report-subtitle {
    margin-top: 5px;
    color: #6b7280;
    font-size: 13px;
}

.stats {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.stat {
    padding: 11px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: bold;
}

.stat-blue {
    background: #dbeafe;
    color: #1e40af;
}

.stat-green {
    background: #dcfce7;
    color: #166534;
}

.stat-orange {
    background: #fef3c7;
    color: #92400e;
}

.button-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

button {
    border: none;
    border-radius: 7px;
    padding: 11px 18px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
}

.btn-primary {
    background: #2563eb;
    color: white;
}

.btn-secondary {
    background: #6b7280;
    color: white;
}

button:hover {
    opacity: .9;
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

.timetable {
    width: 100%;
    border-collapse: collapse;
    min-width: 1100px;
}

.timetable th {
    background: #1e3a8a;
    color: white;
    padding: 12px 9px;
    font-size: 12px;
    text-align: center;
    border: 1px solid #cbd5e1;
}

.timetable td {
    border: 1px solid #dbe3ef;
    padding: 7px;
    vertical-align: top;
    height: 125px;
    min-width: 145px;
}

.day-cell {
    background: #eef2ff;
    color: #1e3a8a;
    font-weight: bold;
    text-align: center;
    vertical-align: middle !important;
    min-width: 100px !important;
}

.period-empty {
    text-align: center;
    vertical-align: middle;
    color: #9ca3af;
    font-size: 12px;
    padding-top: 35px;
}

.period {
    border-radius: 9px;
    padding: 9px;
    height: 100%;
}

.period.fn {
    background: #eff6ff;
    border-left: 4px solid #2563eb;
}

.period.an {
    background: #fffbeb;
    border-left: 4px solid #d97706;
}

.period.substitute {
    background: #f0fdf4;
    border-left: 4px solid #16a34a;
}

.substitute-badge {
    display: inline-block;
    margin-bottom: 7px;
    padding: 4px 9px;
    border-radius: 14px;
    background: #16a34a;
    color: #fff;
    font-size: 10px;
    font-weight: bold;
}

.substitute-original {
    margin-top: 7px;
    font-size: 10px;
    color: #166534;
    font-weight: bold;
}

.subject-code {
    font-size: 11px;
    font-weight: bold;
    color: #1e40af;
    margin-bottom: 5px;
}

.subject-name {
    font-size: 12px;
    font-weight: bold;
    color: #111827;
    line-height: 1.35;
}

.class-info {
    margin-top: 7px;
    font-size: 11px;
    color: #374151;
    line-height: 1.55;
}

.room {
    margin-top: 6px;
    font-size: 11px;
    color: #6b7280;
    font-weight: bold;
}

.records-table {
    margin-top: 25px;
}

.records-table table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1250px;
}

.records-table th {
    background: #1e3a8a;
    color: white;
    padding: 11px;
    font-size: 12px;
    text-align: left;
}

.records-table td {
    border: 1px solid #dbe3ef;
    padding: 10px;
    font-size: 13px;
}

.badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 15px;
    font-size: 11px;
    font-weight: bold;
}

.badge-fn {
    background: #dbeafe;
    color: #1e40af;
}

.badge-an {
    background: #fef3c7;
    color: #92400e;
}

.badge-substitute {
    background: #dcfce7;
    color: #166534;
}

.empty {
    text-align: center;
    padding: 40px !important;
    color: #6b7280;
}

@media(max-width:1100px) {
    .form-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .staff-info-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width:600px) {
    .form-grid {
        grid-template-columns: 1fr;
    }

    .staff-info-grid {
        grid-template-columns: 1fr;
    }

    .card {
        padding: 17px;
    }
}

@media print {
    body {
        background: white;
    }

    .header {
        background: white !important;
        color: black !important;
        border-bottom: 2px solid black;
    }

    .selection-card,
    .button-row {
        display: none !important;
    }

    .report-card {
        display: block !important;
        box-shadow: none;
        padding: 0;
    }

    .staff-info {
        display: block !important;
    }

    .timetable {
        min-width: 0;
    }

    .timetable th {
        background: #ddd !important;
        color: black !important;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>Staff Timetable Report</h1>
    <p>View regular timetable and approved substitute assignments</p>
</div>

<div class="container">

    <div class="card selection-card">

        </div>

        <div class="form-grid">

            <div class="form-group">

                            <th>Class</th>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {
    apiKey: "AIzaSyAIv3091VM-gkmdwEAn7OhXWd9Cm2zh2bo",
    authDomain: "maasc-2026.firebaseapp.com",
    projectId: "maasc-2026",
    storageBucket: "maasc-2026.appspot.com",
    messagingSenderId: "585813001586",
    appId: "1:585813001586:web:664e0e90ff0725d2e849eb"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* =========================================================
   VARIABLES
========================================================= */

let timetableData = [];
let substituteData = [];
let staffList = [];
let selectedStaff = null;


/* =========================================================
   DOM
========================================================= */

const staffSelect =
    document.getElementById("staffSelect");

const sessionSelect =
    document.getElementById("sessionSelect");


/* =========================================================
   HELPER
========================================================= */

function firstValue(...values) {

    for (const value of values) {

        if (
            value !== undefined &&
            value !== null &&
            String(value).trim() !== ""
        ) {
            return value;
        }
    }

    return "";
}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   SUBSTITUTE DATE FUNCTIONS
========================================================= */

/*
 * Gets the date on which the substitute assignment
 * is actually effective.
 *
 * Supports:
 *
 * assignmentDate
 * assignedDate
 * substituteDate
 * date
 * requestDate
 * assignment_date
 * assigned_date
 *
 * Also supports Firestore Timestamp.
 */

function getSubstituteAssignmentDate(data) {

    const rawDate =
        firstValue(
            data.assignmentDate,
            data.assignedDate,
            data.substituteDate,
            data.date,
            data.requestDate,
            data.assignment_date,
            data.assigned_date
        );


    if (!rawDate) {
        return null;
    }


    /*
     * Firestore Timestamp
     */

    if (
        rawDate &&
        typeof rawDate.toDate === "function"
    ) {

        const date =
            rawDate.toDate();

        return new Date(
            date.getFullYear(),
            date.getMonth(),
            date.getDate()
        );
    }


    /*
     * JavaScript Date
     */

    if (rawDate instanceof Date) {

        return new Date(
            rawDate.getFullYear(),
            rawDate.getMonth(),
            rawDate.getDate()
        );
    }


    const value =
        String(rawDate).trim();


    if (!value) {
        return null;
    }


    /*
     * YYYY-MM-DD
     */

    let match =
        value.match(
            /^(\d{4})-(\d{1,2})-(\d{1,2})$/
        );


    if (match) {

        return new Date(
            Number(match[1]),
            Number(match[2]) - 1,
            Number(match[3])
        );
    }


    /*
     * DD-MM-YYYY
     * DD/MM/YYYY
     */

    match =
        value.match(
            /^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/
        );


    if (match) {

        return new Date(
            Number(match[3]),
            Number(match[2]) - 1,
            Number(match[1])
        );
    }


    /*
     * YYYY/MM/DD
     */

    match =
        value.match(
            /^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/
        );


    if (match) {

        return new Date(
            Number(match[1]),
            Number(match[2]) - 1,
            Number(match[3])
        );
    }


    /*
     * Normal JavaScript date parsing
     */

    const parsed =
        new Date(value);


    if (!isNaN(parsed.getTime())) {

        return new Date(
            parsed.getFullYear(),
            parsed.getMonth(),
            parsed.getDate()
        );
    }


    return null;
}


/*
 * Returns TRUE only when the substitute assignment
 * is for TODAY or a FUTURE date.
 *
 * Example:
 *
 * Assignment = 13-08-2026
 * Today      = 14-08-2026
 * Result     = false
 *
 * Assignment = 14-08-2026
 * Today      = 14-08-2026
 * Result     = true
 *
 * Assignment = 15-08-2026
 * Today      = 14-08-2026
 * Result     = true
 */

function isSubstituteAssignmentActive(data) {

    const assignmentDate =
        getSubstituteAssignmentDate(data);


    /*
     * IMPORTANT:
     *
     * If the assignment does not contain ANY
     * recognizable date, do NOT automatically
     * display it as an active substitute.
     *
     * This prevents an old assignment with a
     * different/unknown date from appearing.
     */

    if (!assignmentDate) {

        console.warn(
            "SUBSTITUTE DATE NOT FOUND - RECORD HIDDEN:",
            data
        );

        return false;
    }


    const now =
        new Date();


    const today =
        new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate()
        );


    return (
        assignmentDate.getTime() >=
        today.getTime()
    );
}


/*
 * Optional helper used only for debugging.
 */

function formatDateForLog(date) {

    if (!date) {
        return "-";
    }

    return [
        String(date.getDate()).padStart(2, "0"),
        String(date.getMonth() + 1).padStart(2, "0"),
        date.getFullYear()
    ].join("-");
}


/* =========================================================
   DAY
========================================================= */

function normalizeDay(value) {

    let day =
        String(value ?? "")
            .trim()
            .toUpperCase();

    if (!day) {
        return "";
    }


    const match =
        day.match(/DAY\s*0?([1-6])/);

    if (match) {

        return `DAY ${String(
            Number(match[1])
        ).padStart(2, "0")}`;
    }


    if (/^[1-6]$/.test(day)) {

        return `DAY ${day.padStart(2, "0")}`;
    }


    const oldDays = {

        MONDAY: "DAY 01",
        TUESDAY: "DAY 02",
        WEDNESDAY: "DAY 03",
        THURSDAY: "DAY 04",
        FRIDAY: "DAY 05",
        SATURDAY: "DAY 06"

    };


    return oldDays[day] || day;
}


/* =========================================================
   SESSION
========================================================= */

function normalizeSession(value) {

    let session =
        String(value ?? "")
            .trim()
            .toUpperCase();

    if (
        session === "FORENOON" ||
        session === "MORNING"
    ) {
        return "FN";
    }

    if (
        session === "AFTERNOON" ||
        session === "EVENING"
    ) {
        return "AN";
    }

    return session;
}


/* =========================================================
   STAFF ID
========================================================= */

function getStaffId(data) {

    return String(
        firstValue(
            data.staffId,
            data.staffID,
            data.staff_id,
            data.staff,
            data.teacherId,
            data.teacherID
        )
    ).trim();
}


/* =========================================================
   STAFF NAME
========================================================= */

function getStaffName(data) {

    return String(
        firstValue(
            data.staffName,
            data.name,
            data.staff_name,
            data.teacherName,
            data.teacher
        )
    ).trim();
}


/* =========================================================
   DEPARTMENT
========================================================= */

function getDepartment(data) {

    return String(
        firstValue(
            data.department,
            data.dept,
            data.departmentName,
            data.deptName
        )
    ).trim();
}


/* =========================================================
   HOUR
========================================================= */

function getHour(data) {

    const raw =
        firstValue(
            data.hour,
            data.period,
            data.hourNo,
            data.periodNo,
            data.hourNumber
        );


    if (typeof raw === "number") {
        return raw;
    }


    const match =
        String(raw ?? "")
            .match(/\d+/);


    if (!match) {
        return 0;
    }


    return Number(match[0]);
}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type = "info"
) {

    const message =
        document.getElementById("message");


    message.textContent =
        text;


    message.className =
        "message " + type;


    if (type !== "error") {

        setTimeout(() => {

            message.className =
                "message";

        }, 4000);
    }
}


/* =========================================================
   CREATE NORMALIZED TIMETABLE RECORD
========================================================= */

function normalizeTimetableRecord(
    id,
    data
) {

    return {

        id,

        ...data,

        normalizedDay:
            normalizeDay(
                firstValue(
                    data.day,
                    data.dayName,
                    data.dayNo,
                    data.dayNumber
                )
            ),

        normalizedSession:
            normalizeSession(
                firstValue(
                    data.session,
                    data.shift
                )
            ),

        normalizedHour:
            getHour(data),

        normalizedStaffId:
            getStaffId(data),

        normalizedStaffName:
            getStaffName(data),

        normalizedDepartment:
            getDepartment(data),

        subjectCode:
            firstValue(
                data.subjectCode,
                data.subjectId,
                data.code
            ),

        subjectName:
            firstValue(
                data.subjectName,
                data.subject,
                data.subjectTitle
            ),

        classYear:
            firstValue(
                data.classYear,
                data.class,
                data.year,
                data.className
            ),

        section:
            firstValue(
                data.section,
                data.sec
            ),

        roomNo:
            firstValue(
                data.roomNo,
                data.room,
                data.roomNumber
            )
    };
}


/* =========================================================
   LOAD ALL TIMETABLE DATA
========================================================= */

async function loadTimetableData() {

    try {

        showMessage(
            "Loading timetable...",
            "info"
        );


        timetableData = [];

        substituteData = [];

        const staffMap =
            new Map();


        /* =================================================
           LOAD REGULAR TIMETABLE
        ================================================= */

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "timetableAssignments"
                )
            );


        snapshot.forEach(doc => {

            const data =
                doc.data() || {};


            const record =
                normalizeTimetableRecord(
                    doc.id,
                    data
                );


            if (
                !record.normalizedStaffId
            ) {
                return;
            }


            timetableData.push(
                record
            );


            const staffId =
                record.normalizedStaffId;


            if (!staffMap.has(staffId)) {

                staffMap.set(
                    staffId,
                    {
                        staffId,
                        staffName:
                            record.normalizedStaffName,
                        department:
                            record.normalizedDepartment
                    }
                );

            } else {

                const staff =
                    staffMap.get(
                        staffId
                    );


                if (
                    !staff.staffName &&
                    record.normalizedStaffName
                ) {

                    staff.staffName =
                        record.normalizedStaffName;
                }


                if (
                    !staff.department &&
                    record.normalizedDepartment
                ) {

                    staff.department =
                        record.normalizedDepartment;
                }
            }

        });


        /* =================================================
           LOAD SUBSTITUTE REQUESTS
        ================================================= */

        const substituteSnapshot =
            await getDocs(
                collection(
                    db,
                    "substituteRequests"
                )
            );


        substituteSnapshot.forEach(doc => {

            const data =
                doc.data() || {};


            const status =
                String(
                    firstValue(
                        data.status,
                        data.approvalStatus,
                        data.requestStatus
                    )
                )
                .trim()
                .toUpperCase();


            /*
             * ONLY APPROVED RECORDS
             */

            if (
                status !== "APPROVED"
            ) {

                return;
            }


            /* =================================================
               DATE CHECK
               =================================================
               
               THIS IS THE IMPORTANT FIX.

               An approved substitute is loaded ONLY if
               its assignment date is today or later.

               Expired dates are NOT pushed into
               substituteData.
            ================================================= */

            const assignmentDate =
                getSubstituteAssignmentDate(data);


            if (!assignmentDate) {

                console.warn(
                    "APPROVED SUBSTITUTE HIDDEN - NO VALID DATE:",
                    doc.id,
                    data
                );

                return;
            }


            if (
                !isSubstituteAssignmentActive(data)
            ) {

                console.log(
                    "EXPIRED SUBSTITUTE HIDDEN:",
                    {
                        id: doc.id,
                        assignmentDate:
                            formatDateForLog(
                                assignmentDate
                            ),
                        today:
                            formatDateForLog(
                                new Date()
                            )
                    }
                );

                return;
            }


            /*
             * Get substitute staff ID.
             */

            const substituteStaffId =
                String(
                    firstValue(
                        data.substituteStaffId,
                        data.substituteStaffID,
                        data.substituteId,
                        data.allottedStaffId,
                        data.allotedStaffId,
                        data.assignedStaffId
                    )
                ).trim();


            if (!substituteStaffId) {

                console.warn(
                    "SUBSTITUTE STAFF ID MISSING:",
                    doc.id
                );

                return;
            }


            const substituteStaffName =
                String(
                    firstValue(
                        data.substituteStaffName,
                        data.substituteName,
                        data.allottedStaffName,
                        data.allotedStaffName,
                        data.assignedStaffName
                    )
                ).trim();


            const record = {

                id: doc.id,

                ...data,

                isSubstitute: true,

                /*
                 * Store normalized assignment date
                 * inside the record as well.
                 */

                substituteAssignmentDate:
                    assignmentDate,

                normalizedDay:
                    normalizeDay(
                        firstValue(
                            data.day,
                            data.dayName,
                            data.dayNo,
                            data.assignmentDay,
                            data.requestDay
                        )
                    ),

                normalizedSession:
                    normalizeSession(
                        firstValue(
                            data.session,
                            data.substituteSession,
                            data.assignmentSession
                        )
                    ),

                normalizedHour:
                    getHour(data),

                normalizedStaffId:
                    substituteStaffId,

                normalizedStaffName:
                    substituteStaffName,

                normalizedDepartment:
                    String(
                        firstValue(
                            data.substituteDepartment,
                            data.department,
                            data.dept
                        )
                    ).trim(),

                originalStaffId:
                    String(
                        firstValue(
                            data.requestingStaffId,
                            data.requestedByStaffId,
                            data.originalStaffId,
                            data.staffId,
                            data.staffID
                        )
                    ).trim(),

                originalStaffName:
                    String(
                        firstValue(
                            data.requestingStaffName,
                            data.requestedByStaffName,
                            data.originalStaffName,
                            data.staffName,
                            data.name
                        )
                    ).trim(),

                subjectCode:
                    firstValue(
                        data.subjectCode,
                        data.subjectId,
                        data.code
                    ),

                subjectName:
                    firstValue(
                        data.subjectName,
                        data.subject,
                        data.subjectTitle
                    ),

                classYear:
                    firstValue(
                        data.classYear,
                        data.class,
                        data.year,
                        data.className
                    ),

                section:
                    firstValue(
                        data.section,
                        data.sec
                    ),

                roomNo:
                    firstValue(
                        data.roomNo,
                        data.room,
                        data.roomNumber
                    )
            };


            /*
             * Only valid substitute records
             * are allowed into substituteData.
             */

            if (
                record.normalizedDay &&
                record.normalizedSession &&
                record.normalizedHour > 0
            ) {

                substituteData.push(
                    record
                );


                if (
                    !staffMap.has(
                        substituteStaffId
                    )
                ) {

                    staffMap.set(
                        substituteStaffId,
                        {
                            staffId:
                                substituteStaffId,

                            staffName:
                                substituteStaffName,

                            department:
                                record.normalizedDepartment
                        }
                    );

                }

            }

        });


        /*
         * Copy original timetable details
         * into every approved active substitute.
         */

        enrichSubstituteRecords();


        staffList =
            Array.from(
                staffMap.values()
            );


        /*
         * Make sure active substitute staff
         * are also included.
         */

        substituteData.forEach(
            substitute => {

                if (
                    !substitute.normalizedStaffId
                ) {
                    return;
                }


                const exists =
                    staffList.some(
                        staff =>
                            staff.staffId ===
                            substitute.normalizedStaffId
                    );


                if (!exists) {

                    staffList.push({

                        staffId:
                            substitute.normalizedStaffId,

                        staffName:
                            substitute.normalizedStaffName,

                        department:
                            substitute.normalizedDepartment
                    });
                }
            }
        );


        staffList.sort(
            (a, b) => {

                const nameA =
                    String(
                        a.staffName ||
                        a.staffId ||
                        ""
                    );

                const nameB =
                    String(
                        b.staffName ||
                        b.staffId ||
                        ""
                    );

                return nameA.localeCompare(
                    nameB
                );
            }
        );


        populateStaffDropdown();


        console.log(
            "REGULAR TIMETABLE:",
            timetableData
        );

        console.log(
            "ACTIVE APPROVED SUBSTITUTE DATA:",
            substituteData
        );

        console.log(
            "STAFF LIST:",
            staffList
        );


        if (!timetableData.length) {

            showMessage(
                "No timetable assignments found.",
                "error"
            );

        } else {

            document.getElementById(
                "message"
            ).className =
                "message";
        }


    } catch (error) {

        console.error(
            "TIMETABLE LOAD ERROR:",
            error
        );


        showMessage(
            "Unable to load timetable: " +
            error.message,
            "error"
        );
    }
}


/* =========================================================
   ENRICH SUBSTITUTE RECORDS
========================================================= */

function enrichSubstituteRecords() {

    substituteData =
        substituteData.map(
            substitute => {

                let originalEntry =
                    null;


                /*
                 * Exact match using original staff.
                 */

                if (
                    substitute.originalStaffId
                ) {

                    originalEntry =
                        timetableData.find(
                            item =>

                                item.normalizedStaffId ===
                                    substitute.originalStaffId &&

                                item.normalizedDay ===
                                    substitute.normalizedDay &&

                                item.normalizedSession ===
                                    substitute.normalizedSession &&

                                item.normalizedHour ===
                                    substitute.normalizedHour
                        );
                }


                /*
                 * Fallback:
                 * DAY + SESSION + HOUR
                 */

                if (!originalEntry) {

                    originalEntry =
                        timetableData.find(
                            item =>

                                item.normalizedDay ===
                                    substitute.normalizedDay &&

                                item.normalizedSession ===
                                    substitute.normalizedSession &&

                                item.normalizedHour ===
                                    substitute.normalizedHour
                        );
                }


                if (originalEntry) {

                    return {

                        ...originalEntry,

                        ...substitute,

                        isSubstitute: true,


                        /*
                         * Preserve assignment date.
                         */

                        substituteAssignmentDate:
                            substitute.substituteAssignmentDate,


                        subjectCode:
                            firstValue(
                                originalEntry.subjectCode,
                                originalEntry.subjectId,
                                originalEntry.code,
                                substitute.subjectCode,
                                substitute.subjectId,
                                substitute.code
                            ),


                        subjectName:
                            firstValue(
                                originalEntry.subjectName,
                                originalEntry.subject,
                                originalEntry.subjectTitle,
                                substitute.subjectName,
                                substitute.subject,
                                substitute.subjectTitle
                            ),


                        department:
                            firstValue(
                                originalEntry.department,
                                originalEntry.dept,
                                originalEntry.departmentName,
                                originalEntry.normalizedDepartment,
                                substitute.department,
                                substitute.dept,
                                substitute.normalizedDepartment
                            ),


                        classYear:
                            firstValue(
                                originalEntry.classYear,
                                originalEntry.class,
                                originalEntry.year,
                                originalEntry.className,
                                substitute.classYear,
                                substitute.class,
                                substitute.year
                            ),


                        section:
                            firstValue(
                                originalEntry.section,
                                originalEntry.sec,
                                substitute.section,
                                substitute.sec
                            ),


                        roomNo:
                            firstValue(
                                originalEntry.roomNo,
                                originalEntry.room,
                                originalEntry.roomNumber,
                                substitute.roomNo,
                                substitute.room,
                                substitute.roomNumber
                            ),


                        normalizedStaffId:
                            substitute.normalizedStaffId,

                        normalizedStaffName:
                            substitute.normalizedStaffName,


                        originalStaffId:
                            firstValue(
                                substitute.originalStaffId,
                                originalEntry.normalizedStaffId
                            ),

                        originalStaffName:
                            firstValue(
                                substitute.originalStaffName,
                                originalEntry.normalizedStaffName
                            ),


                        normalizedDay:
                            originalEntry.normalizedDay,

                        normalizedSession:
                            originalEntry.normalizedSession,

                        normalizedHour:
                            originalEntry.normalizedHour
                    };
                }


                return {
                    ...substitute,
                    isSubstitute: true
                };
            }
        );


    console.log(
        "ENRICHED ACTIVE SUBSTITUTE DATA:",
        substituteData
    );
}


/* =========================================================
   STAFF DROPDOWN
========================================================= */

function populateStaffDropdown() {

    staffSelect.innerHTML = "";


    const defaultOption =
        document.createElement("option");

    defaultOption.value = "";

    defaultOption.textContent =
        "Select Staff";


    staffSelect.appendChild(
        defaultOption
    );


    staffList.forEach(
        staff => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                staff.staffId;


            option.textContent =
                `${staff.staffName || "Unnamed Staff"} (${staff.staffId})`;


            staffSelect.appendChild(
                option
            );
        }
    );
}


/* =========================================================
   STAFF CHANGE
========================================================= */

staffSelect.addEventListener(
    "change",
    function() {

        const staffId =
            this.value;


        if (!staffId) {

            clearReport();

            return;
        }


        selectedStaff =
            staffList.find(
                staff =>
                    staff.staffId ===
                    staffId
            );


        if (!selectedStaff) {

            clearReport();

            return;
        }


        loadSelectedStaffReport(
            staffId
        );
    }
);


/* =========================================================
   SESSION CHANGE
========================================================= */

sessionSelect.addEventListener(
    "change",
    function() {

        if (!selectedStaff) {
            return;
        }


        loadSelectedStaffReport(
            selectedStaff.staffId
        );
    }
);


/* =========================================================
   LOAD STAFF REPORT
========================================================= */

function loadSelectedStaffReport(
    staffId
) {

    const selectedSession =
        normalizeSession(
            sessionSelect.value
        );


    /*
     * REGULAR ENTRIES
     */

    let regularEntries =
        timetableData.filter(
            item =>
                item.normalizedStaffId ===
                staffId
        );


    /*
     * ACTIVE APPROVED SUBSTITUTE ENTRIES
     *
     * Date is checked AGAIN here.
     *
     * This is an additional safety check in case
     * the page stays open across midnight.
     */

    let approvedSubstitutes =
        substituteData.filter(
            item => {

                if (
                    item.normalizedStaffId !==
                    staffId
                ) {
                    return false;
                }


                return isSubstituteAssignmentActive(
                    item
                );
            }
        );


    /*
     * SESSION FILTER
     */

    if (
        selectedSession !== "ALL"
    ) {

        regularEntries =
            regularEntries.filter(
                item =>
                    item.normalizedSession ===
                    selectedSession
            );


        approvedSubstitutes =
            approvedSubstitutes.filter(
                item =>
                    item.normalizedSession ===
                    selectedSession
            );
    }


    /*
     * REMOVE ORIGINAL PERIODS
     * ONLY WHEN THERE IS AN ACTIVE SUBSTITUTE.
     */

    const finalEntries =
        regularEntries.filter(
            regular =>

                !approvedSubstitutes.some(
                    substitute =>

                        substitute.normalizedDay ===
                            regular.normalizedDay &&

                        substitute.normalizedSession ===
                            regular.normalizedSession &&

                        substitute.normalizedHour ===
                            regular.normalizedHour
                )
        );


    /*
     * Add active substitutes.
     */

    finalEntries.push(
        ...approvedSubstitutes
    );


    /*
     * STAFF DETAILS
     */

    document.getElementById(
        "staffId"
    ).value =
        selectedStaff.staffId;


    document.getElementById(
        "department"
    ).value =
        selectedStaff.department || "";


    document.getElementById(
        "totalPeriods"
    ).value =
        finalEntries.length;


    document.getElementById(
        "infoStaffId"
    ).textContent =
        selectedStaff.staffId;


    document.getElementById(
        "infoStaffName"
    ).textContent =
        selectedStaff.staffName || "-";


    document.getElementById(
        "infoDepartment"
    ).textContent =
        selectedStaff.department || "-";


    document.getElementById(
        "infoStatus"
    ).textContent =
        finalEntries.length
            ? "Timetable Available"
            : "No Timetable Assigned";


    document.getElementById(
        "staffInfo"
    ).style.display =
        "block";


    document.getElementById(
        "reportCard"
    ).style.display =
        "block";


    let sessionText =
        "All Sessions";


    if (
        selectedSession === "FN"
    ) {
        sessionText = "FN";
    }


    if (
        selectedSession === "AN"
    ) {
        sessionText = "AN";
    }


    document.getElementById(
        "reportSubtitle"
    ).textContent =
        `${selectedStaff.staffName || ""} (${selectedStaff.staffId}) — ${sessionText}`;


    renderStats(
        finalEntries
    );


    renderTimetable(
        finalEntries,
        selectedSession
    );


    renderDetailedRecords(
        finalEntries
    );
}


/* =========================================================
   STATS
========================================================= */

function renderStats(entries) {

    let fn = 0;
    let an = 0;


    entries.forEach(
        entry => {

            const session =
                entry.normalizedSession;


            if (session === "FN") {
                fn++;
            }


            if (session === "AN") {
                an++;
            }
        }
    );


    document.getElementById(
        "statTotal"
    ).textContent =
        entries.length;


    document.getElementById(
        "statFN"
    ).textContent =
        fn;


    document.getElementById(
        "statAN"
    ).textContent =
        an;
}


/* =========================================================
   TIMETABLE HEADER
========================================================= */

function renderTimetableHeader(
    session
) {

    const thead =
        document.getElementById(
            "timetableHead"
        );


    thead.innerHTML = "";


    let html =
        "<tr><th>Day</th>";


    if (
        session === "ALL" ||
        session === "FN"
    ) {

        for (
            let hour = 1;
            hour <= 5;
            hour++
        ) {

            html += `
                <th>
                    FN<br>
                    Hour ${hour}
                </th>
            `;
        }
    }


    if (
        session === "ALL" ||
        session === "AN"
    ) {

        for (
            let hour = 1;
            hour <= 5;
            hour++
        ) {

            html += `
                <th>
                    AN<br>
                    Hour ${hour}
                </th>
            `;
        }
    }


    html += "</tr>";


    thead.innerHTML =
        html;
}


/* =========================================================
   RENDER TIMETABLE
========================================================= */

function renderTimetable(
    entries,
    session
) {

    const tbody =
        document.getElementById(
            "timetableBody"
        );


    tbody.innerHTML = "";


    renderTimetableHeader(
        session
    );


    const days = [

        "DAY 01",
        "DAY 02",
        "DAY 03",
        "DAY 04",
        "DAY 05",
        "DAY 06"

    ];


    if (!entries.length) {

        const columns =
            session === "ALL"
                ? 11
                : 6;


        tbody.innerHTML = `

            <tr>

                <td
                    colspan="${columns}"
                    class="empty"
                >
                    No timetable assigned
                </td>

            </tr>

        `;

        return;
    }


    days.forEach(
        day => {

            const row =
                document.createElement(
                    "tr"
                );


            const dayCell =
                document.createElement(
                    "td"
                );


            dayCell.className =
                "day-cell";


            dayCell.textContent =
                day;


            row.appendChild(
                dayCell
            );


            if (
                session === "ALL" ||
                session === "FN"
            ) {

                for (
                    let hour = 1;
                    hour <= 5;
                    hour++
                ) {

                    row.appendChild(
                        createPeriodCell(
                            entries,
                            day,
                            "FN",
                            hour
                        )
                    );
                }
            }


            if (
                session === "ALL" ||
                session === "AN"
            ) {

                for (
                    let hour = 1;
                    hour <= 5;
                    hour++
                ) {

                    row.appendChild(
                        createPeriodCell(
                            entries,
                            day,
                            "AN",
                            hour
                        )
                    );
                }
            }


            tbody.appendChild(
                row
            );
        }
    );
}


/* =========================================================
   PERIOD CELL
========================================================= */

function createPeriodCell(
    entries,
    day,
    session,
    hour
) {

    const cell =
        document.createElement(
            "td"
        );


    const matching =
        entries.filter(
            item =>

                item.normalizedDay ===
                    normalizeDay(day) &&

                item.normalizedSession ===
                    normalizeSession(session) &&

                item.normalizedHour ===
                    Number(hour)
        );


    /*
     * SUBSTITUTE HAS PRIORITY.
     *
     * At this point substituteData already
     * contains only active dates.
     */

    const entry =
        matching.find(
            item =>
                item.isSubstitute
        ) ||
        matching[0];


    if (!entry) {

        cell.innerHTML = `

            <div class="period-empty">
                Free
            </div>

        `;

        return cell;
    }


    const periodClass =
        entry.isSubstitute
            ? "substitute"
            : (
                session === "FN"
                    ? "fn"
                    : "an"
            );


    const subjectCode =
        firstValue(
            entry.subjectCode,
            entry.subjectId,
            entry.code
        );


    const subjectName =
        firstValue(
            entry.subjectName,
            entry.subject,
            entry.subjectTitle
        );


    const department =
        firstValue(
            entry.department,
            entry.dept,
            entry.departmentName,
            entry.normalizedDepartment
        );


    const classYear =
        firstValue(
            entry.classYear,
            entry.class,
            entry.year,
            entry.className
        );


    const section =
        firstValue(
            entry.section,
            entry.sec
        );


    const room =
        firstValue(
            entry.roomNo,
            entry.room,
            entry.roomNumber
        );


    const originalStaff =
        firstValue(
            entry.originalStaffName,
            entry.originalStaffId
        );


    cell.innerHTML = `

        <div class="period ${periodClass}">

            ${
                entry.isSubstitute
                    ? `
                        <div class="substitute-badge">
                            APPROVED SUBSTITUTE
                        </div>
                    `
                    : ""
            }

            ${
                subjectCode
                    ? `
                        <div class="subject-code">
                            ${escapeHtml(subjectCode)}
                        </div>
                    `
                    : ""
            }

            <div class="subject-name">
                ${escapeHtml(
                    subjectName ||
                    "SUBSTITUTE ASSIGNMENT"
                )}
            </div>

            <div class="class-info">

                <strong>Department:</strong>
                ${escapeHtml(
                    department || "-"
                )}
                <br>

                <strong>Class:</strong>
                ${escapeHtml(
                    classYear || "-"
                )}
                <br>

                <strong>Section:</strong>
                ${escapeHtml(
                    section || "-"
                )}

            </div>

            <div class="room">
                Room:
                ${escapeHtml(
                    room || "-"
                )}
            </div>

            ${
                entry.isSubstitute &&
                originalStaff
                    ? `
                        <div class="substitute-original">
                            Original Staff:
                            ${escapeHtml(
                                originalStaff
                            )}
                        </div>
                    `
                    : ""
            }

        </div>

    `;


    return cell;
}


/* =========================================================
   DETAILED TABLE
========================================================= */

function renderDetailedRecords(
    entries
) {

    const tbody =
        document.getElementById(
            "detailsBody"
        );


    tbody.innerHTML = "";


    const dayOrder = {

        "DAY 01": 1,
        "DAY 02": 2,
        "DAY 03": 3,
        "DAY 04": 4,
        "DAY 05": 5,
        "DAY 06": 6

    };


    const sorted =
        [...entries].sort(
            (a, b) => {

                const dayA =
                    dayOrder[
                        a.normalizedDay
                    ] || 99;


                const dayB =
                    dayOrder[
                        b.normalizedDay
                    ] || 99;


                if (
                    dayA !== dayB
                ) {
                    return dayA - dayB;
                }


                if (
                    a.normalizedSession !==
                    b.normalizedSession
                ) {

                    return (
                        a.normalizedSession ===
                        "FN"
                    )
                        ? -1
                        : 1;
                }


                return (
                    a.normalizedHour -
                    b.normalizedHour
                );
            }
        );


    if (!sorted.length) {

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="12"
                    class="empty"
                >
                    No timetable assigned
                </td>

            </tr>

        `;

        return;
    }


    sorted.forEach(
        (entry, index) => {

            const subjectCode =
                firstValue(
                    entry.subjectCode,
                    entry.subjectId,
                    entry.code
                );


            const subjectName =
                firstValue(
                    entry.subjectName,
                    entry.subject,
                    entry.subjectTitle
                );


            const department =
                firstValue(
                    entry.department,
                    entry.dept,
                    entry.departmentName,
                    entry.normalizedDepartment
                );


            const classYear =
                firstValue(
                    entry.classYear,
                    entry.class,
                    entry.year,
                    entry.className
                );


            const section =
                firstValue(
                    entry.section,
                    entry.sec
                );


            const room =
                firstValue(
                    entry.roomNo,
                    entry.room,
                    entry.roomNumber
                );


            const originalStaff =
                firstValue(
                    entry.originalStaffName,
                    entry.originalStaffId
                );


            const tr =
                document.createElement(
                    "tr"
                );


            tr.innerHTML = `

                <td>
                    ${index + 1}
                </td>

                <td>
                    ${escapeHtml(
                        entry.normalizedDay
                    )}
                </td>

                <td>

                    <span class="badge ${
                        entry.normalizedSession === "FN"
                            ? "badge-fn"
                            : "badge-an"
                    }">

                        ${escapeHtml(
                            entry.normalizedSession
                        )}

                    </span>

                </td>

                <td>
                    Hour
                    ${escapeHtml(
                        entry.normalizedHour
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        subjectCode || "-"
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        subjectName || "-"
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        department || "-"
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        classYear || "-"
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        section || "-"
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        room || "-"
                    )}
                </td>

                <td>

                    ${
                        entry.isSubstitute
                            ? `
                                <span class="badge badge-substitute">
                                    SUBSTITUTE
                                </span>
                            `
                            : "REGULAR"
                    }

                </td>

                <td>
                    ${
                        entry.isSubstitute
                            ? escapeHtml(
                                originalStaff || "-"
                            )
                            : "-"
                    }
                </td>

            `;


            tbody.appendChild(
                tr
            );
        }
    );
}


/* =========================================================
   CLEAR
========================================================= */

function clearReport() {

    selectedStaff = null;


    staffSelect.value = "";


    sessionSelect.value =
        "ALL";


    document.getElementById(
        "staffId"
    ).value = "";


    document.getElementById(
        "department"
    ).value = "";


    document.getElementById(
        "totalPeriods"
    ).value = "0";


    document.getElementById(
        "staffInfo"
    ).style.display =
        "none";


    document.getElementById(
        "reportCard"
    ).style.display =
        "none";


    document.getElementById(
        "timetableHead"
    ).innerHTML =
        "";


    document.getElementById(
        "timetableBody"
    ).innerHTML =
        "";


    document.getElementById(
        "detailsBody"
    ).innerHTML =
        "";


    document.getElementById(
        "statTotal"
    ).textContent =
        "0";


    document.getElementById(
        "statFN"
    ).textContent =
        "0";


    document.getElementById(
        "statAN"
    ).textContent =
        "0";


    document.getElementById(
        "reportSubtitle"
    ).textContent =
        "";


    document.getElementById(
        "message"
    ).className =
        "message";
}

document.getElementById(
    "printBtn"
).addEventListener(

    }
);


/* =========================================================

========================================================= */

document.getElementById(
    "clearBtn"
).addEventListener(

    }
);

loadTimetableData();
